<title>Noa Farm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Noa Farm — nông trại merge trên hành tinh hạt giống. Merge farming game prototype.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Coiny&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* css/base.css */
/* Layout: one phone-width column. Sky header (HUD + robot Bean + sky events) → active screen → sticky tab bar.
   Panels are "seed-paper" cards with chunky ink outlines and a pressed-down shadow, like a hand-drawn seed packet. */
:root {
  --ink: #3a2a4d;
  --ink-2: #6b5b80;
  --ink-3: #9a8cad;
  --paper: #fffaf0;
  --paper-2: #fbefd9;
  --paper-3: #f1dfc2;
  --leaf: #5cbb49;
  --leaf-d: #3f8e31;
  --sun: #ffc83a;
  --sun-d: #e3a118;
  --berry: #ff6b8e;
  --berry-d: #d6476c;
  --sky: #56c1ff;
  --sky-d: #2a93d4;
  --grass: #b6e58b;
  --grass-d: #8fcb63;
  --soil: #c08a5f;
  --soil-d: #8a5a37;
  --cell: #f7fce9;
  --page: #dff2cf;
  --white: #ffffff;
  --shade: rgba(58, 42, 77, 0.18);
  --scrim: rgba(36, 24, 52, 0.55);

  --r-common: #9aa69a;
  --r-rare: #3ea8f4;
  --r-epic: #a560f0;
  --r-legendary: #ffb21f;
  --r-mythic: #ff58a6;

  --font-display: "Coiny", "Baloo 2", "Nunito", system-ui, sans-serif;
  --font-ui: "Baloo 2", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: "Nunito", "Baloo 2", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --line: 3px;
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --pop: 0 4px 0 var(--ink);
  --pop-sm: 0 3px 0 var(--ink);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--page);
  background-image: radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.55) 0 2px, transparent 3px),
    radial-gradient(circle at 80% 40%, rgba(255, 255, 255, 0.45) 0 2px, transparent 3px);
  background-size: 46px 46px, 64px 64px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--font-ui); line-height: 1.25; margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--sky-d); outline-offset: 2px; border-radius: 8px; }
.muted { color: var(--ink-2); }
.tiny { font-size: 11.5px; }
.num { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ app frame */
.app {
  max-width: 480px;
  margin: 0 auto;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-block: 8px 0;
}
/* one-screen app: the screen area scrolls, the sky header and tab bar stay put */
.screens { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.screen { display: flex; flex-direction: column; gap: 8px; padding-block: 8px 12px; min-height: 100%; }

/* ------------------------------------------------------------ buttons */
.btn {
  appearance: none;
  border: var(--line) solid var(--ink);
  border-radius: 14px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 15px;
  line-height: 1.2;
  padding: 8px 14px 7px;
  box-shadow: var(--pop);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s;
  white-space: nowrap;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { filter: grayscale(0.7) opacity(0.6); cursor: not-allowed; }
.btn--leaf { background: var(--leaf); color: var(--white); text-shadow: 0 2px 0 var(--leaf-d); }
.btn--sun { background: var(--sun); }
.btn--berry { background: var(--berry); color: var(--white); text-shadow: 0 2px 0 var(--berry-d); }
.btn--sky { background: var(--sky); color: var(--white); text-shadow: 0 2px 0 var(--sky-d); }
.btn--ghost { background: var(--paper-2); }
.btn--sm { font-size: 13px; padding: 4px 10px 3px; border-radius: 11px; box-shadow: var(--pop-sm); border-width: 2.5px; }
.btn--block { width: 100%; }
.btn-icon {
  appearance: none;
  border: 2.5px solid var(--ink);
  background: var(--paper);
  border-radius: 10px;
  width: 30px;
  height: 30px;
  display: inline-grid;
  place-items: center;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 2px 0 var(--ink);
  padding: 0;
}
.chip-btn {
  appearance: none;
  border: 2.5px solid var(--ink);
  background: var(--paper-2);
  border-radius: 999px;
  padding: 3px 10px;
  font-family: var(--font-ui);
  font-weight: 700;
  cursor: pointer;
}

/* ------------------------------------------------------------ cards / panels */
.panel {
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: var(--r-lg);
  box-shadow: var(--pop);
  padding: 14px;
}
.panel-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 17px;
}
.seg {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 4px;
}
.seg::-webkit-scrollbar { display: none; }
.seg button {
  flex: 0 0 auto;
  appearance: none;
  border: 2.5px solid var(--ink);
  background: var(--paper);
  border-radius: 999px;
  padding: 4px 12px 3px;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 2px 0 var(--ink);
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* ------------------------------------------------------------ tab bar */
.tabbar {
  position: relative;
  flex: 0 0 auto;
  z-index: 40;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-bottom: 0;
  border-radius: 22px 22px 0 0;
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -4px 0 rgba(58, 42, 77, 0.08);
}
.tab {
  appearance: none;
  border: 0;
  background: transparent;
  border-radius: 14px;
  padding: 4px 2px 3px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  cursor: pointer;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 11.5px;
  color: var(--ink-2);
  position: relative;
}
.tab .ti { font-size: 22px; line-height: 1.1; transition: transform 0.2s cubic-bezier(.3, 1.6, .5, 1); }
.tab[aria-current="page"] { background: var(--sun); color: var(--ink); box-shadow: inset 0 0 0 2.5px var(--ink); }
.tab[aria-current="page"] .ti { transform: translateY(-2px) scale(1.12); }
.tab .badge-dot {
  position: absolute;
  top: 3px;
  right: 18%;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--berry);
  border: 2px solid var(--ink);
}

/* ------------------------------------------------------------ modals */
#modals { position: relative; z-index: 800; }
.modal-wrap {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: fadeIn 0.18s ease;
}
.modal-wrap.closing { animation: fadeOut 0.18s ease forwards; }
.modal-bg { position: absolute; inset: 0; background: var(--scrim); }
.modal {
  position: relative;
  width: min(420px, 100%);
  max-height: min(86vh, 760px);
  overflow: auto;
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: 24px;
  box-shadow: 0 6px 0 var(--ink);
  padding: 18px 16px 16px;
  animation: popIn 0.32s cubic-bezier(.2, 1.5, .4, 1);
}
.modal-title { text-align: center; padding: 0 30px 10px; }
.modal-title h2 { font-size: 21px; font-weight: 800; }
.modal-x { position: absolute; top: 10px; right: 10px; }
.modal-body { display: flex; flex-direction: column; gap: 12px; }
.modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

/* ------------------------------------------------------------ toasts */
#toasts {
  position: fixed;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 96px);
  transform: translateX(-50%);
  z-index: 990;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
  width: min(440px, calc(100vw - 32px));
}
.toast {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: 14px;
  padding: 7px 14px 6px;
  border-radius: 14px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
  animation: toastIn 0.25s cubic-bezier(.2, 1.5, .4, 1);
  text-align: center;
  max-width: 100%;
}
.toast.out { animation: fadeOut 0.3s ease forwards; }
.toast--good { background: var(--leaf-d); }
.toast--warn { background: var(--berry-d); }

/* ------------------------------------------------------------ reward chips */
.rewards { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.rchip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--paper-2);
  border: 2.5px solid var(--ink);
  border-radius: 14px;
  padding: 5px 10px 4px;
  font-family: var(--font-ui);
  font-weight: 800;
  animation: popIn 0.4s cubic-bezier(.2, 1.6, .4, 1) both;
}
.rchip .ri { font-size: 20px; line-height: 1; }
.rchip small { font-weight: 700; color: var(--ink-2); font-size: 12px; }

/* ------------------------------------------------------------ keyframes */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes popIn { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes toastIn { from { transform: translateY(-10px) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes wiggle { 0%, 86%, 100% { transform: rotate(0); } 89% { transform: rotate(-8deg); } 93% { transform: rotate(7deg); } 97% { transform: rotate(-4deg); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes spinC { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes shakeX { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

.bump { animation: bump 0.35s cubic-bezier(.3, 1.6, .5, 1); }
.shake { animation: shakeX 0.4s ease; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* css/game.css */
/* ============================================================ SKY HEADER */
.sky {
  position: relative;
  border: var(--line) solid var(--ink);
  border-radius: 24px;
  box-shadow: var(--pop);
  padding: 8px 8px 8px;
  overflow: hidden;
  isolation: isolate;
  background: linear-gradient(180deg, #8fd6ff 0%, #c4ecff 62%, #e4f8d6 100%);
  transition: background 1s ease;
}
.sky--dawn { background: linear-gradient(180deg, #ffc9a6 0%, #ffe6c6 60%, #e4f6d2 100%); }
.sky--dusk { background: linear-gradient(180deg, #ff9d8c 0%, #ffcc9f 58%, #f7e4c5 100%); }
.sky--night { background: linear-gradient(180deg, #1c2358 0%, #322f6c 58%, #4c3f7f 100%); }
.sky--night::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background-image: radial-gradient(1.5px 1.5px at 12% 22%, #fff 99%, transparent),
    radial-gradient(1px 1px at 32% 64%, #fff 99%, transparent),
    radial-gradient(1.5px 1.5px at 58% 18%, #fff 99%, transparent),
    radial-gradient(1px 1px at 74% 52%, #fff 99%, transparent),
    radial-gradient(1.5px 1.5px at 90% 28%, #fff 99%, transparent),
    radial-gradient(1px 1px at 46% 40%, #fff 99%, transparent);
  animation: twinkle 3s ease-in-out infinite alternate;
}
@keyframes twinkle { from { opacity: 0.55; } to { opacity: 1; } }
.sky-fx { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.wx-rain .sky-fx, .wx-storm .sky-fx {
  background-image: repeating-linear-gradient(105deg, rgba(255, 255, 255, 0.0) 0 9px, rgba(255, 255, 255, 0.55) 9px 10px, rgba(255, 255, 255, 0) 10px 22px);
  background-size: 120px 120px;
  animation: rain 0.5s linear infinite;
  opacity: 0.55;
}
.wx-storm { filter: saturate(0.8); }
.wx-storm .sky-fx::after {
  content: "";
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  animation: lightning 7s infinite;
}
.wx-cloudy .sky-fx { background: linear-gradient(180deg, rgba(255, 255, 255, 0.25), rgba(200, 200, 215, 0.25)); }
@keyframes rain { to { background-position: -40px 120px; } }
@keyframes lightning { 0%, 92%, 100% { opacity: 0; } 93% { opacity: 0.7; } 94% { opacity: 0.1; } 95% { opacity: 0.6; } }

.hud { position: relative; z-index: 2; display: flex; align-items: center; gap: 6px; }
.hud .grow { flex: 1; min-width: 0; display: flex; gap: 5px; }
.lvl {
  appearance: none;
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: var(--line) solid var(--ink);
  padding: 0;
  cursor: pointer;
  position: relative;
  display: grid;
  place-items: center;
  background: conic-gradient(var(--leaf) calc(var(--p, 0) * 360deg), var(--paper-3) 0);
  box-shadow: var(--pop-sm);
}
.lvl::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--sun); border: 2px solid var(--ink); }
.lvl b { position: relative; font-family: var(--font-display); font-size: 18px; line-height: 1; padding-top: 2px; }
.pill {
  appearance: none;
  flex: 1 1 0;
  min-width: 0;
  height: 32px;
  border: 2.5px solid var(--ink);
  border-radius: 999px;
  background: var(--paper);
  box-shadow: 0 2px 0 var(--ink);
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 0 8px 0 4px;
  cursor: pointer;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 14px;
  white-space: nowrap;
  position: relative;
}
.pill .pi { font-size: 15px; width: 20px; flex: 0 0 auto; text-align: center; }
.pill b { font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
.pill small { color: var(--ink-2); font-size: 11px; }
.pill-timer {
  position: absolute;
  left: 50%;
  bottom: -11px;
  transform: translateX(-50%);
  font-size: 10px;
  line-height: 1;
  background: var(--ink);
  color: var(--paper);
  border-radius: 6px;
  padding: 2px 5px 1px;
}
.hud-btn { position: relative; flex: 0 0 auto; }
.hud-btn .dot {
  position: absolute;
  top: -4px;
  right: -4px;
  width: 11px;
  height: 11px;
  background: var(--berry);
  border: 2px solid var(--ink);
  border-radius: 50%;
}

.scene { position: relative; z-index: 2; display: flex; align-items: flex-end; gap: 8px; margin-top: 10px; min-height: 48px; }
.bean {
  appearance: none;
  background: none;
  border: 0;
  padding: 0;
  width: 44px;
  height: 52px;
  flex: 0 0 auto;
  cursor: pointer;
  position: relative;
  animation: bob 2.6s ease-in-out infinite;
}
.bean-body {
  position: absolute;
  left: 4px;
  bottom: 2px;
  width: 36px;
  height: 38px;
  background: radial-gradient(circle at 34% 30%, #c4f19b 0 22%, #8fd365 60%);
  border: var(--line) solid var(--ink);
  border-radius: 52% 48% 46% 50% / 56% 56% 44% 44%;
}
.bean-body .eye { position: absolute; top: 13px; width: 6px; height: 8px; background: var(--ink); border-radius: 50%; animation: blink 4s infinite; }
.bean-body .eye.l { left: 8px; }
.bean-body .eye.r { right: 8px; }
.bean-body .blush { position: absolute; top: 22px; left: 5px; right: 5px; height: 5px; background: radial-gradient(circle at 15% 50%, #ff9db5 0 3px, transparent 4px), radial-gradient(circle at 85% 50%, #ff9db5 0 3px, transparent 4px); }
.bean-body .mouth { position: absolute; top: 22px; left: 50%; width: 8px; height: 4px; margin-left: -4px; border-bottom: 2.5px solid var(--ink); border-radius: 0 0 8px 8px; }
.bean .sprout { position: absolute; left: 20px; top: 0; width: 3px; height: 14px; background: var(--leaf-d); border-radius: 2px; }
.bean .sprout::before, .bean .sprout::after {
  content: "";
  position: absolute;
  top: 0;
  width: 12px;
  height: 8px;
  background: var(--leaf);
  border: 2px solid var(--ink);
  border-radius: 100% 0;
}
.bean .sprout::before { right: 2px; transform: rotate(-10deg); }
.bean .sprout::after { left: 2px; transform: scaleX(-1) rotate(-10deg); }
.bean.talk { animation: bump 0.4s ease; }
.bean.glitch .bean-body { animation: glitch 0.3s steps(2) 3; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
@keyframes glitch { 0% { filter: hue-rotate(0); transform: translateX(0); } 50% { filter: hue-rotate(160deg); transform: translateX(2px); } 100% { filter: hue-rotate(0); transform: translateX(-2px); } }
.bubble {
  position: relative;
  flex: 1;
  min-width: 0;
  background: var(--paper);
  border: 2.5px solid var(--ink);
  border-radius: 14px;
  padding: 6px 10px 5px;
  font-size: 12.5px;
  line-height: 1.35;
  font-weight: 700;
  margin-bottom: 4px;
  box-shadow: 0 2px 0 var(--ink);
}
.bubble::before {
  content: "";
  position: absolute;
  left: -9px;
  bottom: 9px;
  width: 12px;
  height: 12px;
  background: var(--paper);
  border-left: 2.5px solid var(--ink);
  border-bottom: 2.5px solid var(--ink);
  transform: rotate(45deg);
}
.bubble.pop { animation: popIn 0.3s cubic-bezier(.2, 1.6, .4, 1); }
.sky-icons { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 0 0 auto; }
.gift-btn { position: relative; align-self: center; }
.sky-icons button { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; font-size: 20px; line-height: 1.1; }
.moon.full { filter: drop-shadow(0 0 8px #fff7c2); animation: pulse 3s ease-in-out infinite; }
.earth {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  background: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, 0.65) 0 18%, transparent 40%), var(--earth, #a47a58);
}
.sky-events { position: relative; z-index: 2; display: flex; flex-wrap: nowrap; gap: 5px; margin-top: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.sky-events::-webkit-scrollbar { display: none; }
.sky-events .ev { flex: 0 0 auto; }
.sky-events:empty { display: none; }
.ev {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(255, 250, 240, 0.92);
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 1px 8px 0;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 11.5px;
}
.sky-layer { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.meteor {
  position: absolute;
  pointer-events: auto;
  appearance: none;
  border: 0;
  padding: 10px;
  background: none;
  cursor: pointer;
  width: 44px;
  height: 44px;
  animation: meteorFly 1.9s linear forwards;
}
.meteor::before {
  content: "";
  position: absolute;
  right: 12px;
  top: 20px;
  width: 70px;
  height: 3px;
  border-radius: 3px;
  background: linear-gradient(90deg, transparent, #fff8c9);
  transform-origin: right center;
  transform: rotate(-24deg);
}
.meteor::after {
  content: "";
  position: absolute;
  right: 10px;
  top: 16px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #fffbe0;
  box-shadow: 0 0 10px 4px rgba(255, 245, 190, 0.9);
}
@keyframes meteorFly { from { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } to { transform: translate(-260px, 116px); opacity: 0; } }
.firefly {
  position: fixed;
  z-index: 700;
  appearance: none;
  border: 0;
  background: none;
  width: 48px;
  height: 48px;
  padding: 0;
  cursor: pointer;
  animation: fireflyDrift 9s ease-in-out forwards;
}
.firefly::before {
  content: "";
  position: absolute;
  inset: 16px;
  border-radius: 50%;
  background: #f6ff9e;
  box-shadow: 0 0 14px 7px rgba(240, 255, 120, 0.85);
  animation: pulse 0.9s ease-in-out infinite;
}
@keyframes fireflyDrift {
  0% { transform: translate(0, 0); opacity: 0; }
  10% { opacity: 1; }
  30% { transform: translate(-60px, -40px); }
  55% { transform: translate(-130px, 10px); }
  80% { transform: translate(-200px, -50px); opacity: 1; }
  100% { transform: translate(-260px, -20px); opacity: 0; }
}

/* ============================================================ ORDERS */
.row-title { display: flex; align-items: center; justify-content: space-between; font-family: var(--font-ui); font-weight: 800; font-size: 13px; color: var(--ink-2); padding: 0 4px; }
.hscroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 2px 8px;
  scroll-snap-type: x proximity;
  scrollbar-width: thin;
}
.order {
  flex: 0 0 auto;
  width: 144px;
  scroll-snap-align: start;
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: 18px;
  box-shadow: var(--pop-sm);
  padding: 6px 8px 7px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
  transition: transform 0.15s;
}
.order.vip { background: linear-gradient(180deg, #fff3c4, var(--paper) 60%); border-color: #a86b00; box-shadow: 0 3px 0 #a86b00; }
.order.earth { background: linear-gradient(180deg, #d8f5ff, var(--paper) 60%); }
.order.ready { transform: translateY(-2px); }
.order.ready::after {
  content: "";
  position: absolute;
  inset: -6px;
  border-radius: 22px;
  border: 3px dashed var(--leaf);
  pointer-events: none;
  animation: spinDash 6s linear infinite;
  opacity: 0.8;
}
@keyframes spinDash { to { filter: hue-rotate(0); } }
.o-head { display: flex; align-items: center; gap: 5px; min-width: 0; }
.o-npc { font-size: 20px; line-height: 1; }
.o-name { font-family: var(--font-ui); font-weight: 800; font-size: 12px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.o-tag { position: absolute; top: -9px; right: 8px; font-family: var(--font-ui); font-weight: 800; font-size: 10.5px; border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; background: var(--sun); }
.order.earth .o-tag { background: #8fe0ff; }
.o-lines { display: flex; flex-wrap: wrap; gap: 4px; }
.o-line {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  background: var(--paper-2);
  border: 2px solid var(--paper-3);
  border-radius: 10px;
  padding: 1px 5px 0 3px;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 12px;
}
.o-line .oe { font-size: 17px; line-height: 1.2; }
.o-line.ok { border-color: var(--leaf); background: #e3f7d6; }
.o-line.done { opacity: 0.55; }
.o-line .req { font-size: 10px; color: var(--ink-2); }
.o-foot { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: auto; }
.o-rew { font-family: var(--font-ui); font-weight: 800; font-size: 12.5px; white-space: nowrap; }
.o-wait { width: 148px; flex: 0 0 auto; display: grid; place-items: center; text-align: center; color: var(--ink-2); font-weight: 700; font-size: 12px; border: 3px dashed var(--ink-3); border-radius: 18px; padding: 10px; }

/* ============================================================ FIELD (plots & pens) */
.slot {
  flex: 0 0 auto;
  width: 74px;
  height: 76px;
  border: var(--line) solid var(--ink);
  border-radius: 18px;
  box-shadow: var(--pop-sm);
  position: relative;
  display: grid;
  place-items: center;
  cursor: pointer;
  scroll-snap-align: start;
  overflow: hidden;
  appearance: none;
  padding: 0;
  font: inherit;
}
.slot--plot {
  background: repeating-linear-gradient(0deg, var(--soil) 0 9px, #b07a50 9px 12px);
}
.slot--pen {
  background: linear-gradient(180deg, transparent 58%, rgba(0, 0, 0, 0) 58%),
    repeating-linear-gradient(90deg, transparent 0 15px, #c9935f 15px 19px),
    linear-gradient(180deg, #cdeaa6 0 55%, #a9d97f 55%);
}
.slot--pen::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 34px;
  height: 6px;
  background: #b97f4a;
  border-block: 2px solid var(--soil-d);
}
.slot--buy { background: var(--paper-2); border-style: dashed; box-shadow: none; color: var(--ink-2); font-family: var(--font-ui); font-weight: 800; font-size: 12px; text-align: center; line-height: 1.15; padding: 4px; }
.slot .se { position: relative; font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.18)); z-index: 1; }
.slot .se.small { font-size: 22px; }
.slot .sl {
  position: absolute;
  left: 4px;
  right: 4px;
  bottom: 4px;
  z-index: 2;
  text-align: center;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 10.5px;
  line-height: 1.15;
  background: rgba(255, 250, 240, 0.92);
  border: 2px solid var(--ink);
  border-radius: 8px;
  padding: 1px 2px 0;
  overflow: hidden;
}
.slot .ring {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  background: conic-gradient(var(--leaf) calc(var(--p, 0) * 360deg), var(--paper) 0);
  z-index: 2;
}
.slot .feed {
  position: absolute;
  top: 5px;
  left: 5px;
  z-index: 2;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 10.5px;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 8px;
  padding: 0 4px;
}
.slot.ready .se { animation: readyBounce 0.9s ease-in-out infinite; }
.slot.ready .sl { background: var(--sun); }
.slot.hungry .sl { background: #ffd0db; }
.slot .bubble-prod {
  position: absolute;
  top: 3px;
  right: 3px;
  z-index: 3;
  font-size: 18px;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 50%;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  animation: readyBounce 0.9s ease-in-out infinite;
}
.slot.has-gene .se { filter: drop-shadow(0 0 6px var(--gc)) drop-shadow(0 2px 0 rgba(0, 0, 0, 0.18)); }
@keyframes readyBounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.06); } }

/* ============================================================ BOARD */
.board-wrap { position: relative; flex: 1 1 0; min-height: 230px; display: grid; place-items: center; }
.board {
  width: var(--bw, 100%);
  max-width: 100%;
  aspect-ratio: var(--cols, 7) / var(--rows, 7);
  display: grid;
  grid-template-columns: repeat(var(--cols, 7), 1fr);
  grid-template-rows: repeat(var(--rows, 7), 1fr);
  gap: 4px;
  padding: 7px;
  background: linear-gradient(180deg, var(--grass), var(--grass-d));
  border: var(--line) solid var(--ink);
  border-radius: 22px;
  box-shadow: var(--pop);
  touch-action: manipulation;
}
.cell {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: var(--cell);
  border-radius: 12px;
  box-shadow: inset 0 -3px 0 rgba(58, 42, 77, 0.08);
}
.cell:nth-child(odd) { background: #eff9db; }
.cell.hover { box-shadow: inset 0 0 0 3px var(--sky-d); }
.cell.hover-merge { box-shadow: inset 0 0 0 3px var(--leaf); background: #e2f7cf; }
.cell.selected { box-shadow: inset 0 0 0 3px var(--ink); }

/* item art (shared by board, sheet, cards, overlays) */
.art {
  --sz: var(--board-sz, 30px);
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  user-select: none;
  -webkit-user-select: none;
  border-radius: 12px;
}
.art .emo { position: relative; z-index: 1; font-size: var(--sz); line-height: 1; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.16)); }
.art .emo2 { position: absolute; z-index: 2; right: 8%; bottom: 14%; font-size: calc(var(--sz) * 0.55); line-height: 1; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.2)); }
.art--seed .emo { font-size: calc(var(--sz) * 0.62); margin-top: 18%; }
.art--seed .sack {
  position: absolute;
  inset: 16% 15% 7%;
  background: radial-gradient(circle at 30% 30%, #f9e1b5, #e5be86 70%);
  border: 2.5px solid #9a6a3b;
  border-radius: 38% 38% 34% 34% / 28% 28% 46% 46%;
}
.art--seed .sack::before {
  content: "";
  position: absolute;
  left: 22%;
  right: 22%;
  top: 14%;
  height: 4px;
  border-radius: 3px;
  background: #b17a40;
}
.art--animal .tuft {
  position: absolute;
  left: 16%;
  right: 16%;
  bottom: 9%;
  height: 18%;
  border-radius: 50%;
  background: radial-gradient(ellipse at 50% 40%, #9bd36f, #79b84f);
  opacity: 0.85;
}
.art--animal .emo { font-size: calc(var(--sz) * var(--as, 0.9)); }
.art--generator {
  background: linear-gradient(180deg, #e7b27a, #c9874c);
  border: 2.5px solid var(--soil-d);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.15);
}
.art--generator .emo { font-size: calc(var(--sz) * 1.05); }
.art .b-lv, .art .b-st {
  position: absolute;
  right: 1px;
  bottom: 1px;
  z-index: 3;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 10px;
  line-height: 1;
  padding: 2px 3px 1px;
  border-radius: 6px;
  background: var(--ink);
  color: var(--paper);
}
.art .b-st { background: var(--sun); color: var(--ink); border: 1.5px solid var(--ink); }
.art .b-en { position: absolute; right: 1px; top: 1px; z-index: 3; font-family: var(--font-ui); font-weight: 800; font-size: 9.5px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 6px; padding: 1px 3px 0; }
.art .b-gene {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 3;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 10px;
  background: var(--paper);
  border: 2px solid var(--gc, var(--ink));
}
.art .b-charm { position: absolute; right: 0; top: 0; z-index: 3; font-size: 12px; line-height: 1; filter: drop-shadow(0 1px 0 #fff); }
.art .b-lock { position: absolute; left: 1px; bottom: 1px; z-index: 3; font-size: 10px; line-height: 1; }
.art .b-carrier {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 3;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 9px;
  background: rgba(255, 255, 255, 0.7);
  border: 2px dashed var(--ink-3);
  opacity: 0.85;
}
/* gene aura */
.art.has-gene { box-shadow: 0 0 0 2px var(--gc), 0 0 12px 2px var(--gc); background: radial-gradient(circle, rgba(255, 255, 255, 0.7), transparent 70%); animation: aura 2.4s ease-in-out infinite; }
.art.gt-2 { box-shadow: 0 0 0 2px var(--gc), 0 0 0 4px #fff, 0 0 14px 4px var(--gc); }
.art.gt-3::before, .art.is-super::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 14px;
  padding: 3px;
  background: conic-gradient(from var(--ang, 0deg), #ff5fa2, #ffb21f, #f9f871, #5cbb49, #56c1ff, #a560f0, #ff5fa2);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: spinAng 3s linear infinite;
}
@property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes spinAng { to { --ang: 360deg; } }
.art.is-super { box-shadow: 0 0 16px 5px rgba(255, 210, 90, 0.85); }
@keyframes aura { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.12); } }

/* board item behaviours */
.cell > .art { position: absolute; inset: 1px; width: auto; height: auto; touch-action: none; cursor: grab; }
.cell > .art.dragging { opacity: 0.25; }
.cell > .art.hint { animation: hintPulse 0.8s ease-in-out infinite; }
.cell > .art.locked-item { filter: saturate(0.7); }
.art--generator.idle { animation: wiggle 4s ease-in-out infinite; }
@keyframes hintPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.ghost { position: fixed; z-index: 880; pointer-events: none; transform: translate(-50%, -58%) scale(1.15); filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.25)); transition: none; }
.ghost.snap { transition: left 0.12s ease, top 0.12s ease, transform 0.12s ease; }
.pop-in { animation: mergePop 0.42s cubic-bezier(.2, 1.7, .4, 1) both; animation-delay: 0.05s; }
.fly-in { animation: flyIn 0.55s cubic-bezier(.25, 1.3, .5, 1) both; }
@keyframes mergePop { 0% { transform: scale(0.5); } 55% { transform: scale(1.28, 1.16); } 75% { transform: scale(0.94, 1.04); } 100% { transform: none; } }
@keyframes flyIn { 0% { transform: translate(var(--fx, 0), var(--fy, 0)) scale(0.35); } 70% { transform: translate(0, 0) scale(1.15); } 100% { transform: none; } }

.preview {
  position: fixed;
  z-index: 870;
  pointer-events: none;
  background: var(--paper);
  border: 2.5px solid var(--ink);
  border-radius: 12px;
  box-shadow: 0 3px 0 var(--ink);
  padding: 5px 8px 4px;
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: 12px;
  line-height: 1.3;
  min-width: 150px;
  max-width: 230px;
  transform: translate(-50%, calc(-100% - 10px));
}
.preview .pr { display: flex; justify-content: space-between; gap: 10px; }
.preview .pr b { font-variant-numeric: tabular-nums; }
.preview .pr.lock { color: var(--berry-d); }

/* ============================================================ DOCK */
.dock { display: flex; align-items: stretch; gap: 8px; }
.sell-bin, .store-btn {
  flex: 0 0 auto;
  appearance: none;
  border: var(--line) solid var(--ink);
  border-radius: 16px;
  background: var(--paper);
  box-shadow: var(--pop-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 58px;
  padding: 3px 0 2px;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 11px;
  cursor: pointer;
}
.sell-bin .di, .store-btn .di { font-size: 22px; line-height: 1.1; }
.sell-bin.hover { background: var(--sun); transform: scale(1.08); }
.store-btn.hover { background: var(--sky); }
.bag {
  flex: 1;
  min-width: 0;
  display: flex;
  gap: 5px;
  overflow-x: auto;
  background: var(--paper-2);
  border: var(--line) solid var(--ink);
  border-radius: 16px;
  padding: 5px;
  align-items: center;
  scrollbar-width: none;
}
.bag::-webkit-scrollbar { display: none; }
.boost {
  flex: 0 0 auto;
  position: relative;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  background: var(--paper);
  border: 2.5px solid var(--ink);
  border-radius: 12px;
  font-size: 22px;
  cursor: grab;
  touch-action: none;
  user-select: none;
}
.boost b {
  position: absolute;
  right: -3px;
  bottom: -4px;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 10.5px;
  line-height: 1;
  background: var(--ink);
  color: var(--paper);
  border-radius: 7px;
  padding: 2px 4px 1px;
}
.boost.empty { opacity: 0.38; cursor: default; }

/* ============================================================ ITEM SHEET */
.sheet {
  position: fixed;
  left: 50%;
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 60;
  width: min(448px, calc(100vw - 32px));
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: 22px;
  box-shadow: 0 6px 0 var(--ink), 0 12px 30px rgba(0, 0, 0, 0.18);
  padding: 12px;
  animation: sheetIn 0.25s cubic-bezier(.2, 1.4, .4, 1);
  max-height: 62vh;
  overflow: auto;
}
@keyframes sheetIn { from { transform: translate(-50%, 30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.sh-head { display: flex; gap: 10px; align-items: center; padding-right: 30px; }
.sh-art { width: 58px; height: 58px; flex: 0 0 auto; background: var(--cell); border-radius: 14px; border: 2.5px solid var(--ink); }
.sh-art .art { --sz: 34px; }
.sh-name { font-family: var(--font-ui); font-weight: 800; font-size: 17px; line-height: 1.2; }
.sh-sub { font-size: 12.5px; color: var(--ink-2); font-weight: 700; }
.sh-x { position: absolute; top: 10px; right: 10px; }
.stats { display: grid; gap: 5px; margin-top: 10px; }
.stat { display: grid; grid-template-columns: 22px 88px 1fr 46px; align-items: center; gap: 6px; font-weight: 700; font-size: 12.5px; }
.stat .si { font-size: 15px; text-align: center; }
.stat .bar { height: 10px; border-radius: 6px; background: var(--paper-3); border: 2px solid var(--ink); overflow: hidden; position: relative; }
.stat .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--leaf); border-radius: 0 4px 4px 0; }
.stat .bar i.bonus { background: var(--gc, var(--sun)); }
.stat .sv { font-family: var(--font-ui); font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.stat .sv small { color: var(--leaf-d); }
.gene-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 800; font-size: 13px; padding: 6px 8px; border-radius: 12px; background: var(--paper-2); border: 2px dashed var(--paper-3); }
.gene-line.on { background: linear-gradient(90deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.6)), var(--gc); border: 2px solid var(--gc); }
.gene-line .pur { letter-spacing: 1px; color: var(--ink); }
.sh-meta { display: grid; gap: 3px; margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.sh-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* ============================================================ LABS */
.lab { display: flex; flex-direction: column; gap: 10px; }
.lab-head { display: flex; gap: 12px; align-items: center; }
.lab-art {
  width: 72px;
  height: 72px;
  flex: 0 0 auto;
  border: var(--line) solid var(--ink);
  border-radius: 20px;
  display: grid;
  place-items: center;
  font-size: 38px;
  background: linear-gradient(180deg, #d9f4ff, #b4e48c);
  position: relative;
}
.lab-art.tier-2 { background: linear-gradient(180deg, #f0e1ff, #b4e48c); }
.lab-art.tier-3 { background: linear-gradient(180deg, #fff2c0, #ffd36b); box-shadow: 0 0 16px rgba(255, 200, 80, 0.8); }
.lab-art .lv { position: absolute; bottom: -8px; right: -8px; background: var(--ink); color: var(--paper); font-family: var(--font-display); font-size: 14px; border-radius: 10px; padding: 3px 7px 1px; }
.lab-name { font-family: var(--font-ui); font-weight: 800; font-size: 18px; line-height: 1.2; }
.kv { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 10px; font-size: 12.5px; font-weight: 700; align-items: baseline; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-family: var(--font-ui); font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.kv .up { color: var(--leaf-d); font-family: var(--font-ui); font-weight: 800; font-size: 12px; }
.lab-sub { font-size: 15px; font-weight: 800; margin-top: 2px; }
.hslots { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.hslot {
  border: 2.5px dashed var(--ink-3);
  border-radius: 16px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  min-height: 96px;
  justify-content: center;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
}
.hslot.busy { border-style: solid; border-color: var(--ink); background: var(--paper-2); }
.hslot .pair { font-size: 26px; line-height: 1; display: flex; align-items: center; gap: 2px; }
.dna { display: inline-block; animation: spin 2.4s linear infinite; }
.essence-row { display: flex; flex-wrap: wrap; gap: 6px; }
.locked-panel { position: relative; }
.locked-panel::after {
  content: attr(data-lock);
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 16px;
  background: rgba(255, 250, 240, 0.86);
  border-radius: var(--r-lg);
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 15px;
}

/* picker grid */

/* ============================================================ CODEX */
.cx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.cx {

}

.story-card { display: flex; flex-direction: column; gap: 6px; }
.story-card h3 { font-size: 16px; font-weight: 800; }
.story-card p { font-size: 14px; line-height: 1.6; max-width: 62ch; }

.earth-meter { height: 14px; border-radius: 8px; border: 2.5px solid var(--ink); background: #c9a17d; overflow: hidden; }
.earth-meter i { display: block; height: 100%; background: linear-gradient(90deg, #6fd06a, #4fb6e8); }
.secret-card { display: flex; gap: 10px; align-items: flex-start; }
.secret-card .ce { font-size: 30px; line-height: 1; flex: 0 0 auto; }
.secret-card.unknown .ce { filter: grayscale(1) opacity(0.35); }
.secret-card h4 { font-size: 15px; font-weight: 800; }
.secret-card p { font-size: 13px; color: var(--ink-2); font-weight: 600; }

/* ============================================================ LOGIN / LEVEL MODALS */
.login-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.lday {
  border: 2.5px solid var(--ink);
  border-radius: 14px;
  background: var(--paper-2);
  padding: 6px 3px 5px;
  text-align: center;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 11px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: center;
  min-width: 0;
}
.lday .le { font-size: 18px; line-height: 1.2; }
.lday small { font-size: 10px; color: var(--ink-2); line-height: 1.15; }

.lday.today { background: var(--sun); transform: scale(1.04); box-shadow: 0 3px 0 var(--ink); }
.lday.big { grid-column: span 2; }
.levelup-num { font-family: var(--font-display); font-size: 64px; line-height: 1; text-align: center; color: var(--sun); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); animation: popIn 0.6s cubic-bezier(.2, 1.6, .4, 1); }
.unlock-list { display: grid; gap: 6px; }
.unlock-list div { display: flex; gap: 8px; align-items: center; font-weight: 700; background: var(--paper-2); border-radius: 12px; padding: 5px 9px; border: 2px solid var(--paper-3); }
.form-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.form-row label { font-weight: 800; font-family: var(--font-ui); }
.input {

  font-weight: 700;

}

.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); transition: left 0.2s; }
.toggle[aria-pressed="true"] { background: var(--leaf); }
.toggle[aria-pressed="true"]::after { left: 26px; }
.dev { display: grid; gap: 10px; }
.dev h3 { font-size: 14px; }
.dev .row { display: flex; flex-wrap: wrap; gap: 6px; }
.dev pre { white-space: pre-wrap; font-size: 11.5px; background: var(--paper-2); border-radius: 10px; padding: 8px; margin: 0; max-height: 220px; overflow: auto; }
.rate-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }

.rate-table td.p { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-ui); font-weight: 800; }
.rate-table tr.rh td { font-family: var(--font-ui); font-weight: 800; padding-top: 8px; }
.rh-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); margin-right: 5px; vertical-align: -1px; }

/* ============================================================ FX LAYERS */
#fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 940; }
#fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 941; overflow: hidden; }
.ftxt {
  position: absolute;
  transform: translate(-50%, -50%);
  font-family: var(--font-display);
  font-size: 18px;
  line-height: 1.3;
  color: var(--white);
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
  white-space: nowrap;
  animation: floatUp 1.2s ease-out forwards;
}
.ftxt.big { font-size: 24px; color: var(--sun); }
.ftxt.gene { color: #fff6a8; font-size: 20px; }
.ftxt.sad { color: #d6d0e0; font-size: 15px; }
.ftxt.good { color: #b7ff8f; }
@keyframes floatUp { 0% { transform: translate(-50%, -30%) scale(0.6); opacity: 0; } 15% { transform: translate(-50%, -60%) scale(1.15); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(-50%, -190%) scale(1); opacity: 0; } }
.fly { position: absolute; font-size: 22px; line-height: 1; transform: translate(-50%, -50%); filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.2)); }
.ring-fx { position: absolute; width: 20px; height: 20px; border-radius: 50%; border: 4px solid var(--rc, #fff); transform: translate(-50%, -50%); animation: ringOut 0.5s ease-out forwards; }
@keyframes ringOut { to { width: 120px; height: 120px; opacity: 0; border-width: 1px; } }
.flash-fx { position: fixed; inset: 0; background: var(--fc, #fff); animation: flash 0.35s ease-out forwards; z-index: 939; pointer-events: none; }
@keyframes flash { from { opacity: 0.75; } to { opacity: 0; } }
.screen-shake { animation: shakeX 0.35s ease; }

/* drag targets */
.slot.target, .order.target { box-shadow: 0 0 0 4px var(--leaf), var(--pop-sm); animation: hintPulse 0.8s ease-in-out infinite; }
.slot.hover, .order.hover { box-shadow: 0 0 0 4px var(--sky-d), var(--pop-sm); transform: scale(1.05); }
.tut-focus { position: relative; z-index: 5; animation: tutPulse 1.2s ease-in-out infinite; }
@keyframes tutPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 200, 58, 0.0); } 50% { box-shadow: 0 0 0 6px rgba(255, 200, 58, 0.9); } }

/* css/gacha.css */
/* ============================================================ GIFT BOX ART */
.gbox { --w: 110px; --body: #7ed36b; --lid: #5cbb49; --rib: #ffcf3d; position: relative; width: var(--w); height: calc(var(--w) * 0.96); }
.gbox--star { --body: #3d438f; --lid: #2d3177; --rib: #ffd84d; }

  position: absolute;
  left: 6%;
  right: 6%;

  height: 66%;
  background: var(--body);
  border: var(--line) solid var(--ink);

}
.gbox--star .gb-body { background-image: radial-gradient(2px 2px at 20% 30%, #fff 99%, transparent), radial-gradient(2px 2px at 70% 60%, #fff 99%, transparent), radial-gradient(1.5px 1.5px at 40% 75%, #fff 99%, transparent); background-color: var(--body); }

.gb-emblem { position: relative; z-index: 1; font-size: calc(var(--w) * 0.26); background: var(--paper); border: 2.5px solid var(--ink); border-radius: 50%; width: 44%; aspect-ratio: 1; display: grid; place-items: center; line-height: 1; }

  height: 24%;

  z-index: 2;

}

.gb-bow { position: absolute; left: 50%; top: -42%; width: 0; height: 0; }

/* ============================================================ GACHA SCREEN */
.box-card { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.box-card .gbox { animation: bob 2.8s ease-in-out infinite; margin: 6px 4px; }
.box-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.box-info h3 { font-size: 19px; font-weight: 800; }
.box-info p { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.box-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.pity-line { font-size: 11.5px; font-weight: 700; color: var(--ink-2); }
.tickets-bar { display: flex; gap: 8px; flex-wrap: wrap; }

/* ============================================================ OPENING STAGE */
.gstage {
  --rc: #ffffff;
  position: fixed;
  inset: 0;
  z-index: 960;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: var(--paper);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: fadeIn 0.25s ease;

  -webkit-user-select: none;
}
.gs-bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, #3b2f6e 0%, #1a1438 60%, #0d0a22 100%); }
.gs-bg::after {
  content: "";
  position: absolute;

    radial-gradient(1.5px 1.5px at 70% 15%, #fff 99%, transparent), radial-gradient(1px 1px at 85% 65%, #fff 99%, transparent),

}

  position: absolute;

  top: 46%;

  height: 180vmax;

  -webkit-mask: radial-gradient(circle, #000 0%, transparent 45%);
  mask: radial-gradient(circle, #000 0%, transparent 45%);
  opacity: 0.2;
  animation: spinC 18s linear infinite;
  transition: opacity 0.4s;
}
.gs-glow { position: absolute; left: 50%; top: 46%; width: 340px; height: 340px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, var(--rc) 0%, transparent 65%); opacity: 0.35; transition: background 0.3s, opacity 0.3s; }
.gstage.charging .gs-glow { opacity: 0.6; }
.gstage.burst .gs-rays { opacity: 0.55; animation-duration: 6s; }
.gstage.burst .gs-glow { opacity: 0.9; }
.gs-center { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.gs-box { --w: 150px; cursor: pointer; animation: bob 2.4s ease-in-out infinite; filter: drop-shadow(0 0 22px var(--rc)); }
.gs-box.s1 { animation: boxShake 0.45s ease; }
.gs-box.s2 { animation: boxShake2 0.5s ease; }
.gs-box.s3 { animation: boxShake3 0.55s ease; }
.gs-box.open .gb-lid { animation: lidOff 0.7s cubic-bezier(.2, .8, .3, 1) forwards; }

@keyframes boxShake { 0%, 100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-7deg) scale(1.03); } 50% { transform: rotate(6deg) scale(1.05); } 75% { transform: rotate(-4deg); } }
@keyframes boxShake2 { 0%, 100% { transform: rotate(0) scale(1); } 20% { transform: rotate(-11deg) scale(1.06); } 40% { transform: rotate(10deg) scale(1.08); } 60% { transform: rotate(-8deg) scale(1.06); } 80% { transform: rotate(5deg); } }
@keyframes boxShake3 { 0%, 100% { transform: translateY(0) rotate(0) scale(1); } 15% { transform: translateY(-14px) rotate(-14deg) scale(1.1); } 35% { transform: translateY(-4px) rotate(12deg) scale(1.12); } 55% { transform: translateY(-16px) rotate(-10deg) scale(1.12); } 75% { transform: translateY(-2px) rotate(7deg) scale(1.08); } }
@keyframes lidOff { 0% { transform: none; } 30% { transform: translateY(-30px) rotate(-12deg); } 100% { transform: translate(-140px, -320px) rotate(-75deg); opacity: 0; } }
@keyframes boxSink { to { transform: translateY(40px) scale(0.6); opacity: 0; } }
.gs-hint { font-family: var(--font-display); font-size: 22px; color: var(--paper); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; animation: pulse 1.2s ease-in-out infinite; text-align: center; }
.gs-skip { position: absolute; z-index: 5; top: max(14px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); }
.gs-cards { position: relative; z-index: 3; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 560px; }
.gs-cards.many { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; width: min(560px, 100%); }
.gs-actions { position: relative; z-index: 4; display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }

/* reveal cards */

.gcard.r-common { --rc: var(--r-common); }

.gs-title {

/* ============================================================ GENE AWAKENING CINEMATIC */

  /* ---------------- cốt truyện */
  'intro.1': 'Năm 2190. Trái Đất đã khô cằn. Sông cạn đáy, rừng hóa tro, và cây xanh cuối cùng đã héo úa.',
  'intro.2': 'Trước khi quá muộn, Hội Người Giữ Hạt đã cất giữ gen của muôn loài cây, hoa và động vật vào một hành tinh nhỏ do con người tạo ra: NOA.',
  'intro.3': 'Noa nhỏ đến mức đi bộ một vòng chỉ hết một buổi chiều. Nó bay quanh một ngôi sao trẻ, mang theo Kho Gen Vĩnh Cửu.',
  'intro.4': 'Qua hành trình dài, bức xạ vũ trụ làm kho gen vỡ thành từng mảnh nhỏ. Mỗi hạt giống in ra chỉ là một mảnh gen chưa trọn vẹn.',
  'intro.5': 'Bạn là cháu của bà Mai, trưởng Hội Người Giữ Hạt. Hôm nay, bạn tỉnh dậy sau 300 năm ngủ đông.',
  'intro.6': '"Chào Người Gieo Mầm! Mình là Đậu. Ghép các mảnh gen lại (MERGE), gieo trồng, lai tạo… và một ngày nào đó, chúng ta sẽ mang màu xanh trở về Trái Đất!"',
  'intro.start': 'Bắt đầu gieo mầm',

  'story.ch1.title': 'Chương 1 · Thức giấc',
  'story.ch1.text': 'Khoang ngủ đông mở ra. Không khí trên Noa thơm mùi đất ẩm. Robot Đậu, một cỗ máy nhỏ hình hạt đậu có mầm lá trên đầu, dẫn bạn ra cánh đồng đầu tiên. "Kho gen đã vỡ thành mảnh," Đậu nói, "nhưng hai mảnh giống nhau ghép lại sẽ thành một mảnh hoàn chỉnh hơn. Bà Mai gọi đó là MERGE." Bạn gieo hạt lúa đầu tiên trên Noa.',
  'story.ch2.title': 'Chương 2 · Gen đang ngủ',
  'story.ch2.text': 'Một hạt giống vừa merge bỗng phát sáng. Đậu reo lên: "Gen thức tỉnh!" Bà Mai đã viết thêm vào kho gen những đoạn mã lấy cảm hứng từ thiên nhiên và truyền thuyết của loài người: ánh mặt trời, ánh trăng, ngọn lửa, giọt nước. Bà tin rằng sự sống ngoài không gian cần mạnh mẽ hơn sự sống trên Trái Đất. Những gen ấy chưa mất. Chúng chỉ đang ngủ.',
  'story.ch3.title': 'Chương 3 · Tín hiệu từ Trái Đất',
  'story.ch3.text': 'Đêm ấy, radio của Đậu bắt được một tín hiệu yếu ớt: "…đây là Vòm Hà Nội… có ai nghe không…" Trên Trái Đất vẫn còn người sống trong những mái vòm kín. Một cô bé tên Na hỏi: "Hoa hồng có mùi gì vậy ạ?" Từ hôm đó, những chuyến tàu ong vàng bắt đầu chở nông sản của Noa về Trái Đất.',
  'story.ch4.title': 'Chương 4 · Tứ Linh',
  'story.ch4.text': 'Trong Trại Nghiên Cứu, bạn tìm thấy cuốn sổ tay của bà Mai. Bà là người Việt, và bà đã đặt tên cho gen động vật theo Tứ Linh: Long, Lân, Quy, Phụng. "Người xưa tin bốn linh vật mang lại thái bình," bà viết. "Bà mong muôn thú trên Noa cũng mang theo niềm tin ấy."',
  'story.ch5.title': 'Chương 5 · Lá thư thứ năm',
  'story.ch5.text': 'Trái Đất trên bầu trời Noa đã bớt màu nâu xỉn. Bé Na gửi một bức ảnh: một chậu hoa hồng nhỏ nở trong Vòm Hà Nội. Bông hoa đầu tiên sau ba trăm năm! Cả vòm đã khóc. Đậu im lặng rất lâu rồi nói: "Bà Mai sẽ vui lắm."',
  'story.ch6.title': 'Chương 6 · Hạt giống Tinh Tú',
  'story.ch6.text': 'Đất trên Trái Đất quá khô để hạt giống thường nảy mầm. Đậu đưa bạn bản thiết kế cuối cùng của bà Mai: Hạt giống Tinh Tú, mang gen thần thoại, chịu được hạn hán và cát bụi. "Khi đủ hạt Tinh Tú," Đậu nói, "Noa sẽ thả một CƠN MƯA HẠT GIỐNG xuống Trái Đất."',
  'story.ch7.title': 'Chương 7 · Cơn mưa hạt giống',
  'story.ch7.text': 'Hàng triệu hạt giống phát sáng rơi xuống như mưa sao băng. Từ bầu trời Noa, bạn thấy những đốm xanh đầu tiên lan ra trên Trái Đất. Đậu chiếu lên màn hình một dòng chữ cũ: "Gửi cháu, Người Gieo Mầm cuối cùng. Bà luôn tin cháu sẽ làm được." Câu chuyện của Noa chưa kết thúc. Nó chỉ vừa nảy mầm.',
  'story.l1.title': 'Thư số 1 · Gửi cháu',
  'story.l1.text': 'Cháu yêu, khi cháu đọc thư này, bà đã không còn ở bên. Đừng buồn. Bà để lại cho cháu cả một hành tinh. Hãy nhớ: một hạt giống không cần phải hoàn hảo. Nó chỉ cần được ghép với một hạt giống khác cũng đang cố gắng như nó.',
  'story.l2.title': 'Thư số 2 · Về những gen đang ngủ',
  'story.l2.text': 'Gen không bao giờ thật sự mất đi, cháu ạ. Có khi nó chỉ ẩn xuống, ngủ yên trong dòng giống, chờ đúng cặp bố mẹ để thức dậy. Ông Mendel đã đếm từng hạt đậu để hiểu điều đó. Cháu cũng sẽ hiểu, nếu đủ kiên nhẫn.',
  'story.l3.title': 'Thư số 3 · Ưu thế lai',
  'story.l3.text': 'Hai loài khác nhau gặp nhau đôi khi sinh ra một thứ mạnh hơn cả hai. Người ta gọi đó là ưu thế lai. Bà nghĩ con người cũng vậy: chúng ta mạnh nhất khi biết tìm đến nhau.',
  'story.l4.title': 'Thư số 4 · Đoạn ghi âm',

// ---- js/core/noa.js
/*
 * Core: namespace, utilities, seeded RNG, event bus, hooks (extension points)
 * and the modifier registry every rate lookup goes through.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';

  /* ------------------------------------------------------------ utilities */
  const U = NOA.util = {
    clamp(v, a, b) { return Math.max(a, Math.min(b, v)); },
    lerp(a, b, t) { return a + (b - a) * t; },
    sum(arr) { let s = 0; for (const v of arr) s += v; return s; },
    randInt(min, max) { return min + Math.floor(NOA.rng.random() * (max - min + 1)); },
    randFloat(min, max) { return min + NOA.rng.random() * (max - min); },
    chance(p) { return NOA.rng.random() < p; },
    pick(arr) { return arr[Math.floor(NOA.rng.random() * arr.length)]; },
    /** weights: { key: weight } -> key (null if every weight is 0) */
    pickWeighted(weights) {
      let total = 0;
      for (const k in weights) total += Math.max(0, weights[k] || 0);
      if (total <= 0) return null;
      let r = NOA.rng.random() * total;
      for (const k in weights) {
        const w = Math.max(0, weights[k] || 0);
        if (r < w) return k;
        r -= w;
      }
      return Object.keys(weights).pop();
    },
    shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(NOA.rng.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    },
    uid(prefix) {
      U._uid = (U._uid || 0) + 1;
      return (prefix || 'i') + Date.now().toString(36) + U._uid.toString(36) + Math.floor(Math.random() * 1296).toString(36);
    },
    clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); },
    isObj(o) { return o && typeof o === 'object' && !Array.isArray(o); },
    deepMerge(target, src) {
      for (const k in src) {
        if (U.isObj(src[k]) && U.isObj(target[k])) U.deepMerge(target[k], src[k]);
        else target[k] = U.clone(src[k]);
      }
      return target;
    },
    pad2(n) { return String(n).padStart(2, '0'); },
    /** ms -> "0:42", "12:05", "1:02:03" */
    fmtDuration(ms) {
      const s = Math.max(0, Math.ceil(ms / 1000));
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      return h > 0 ? h + ':' + U.pad2(m) + ':' + U.pad2(sec) : m + ':' + U.pad2(sec);
    },
    pct(p, digits) {
      const v = p * 100;
      const d = digits != null ? digits : (v < 1 && v > 0 ? 2 : v < 10 ? 1 : 0);
      return (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toLocaleString(NOA.i18n ? NOA.i18n.locale() : 'vi-VN') + '%';
    }
  };

  /* ------------------------------------------------------------ seeded RNG (mulberry32) */
  NOA.rng = {
    _s: (Date.now() ^ 0x9e3779b9) >>> 0,
    seed(s) { this._s = (s >>> 0) || 1; },
    random() {
      let t = (this._s += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    /** Deterministic value in [0,1) for a key (weather slots etc.) */
    hash(n) {
      let t = (n >>> 0) + 0x6d2b79f5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
  };

  /* ------------------------------------------------------------ event bus */
  const listeners = {};
  NOA.events = {
    on(name, fn) {
      (listeners[name] = listeners[name] || []).push(fn);
      return () => { listeners[name] = (listeners[name] || []).filter((f) => f !== fn); };
    },
    emit(name, payload) {
      for (const fn of (listeners[name] || []).slice()) {
        try { fn(payload); } catch (e) { console.error('[NOA event ' + name + ']', e); }
      }
      for (const fn of (listeners['*'] || []).slice()) {
        try { fn(name, payload); } catch (e) { console.error(e); }
      }
    }
  };

  /* ------------------------------------------------------------ hooks (filters for extensions) */
  const hooks = {};
  NOA.hooks = {
    /** Register a filter: fn(value, ...args) -> new value */
    add(name, fn, priority) {
      (hooks[name] = hooks[name] || []).push({ fn, p: priority || 10 });
      hooks[name].sort((a, b) => a.p - b.p);
    },
    run(name, value, ...args) {
      for (const h of hooks[name] || []) {
        try {
          const out = h.fn(value, ...args);
          if (out !== undefined) value = out;
        } catch (e) { console.error('[NOA hook ' + name + ']', e); }
      }
      return value;
    }
  };

  /* ------------------------------------------------------------ modifiers
   * Every tunable rate is read through NOA.mods so labs, mascots, boosters,
   * world events and future features can stack bonuses without touching the
   * systems.  A provider returns [{ key, add?, mult?, src, params? }].
   * A modifier with key "gene.keep" also applies to "gene.keep.sameGene".
   */
  const providers = [];
  NOA.mods = {
    register(id, fn) {
      const i = providers.findIndex((p) => p.id === id);
      if (i >= 0) providers.splice(i, 1);
      providers.push({ id, fn });
    },
    collect(key, ctx) {
      const out = [];
      for (const p of providers) {
        let list;
        try { list = p.fn(ctx || {}) || []; } catch (e) { console.error('[NOA mods ' + p.id + ']', e); list = []; }
        for (const m of list) {
          if (m.key === key || key.startsWith(m.key + '.')) out.push(m);
        }
      }
      return out;
    },
    value(key, base, ctx) {
      let add = 0, mult = 1;
      for (const m of NOA.mods.collect(key, ctx)) {
        if (m.add) add += m.add;
        if (m.mult != null) mult *= m.mult;
      }
      return (base + add) * mult;
    },
    chance(key, base, ctx) {
      return U.clamp(NOA.mods.value(key, base, ctx), 0, NOA.BALANCE.merge.maxChance);
    },
    breakdown(key, base, ctx) {
      return { base, entries: NOA.mods.collect(key, ctx), total: NOA.mods.value(key, base, ctx) };
    }
  };
})();

/*
 * i18n: flat key dictionaries in i18n/vi.js and i18n/en.js.
 * t('key', {param}) replaces {param}; missing keys fall back to Vietnamese, then the key itself.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  NOA.I18N = NOA.I18N || {};

  const LOCALES = { vi: 'vi-VN', en: 'en-US' };

  NOA.i18n = {
    lang: 'vi',
    langs: ['vi', 'en'],
    setLang(lang) {
      this.lang = LOCALES[lang] ? lang : 'vi';
      if (globalThis.document) document.documentElement.lang = this.lang;
      NOA.events.emit('lang.changed', this.lang);
    },
    locale() { return LOCALES[this.lang] || 'vi-VN'; },
    has(key) {
      const d = NOA.I18N[this.lang] || {};
      return d[key] != null || (NOA.I18N.vi || {})[key] != null;
    },
    t(key, params) {
      const d = NOA.I18N[this.lang] || {};
      let s = d[key];
      if (s == null) s = (NOA.I18N.vi || {})[key];
      if (s == null) return key;
      if (params) s = s.replace(/\{(\w+)\}/g, (m, p) => (params[p] != null ? params[p] : m));
      return s;
    },
    num(n) {
      return Math.round(n).toLocaleString(this.locale());
    },
    /** 1.2K / 3,4M */
    compact(n) {
      if (Math.abs(n) < 10000) return this.num(n);
      try {
        return new Intl.NumberFormat(this.locale(), { notation: 'compact', maximumFractionDigits: 1 }).format(n);
      } catch (e) { return this.num(n); }
    }
  };

  NOA.t = (key, params) => NOA.i18n.t(key, params);
})();

/*
 * Clock: real time + dev offset, duration scaling, day keys and the lunar phase.
 * Every timer in the game reads NOA.time.now() so the dev panel can time-travel.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const DAY = 86400000;

  NOA.time = {
    now() {
      const dev = NOA.state && NOA.state.dev;
      return Date.now() + (dev && dev.offsetMs ? dev.offsetMs : 0);
    },
    scale() {
      const dev = NOA.state && NOA.state.dev;
      return dev && dev.timeScale ? dev.timeScale : NOA.BALANCE.time.timeScale;
    },
    /** seconds of game design time -> real milliseconds */
    dur(sec) { return sec * 1000 * NOA.time.scale(); },
    date() { return new Date(NOA.time.now()); },
    hour() { return NOA.time.date().getHours() + NOA.time.date().getMinutes() / 60; },
    isNight() {
      const force = NOA.state && NOA.state.dev && NOA.state.dev.force;
      if (force && force.night != null) return !!force.night;
      const h = NOA.time.date().getHours();
      const b = NOA.BALANCE.time;
      return h >= b.nightStartHour || h < b.nightEndHour;
    },
    /** 'dawn' | 'day' | 'dusk' | 'night' */
    phase() {
      if (NOA.time.isNight()) return 'night';
      const h = NOA.time.hour();
      const b = NOA.BALANCE.time;
      if (h < b.nightEndHour + 1.5) return 'dawn';
      if (h >= b.nightStartHour - 1.5) return 'dusk';
      return 'day';
    },
    /** Calendar day key that rolls over at balance.time.dayResetHour */
    dayKey(ts) {
      const d = new Date((ts != null ? ts : NOA.time.now()) - NOA.BALANCE.time.dayResetHour * 3600000);
      return d.getFullYear() + '-' + NOA.util.pad2(d.getMonth() + 1) + '-' + NOA.util.pad2(d.getDate());
    },
    /** 'MM-DD' in local time */
    md(ts) {
      const d = new Date(ts != null ? ts : NOA.time.now());
      return NOA.util.pad2(d.getMonth() + 1) + '-' + NOA.util.pad2(d.getDate());
    },
    /** Moon age as a fraction of the synodic month: 0 = new moon, 0.5 = full moon */
    moonPhase(ts) {
      const m = NOA.BALANCE.world.moon;
      const epoch = Date.parse(m.epochNewMoonUTC);
      const days = ((ts != null ? ts : NOA.time.now()) - epoch) / DAY;
      const f = (days / m.synodicDays) % 1;
      return f < 0 ? f + 1 : f;
    },
    isFullMoon(ts) {
      const force = NOA.state && NOA.state.dev && NOA.state.dev.force;
      if (force && force.fullMoon != null) return !!force.fullMoon;
      const m = NOA.BALANCE.world.moon;
      const ageFromFull = Math.abs(NOA.time.moonPhase(ts) - 0.5) * m.synodicDays;
      return ageFromFull <= m.fullWindowDays;
    },
    moonEmoji(ts) {
      if (NOA.time.isFullMoon(ts)) return '🌕';
      const f = NOA.time.moonPhase(ts);
      const icons = ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘'];
      return icons[Math.round(f * 8) % 8];
    },
    DAY
  };
})();

/*
 * Save system with a swappable storage adapter.
 * Default adapter: localStorage (wrapped in try/catch) with an in-memory fallback.
 * A cloud save only needs a new adapter with get/set/remove (see docs/GDD.md, "Mở rộng").
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const KEY = 'noa-farm-save';

  const memory = {};
  const memoryAdapter = {
    id: 'memory',
    get(k) { return memory[k] != null ? memory[k] : null; },
    set(k, v) { memory[k] = v; },
    remove(k) { delete memory[k]; }
  };
  const localAdapter = {
    id: 'local',
    get(k) { try { return globalThis.localStorage.getItem(k); } catch (e) { return memoryAdapter.get(k); } },
    set(k, v) { try { globalThis.localStorage.setItem(k, v); } catch (e) { memoryAdapter.set(k, v); } },
    remove(k) { try { globalThis.localStorage.removeItem(k); } catch (e) { memoryAdapter.remove(k); } }
  };

  let timer = null;

  NOA.save = {
    adapter: (function () {
      try { return globalThis.localStorage ? localAdapter : memoryAdapter; } catch (e) { return memoryAdapter; }
    })(),
    /** Version -> function(state) upgrading a save from version-1 to version */
    migrations: {
      // 2: (s) => { s.newField = 0; return s; }
    },
    setAdapter(adapter) { this.adapter = adapter; },
    load() {
      const raw = this.adapter.get(KEY);
      if (!raw) return null;
      try {
        let s = JSON.parse(raw);
        const target = NOA.BALANCE.meta.saveVersion;
        while ((s.v || 1) < target) {
          const next = (s.v || 1) + 1;
          if (this.migrations[next]) s = this.migrations[next](s);
          s.v = next;
        }
        return s;
      } catch (e) {
        console.warn('[NOA save] could not parse save, starting fresh', e);
        return null;
      }
    },
    write() {
      if (!NOA.state) return;
      try { this.adapter.set(KEY, JSON.stringify(NOA.state)); } catch (e) { console.warn('[NOA save]', e); }
    },
    schedule() {
      clearTimeout(timer);
      timer = setTimeout(() => NOA.save.write(), 400);
    },
    clear() { this.adapter.remove(KEY); },
    exportString() { return JSON.stringify(NOA.state); }
  };
})();
