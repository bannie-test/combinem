          else if (pg.tier !== g.tier - 1) warn('Gen ' + id + ': gen cha/mẹ ' + p + ' phải ở tầng ' + (g.tier - 1));
        });
      }
      if (!B.gene.priceMult[g.tier]) warn('balance.gene.priceMult thiếu tầng ' + g.tier);
    }
    for (const fam of ['plant', 'animal']) {
      const w = B.gene.spawnWeights[fam] || {};
      sumPositive('gene.spawnWeights.' + fam, w);
      for (const id in w) {
        if (!C.genes[id]) warn('gene.spawnWeights.' + fam + ': gen không tồn tại ' + id);
        else if (C.genes[id].tier !== 1 || C.genes[id].family !== fam) warn('gene.spawnWeights.' + fam + '.' + id + ' phải là gen tầng 1 họ ' + fam);
      }
    }

    // probabilities
    prob('gene.spawnChance', B.gene.spawnChance);
    for (const k in B.gene.keep) prob('gene.keep.' + k, B.gene.keep[k]);
    B.gene.purityUpChance.forEach((v, i) => prob('gene.purityUpChance[' + i + ']', v));
    for (const k in B.gene.fusion.chanceByTier) prob('gene.fusion.chanceByTier.' + k, B.gene.fusion.chanceByTier[k]);
    for (const k in B.recessive) prob('recessive.' + k, B.recessive[k]);
    B.merge.breakthroughChance.forEach((v, i) => prob('merge.breakthroughChance[' + i + ']', v));
    prob('harvest.geneProductChance', B.harvest.geneProductChance);
    prob('harvest.naturalCloverChance', B.harvest.naturalCloverChance);
    prob('breeds.carrierChance', B.breeds.carrierChance);
    for (const k of ['extraChance', 'geneInherit', 'carrierFromGene', 'carrierInherit', 'inheritRatio']) prob('harvest.seeds.' + k, B.harvest.seeds[k]);
    prob('livestock.offspringChance', B.livestock.offspringChance);
    prob('livestock.manureChance', B.livestock.manureChance);
    prob('production.starUpChance', B.production.starUpChance);
    prob('orders.vip.chance', B.orders.vip.chance);
    prob('hybrid.baseDiscovery', B.hybrid.baseDiscovery);

    // recipes & buildings
    for (const pid in B.recipes) {
      const r = B.recipes[pid];
      if (!C.products[pid]) warn('recipes: sản phẩm không tồn tại ' + pid);
      if (!B.production.buildings[r.building]) warn('recipes.' + pid + ': xưởng không tồn tại ' + r.building);
      for (const inp in r.inputs) {
        if (!C.products[inp] && !C.materials[inp]) warn('recipes.' + pid + ': nguyên liệu không tồn tại ' + inp);
        if (!(r.inputs[inp] > 0)) warn('recipes.' + pid + ': số lượng ' + inp + ' phải > 0');
      }
      if (!(r.timeSec > 0)) warn('recipes.' + pid + '.timeSec phải > 0');
    }
    for (const id in C.species) {
      const sp = C.species[id];
      (sp.products || []).slice(1).forEach((pid) => { if (!B.recipes[pid]) warn('Thiếu công thức chế biến cho ' + pid); });
    }
    for (const b in B.production.buildings) if (!C.buildings[b]) warn('content.buildings thiếu xưởng "' + b + '"');
    for (const b in B.livestock.pens) if (!C.buildings[b]) warn('content.buildings thiếu chuồng "' + b + '"');
    for (const b in C.buildings) if (!C.map.buildings[b]) warn('content.map.buildings thiếu vị trí cho "' + b + '"');
    for (const bed of ['crop', 'flower']) {
      const f = B.fields[bed];
      if (f.cost.length < f.max || f.levelReq.length < f.max) warn('fields.' + bed + ': cost/levelReq phải đủ ' + f.max + ' phần tử');
      if (!C.map.plots[bed]) warn('content.map.plots thiếu "' + bed + '"');
    }
    for (const m in C.materials) if (!B.materials[m]) warn('balance.materials thiếu "' + m + '"');

    // labs
    if (B.labs.levels.length !== B.labs.maxLevel + 1) warn('labs.levels phải có ' + (B.labs.maxLevel + 1) + ' phần tử (kể cả null ở index 0)');
    for (let i = 2; i < B.labs.levels.length; i++) {
      const L = B.labs.levels[i];
      if (!L || !L.cost) warn('labs.levels[' + i + '] thiếu cost');
    }

    // gacha
    for (const boxId in B.gacha.boxes) {
      const box = B.gacha.boxes[boxId];
      if (!C.boxes[boxId]) warn('content.boxes thiếu "' + boxId + '"');
      sumPositive('gacha.boxes.' + boxId + '.rarityWeights', box.rarityWeights);
      for (const r in box.rarityWeights) {
        if (B.gacha.rarityOrder.indexOf(r) < 0) warn('Hộp ' + boxId + ': độ hiếm lạ ' + r);
        if (box.rarityWeights[r] > 0) {
          const pool = box.pool[r] || {};
          if (!Object.keys(pool).length) warn('Hộp ' + boxId + ': độ hiếm ' + r + ' có trọng số nhưng pool rỗng');
          for (const rid in pool) if (!B.gacha.rewards[rid]) warn('Hộp ' + boxId + ': phần thưởng không tồn tại ' + rid);
        }
      }
      for (const r in box.pity || {}) if (B.gacha.rarityOrder.indexOf(r) < 0) warn('Hộp ' + boxId + ': pity độ hiếm lạ ' + r);
    }
    for (const id in B.gacha.speciesWeights) if (!C.species[id] || C.species[id].hybrid) warn('gacha.speciesWeights: loài không hợp lệ ' + id);
    for (const id in C.species) if (!C.species[id].hybrid && !(B.gacha.speciesWeights[id] > 0)) warn('gacha.speciesWeights: thiếu trọng số cho ' + id);
    for (const pool in B.gacha.mascotPools) {
      for (const id in B.gacha.mascotPools[pool]) if (!C.mascots[id]) warn('gacha.mascotPools.' + pool + ': linh vật không tồn tại ' + id);
    }
    for (const rid in B.gacha.rewards) {
      const r = B.gacha.rewards[rid];
      if (r.type === 'booster' && !C.boosters[r.id]) warn('gacha.rewards.' + rid + ': booster không tồn tại ' + r.id);
      if (r.type === 'mascot' && !B.gacha.mascotPools[r.pool]) warn('gacha.rewards.' + rid + ': nhóm linh vật không tồn tại ' + r.pool);
      if (r.type === 'material' && !C.materials[r.id]) warn('gacha.rewards.' + rid + ': vật liệu không tồn tại ' + r.id);
    }

    // mascots
    for (const id in C.mascots) {
      if (!B.mascots.effects[id]) warn('mascots.effects thiếu "' + id + '"');
      if (C.mascots[id].type === 'temp' && !(B.mascots.durationMin[id] > 0)) warn('mascots.durationMin thiếu "' + id + '"');
    }

    // rewards tables
    if ((B.login.days || []).length < 1) warn('login.days rỗng');
    const checkReward = (path, r) => {
      for (const b in (r && r.boosters) || {}) if (!C.boosters[b]) warn(path + ': booster không tồn tại ' + b);
      for (const tk in (r && r.tickets) || {}) if (!B.gacha.boxes[tk]) warn(path + ': vé không tồn tại ' + tk);
      if (r && r.mascot && !C.mascots[r.mascot]) warn(path + ': linh vật không tồn tại ' + r.mascot);
      for (const m in (r && r.materials) || {}) if (!C.materials[m]) warn(path + ': vật liệu không tồn tại ' + m);
      for (const p in (r && r.products) || {}) if (!C.products[p]) warn(path + ': sản phẩm không tồn tại ' + p);
      ((r && r.seeds) || []).concat((r && r.animals) || []).forEach((sp) => { if (!C.species[sp.species]) warn(path + ': loài không tồn tại ' + sp.species); });
    };
    B.login.days.forEach((d, i) => checkReward('login.days[' + i + ']', d));
    for (const lv in B.levelRewards) checkReward('levelRewards.' + lv, B.levelRewards[lv]);
    B.shop.items.forEach((it) => checkReward('shop.' + it.id, it.grant));
    for (const s in B.secrets.rewards) checkReward('secrets.rewards.' + s, B.secrets.rewards[s]);

    // payment
    const skus = {};
    (P.products || []).forEach((p) => {
      if (skus[p.sku]) warn('payment: trùng sku ' + p.sku);
      skus[p.sku] = true;
      checkReward('payment.' + p.sku, p.grant);
    });
    if (P.enabled && P.provider === 'disabled') warn('payment.enabled = true nhưng provider vẫn là "disabled"');

    // i18n coverage for content names
    if (NOA.I18N && NOA.I18N.vi && NOA.I18N.en) {
      const need = [];
      for (const id in C.species) need.push('species.' + id);
      for (const id in C.products) need.push('product.' + id);
      for (const id in C.genes) need.push('gene.' + id);
      for (const id in C.mascots) need.push('mascot.' + id);
      for (const id in C.boosters) need.push('booster.' + id);
      for (const id in C.materials) need.push('material.' + id);
      for (const id in C.buildings) need.push('bld.' + id);
      for (const z of C.map.zones) need.push('zone.' + z.id);
      for (const s of C.tutorial) need.push('tut.' + s.id);
      for (const k of need) {
        if (NOA.I18N.vi[k] == null) warn('i18n/vi.js thiếu "' + k + '"');
        if (NOA.I18N.en[k] == null) warn('i18n/en.js thiếu "' + k + '"');
      }
    }
    return out;
  };
})();

// ---- js/systems/state.js
/*
 * Game state shape (v2: farm map with zones), resources (coins / gems / research points) and XP / levels.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const S = () => NOA.state;

  const plot = (bed) => ({ bed, seed: null, start: 0, end: 0, fert: false });

  NOA.newState = function (lang) {
    const b = B();
    const now = Date.now();
    const state = {
      v: b.meta.saveVersion,
      createdAt: now,
      lang: lang || 'vi',
      farmName: '',
      res: { coins: 400, gems: 30, rp: 0 },
      xp: 0,
      level: 1,
      tickets: { sprout: 0, star: 0 },
      boosters: { clover: 1, stabilizer: 0, stardust: 0, tonic: 2, loupe: 0 },
      barn: { items: {}, upgrades: 0 },
      vault: { cells: new Array(b.storage.vaultStart).fill(null), pending: [] },
      nursery: { cells: new Array(b.storage.nurseryStart).fill(null) },
      fields: { crop: [], flower: [] },
      pens: {},
      factories: {},
      orders: [],
      orderRefillAt: 0,
      orderSwapAt: 0,
      ship: { state: 'away', until: 0, crates: [], trips: 0 },
      labs: { greenhouse: { level: 1, slots: [] }, ranch: { level: 1, slots: [] } },
      mascots: { owned: {}, temp: {}, shrine: new Array(b.mascots.shrineSlots).fill(null) },
      discovered: { species: {}, genes: {}, hybrids: {}, products: {}, mascots: {}, maxLevel: {} },
      essence: {},
      secrets: {},
      flags: {},
      login: { lastDay: null, claimed: 0 },
      gacha: {},
      market: { day: null, sold: {} },
      earth: 0,
      tutorial: { step: 0, counts: {}, done: false },
      settings: { sfx: true, music: true, haptics: true },
      dev: { offsetMs: 0, timeScale: null, force: {}, payProvider: null, features: {} },
      ledger: [],
      purchases: { owned: {}, monthlyUntil: 0, monthlyLastDay: null },
      stats: { merges: 0, breedMerges: 0, harvests: 0, orders: 0, genesAwakened: 0, opens: 0, maxCombo: 0, crafted: 0, ships: 0 },
      seen: { intro: false },
      camera: null
    };
    for (const bed of ['crop', 'flower']) {
      for (let i = 0; i < b.fields[bed].start; i++) state.fields[bed].push(plot(bed));
    }
    for (const id in b.livestock.pens) state.pens[id] = { slots: new Array(b.livestock.pens[id].slotsStart).fill(null) };
    for (const id in b.production.buildings) state.factories[id] = { slots: b.production.buildings[id].slotsStart, queue: [] };
    for (const id in b.gacha.boxes) state.gacha[id] = { opened: 0, since: {} };
    return state;
  };
  NOA.newPlot = plot;

  /** Starter kit for a brand-new farm */
  NOA.seedNewGame = function () {
    const s = S();
    const put = (grid, item) => { const i = s[grid].cells.indexOf(null); if (i >= 0) s[grid].cells[i] = item; };
    ['rice', 'rice', 'rice', 'tomato', 'tomato'].forEach((sp) => put('vault', NOA.items.newBreed(sp, 1)));
    put('nursery', NOA.items.newBreed('chicken', 1));
    NOA.barn.add('rice_1', 3);
    for (const id in C().species) {
      const sp = C().species[id];
      if (!sp.hybrid && B().species[id].unlockLevel <= 1) s.discovered.species[id] = true;
    }
  };

  /* ------------------------------------------------------------ resources */
  NOA.res = {
    get(k) { return S().res[k] || 0; },
    add(k, n) {
      if (!n) return;
      const r = S().res;
      r[k] = Math.max(0, (r[k] || 0) + n);
      NOA.events.emit('res.changed', { k, n });
      NOA.save.schedule();
    },
    canAfford(cost) {
      if (!cost) return true;
      for (const k in cost) {
        if (k === 'tickets') {
          for (const t in cost.tickets) if ((S().tickets[t] || 0) < cost.tickets[t]) return false;
        } else if ((S().res[k] || 0) < cost[k]) return false;
      }
      return true;
    },
    spend(cost) {
      if (!NOA.res.canAfford(cost)) return false;
      for (const k in cost) {
        if (k === 'tickets') {
          for (const t in cost.tickets) S().tickets[t] -= cost.tickets[t];
          NOA.events.emit('res.changed', { k: 'tickets' });
        } else {
          S().res[k] -= cost[k];
          NOA.events.emit('res.changed', { k, n: -cost[k] });
        }
      }
      NOA.save.schedule();
      return true;
    }
  };

  /* ------------------------------------------------------------ XP & level */
  NOA.progress = {
    xpToNext(level) {
      const t = B().level.xpToNext;
      if (level < t.length) return t[level];
      return t[t.length - 1] + (level - t.length + 1) * B().level.xpGrowthAfterTable;
    },
    addXP(n) {
      if (!n || n <= 0) return;
      const s = S();
      s.xp += Math.round(n);
      while (s.level < B().level.maxLevel && s.xp >= NOA.progress.xpToNext(s.level)) {
        s.xp -= NOA.progress.xpToNext(s.level);
        s.level += 1;
        const reward = NOA.rewards.levelReward(s.level);
        const granted = NOA.rewards.grant(reward, 'level');
        const unlocks = NOA.progress.unlocksAt(s.level);
        unlocks.species.forEach((id) => { s.discovered.species[id] = true; });
        if (NOA.farm) NOA.farm.grantFreePlots();
        NOA.events.emit('level.up', { level: s.level, granted, unlocks });
      }
      NOA.events.emit('xp.changed', { n });
      NOA.save.schedule();
    },
    unlocksAt(level) {
      const out = { species: [], features: [], buildings: [], plots: 0, flowerBeds: 0 };
      const b = B();
      for (const id in NOA.CONTENT.species) {
        const eco = b.species[id];
        if (!NOA.CONTENT.species[id].hybrid && eco.unlockLevel === level) out.species.push(id);
      }
      for (const f in b.unlocks) if (b.unlocks[f] === level) out.features.push(f);
      for (const id in b.production.buildings) if (b.production.buildings[id].unlockLevel === level && level > 1) out.buildings.push(id);
      out.plots = b.fields.crop.levelReq.filter((l, i) => l === level && i >= b.fields.crop.start).length;
      out.flowerBeds = b.fields.flower.levelReq.filter((l, i) => l === level && i >= b.fields.flower.start).length;
      return out;
    },
    isUnlocked(feature) {
      const lv = B().unlocks[feature];
      return lv == null || S().level >= lv;
    },
    speciesUnlocked(id) {
      const sp = NOA.CONTENT.species[id];
      if (sp.hybrid) return !!S().discovered.hybrids[id];
      return B().species[id].unlockLevel <= S().level;
    }
  };
})();

// ---- js/systems/items.js
/*
 * Items: breeds (seeds / animals living in the merge grids), barn goods (products & materials
 * stored as stacks), naming, effective stats and value.
 *
 *   breed  : { id, kind:'seed'|'animal', species, level, stats:{yield,growth,quality},
 *              gene:{id,purity}|null, carrier: geneId|null (hidden recessive), revealed, charm, locked }
 *   barn   : stacks keyed "productId|stars|geneId|purity"  (materials: "straw||0|0")
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const U = NOA.util;
  const STATS = ['yield', 'growth', 'quality'];
  const valueCache = {};

  const I = NOA.items = {
    STATS,
    kindOf(family) { return family === 'plant' ? 'seed' : 'animal'; },
    isBreed(item) { return !!item && (item.kind === 'seed' || item.kind === 'animal'); },
    family(item) {
      if (!item) return null;
      if (I.isBreed(item)) return C().species[item.species].family;
      return null;
    },
    isMaterial(id) { return !!C().materials[id]; },
    productSpecies(pid) { return C().products[pid] ? C().products[pid].species : null; },

    /* ------------------------------------------------------------ breeds */
    rollStats(level) {
      const ranges = B().breeds.spawnStats;
      let r = ranges[level];
      if (!r) {
        const cap = B().merge.statCapByLevel[level] || 100;
        r = [Math.round(cap * 0.4), Math.round(cap * 0.65)];
      }
      return { yield: U.randInt(r[0], r[1]), growth: U.randInt(r[0], r[1]), quality: U.randInt(r[0], r[1]) };
    },
    randomCarrier(family) {
      if (!NOA.FEATURES.recessiveGenes) return null;
      if (!U.chance(B().breeds.carrierChance)) return null;
      return U.pickWeighted(B().gene.spawnWeights[family]);
    },
    newBreed(species, level, opts) {
      opts = opts || {};
      const fam = C().species[species].family;
      return {
        id: U.uid('b'),
        kind: I.kindOf(fam),
        species,
        level: level || 1,
        stats: opts.stats || I.rollStats(level || 1),
        gene: opts.gene || null,
        carrier: opts.carrier !== undefined ? opts.carrier : (opts.gene ? null : I.randomCarrier(fam)),
        revealed: false,
        charm: null,
        locked: false
      };
    },
    geneDef(item) { return item && item.gene ? C().genes[item.gene.id] : null; },
    geneTier(item) { const g = I.geneDef(item); return g ? g.tier : 0; },
    isSuper(item) { return !!(item && item.gene && item.gene.purity >= B().gene.maxPurity); },
    geneBonus(item, stat) {
      const g = I.geneDef(item);
      if (!g) return 0;
      const pts = B().gene.statBonusByPurity[item.gene.purity] || 0;
      if (g.favor === 'all') return Math.round(pts * B().gene.allFavorShare);
      return g.favor === stat ? pts : 0;
    },
    stat(item, stat) {
      if (!I.isBreed(item)) return 0;
      return item.stats[stat] + I.geneBonus(item, stat);
    },
    statTotal(item) { return STATS.reduce((a, s) => a + I.stat(item, s), 0); },
    geneMult(gene) {
      if (!gene) return 1;
      const def = C().genes[gene.id];
      const row = B().gene.priceMult[def.tier] || [1];
      return row[gene.purity] || row[row.length - 1];
    },
    breedValue(item) {
      if (!I.isBreed(item)) return 0;
      const m = B().market;
      const hybrid = C().species[item.species].hybrid ? 1.5 : 1;
      return Math.round(m.seedSellBase * (m.seedLevelMult[item.level] || 1) * I.geneMult(item.gene) * hybrid);
    },
    canMerge(a, b) {
      if (!a || !b || a === b || a.locked || b.locked) return false;
      return I.isBreed(a) && I.isBreed(b) && a.kind === b.kind && a.species === b.species &&
        a.level === b.level && a.level < B().merge.maxLevel;
    },
    isMaxed(item) { return I.isBreed(item) && item.level >= B().merge.maxLevel; },

    /* ------------------------------------------------------------ barn goods */
    key(pid, stars, gene) {
      if (I.isMaterial(pid)) return pid + '||0|0';
      return pid + '|' + (stars || 1) + '|' + (gene ? gene.id : '') + '|' + (gene ? gene.purity : 0);
    },
    parseKey(key) {
      const [pid, stars, geneId, purity] = key.split('|');
      return { pid, stars: Number(stars) || 1, gene: geneId ? { id: geneId, purity: Number(purity) || 1 } : null };
    },
    unitPrice(species) {
      const eco = B().species[species];
      if (eco.price) return eco.price;
      const sp = C().species[species];
      if (sp.hybrid) return (I.unitPrice(sp.hybrid[0]) + I.unitPrice(sp.hybrid[1])) / 2 * (eco.hybridPriceMult || 1);
      return 1;
    },
    /** Base value of a product (1★, no gene). Processed goods = inputs × markup (from the recipe). */
    baseValue(pid) {
      if (valueCache[pid] != null) return valueCache[pid];
      let v;
      if (I.isMaterial(pid)) v = B().materials[pid].price;
      else {
        const rec = B().recipes[pid];
        if (rec) {
          v = 0;
          for (const inp in rec.inputs) v += I.baseValue(inp) * rec.inputs[inp];
          v *= B().production.valueMarkup;
        } else {
          v = I.unitPrice(C().products[pid].species);
        }
      }
      valueCache[pid] = v;
      return v;
    },
    clearValueCache() { for (const k in valueCache) delete valueCache[k]; },
    productValue(pid, stars, gene) {
      if (I.isMaterial(pid)) return I.baseValue(pid);
      return I.baseValue(pid) * (B().product.starPriceMult[stars || 1] || 1) * I.geneMult(gene);
    },
    keyValue(key) {
      const p = I.parseKey(key);
      return I.productValue(p.pid, p.stars, p.gene);
    },
    tierOf(pid) { return C().products[pid] ? C().products[pid].tier : 0; },

    /* ------------------------------------------------------------ display */
    speciesName(id) { return NOA.t('species.' + id); },
    geneName(id) { return NOA.t('gene.' + id); },
    baseName(item) {
      if (!item) return '';
      if (item.kind === 'seed') return NOA.t('item.seedName', { species: I.speciesName(item.species) });
      if (item.kind === 'animal') return I.speciesName(item.species);
      return '';
    },
    name(item) {
      const base = I.baseName(item);
      if (item && item.gene) return NOA.t('item.withGene', { base, gene: I.geneName(item.gene.id) });
      return base;
    },
    goodName(pid, gene) {
      const base = I.isMaterial(pid) ? NOA.t('material.' + pid) : NOA.t('product.' + pid);
      return gene ? NOA.t('item.withGene', { base, gene: I.geneName(gene.id) }) : base;
    },
    goodEmoji(pid) { return I.isMaterial(pid) ? C().materials[pid].emoji : C().products[pid].emoji; },
    emoji(item) { return I.isBreed(item) ? C().species[item.species].emoji : ''; },
    emoji2(item) { return I.isBreed(item) ? C().species[item.species].emoji2 || null : null; },
    purityText(p) {
      const max = B().gene.maxPurity;
      return '◆'.repeat(p) + '◇'.repeat(Math.max(0, max - p));
    },
    starsFor(quality) {
      const th = B().harvest.starThresholds;
      let s = 1;
      for (let i = 0; i < th.length; i++) if (quality >= th[i]) s = i + 1;
      return U.clamp(s, 1, 5);
    }
  };
})();

// ---- js/systems/genetics.js
/*
 * Genetics: merge resolution for seeds / animals, gene inheritance, fusion, purity,
 * recessive genes, breakthrough, offspring (harvest seeds / young animals) and the pre-merge preview.
 *
 * Rules (from the design):
 *   - max 1 gene per item, plant genes only on plants, animal genes only on animals
 *   - normal + normal   -> small chance a new gene appears (lab level raises it)
 *   - gene   + normal   -> LOW chance to keep the gene (purity -1)
 *   - gene   + gene     -> HIGH chance to keep; same gene can gain purity;
 *                          a valid pair can fuse into a higher-tier gene
 *   - luck boosters attached to either parent add to every chance of that merge
 *   - a lost gene sinks into a hidden recessive gene that can re-awaken later
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const U = NOA.util;
  const I = () => NOA.items;

  const G = NOA.genetics = {
    labId(family) { return C().families[family].lab; },
    labLevel(family) {
      const s = NOA.state;
      return s ? s.labs[G.labId(family)].level : 1;
    },
    labData(family) { return B().labs.levels[G.labLevel(family)] || B().labs.levels[1]; },
    purityCap(family) { return Math.min(B().gene.maxPurity, G.labData(family).purityCap); },
    fusionTierAllowed(family) { return G.labData(family).fusionTier; },

    ctxFor(a, b, op) {
      return {
        family: I().family(a),
        items: [a, b],
        charms: [a && a.charm, b && b.charm].filter(Boolean),
        op: op || 'merge'
      };
    },

    /** Weighted pick of a tier-1 gene for a family, with world / mascot weight modifiers */
    spawnGeneId(family, ctx) {
      const w = Object.assign({}, B().gene.spawnWeights[family]);
      for (const id in w) w[id] = NOA.mods.value('geneWeight.' + id, w[id], ctx || { family });
      return U.pickWeighted(w);
    },

    /** Fusion recipe for two different genes -> gene id or null */
    fusionTarget(g1, g2) {
      for (const id in C().genes) {
        const p = C().genes[id].parents;
        if (p && ((p[0] === g1 && p[1] === g2) || (p[0] === g2 && p[1] === g1))) return id;
      }
      return null;
    },

    better(a, b) {
      const ta = C().genes[a.id].tier, tb = C().genes[b.id].tier;
      if (ta !== tb) return ta > tb ? a : b;
      if (a.purity !== b.purity) return a.purity > b.purity ? a : b;
      return U.chance(0.5) ? a : b;
    },

    chances(a, b, ctx) {
      const g = B().gene;
      const stab = ctx.charms.indexOf('stabilizer') >= 0;
      return {
        spawn: NOA.mods.chance('gene.spawn', g.spawnChance, ctx),
        keepNormal: stab ? 1 : NOA.mods.chance('gene.keep.withNormal', g.keep.withNormal, ctx),
        keepSame: stab ? 1 : NOA.mods.chance('gene.keep.sameGene', g.keep.sameGene, ctx),
        keepDiff: stab ? 1 : NOA.mods.chance('gene.keep.diffGene', g.keep.diffGene, ctx),
        recessive: NOA.mods.chance('recessive.express', B().recessive.expressChance, ctx),
        stab
      };
    },

    purityUpChance(gA, gB, ctx) {
      const g = B().gene;
      const purity = Math.max(gA.purity, gB.purity);
      let base = g.purityUpChance[purity] || 0;
      if (gA.purity !== gB.purity) base *= g.purityUpUnequalFactor;
      return NOA.mods.chance('gene.purityUp', base, ctx);
    },

    fusionChance(target, ctx) {
      const tier = C().genes[target].tier;
      const base = B().gene.fusion.chanceByTier[tier] || 0;
      return NOA.mods.chance('gene.fusion', base, Object.assign({}, ctx, { fusionTo: target }));
    },

    /** Gene outcome for two breeds -> { gene, carrier } and pushes fx events */
    resolveGene(a, b, ctx, fx) {
      const g = B().gene;
      const fam = ctx.family;
      const ch = G.chances(a, b, ctx);
      const gA = a.gene, gB = b.gene;

      // --- normal + normal
      if (!gA && !gB) {
        let carrier = null;
        if (NOA.FEATURES.recessiveGenes && a.carrier && a.carrier === b.carrier) {
          if (U.chance(ch.recessive)) {
            fx.push({ type: 'recessive', gene: a.carrier });
            fx.push({ type: 'awaken', gene: a.carrier });
            return { gene: { id: a.carrier, purity: 1 }, carrier: null };
          }
          carrier = U.chance(B().recessive.inheritBothCarriers) ? a.carrier : null;
        } else if (NOA.FEATURES.recessiveGenes && (a.carrier || b.carrier)) {
          const c = a.carrier && b.carrier ? U.pick([a.carrier, b.carrier]) : (a.carrier || b.carrier);
          carrier = U.chance(B().recessive.inheritOneCarrier) ? c : null;
        }
        if (ctx.forceGene || U.chance(ch.spawn)) {
          const id = G.spawnGeneId(fam, ctx);
          fx.push({ type: 'awaken', gene: id });
          return { gene: { id, purity: 1 }, carrier: null };
        }
        return { gene: null, carrier };
      }

      // --- gene + gene
      if (gA && gB) {
        if (gA.id === gB.id) {
          if (!U.chance(ch.keepSame)) {
            fx.push({ type: 'geneLost', gene: gA.id });
            return { gene: null, carrier: g.lostGeneBecomesRecessive ? gA.id : null };
          }
          let purity = Math.max(gA.purity, gB.purity);
          const cap = G.purityCap(fam);
          if (purity < g.maxPurity) {
            if (purity >= cap) {
              fx.push({ type: 'purityCapped', gene: gA.id, cap });
            } else if (U.chance(G.purityUpChance(gA, gB, ctx))) {
              purity += 1;
              fx.push({ type: 'purityUp', gene: gA.id, purity });
              if (purity >= g.maxPurity) fx.push({ type: 'super', gene: gA.id });
            }
          }
          return { gene: { id: gA.id, purity }, carrier: null };
        }

        // different genes: try a fusion recipe, then secret recipes, else keep one
        let fused = null;
        const target = G.fusionTarget(gA.id, gB.id);
        if (target) {
          const tier = C().genes[target].tier;
          const allowed = tier <= G.fusionTierAllowed(fam);
          const pure = gA.purity >= g.fusion.minPurity && gB.purity >= g.fusion.minPurity;
          if (!allowed) fx.push({ type: 'fusionLocked', gene: target });
          else if (!pure) fx.push({ type: 'fusionNeedsPurity', gene: target });
          else if (U.chance(G.fusionChance(target, ctx))) fused = target;
        } else {
          fused = NOA.hooks.run('gene.secretFusion', null, { a: gA, b: gB, ctx, fx });
        }
        if (fused) {
          fx.push({ type: 'fusion', gene: fused });
          fx.push({ type: 'awaken', gene: fused });
          return { gene: { id: fused, purity: 1 }, carrier: null };
        }
        const win = G.better(gA, gB);
        if (U.chance(ch.keepDiff)) return { gene: { id: win.id, purity: win.purity }, carrier: null };
        fx.push({ type: 'geneLost', gene: win.id });
        return { gene: null, carrier: g.lostGeneBecomesRecessive ? win.id : null };
      }

      // --- gene + normal
      const one = gA || gB;
      if (U.chance(ch.keepNormal)) {
        const loss = ch.stab ? 0 : g.purityLossWithNormal;
        const purity = Math.max(1, one.purity - loss);
        if (purity < one.purity) fx.push({ type: 'purityDown', gene: one.id, purity });
        return { gene: { id: one.id, purity }, carrier: null };
      }
      fx.push({ type: 'geneLost', gene: one.id });
      return { gene: null, carrier: g.lostGeneBecomesRecessive ? one.id : null };
    },

    /** Merge two seeds or two animals (same species, same level) */
    mergeBreed(a, b, opts) {
      const ctx = G.ctxFor(a, b, 'merge');
      if (opts && opts.forceGene) ctx.forceGene = true;
      const fx = [];
      const m = B().merge;
      const L = a.level;
      let level = L + 1;
      let bt = false;
      if (L + 2 <= m.maxLevel) {
        const p = NOA.mods.chance('merge.breakthrough', m.breakthroughChance[L] || 0, ctx);
        if (p > 0 && U.chance(p)) { level = L + 2; bt = true; fx.push({ type: 'breakthrough', level }); }
      }
      const cap = m.statCapByLevel[level] || 100;
      const stats = {};
      for (const s of I().STATS) {
        const v = (a.stats[s] + b.stats[s]) / 2 + U.randInt(m.statGain[0], m.statGain[1]) + (bt ? m.breakthroughStatBonus : 0);
        stats[s] = U.clamp(Math.round(v), 1, cap);
      }
      const res = G.resolveGene(a, b, ctx, fx);
      const item = I().newBreed(a.species, level, { stats, gene: res.gene, carrier: res.carrier });
      item.revealed = !!(a.revealed || b.revealed);
      const out = NOA.hooks.run('merge.result', { item, fx, a, b, ctx });
      return out;
    },

    merge(a, b, opts) { return G.mergeBreed(a, b, opts); },

    /**
     * Next-generation breed born from a harvest (seeds) or a production cycle (young animals).
     * Level drops (Lv5 parent -> Lv3 child), stats are inherited at ~75% with mutation,
     * the gene passes on with a chance (purity -1) or sinks into a recessive gene.
     */
    offspring(parent) {
      const cfg = B().harvest.seeds;
      const level = Math.max(1, parent.level - cfg.levelDrop);
      const cap = B().merge.statCapByLevel[level] || 100;
      const stats = {};
      for (const s of I().STATS) {
        stats[s] = U.clamp(Math.round(parent.stats[s] * cfg.inheritRatio + U.randInt(-cfg.mutation, cfg.mutation)), 1, cap);
      }
      let gene = null, carrier = null;
      const ctx = { family: I().family(parent), items: [parent], charms: [], op: 'offspring' };
      if (parent.gene) {
        if (U.chance(NOA.mods.chance('gene.inherit', cfg.geneInherit, ctx))) {
          gene = { id: parent.gene.id, purity: Math.max(1, parent.gene.purity - 1) };
        } else if (U.chance(cfg.carrierFromGene)) carrier = parent.gene.id;
      } else if (parent.carrier && U.chance(cfg.carrierInherit)) {
        carrier = parent.carrier;
      }
      return I().newBreed(parent.species, level, { stats, gene, carrier });
    },

    /** Luck boosters attached to the merging items */
    charmMods(ctx) {
      const out = [];
      for (const c of ctx.charms || []) {
        const b = B().boosters[c];
        if (!b) continue;
        if (b.geneKeepAdd) out.push({ key: 'gene.keep', add: b.geneKeepAdd, src: 'booster', id: c });
        if (b.purityUpAdd) out.push({ key: 'gene.purityUp', add: b.purityUpAdd, src: 'booster', id: c });
        if (b.fusionAdd) out.push({ key: 'gene.fusion', add: b.fusionAdd, src: 'booster', id: c });
        if (b.spawnMult) out.push({ key: 'gene.spawn', mult: b.spawnMult, src: 'booster', id: c });
        if (b.breakthroughAdd) out.push({ key: 'merge.breakthrough', add: b.breakthroughAdd, src: 'booster', id: c });
      }
      return out;
    },

    /** Research labs: bonuses for the family being merged */
    labMods(ctx) {
      if (!ctx.family || !NOA.state) return [];
      const L = G.labData(ctx.family);
      const lv = G.labLevel(ctx.family);
      const src = 'lab', id = G.labId(ctx.family);
      const out = [];
      if (L.success) {
        out.push({ key: 'gene.keep', add: L.success, src, id, lv });
        out.push({ key: 'gene.purityUp', add: L.success, src, id, lv });
        out.push({ key: 'gene.fusion', add: L.success, src, id, lv });
      }
      if (L.spawnAdd) out.push({ key: 'gene.spawn', add: L.spawnAdd, src, id, lv });
      if (L.breakAdd) out.push({ key: 'merge.breakthrough', add: L.breakAdd, src, id, lv });
      if (L.discoveryAdd) out.push({ key: 'hybrid.discovery', add: L.discoveryAdd, src, id, lv });
      return out;
    }
  };

  Object.assign(G, {

    /**
     * What the player sees while hovering one item over another.
     * Returns rows: { k: i18n key, p: probability|null, params }
     */
    preview(a, b) {
      const rows = [];
      if (!I().canMerge(a, b)) return rows;
      const ctx = G.ctxFor(a, b, 'merge');
      const ch = G.chances(a, b, ctx);
      const m = B().merge;
      rows.push({ k: 'preview.levelUp', p: 1, params: { level: a.level + 1 } });
      if (a.level + 2 <= m.maxLevel) {
        const p = NOA.mods.chance('merge.breakthrough', m.breakthroughChance[a.level] || 0, ctx);
        if (p > 0) rows.push({ k: 'preview.breakthrough', p, params: { level: a.level + 2 } });
      }
      const gA = a.gene, gB = b.gene;
      if (!gA && !gB) {
        rows.push({ k: 'preview.newGene', p: ch.spawn });
        if (a.revealed && b.revealed && a.carrier && a.carrier === b.carrier) {
          rows.push({ k: 'preview.recessive', p: ch.recessive, params: { gene: NOA.t('gene.' + a.carrier) } });
        }
      } else if (gA && gB && gA.id === gB.id) {
        rows.push({ k: 'preview.keepGene', p: ch.keepSame });
        const purity = Math.max(gA.purity, gB.purity);
        if (purity < B().gene.maxPurity) {
          if (purity >= G.purityCap(ctx.family)) rows.push({ k: 'preview.purityCapped', p: null, params: { level: G.labLevel(ctx.family) + 1 } });
          else rows.push({ k: 'preview.purityUp', p: G.purityUpChance(gA, gB, ctx), params: { purity: purity + 1 } });
        }
      } else if (gA && gB) {
        const target = G.fusionTarget(gA.id, gB.id);
        if (target) {
          const tier = C().genes[target].tier;
          if (tier > G.fusionTierAllowed(ctx.family)) rows.push({ k: 'preview.fusionLocked', p: null, params: { gene: NOA.t('gene.' + target) } });
          else if (gA.purity < B().gene.fusion.minPurity || gB.purity < B().gene.fusion.minPurity) {
            rows.push({ k: 'preview.fusionNeedsPurity', p: null, params: { purity: B().gene.fusion.minPurity } });
          } else {
            const known = NOA.state && NOA.state.discovered.genes[target];
            rows.push({ k: 'preview.fusion', p: G.fusionChance(target, ctx), params: { gene: known ? NOA.t('gene.' + target) : '???' } });
          }
        }
        rows.push({ k: 'preview.keepOne', p: ch.keepDiff });
      } else {
        rows.push({ k: 'preview.keepGeneNormal', p: ch.keepNormal });
      }
      if (ctx.charms.length) rows.push({ k: 'preview.charms', p: null, params: { list: ctx.charms.map((c) => C().boosters[c].emoji).join(' ') } });
      return rows;
    }
  });

  NOA.mods.register('charms', (ctx) => G.charmMods(ctx));
  NOA.mods.register('labs', (ctx) => G.labMods(ctx));
})();

// ---- js/systems/grids.js
/*
 * Merge grids: 🌰 Kho hạt giống (vault, plant seeds) and 🐣 Chuồng ươm (nursery, young animals).
 * Merging happens here: drag a seed / animal onto an identical one to get a higher-level breed.
 * No DOM here (the view lives in js/ui/grid-view.js).
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const S = () => NOA.state;
  const I = () => NOA.items;

  const GR = NOA.grids = {
    ids: ['vault', 'nursery'],
    combo: { count: 0, last: 0 },
    cells(id) { return S()[id].cells; },
    get(id, i) { return S()[id].cells[i] || null; },
    family(id) { return id === 'vault' ? 'plant' : 'animal'; },
    gridFor(item) { return I().family(item) === 'plant' ? 'vault' : 'nursery'; },
    size(id) { return S()[id].cells.length; },
    freeCount(id) { return S()[id].cells.filter((x) => !x).length; },
    count(id) { return S()[id].cells.filter(Boolean).length; },
    maxSize(id) { return id === 'vault' ? B().storage.vaultMax : B().storage.nurseryMax; },
    changed(id, detail) { NOA.events.emit('grid.changed', Object.assign({ grid: id }, detail || {})); NOA.save.schedule(); },

    /** Put a breed into its grid. -> index | 'pending' | -1 (lost) */
    place(item) {
      const id = GR.gridFor(item);
      const cells = S()[id].cells;
      const i = cells.indexOf(null);
      if (i >= 0) {
        cells[i] = item;
        S().discovered.species[item.species] = true;
        GR.changed(id, { placed: [i] });
        return i;
      }
      if (id === 'vault' && S().vault.pending.length < B().storage.pendingSeedsMax) {
        S().vault.pending.push(item);
        GR.changed(id, { pending: true });
        return 'pending';
      }
      return -1;
    },
    /** Move waiting seeds into free vault cells */
    flushPending() {
      const v = S().vault;
      let moved = 0;
      while (v.pending.length) {
        const i = v.cells.indexOf(null);
        if (i < 0) break;
        v.cells[i] = v.pending.shift();
        moved += 1;
      }
      if (moved) GR.changed('vault', { flushed: moved });
      return moved;
    },
    hasRoom(id, n) { return GR.freeCount(id) >= (n || 1); },
    remove(id, i) {
      const it = S()[id].cells[i];
      S()[id].cells[i] = null;
      GR.changed(id, { removed: [i] });
      if (id === 'vault') GR.flushPending();
      return it;
    },
    move(id, from, to) {
      if (from === to) return false;
      const cells = S()[id].cells;
      const a = cells[from], b = cells[to];
      cells[to] = a;
      cells[from] = b || null;
      GR.changed(id, { moved: [from, to] });
      return true;
    },
    expand(id, n) {
      const cells = S()[id].cells;
      const target = Math.min(GR.maxSize(id), cells.length + n);
      while (cells.length < target) cells.push(null);
      GR.changed(id, { expanded: true });
      if (id === 'vault') GR.flushPending();
    },

    /* ------------------------------------------------------------ merge */
    merge(id, from, to) {
      const cells = S()[id].cells;
      const a = cells[to], b = cells[from];
      if (!I().canMerge(a, b)) return null;
      const first = B().gene.firstGeneAtMerge;
      const s = S();
      s.stats.breedMerges = (s.stats.breedMerges || 0) + 1;
      const forceGene = first > 0 && !s.flags.firstGene && !a.gene && !b.gene && s.stats.breedMerges >= first;
      const res = NOA.genetics.merge(a, b, { forceGene });
      cells[from] = null;
      cells[to] = res.item;
      s.stats.merges += 1;
      const fam = I().family(res.item);
      NOA.progress.addXP(B().xp.mergePerLevel * a.level);
      s.discovered.maxLevel[res.item.species] = Math.max(s.discovered.maxLevel[res.item.species] || 0, res.item.level);
      if (res.item.gene) GR.recordGene(res.item.gene.id, res.fx, fam);
      const now = Date.now();
      const win = NOA.mods.value('combo.windowMs', B().merge.comboWindowMs, {});
      GR.combo.count = now - GR.combo.last <= win ? GR.combo.count + 1 : 1;
      GR.combo.last = now;
      s.stats.maxCombo = Math.max(s.stats.maxCombo || 0, GR.combo.count);
      res.combo = GR.combo.count;
      GR.changed(id, { merged: to, from });
      if (id === 'vault') GR.flushPending();
      NOA.events.emit('merge.done', { grid: id, item: res.item, index: to, from, fx: res.fx, family: fam, combo: res.combo });
      return res;
    },
    recordGene(geneId, fx, family) {
      const s = S();
      if (fx && fx.some((f) => f.type === 'awaken')) s.stats.genesAwakened += 1;
      if (!s.discovered.genes[geneId]) {
        s.discovered.genes[geneId] = true;
        if (!s.flags.firstGene) s.flags.firstGene = true;
        if (family === 'animal' && !s.flags.firstAnimalGene) s.flags.firstAnimalGene = true;
        NOA.res.add('rp', B().gene.firstDiscoveryRP);
        NOA.progress.addXP(B().xp.discovery);
        NOA.events.emit('gene.discovered', { gene: geneId });
      }
    },

    /* ------------------------------------------------------------ boosters */
    applyBooster(id, boosterId, i) {
      const it = S()[id].cells[i];
      const def = C().boosters[boosterId];
      if (!it || !I().isBreed(it) || !def || def.target !== 'breed') return { error: 'target' };
      if ((S().boosters[boosterId] || 0) < 1) return { error: 'none' };
      if (boosterId === 'loupe') {
        if (it.revealed) return { error: 'already' };
        S().boosters.loupe -= 1;
        it.revealed = true;
        GR.changed(id, { updated: [i] });
        NOA.events.emit('booster.used', { id: boosterId, item: it });
        return { ok: true, carrier: it.carrier };
      }
      if (it.charm) return { error: 'charmed' };
      S().boosters[boosterId] -= 1;
      it.charm = boosterId;
      GR.changed(id, { updated: [i] });
      NOA.events.emit('booster.used', { id: boosterId, item: it });
      return { ok: true };
    },

    /* ------------------------------------------------------------ selling & locking */
    salePrice(item) {
      const m = B().market;
      NOA.barn.rollMarketDay();
      const key = 'breed:' + item.species + ':' + item.level;
      const sold = S().market.sold[key] || 0;
      const sat = Math.max(m.saturationFloor, 1 - sold * m.saturationStep);
      return Math.max(1, Math.round(I().breedValue(item) * sat * NOA.mods.value('coins.mult', 1, {})));
    },
    needsConfirm(item) { return !!(item.gene || item.level >= B().market.confirmSellMinLevel); },
    sell(id, i) {
      const it = S()[id].cells[i];
      if (!it || it.locked) return null;
      const price = GR.salePrice(it);
      const key = 'breed:' + it.species + ':' + it.level;
      S().market.sold[key] = (S().market.sold[key] || 0) + 1;
      GR.remove(id, i);
      NOA.res.add('coins', price);
      NOA.events.emit('item.sold', { item: it, price });
      return price;
    },
    /** Sell every unlocked Lv1 breed without a (visible) gene — keeps `keepPerSpecies` of each species */
    sellCommon(id, keepPerSpecies) {
      const cells = S()[id].cells;
      const seen = {};
      let total = 0, n = 0;
      cells.forEach((it, i) => {
        if (!it || it.locked || it.gene || it.level > 1 || (it.revealed && it.carrier)) return;
        seen[it.species] = (seen[it.species] || 0) + 1;
        if (seen[it.species] <= keepPerSpecies) return;
        total += GR.sell(id, i) || 0;
        n += 1;
      });
      return { n, total };
    },
    toggleLock(id, i) {
      const it = S()[id].cells[i];
      if (!it) return;
      it.locked = !it.locked;
      GR.changed(id, { updated: [i] });
    }
  };
})();

// ---- js/systems/barn.js
/*
 * 📦 Kho nông sản (barn): products and materials stored as stacks with a shared capacity
 * (Hay Day style). Variants of the same product (stars / gene) are separate stacks.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const S = () => NOA.state;
  const I = () => NOA.items;

  const BN = NOA.barn = {
    items() { return S().barn.items; },
    cap() {
      const s = B().storage;
      return Math.round(NOA.mods.value('barn.cap', s.barnStart + S().barn.upgrades * s.barnUpgrade.step, {}));
    },
    used() { let n = 0; for (const k in BN.items()) n += BN.items()[k]; return n; },
    free() { return Math.max(0, BN.cap() - BN.used()); },
    changed(detail) { NOA.events.emit('barn.changed', detail || {}); NOA.save.schedule(); },

    /** Add goods. force=true ignores capacity (rewards, refunds). -> false when it does not fit */
    add(pid, n, opts) {
      opts = opts || {};
      if (!n) return true;
      if (!opts.force && BN.free() < n) return false;
      const key = I().key(pid, opts.stars, opts.gene);
      BN.items()[key] = (BN.items()[key] || 0) + n;
      if (!I().isMaterial(pid)) S().discovered.products[pid] = true;
      BN.changed({ added: pid });
      return true;
    },
    addKey(key, n) {
      BN.items()[key] = (BN.items()[key] || 0) + n;
      BN.changed({ added: key });
    },
    /** Stacks of a product that satisfy a requirement, cheapest first */
    variants(pid, req) {
      req = req || {};
      const out = [];
      for (const key in BN.items()) {
        const n = BN.items()[key];
        if (!n) continue;
        const p = I().parseKey(key);
        if (p.pid !== pid) continue;
        if (req.minStars && p.stars < req.minStars) continue;
        if (req.needGene && !p.gene) continue;
        out.push({ key, n, stars: p.stars, gene: p.gene, value: I().keyValue(key) });
      }
      // plain goods first, gene goods last, then by value
      out.sort((a, b) => (!!a.gene - !!b.gene) || (a.value - b.value));
      return out;
    },
    count(pid, req) { return BN.variants(pid, req).reduce((a, v) => a + v.n, 0); },
    has(pid, n, req) { return BN.count(pid, req) >= n; },
    /** Remove n of a product (cheapest matching stacks first). -> [{key, n, stars, gene}] or null */
    take(pid, n, req) {
      if (!BN.has(pid, n, req)) return null;
      const taken = [];
      let left = n;
      for (const v of BN.variants(pid, req)) {
        if (!left) break;
        const k = Math.min(v.n, left);
        BN.items()[v.key] -= k;
        if (BN.items()[v.key] <= 0) delete BN.items()[v.key];
        taken.push({ key: v.key, n: k, stars: v.stars, gene: v.gene, value: v.value });
        left -= k;
      }
      BN.changed({ taken: pid });
      return taken;
    },
    takeKey(key, n) {
      const have = BN.items()[key] || 0;
      if (have < n) return false;
      BN.items()[key] = have - n;
      if (BN.items()[key] <= 0) delete BN.items()[key];
      BN.changed({ taken: key });
      return true;
    },

    /* ------------------------------------------------------------ selling */
    rollMarketDay() {
      const day = NOA.time.dayKey();
      if (S().market.day !== day) { S().market.day = day; S().market.sold = {}; }
    },
    salePrice(key) { return BN.quote(key, 1); },
    /** Coins for selling n of a stack right now (each sale lowers today's price a little) */
    quote(key, n) {
      const m = B().market;
      BN.rollMarketDay();
      const pid = I().parseKey(key).pid;
      const sold = S().market.sold[pid] || 0;
      const base = I().keyValue(key) * NOA.mods.value('coins.mult', 1, {});
      let total = 0;
      for (let k = 0; k < n; k++) total += Math.max(1, Math.round(base * Math.max(m.saturationFloor, 1 - (sold + k) * m.saturationStep)));
      return total;
    },
    sell(key, n) {
      let total = 0, sold = 0;
      const pid = I().parseKey(key).pid;
      for (let i = 0; i < n; i++) {
        if (!(BN.items()[key] > 0)) break;
        total += BN.salePrice(key);
        BN.items()[key] -= 1;
        if (BN.items()[key] <= 0) delete BN.items()[key];
        S().market.sold[pid] = (S().market.sold[pid] || 0) + 1;
        sold += 1;
      }
      if (!sold) return null;
      NOA.res.add('coins', total);
      BN.changed({ sold: key });
      NOA.events.emit('goods.sold', { key, n: sold, price: total });
      return { n: sold, total };
    },

    /* ------------------------------------------------------------ upgrades */
    upgradeCost() {
      const u = B().storage.barnUpgrade;
      return Math.round(u.costBase * Math.pow(u.costGrowth, S().barn.upgrades));
    },
    canUpgrade() {
      const u = B().storage.barnUpgrade;
      return B().storage.barnStart + (S().barn.upgrades + 1) * u.step <= u.max;
    },
    upgrade() {
      if (!BN.canUpgrade()) return { error: 'max' };
      if (!NOA.res.spend({ coins: BN.upgradeCost() })) return { error: 'coins' };
      S().barn.upgrades += 1;
      BN.changed({ upgraded: true });
      return { ok: true, cap: BN.cap() };
    }
  };
})();

// ---- js/systems/farm.js
/*
 * Farm: 🌾 crop fields, 🌸 flower beds and 🐄 livestock pens.
 *   Plant a seed from the vault -> harvest gives produce (barn) + next-generation SEEDS (vault)
 *   + byproducts (straw / pollen). Animals eat feed from the barn -> produce goods, sometimes
 *   young animals (nursery) and manure (fertilizer).
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const S = () => NOA.state;
  const U = NOA.util;
  const I = () => NOA.items;

  const F = NOA.farm = {
    /* ------------------------------------------------------------ timing & yield */
    growMs(item) {
      const h = B().harvest;
      const eco = B().species[item.species];
      const base = item.kind === 'seed' ? eco.growSec : eco.cycleSec;
      const red = Math.min(h.maxTimeReduction, I().stat(item, 'growth') * h.growthReductionPerPoint);
      const key = item.kind === 'seed' ? 'plant.timeMult' : 'animal.timeMult';
      const mult = NOA.mods.value(key, 1, { family: I().family(item) });
      return Math.max(1000, NOA.time.dur(base * (h.timeMultByLevel[item.level] || 1) * (1 - red) * mult));
    },
    units(item) {
      const h = B().harvest;
      const base = h.baseUnitsByLevel[item.level] || 1;
      const u = base * (1 + I().stat(item, 'yield') * h.yieldBonusPerPoint);
      return NOA.mods.value('harvest.units', u, { family: I().family(item) });
    },
    estimateUnits(item) { return Math.max(1, Math.round(F.units(item))); },
    roll(x) { let n = Math.floor(x); if (U.chance(x - n)) n += 1; return n; },
    isReady(slot) { return !!(slot && slot.end && NOA.time.now() >= slot.end); },
    progress(slot) {
      if (!slot || !slot.end) return 0;
      return U.clamp((NOA.time.now() - slot.start) / Math.max(1, slot.end - slot.start), 0, 1);
    },

    /** Goods for one harvest / production cycle: [{ pid, stars, gene }] (hybrids split across both parents) */
    makeGoods(item, units) {
      const h = B().harvest;
      const sp = C().species[item.species];
      const parts = sp.hybrid ? [[sp.hybrid[0], Math.ceil(units / 2)], [sp.hybrid[1], Math.floor(units / 2)]] : [[item.species, units]];
      const out = [];
      for (const [speciesId, n] of parts) {
        const pid = C().species[speciesId].products[0];
        for (let i = 0; i < n; i++) {
          const q = I().stat(item, 'quality') + U.randInt(-h.starJitter, h.starJitter);
          const gene = item.gene && U.chance(h.geneProductChance) ? { id: item.gene.id, purity: item.gene.purity } : null;
          out.push({ pid, stars: I().starsFor(q), gene });
        }
      }
      return out;
    },
    addGoods(list) {
      for (const g of list) NOA.barn.add(g.pid, 1, { stars: g.stars, gene: g.gene, force: true });
      return list.length;
    },
    countGenes(list) { return list.filter((g) => g.gene).length; },

    /* ------------------------------------------------------------ fields */
    plots(bed) { return S().fields[bed]; },
    plotFits(bed, item) { return !!item && item.kind === 'seed' && C().species[item.species].bed === bed; },
    /** Plant the seed at vault[vaultIdx] into fields[bed][idx] */
    plant(bed, idx, vaultIdx) {
      const plot = S().fields[bed][idx];
      const it = S().vault.cells[vaultIdx];
      if (!plot || plot.seed || !F.plotFits(bed, it) || it.locked) return false;
      S().vault.cells[vaultIdx] = null;
      plot.seed = it;
      plot.start = NOA.time.now();
      plot.end = plot.start + F.growMs(it);
      NOA.grids.changed('vault', { removed: [vaultIdx] });
      NOA.grids.flushPending();
      NOA.events.emit('plot.planted', { bed, idx, item: it });
      NOA.events.emit('field.changed', { bed });
      return true;
    },
    /** -> { goods, seeds:[{item, where}], mats:{id:n}, lostSeeds } | { error:'barn', need } | null */
    harvest(bed, idx) {
      const plot = S().fields[bed][idx];
      if (!plot || !plot.seed || !F.isReady(plot)) return null;
      const seed = plot.seed;
      const fert = plot.fert ? B().fertilizer : null;
      let units = F.roll(F.units(seed) * (fert ? fert.unitsMult : 1));
      units = Math.max(1, units);
      const sp = C().species[seed.species];
      const mats = {};
      if (sp.byproduct) {
        const bp = B().byproducts[sp.byproduct];
        mats[sp.byproduct] = bp.base + Math.floor(units / bp.perUnits);
      }
      const need = units + Object.values(mats).reduce((a, b) => a + b, 0);
      if (NOA.barn.free() < need) return { error: 'barn', need };
      const goods = F.makeGoods(seed, units);
      F.addGoods(goods);
      for (const m in mats) NOA.barn.add(m, mats[m], { force: true });
      // next-generation seeds
      const cfg = B().harvest.seeds;
      let nSeeds = (cfg.countByLevel[seed.level] || 1) + (fert ? fert.extraSeeds : 0);
      if (U.chance(cfg.extraChance + I().stat(seed, 'yield') * cfg.extraPerYieldPoint)) nSeeds += 1;
      const seeds = [];
      let lostSeeds = 0;
      for (let i = 0; i < nSeeds; i++) {
        const child = NOA.genetics.offspring(seed);
        const where = NOA.grids.place(child);
        if (where === -1) lostSeeds += 1;
        else seeds.push({ item: child, where });
        if (child.gene) NOA.grids.recordGene(child.gene.id, [], 'plant');
      }
      plot.seed = null;
      plot.start = plot.end = 0;
      plot.fert = false;
      F.afterOutput(goods, units);
      S().stats.harvests += 1;
      NOA.events.emit('harvest', { bed, idx, item: seed, goods, seeds, mats, lostSeeds });
      NOA.events.emit('field.changed', { bed });
      return { goods, seeds, mats, lostSeeds, units };
    },
    afterOutput(goods, units) {
      const h = B().harvest;
      NOA.progress.addXP(units * B().xp.harvestPerUnit);
      const g = F.countGenes(goods);
      if (g) NOA.res.add('rp', g * h.geneRP);
      if (U.chance(h.naturalCloverChance)) {
        S().boosters.clover = (S().boosters.clover || 0) + 1;
        NOA.events.emit('harvest.clover', {});
      }
    },
    fertilize(bed, idx) {
      const plot = S().fields[bed][idx];
      if (!plot || plot.fert) return { error: 'already' };
      if (!NOA.barn.take('manure', 1)) return { error: 'none' };
      plot.fert = true;
      NOA.events.emit('field.changed', { bed });
      return { ok: true };
    },
    nextPlotCost(bed) {
      const f = B().fields[bed];
      const i = S().fields[bed].length;
      if (i >= f.max) return null;
      return { coins: f.cost[i], level: f.levelReq[i] };
    },
    /** Plots whose price is 0 open by themselves once the level is reached */
    grantFreePlots() {
      let n = 0;
      for (const bed of ['crop', 'flower']) {
        for (let c = F.nextPlotCost(bed); c && !c.coins && S().level >= c.level; c = F.nextPlotCost(bed)) {
          S().fields[bed].push(NOA.newPlot(bed));
          n += 1;
        }
      }
      if (n) NOA.events.emit('field.changed', { granted: n });
      return n;
    },
    unlockPlot(bed) {
      const c = F.nextPlotCost(bed);
      if (!c) return { error: 'max' };
      if (S().level < c.level) return { error: 'level', level: c.level };
      if (c.coins && !NOA.res.spend({ coins: c.coins })) return { error: 'coins' };
      S().fields[bed].push(NOA.newPlot(bed));
      NOA.events.emit('field.changed', { bed });
      return { ok: true };
    },

    /* ------------------------------------------------------------ pens */
    penSpecies(penId) {
      return Object.keys(C().species).filter((id) => C().species[id].pen === penId);
    },
    penOpen(penId) { return F.penSpecies(penId).some((sp) => !C().species[sp].hybrid && NOA.progress.speciesUnlocked(sp)); },
    penFits(penId, item) { return !!item && item.kind === 'animal' && C().species[item.species].pen === penId; },
    placeAnimal(penId, nurseryIdx) {
      const pen = S().pens[penId];
      const it = S().nursery.cells[nurseryIdx];
      if (!pen || !F.penFits(penId, it) || it.locked) return { error: 'fit' };
      const slot = pen.slots.indexOf(null);
      if (slot < 0) return { error: 'full' };
      S().nursery.cells[nurseryIdx] = null;
      pen.slots[slot] = { animal: it, start: 0, end: 0 };
      NOA.grids.changed('nursery', { removed: [nurseryIdx] });
      NOA.events.emit('pen.placed', { penId, slot, item: it });
      NOA.events.emit('pens.changed', { penId });
      return { ok: true, slot };
    },
    feedFor(animal) { return C().species[animal.species].feed || []; },
    hungry(slot) { return !!(slot && slot.animal && !slot.end); },
    /** Feed every idle animal of a pen from the barn -> { fed, missing:[feedIds] } */
    feedAll(penId) {
      const pen = S().pens[penId];
      let fed = 0;
      const missing = new Set();
      pen.slots.forEach((slot) => {
        if (!F.hungry(slot)) return;
        const feeds = F.feedFor(slot.animal);
        const f = feeds.find((id) => NOA.barn.has(id, 1));
        if (!f) { feeds.forEach((x) => missing.add(x)); return; }
        NOA.barn.take(f, 1);
        slot.start = NOA.time.now();
        slot.end = slot.start + F.growMs(slot.animal);
        fed += 1;
      });
      if (fed) {
        NOA.events.emit('pen.fed', { penId, fed });
        NOA.events.emit('pens.changed', { penId });
      }
      return { fed, missing: [...missing] };
    },
    readyCount(penId) { return S().pens[penId].slots.filter((s) => s && F.isReady(s)).length; },
    /** Collect every ready animal -> { goods, young, manure, lostYoung } | { error:'barn' } */
    collectAll(penId) {
      const pen = S().pens[penId];
      const lv = B().livestock;
      const result = { goods: [], young: [], manure: 0, lostYoung: 0, collected: 0 };
      for (const slot of pen.slots) {
        if (!slot || !F.isReady(slot)) continue;
        const a = slot.animal;
        const units = Math.max(1, F.roll(F.units(a)));
        const manure = C().species[a.species].manure && U.chance(lv.manureChance) ? 1 : 0;
        if (NOA.barn.free() < units + manure) { result.error = 'barn'; break; }
        const goods = F.makeGoods(a, units);
        F.addGoods(goods);
        if (manure) NOA.barn.add('manure', manure, { force: true });
        result.goods.push(...goods);
        result.manure += manure;
        if (U.chance(lv.offspringChance + lv.offspringPerLevel * a.level)) {
          const child = NOA.genetics.offspring(a);
          const where = NOA.grids.place(child);
          if (where === -1) result.lostYoung += 1;
          else result.young.push({ item: child, where });
          if (child.gene) NOA.grids.recordGene(child.gene.id, [], 'animal');
        }
        slot.start = slot.end = 0;
        result.collected += 1;
        F.afterOutput(goods, units);
      }
      if (result.collected) {
        S().stats.harvests += 1;
        NOA.events.emit('harvest', Object.assign({ penId, kind: 'pen' }, result));
        NOA.events.emit('pens.changed', { penId });
      }
      return result;
    },
    removeAnimal(penId, slotIdx) {
      const pen = S().pens[penId];
      const slot = pen.slots[slotIdx];
      if (!slot || F.isReady(slot)) return false;
      if (!NOA.grids.hasRoom('nursery')) return false;
      NOA.grids.place(slot.animal);
      pen.slots[slotIdx] = null;
      NOA.events.emit('pens.changed', { penId });
      return true;
    },
    nextSlotCost(penId) {
      const cfg = B().livestock.pens[penId];
      const n = S().pens[penId].slots.length;
      if (n >= cfg.slotsMax) return null;
      return cfg.slotCost[n] || 0;
    },
    unlockSlot(penId) {
      const cost = F.nextSlotCost(penId);
      if (cost == null) return { error: 'max' };
      if (cost && !NOA.res.spend({ coins: cost })) return { error: 'coins' };
      S().pens[penId].slots.push(null);
      NOA.events.emit('pens.changed', { penId });
      return { ok: true };
    },

    /* ------------------------------------------------------------ growth tonic */
    tonicPlot(bed, idx) {
      const plot = S().fields[bed][idx];
      if (!plot || !plot.end || F.isReady(plot) || (S().boosters.tonic || 0) < 1) return false;
      S().boosters.tonic -= 1;
      plot.end = NOA.time.now();
      NOA.events.emit('booster.used', { id: 'tonic' });
      NOA.events.emit('field.changed', { bed });
      return true;
    },
    tonicPen(penId) {
      const pen = S().pens[penId];
      const slot = pen.slots.find((s) => s && s.end && !F.isReady(s));
      if (!slot || (S().boosters.tonic || 0) < 1) return false;
      S().boosters.tonic -= 1;
      pen.slots.forEach((s) => { if (s && s.end && !F.isReady(s)) s.end = NOA.time.now(); });
      NOA.events.emit('booster.used', { id: 'tonic' });
      NOA.events.emit('pens.changed', { penId });
      return true;
    },

    /** Called every tick: emits when something becomes ready */
    tick() {
      for (const bed in S().fields) {
        let changed = false;
        for (const p of S().fields[bed]) {
          const r = F.isReady(p);
          if (r !== !!p._r) { p._r = r; changed = true; }
        }
        if (changed) NOA.events.emit('field.changed', { bed, ready: true });
      }
      for (const penId in S().pens) {
        const n = F.readyCount(penId);
        const pen = S().pens[penId];
        if (n !== (pen._r || 0)) { pen._r = n; NOA.events.emit('pens.changed', { penId, ready: true }); }
      }
    }
  };
})();

// ---- js/systems/production.js
/*
 * 🏭 Processing buildings (Township / Hay Day style): recipes turn barn goods into processed goods.
 * Each building runs one job at a time; extra queue slots hold waiting jobs.
 * Output quality: average stars of the inputs (+ a small chance of +1★); the gene survives only
 * when every input shares it (otherwise the usual low "gene + normal" chance applies).
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const S = () => NOA.state;
  const U = NOA.util;
  const I = () => NOA.items;

  const P = NOA.production = {
    ids() { return Object.keys(B().production.buildings); },
    cfg(bId) { return B().production.buildings[bId]; },
    isOpen(bId) { return S().level >= P.cfg(bId).unlockLevel; },
    recipesFor(bId) { return Object.keys(B().recipes).filter((pid) => B().recipes[pid].building === bId); },
    inputUnlocked(id) {
      if (I().isMaterial(id)) return true;
      return NOA.progress.speciesUnlocked(I().productSpecies(id)) && (!B().recipes[id] || P.recipeUnlocked(id));
    },
    recipeUnlocked(pid) {
      const r = B().recipes[pid];
      if (!r || !P.isOpen(r.building)) return false;
      return Object.keys(r.inputs).every((id) => P.inputUnlocked(id));
    },
    jobMs(pid) {
      return Math.max(1000, NOA.time.dur(B().recipes[pid].timeSec * NOA.mods.value('production.timeMult', 1, {})));
    },
    queue(bId) { return S().factories[bId].queue; },
    slots(bId) { return S().factories[bId].slots; },
    hasInputs(pid) {
      const r = B().recipes[pid];
      return Object.keys(r.inputs).every((id) => NOA.barn.has(id, r.inputs[id]));
    },
    canStart(pid) {
      const r = B().recipes[pid];
      return P.recipeUnlocked(pid) && P.queue(r.building).length < P.slots(r.building) && P.hasInputs(pid);
    },
    start(pid) {
      const r = B().recipes[pid];
      if (!P.recipeUnlocked(pid)) return { error: 'locked' };
      if (P.queue(r.building).length >= P.slots(r.building)) return { error: 'queue' };
      if (!P.hasInputs(pid)) return { error: 'inputs' };
      const taken = [];
      for (const id in r.inputs) taken.push(...NOA.barn.take(id, r.inputs[id]));
      const out = P.outputQuality(taken);
      const q = P.queue(r.building);
      const now = NOA.time.now();
      const startAt = q.length ? Math.max(now, q[q.length - 1].end) : now;
      q.push({ pid, start: startAt, end: startAt + P.jobMs(pid), stars: out.stars, gene: out.gene });
      NOA.events.emit('production.started', { building: r.building, pid });
      NOA.events.emit('factory.changed', { building: r.building });
      NOA.save.schedule();
      return { ok: true };
    },
    outputQuality(taken) {
      const goods = taken.filter((t) => !I().isMaterial(I().parseKey(t.key).pid));
      let n = 0, sum = 0;
      goods.forEach((t) => { sum += t.stars * t.n; n += t.n; });
      let stars = n ? Math.round(sum / n) : 1;
      if (stars < 5 && U.chance(B().production.starUpChance)) stars += 1;
      let gene = null;
      const genes = goods.filter((t) => t.gene);
      if (genes.length) {
        const allSame = genes.length === goods.length && genes.every((t) => t.gene.id === genes[0].gene.id);
        const keep = allSame ? B().gene.keep.sameGene : B().gene.keep.withNormal;
        if (U.chance(keep)) {
          const best = genes.reduce((a, t) => (t.gene.purity > a.gene.purity ? t : a), genes[0]);
          gene = { id: best.gene.id, purity: allSame ? best.gene.purity : Math.max(1, best.gene.purity - 1) };
        }
      }
      return { stars, gene };
    },
    readyJobs(bId) { return P.queue(bId).filter((j) => NOA.time.now() >= j.end); },
    collect(bId) {
      const q = P.queue(bId);
      const out = [];
      while (q.length && NOA.time.now() >= q[0].end) {
        if (NOA.barn.free() < 1) return { items: out, error: 'barn' };
        const j = q.shift();
        NOA.barn.add(j.pid, 1, { stars: j.stars, gene: j.gene, force: true });
        out.push(j);
        S().stats.crafted = (S().stats.crafted || 0) + 1;
        NOA.progress.addXP(B().recipes[j.pid].timeSec * B().production.xpPerSecond);
      }
      if (out.length) {
        NOA.events.emit('production.collected', { building: bId, items: out });
        NOA.events.emit('factory.changed', { building: bId });
      }
      return { items: out };
    },
    nextSlotCost(bId) {
      const c = P.cfg(bId);
      const n = P.slots(bId);
      if (n >= c.slotsMax) return null;
      return c.slotCost[n] || 0;
    },
    unlockSlot(bId) {
      const cost = P.nextSlotCost(bId);
      if (cost == null) return { error: 'max' };
      if (cost && !NOA.res.spend({ coins: cost })) return { error: 'coins' };
      S().factories[bId].slots += 1;
      NOA.events.emit('factory.changed', { building: bId });
      return { ok: true };
    },
    /** Growth tonic: finish the running job now (waiting jobs move up) */
    tonic(bId) {
      const q = P.queue(bId);
      const now = NOA.time.now();
      const i = q.findIndex((j) => now < j.end);
      if (i < 0 || (S().boosters.tonic || 0) < 1) return false;
      S().boosters.tonic -= 1;
      const saved = q[i].end - now;
      q[i].end = now;
      for (let k = i + 1; k < q.length; k++) { q[k].start -= saved; q[k].end -= saved; }
      NOA.events.emit('booster.used', { id: 'tonic' });
      NOA.events.emit('factory.changed', { building: bId });
      return true;
    },
    tick() {
      for (const bId of P.ids()) {
        const n = P.readyJobs(bId).length;
        const f = S().factories[bId];
        if (n !== (f._r || 0)) { f._r = n; NOA.events.emit('factory.changed', { building: bId, ready: true }); }
      }
    }
  };
})();

// ---- js/systems/orders.js
/*
 * 📋 Order board (Hay Day truck orders): customers ask for raw and processed goods from the barn.
 * Rewards scale with the real value of what you deliver, so better stars / genes pay more.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const S = () => NOA.state;
  const U = NOA.util;
  const I = () => NOA.items;

  const lastByLevel = (list, level) => {
    let pick = list[0];
    for (const e of list) if (level >= e.level) pick = e;
    return pick;
  };

  const O = NOA.orders = {
    /** Goods the player can currently obtain, grouped by tier */
    available() {
      const out = { 1: [], 2: [], 3: [] };
      for (const id in C().species) {
        const sp = C().species[id];
        if (sp.hybrid || !NOA.progress.speciesUnlocked(id)) continue;
        if (sp.bed === 'flower' && !NOA.progress.isUnlocked('flowers')) continue;
        out[1].push(sp.products[0]);
      }
      for (const pid in B().recipes) {
        if (NOA.production.recipeUnlocked(pid)) out[I().tierOf(pid)].push(pid);
      }
      return out;
    },
    pickGoods(tierWeights, n, exclude) {
      const avail = O.available();
      const lines = [];
      const used = new Set(exclude || []);
      for (let i = 0; i < n; i++) {
        const w = {};
        [1, 2, 3].forEach((t) => { if (avail[t].some((p) => !used.has(p))) w[t] = tierWeights[t - 1]; });
        const tier = Number(U.pickWeighted(w));
        if (!tier) break;
        const pool = avail[tier].filter((p) => !used.has(p));
        const pid = U.pick(pool);
        used.add(pid);
        lines.push({ product: pid, tier });
      }
      return lines;
    },
    generate() {
      const o = B().orders;
      const lvl = S().level;
      const isVip = lvl >= o.vip.unlockLevel && U.chance(o.vip.chance);
      const nLines = isVip ? 1 : U.randInt(1, lastByLevel(o.linesByLevel, lvl).max);
      const tw = lastByLevel(o.tierWeightsByLevel, lvl).weights;
      const picks = O.pickGoods(isVip ? [tw[0], tw[1], 0] : tw, nLines);
      const lines = picks.map((p) => {
        const r = o.countByTier[p.tier];
        const line = { product: p.product, count: isVip ? 1 : U.randInt(r[0], r[1]), filled: 0, minStars: 0, needGene: false };
        if (isVip) {
          if (U.chance(o.vip.requireGeneChance)) line.needGene = true;
          else line.minStars = o.vip.minStars;
        }
        return line;
      });
      const npcs = Object.keys(C().npcs).filter((id) => !C().npcs[id].vip && !C().npcs[id].earth);
      return NOA.hooks.run('order.generated', {
        id: U.uid('o'),
        npc: isVip ? 'traveler' : U.pick(npcs),
        vip: isVip,
        lines,
        createdAt: NOA.time.now()
      });
    },
    fill() {
      const s = S();
      let added = false;
      while (s.orders.length < B().orders.slots) {
        const o = O.generate();
        if (!o.lines.length) break;
        s.orders.push(o);
        added = true;
      }
      if (added) { NOA.events.emit('orders.changed', {}); NOA.save.schedule(); }
    },
    req(line) { return { minStars: line.minStars || 0, needGene: !!line.needGene }; },
    availability(order) {
      return order.lines.map((l) => Math.min(l.count, NOA.barn.count(l.product, O.req(l))));
    },
    canDeliver(order) { return order.lines.every((l) => NOA.barn.has(l.product, l.count, O.req(l))); },
    deliver(orderId) {
      const order = S().orders.find((o) => o.id === orderId);
      if (!order || !O.canDeliver(order)) return null;
      let value = 0;
      for (const l of order.lines) {
        const taken = NOA.barn.take(l.product, l.count, O.req(l));
        taken.forEach((t) => { value += t.value * t.n; });
        l.filled = l.count;
      }
      return O.complete(order, value);
    },
    estimate(order) {
      let v = 0;
      for (const l of order.lines) {
        const gene = l.needGene ? { id: Object.keys(B().gene.spawnWeights[O.familyOf(l.product)])[0], purity: 1 } : null;
        v += I().productValue(l.product, Math.max(1, l.minStars || 1), gene) * l.count;
      }
      return O.rewardFor(order, v);
    },
    familyOf(pid) { return C().species[I().productSpecies(pid)].family; },
    rewardFor(order, value) {
      const o = B().orders;
      const coins = Math.round(value * o.rewardMult * (order.vip ? o.vip.rewardMult : 1) * NOA.mods.value('coins.mult', 1, {}));
      return { coins, xp: Math.max(o.minXP, Math.round(coins * o.xpPerCoin)) };
    },
    complete(order, value) {
      const o = B().orders;
      const est = O.estimate(order);
      const r = O.rewardFor(order, value);
      const reward = { coins: Math.max(r.coins, est.coins) };
      const xp = Math.max(r.xp, est.xp);
      if (order.vip) {
        reward.rp = U.randInt(o.vip.rpRange[0], o.vip.rpRange[1]);
        if (U.chance(o.vip.gemChance)) reward.gems = U.randInt(o.vip.gemRange[0], o.vip.gemRange[1]);
      }
      const s = S();
      s.orders = s.orders.filter((x) => x.id !== order.id);
      s.orderRefillAt = NOA.time.now() + NOA.time.dur(o.refillDelaySec);
      s.stats.orders += 1;
      const granted = NOA.rewards.grant(reward, 'order');
      NOA.progress.addXP(xp);
      NOA.events.emit('order.complete', { order, reward: Object.assign({ xp }, reward), granted });
      NOA.events.emit('orders.changed', {});
      NOA.save.schedule();
      return { complete: true, reward: Object.assign({ xp }, reward) };
    },
    canSwap() { return NOA.time.now() >= S().orderSwapAt; },
    swap(orderId) {
      const s = S();
      const i = s.orders.findIndex((o) => o.id === orderId);
      if (i < 0 || !O.canSwap()) return false;
      s.orders[i] = O.generate();
      s.orderSwapAt = NOA.time.now() + NOA.time.dur(B().orders.swapCooldownSec);
      NOA.events.emit('orders.changed', {});
      NOA.save.schedule();
      return true;
    },
    tick() {
      if (S().orders.length < B().orders.slots && NOA.time.now() >= S().orderRefillAt) O.fill();
    }
  };
})();

// ---- js/systems/ship.js
/*
 * 🚀 Tàu Ong Vàng (Township-train style): the bee-ship docks with crates for Earth (little Na in
 * Hanoi Dome). Fill every crate before it leaves for coins, gems and Earth revival progress.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const S = () => NOA.state;
  const U = NOA.util;
  const I = () => NOA.items;

  const SH = NOA.ship = {
    open() { return NOA.progress.isUnlocked('ship'); },
    st() { return S().ship; },
    docked() { return SH.st().state === 'docked'; },
    left() { return Math.max(0, SH.st().until - NOA.time.now()); },
    allFilled() { return SH.st().crates.length > 0 && SH.st().crates.every((c) => c.filled); },
    dock() {
      const cfg = B().ship;
      const picks = NOA.orders.pickGoods([cfg.tierWeights[0], cfg.tierWeights[1], cfg.tierWeights[2]], cfg.crates);
      const s = SH.st();
      s.state = 'docked';
      s.until = NOA.time.now() + NOA.time.dur(cfg.dockMinutes * 60);
      s.crates = picks.map((p) => ({ product: p.product, count: U.randInt(cfg.countRange[0], cfg.countRange[1]) - (p.tier > 1 ? 1 : 0), filled: false }));
      s.crates.forEach((c) => { c.count = Math.max(1, c.count); });
      NOA.events.emit('ship.changed', { state: 'docked' });
      NOA.save.schedule();
    },
    canFill(i) {
      const c = SH.st().crates[i];
      return !!c && !c.filled && NOA.barn.has(c.product, c.count);
    },
    fill(i) {
      const c = SH.st().crates[i];
      if (!SH.docked() || !SH.canFill(i)) return null;
      const taken = NOA.barn.take(c.product, c.count);
      let value = 0;
      taken.forEach((t) => { value += t.value * t.n; });
      c.filled = true;
      const coins = Math.round(value * B().ship.rewardMult * NOA.mods.value('coins.mult', 1, {}));
      const granted = NOA.rewards.grant({ coins }, 'ship');
      NOA.progress.addXP(Math.round(coins * B().orders.xpPerCoin));
      NOA.events.emit('ship.changed', { filled: i });
      return { coins, granted };
    },
    /** Leave now (or when time runs out). A full ship pays the bonus and moves Earth forward. */
    depart() {
      const s = SH.st();
      if (!SH.docked()) return null;
      const cfg = B().ship;
      let result = { full: false };
      if (SH.allFilled()) {
        const granted = NOA.rewards.grant(cfg.allBonus, 'ship');
        S().earth = Math.min(B().world.earth.maxProgress, S().earth + cfg.earthProgress);
        S().stats.ships = (S().stats.ships || 0) + 1;
        NOA.events.emit('earth.changed', { earth: S().earth });
        result = { full: true, granted };
      }
      s.state = 'away';
      s.until = NOA.time.now() + NOA.time.dur(cfg.awayMinutes * 60);
      s.crates = [];
      s.trips += 1;
      NOA.events.emit('ship.departed', result);
      NOA.events.emit('ship.changed', { state: 'away' });
      NOA.save.schedule();
      return result;
    },
    tick() {
      if (!SH.open()) return;
      const s = SH.st();
      if (s.state === 'away' && NOA.time.now() >= s.until) SH.dock();
      else if (s.state === 'docked' && NOA.time.now() >= s.until) SH.depart();
    },
    crateValue(c) { return I().productValue(c.product, 1, null) * c.count * B().ship.rewardMult; }
  };
})();

// ---- js/systems/labs.js
/*
 * Research labs: 🌱 Greenhouse (plants) and 🐾 Ranch (animals).
 * Levels raise gene / breakthrough / hybrid chances (applied through NOA.mods in genetics.js),
 * unlock purity caps and fusion tiers, and add cross-breeding slots.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const S = () => NOA.state;
  const U = NOA.util;
  const I = () => NOA.items;

  const LABS = { greenhouse: 'plant', ranch: 'animal' };

  const L = NOA.labs = {
    ids: Object.keys(LABS),
    family(lab) { return LABS[lab]; },
    grid(lab) { return lab === 'greenhouse' ? 'vault' : 'nursery'; },
    level(lab) { return S().labs[lab].level; },
    data(lab, level) { return B().labs.levels[level != null ? level : L.level(lab)]; },
    isOpen(lab) { return lab === 'greenhouse' || NOA.progress.isUnlocked('ranch'); },
    nextCost(lab) {
      const next = L.level(lab) + 1;
      if (next > B().labs.maxLevel) return null;
      return B().labs.levels[next].cost;
    },
    upgrade(lab) {
      if (!L.isOpen(lab)) return { error: 'locked' };
      const cost = L.nextCost(lab);
      if (!cost) return { error: 'max' };
      if (!NOA.res.spend(cost)) return { error: 'cost' };
      S().labs[lab].level += 1;
      L.syncSlots(lab);
      NOA.progress.addXP(B().xp.labUpgrade);
      NOA.events.emit('lab.upgraded', { lab, level: S().labs[lab].level });
      NOA.save.schedule();
      return { ok: true, level: S().labs[lab].level };
    },
    syncSlots(lab) {
      const want = L.data(lab).slots;
      const slots = S().labs[lab].slots;
      while (slots.length < want) slots.push(null);
    },
    hybridOpen(lab) { return NOA.progress.isUnlocked('hybrid') && L.data(lab).slots > 0; },

    /* ------------------------------------------------------------ cross-breeding */
    recipe(a, b) {
      return C().hybrids.find((h) => (h.a === a && h.b === b) || (h.a === b && h.b === a)) || null;
    },
    discoveryChance(lab) {
      return NOA.mods.chance('hybrid.discovery', B().hybrid.baseDiscovery, { family: L.family(lab) });
    },
    /** Grid cells (vault / nursery) that may enter a cross-breeding slot for this lab */
    candidates(lab) {
      const out = [];
      S()[L.grid(lab)].cells.forEach((it, i) => {
        if (it && I().isBreed(it) && !it.locked && !C().species[it.species].hybrid) out.push(i);
      });
      return out;
    },
    startHybrid(lab, slotIdx, idxA, idxB) {
      const slots = S().labs[lab].slots;
      const cells = S()[L.grid(lab)].cells;
      const a = cells[idxA], b = cells[idxB];
      if (!L.hybridOpen(lab) || slots[slotIdx] !== null || slotIdx >= slots.length) return { error: 'slot' };
      if (!a || !b || idxA === idxB || a.species === b.species) return { error: 'pair' };
