/*
 * Audio: every sound is synthesized with WebAudio (no asset files).
 * Merge notes climb a major scale while a combo lasts, so a fast chain plays a melody.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const MAJOR = [0, 2, 4, 5, 7, 9, 11];
  const C5 = 523.25;
  const noteFreq = (degree, base) => {
    const oct = Math.floor(degree / 7);
    const semi = 12 * oct + MAJOR[((degree % 7) + 7) % 7];
    return (base || C5) * Math.pow(2, semi / 12);
  };
  const semis = (base, n) => base * Math.pow(2, n / 12);

  const A = NOA.audio = {
    ctx: null,
    master: null,
    sfxBus: null,
    musicBus: null,
    noiseBuf: null,
    musicTimer: null,
    musicStep: 0,

    settings() { return (NOA.state && NOA.state.settings) || { sfx: true, music: true, haptics: true }; },

    /** Must be called from a user gesture (browsers block audio before one). */
    unlock() {
      if (!globalThis.AudioContext && !globalThis.webkitAudioContext) return;
      if (!A.ctx) {
        const Ctx = globalThis.AudioContext || globalThis.webkitAudioContext;
        A.ctx = new Ctx();
        A.master = A.ctx.createGain();
        A.master.gain.value = 0.9;
        const comp = A.ctx.createDynamicsCompressor();
        comp.threshold.value = -14; comp.ratio.value = 4;
        A.master.connect(comp); comp.connect(A.ctx.destination);
        A.sfxBus = A.ctx.createGain(); A.sfxBus.gain.value = 0.8; A.sfxBus.connect(A.master);
        A.musicBus = A.ctx.createGain(); A.musicBus.gain.value = 0.0; A.musicBus.connect(A.master);
        // shared echo for the music
        A.delay = A.ctx.createDelay(1); A.delay.delayTime.value = 0.34;
        A.fb = A.ctx.createGain(); A.fb.gain.value = 0.32;
        A.dlp = A.ctx.createBiquadFilter(); A.dlp.type = 'lowpass'; A.dlp.frequency.value = 2200;
        A.delay.connect(A.dlp); A.dlp.connect(A.fb); A.fb.connect(A.delay); A.dlp.connect(A.musicBus);
        const len = A.ctx.sampleRate * 1;
        A.noiseBuf = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
        const data = A.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      }
      if (A.ctx.state === 'suspended') A.ctx.resume();
      A.applySettings();
    },

    applySettings() {
      if (!A.ctx) return;
      const s = A.settings();
      A.sfxBus.gain.setTargetAtTime(s.sfx ? 0.8 : 0, A.ctx.currentTime, 0.05);
      const musicOn = s.music && NOA.FEATURES.music;
      A.musicBus.gain.setTargetAtTime(musicOn ? 0.55 : 0, A.ctx.currentTime, 0.4);
      if (musicOn && !A.musicTimer) A.startMusic();
      if (!musicOn && A.musicTimer) A.stopMusic();
    },

    vibrate(pattern) {
      if (!A.settings().haptics) return;
      try { if (globalThis.navigator && navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* ignore */ }
    },

    /* ------------------------------------------------------------ primitives */
    tone(o) {
      if (!A.ctx || !A.settings().sfx) return;
      const t = A.ctx.currentTime + (o.when || 0);
      const osc = A.ctx.createOscillator();
      const g = A.ctx.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.f, t);
      if (o.slideTo) osc.frequency.exponentialRampToValueAtTime(o.slideTo, t + (o.slideTime || o.dur || 0.2));
      if (o.detune) osc.detune.value = o.detune;
      const peak = o.gain != null ? o.gain : 0.2;
      const atk = o.attack || 0.005;
      const dur = o.dur || 0.25;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + atk);
      g.gain.exponentialRampToValueAtTime(0.0001, t + atk + dur);
      osc.connect(g);
      g.connect(o.bus || A.sfxBus);
      osc.start(t);
      osc.stop(t + atk + dur + 0.05);
    },
    noise(o) {
      if (!A.ctx || !A.settings().sfx) return;
      const t = A.ctx.currentTime + (o.when || 0);
      const src = A.ctx.createBufferSource();
      src.buffer = A.noiseBuf;
      const f = A.ctx.createBiquadFilter();
      f.type = o.filter || 'bandpass';
      f.frequency.setValueAtTime(o.freq || 1200, t);
      if (o.sweepTo) f.frequency.exponentialRampToValueAtTime(o.sweepTo, t + (o.dur || 0.3));
      f.Q.value = o.q || 1;
      const g = A.ctx.createGain();
      const dur = o.dur || 0.2;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.gain || 0.15, t + (o.attack || 0.01));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(A.sfxBus);
      src.start(t);
      src.stop(t + dur + 0.05);
    },
    bell(f, when, gain) {
      A.tone({ f, type: 'sine', dur: 0.9, gain: gain || 0.12, when });
      A.tone({ f: f * 2.76, type: 'sine', dur: 0.35, gain: (gain || 0.12) * 0.35, when });
      A.tone({ f: f * 5.4, type: 'sine', dur: 0.15, gain: (gain || 0.12) * 0.15, when });
    },
    shimmer(when, n) {
      for (let i = 0; i < (n || 7); i++) {
        A.tone({ f: 1400 + Math.random() * 2200, type: 'sine', dur: 0.18, gain: 0.04, when: (when || 0) + i * 0.07 });
      }
    },
    chord(freqs, when, dur, gain, type) {
      for (const f of freqs) A.tone({ f, type: type || 'triangle', dur: dur || 1, gain: gain || 0.06, attack: 0.03, when });
    },

    /* ------------------------------------------------------------ game sounds */
    play(name, a, b) {
      if (!A.ctx) return;
      const fn = A.sfx[name];
      if (fn) { try { fn(a, b); } catch (e) { console.warn(e); } }
    },
    sfx: {
      tap() { A.tone({ f: 880, type: 'sine', dur: 0.05, gain: 0.06 }); },
      pick() { A.tone({ f: 620, slideTo: 760, type: 'sine', dur: 0.08, gain: 0.08 }); },
      drop() { A.tone({ f: 420, slideTo: 300, type: 'sine', dur: 0.08, gain: 0.07 }); },
      invalid() {
        A.tone({ f: 180, type: 'square', dur: 0.09, gain: 0.05 });
        A.tone({ f: 150, type: 'square', dur: 0.12, gain: 0.05, when: 0.09 });
      },
      spawn() {
        A.tone({ f: 700, slideTo: 1100, type: 'sine', dur: 0.09, gain: 0.12 });
        A.noise({ freq: 3000, dur: 0.05, gain: 0.04, filter: 'highpass' });
      },
      /** level: item level, combo: 1.. (pitch climbs the major scale) */
      merge(level, combo) {
        const f = noteFreq(Math.max(0, (combo || 1) - 1));
        A.noise({ freq: 2400, dur: 0.04, gain: 0.05, filter: 'highpass' });
        A.tone({ f, type: 'triangle', dur: 0.38, gain: 0.2 });
        A.tone({ f: f * 2, type: 'sine', dur: 0.26, gain: 0.07 });
        A.tone({ f: f * 3, type: 'sine', dur: 0.14, gain: 0.03 });
        if ((level || 1) >= 3) A.tone({ f: f * 4, type: 'sine', dur: 0.2, gain: 0.035, when: 0.06 });
        if ((level || 1) >= 5) A.shimmer(0.05, 5);
      },
      breakthrough() {
        A.tone({ f: 523, slideTo: 1568, slideTime: 0.25, type: 'sawtooth', dur: 0.3, gain: 0.05 });
        A.chord([1046, 1318, 1568], 0.18, 0.7, 0.05);
      },
      gene() {
        A.noise({ freq: 400, sweepTo: 5000, dur: 0.7, gain: 0.07, q: 2 });
        A.shimmer(0.1, 10);
        A.chord([523.25, 659.25, 783.99, 987.77, 1174.66], 0.25, 1.6, 0.045);
        A.bell(2093, 0.6, 0.06);
      },
      purity() {
        A.bell(1318.5, 0, 0.09); A.bell(1760, 0.1, 0.08);
      },
      geneLost() {
        A.tone({ f: 660, slideTo: 330, slideTime: 0.4, type: 'sine', dur: 0.45, gain: 0.08 });
      },
      harvest() {
        A.noise({ freq: 900, dur: 0.12, gain: 0.08 });
        A.tone({ f: 523, type: 'triangle', dur: 0.12, gain: 0.1 });
        A.tone({ f: 784, type: 'triangle', dur: 0.16, gain: 0.1, when: 0.08 });
      },
      plant() {
        A.noise({ freq: 500, dur: 0.1, gain: 0.08, filter: 'lowpass' });
        A.tone({ f: 330, slideTo: 440, type: 'sine', dur: 0.1, gain: 0.08, when: 0.05 });
      },
      coin() {
        A.tone({ f: 1975, type: 'square', dur: 0.05, gain: 0.025 });
        A.tone({ f: 2637, type: 'square', dur: 0.12, gain: 0.025, when: 0.05 });
      },
      gem() { A.bell(2349, 0, 0.05); A.bell(3136, 0.06, 0.04); },
      sell() { A.sfx.coin(); A.tone({ f: 392, type: 'triangle', dur: 0.12, gain: 0.06 }); },
      order() {
        [523, 659, 784, 1046].forEach((f, i) => A.tone({ f, type: 'triangle', dur: 0.2, gain: 0.09, when: i * 0.07 }));
      },
      levelUp() {
        [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => A.tone({ f, type: 'triangle', dur: 0.3, gain: 0.1, when: i * 0.08 }));
        A.chord([261.63, 392, 523.25], 0.5, 1.4, 0.05);
        A.shimmer(0.5, 8);
      },
      unlock() { A.bell(1046, 0, 0.08); A.bell(1568, 0.12, 0.08); },
      secret() {
        A.tone({ f: 392, type: 'sine', dur: 0.5, gain: 0.08 });
        A.tone({ f: 466.16, type: 'sine', dur: 0.5, gain: 0.08, when: 0.18 });
        A.tone({ f: 587.33, type: 'sine', dur: 0.8, gain: 0.08, when: 0.36 });
        A.shimmer(0.4, 10);
      },
      star() { A.tone({ f: 2600, slideTo: 1200, slideTime: 0.4, type: 'sine', dur: 0.45, gain: 0.05 }); A.shimmer(0.05, 4); },
      swoosh() { A.noise({ freq: 600, sweepTo: 3000, dur: 0.25, gain: 0.07, q: 1.5 }); },
      open() { A.tone({ f: 300, slideTo: 600, type: 'sine', dur: 0.12, gain: 0.08 }); },
      close() { A.tone({ f: 600, slideTo: 300, type: 'sine', dur: 0.1, gain: 0.06 }); },
      // --- blindbox
      boxShake(i) {
        const g = 0.25 + 0.1 * (i || 0);
        A.tone({ f: 110, slideTo: 55, type: 'sine', dur: 0.18, gain: g });
        A.noise({ freq: 700, dur: 0.07, gain: 0.08, filter: 'lowpass' });
      },
      boxTease(step) {
        const fs = [880, 1046.5, 1318.5, 1568, 2093];
        A.bell(fs[Math.min(step, fs.length - 1)], 0, 0.08 + step * 0.015);
      },
      boxBurst(r) {
        A.noise({ freq: 2500, sweepTo: 600, dur: 0.5, gain: 0.16, filter: 'highpass' });
        A.tone({ f: 80, slideTo: 40, type: 'sine', dur: 0.35, gain: 0.35 });
        if (r >= 2) A.shimmer(0.1, 8);
      },
      reveal(r) {
        const base = 523.25;
        const seqs = [
          [0, 7],
          [0, 4, 7],
          [0, 4, 7, 12],
          [0, 4, 7, 12, 16, 19],
          [0, 4, 7, 11, 12, 16, 19, 24]
        ];
        const seq = seqs[Math.min(r, 4)];
        seq.forEach((n, i) => A.tone({ f: semis(base, n), type: 'triangle', dur: 0.32, gain: 0.1, when: i * 0.075 }));
        if (r >= 2) A.chord([semis(base, 0), semis(base, 4), semis(base, 7)], seq.length * 0.075, 1.2, 0.04);
        if (r >= 3) { A.tone({ f: 130.81, type: 'sine', dur: 1.4, gain: 0.12, attack: 0.02 }); A.shimmer(0.3, 12); }
        if (r >= 4) {
          [0, 4, 7, 11].forEach((n) => {
            A.tone({ f: semis(261.63, n), type: 'sawtooth', dur: 2.2, gain: 0.018, attack: 0.4, detune: -8 });
            A.tone({ f: semis(261.63, n), type: 'sawtooth', dur: 2.2, gain: 0.018, attack: 0.4, detune: 8 });
          });
        }
      },
      flip() { A.noise({ freq: 1800, dur: 0.06, gain: 0.06 }); A.tone({ f: 990, type: 'sine', dur: 0.06, gain: 0.05 }); }
    },

    /* ------------------------------------------------------------ generative background music */
    startMusic() {
      if (!A.ctx || A.musicTimer) return;
      const PENTA = [0, 2, 4, 7, 9];
      const bassLine = [0, -5, -3, -7]; // C, G, A, F (relative to C3)
      A.musicStep = 0;
      A.musicTimer = setInterval(() => {
        if (!A.ctx || A.ctx.state !== 'running') return;
        const night = NOA.time && NOA.time.isNight();
        const step = A.musicStep++;
        const t = A.ctx.currentTime + 0.05;
        const chance = night ? 0.38 : 0.55;
        if (Math.random() < chance) {
          const deg = PENTA[Math.floor(Math.random() * PENTA.length)];
          const oct = Math.random() < 0.3 ? 12 : 0;
          const f = semis(night ? 392 : 523.25, deg + oct - 12);
          const osc = A.ctx.createOscillator();
          const g = A.ctx.createGain();
          osc.type = 'sine'; osc.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.05, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
          osc.connect(g); g.connect(A.musicBus); g.connect(A.delay);
          osc.start(t); osc.stop(t + 1);
        }
        if (step % 8 === 0) {
          const f = semis(130.81, bassLine[(step / 8) % bassLine.length]);
          const osc = A.ctx.createOscillator();
          const g = A.ctx.createGain();
          osc.type = 'triangle'; osc.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.035, t + 0.2);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
          osc.connect(g); g.connect(A.musicBus);
          osc.start(t); osc.stop(t + 3.3);
        }
      }, 420);
    },
    stopMusic() { clearInterval(A.musicTimer); A.musicTimer = null; },

    noteFreq
  };
})();

// ---- js/core/validate.js
/*
 * Config validator: catches typos and impossible numbers after someone edits
 * config/balance.js or config/content.js. Results show in Dev panel + console.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';

  NOA.validateConfig = function () {
    const B = NOA.BALANCE, C = NOA.CONTENT, P = NOA.PAYMENT;
    const out = [];
    const warn = (msg) => out.push(msg);
    const prob = (path, v) => {
      if (typeof v !== 'number' || isNaN(v) || v < 0 || v > 1) warn(path + ' phải là xác suất 0..1 (đang là ' + v + ')');
    };
    const sumPositive = (path, obj) => {
      const s = Object.values(obj || {}).reduce((a, b) => a + (b > 0 ? b : 0), 0);
      if (s <= 0) warn(path + ': tổng trọng số phải > 0');
      return s;
    };

    // species
    for (const id in C.species) {
      const sp = C.species[id];
      const eco = B.species[id];
      if (!eco) { warn('balance.species thiếu "' + id + '"'); continue; }
      const timeKey = sp.family === 'plant' ? 'growSec' : 'cycleSec';
      if (!(eco[timeKey] > 0)) warn('balance.species.' + id + '.' + timeKey + ' phải > 0');
      if (sp.hybrid) {
        sp.hybrid.forEach((p) => { if (!C.species[p]) warn('Giống lai ' + id + ' tham chiếu loài không tồn tại: ' + p); });
        if (!(eco.hybridPriceMult > 0)) warn('balance.species.' + id + '.hybridPriceMult phải > 0');
      } else {
        if (!(eco.price > 0)) warn('balance.species.' + id + '.price phải > 0');
        if (!(eco.unlockLevel >= 1)) warn('balance.species.' + id + '.unlockLevel phải >= 1');
        (sp.products || []).forEach((pid, i) => {
          const p = C.products[pid];
          if (!p) warn('content.products thiếu "' + pid + '"');
          else if (p.species !== id || p.tier !== i + 1) warn('Sản phẩm ' + pid + ' sai loài/cấp');
        });
      }
      (sp.feed || []).forEach((f) => { if (!C.species[f]) warn('Thức ăn của ' + id + ' không tồn tại: ' + f); });
    }
    for (const id in B.species) if (!C.species[id]) warn('balance.species có "' + id + '" nhưng content.species không có');

    // genes
    for (const id in C.genes) {
      const g = C.genes[id];
      if (g.parents) {
        g.parents.forEach((p) => {
          const pg = C.genes[p];
          if (!pg) warn('Gen ' + id + ': gen cha/mẹ không tồn tại ' + p);
          else if (pg.family !== g.family) warn('Gen ' + id + ': gen cha/mẹ khác họ ' + p);
          else if (pg.tier !== g.tier - 1) warn('Gen ' + id + ': gen cha/mẹ ' + p + ' phải ở tầng ' + (g.tier - 1));
        });
      }
      if (!B.gene.priceMult[g.tier]) warn('balance.gene.priceMult thiếu tầng ' + g.tier);
    }
    for (const fam of ['plant', 'animal']) {
      const w = B.gene.spawnWeights[fam] || {};
      sumPositive('gene.spawnWeights.' + fam, w);
      for (const id in w) {
        if (!C.genes[id]) warn('gene.spawnWeights.' + fam + ': gen không tồn tại ' + id);
        else if (C.genes[id].tier !== 1 || C.genes[id].family !== fam) warn('gene.spawnWeights.' + fam + '.' + id + ' phải là gen tầng 1 họ ' + fam);
      }
    }

    // probabilities
    prob('gene.spawnChance', B.gene.spawnChance);
    for (const k in B.gene.keep) prob('gene.keep.' + k, B.gene.keep[k]);
    B.gene.purityUpChance.forEach((v, i) => prob('gene.purityUpChance[' + i + ']', v));
    for (const k in B.gene.fusion.chanceByTier) prob('gene.fusion.chanceByTier.' + k, B.gene.fusion.chanceByTier[k]);
    for (const k in B.recessive) prob('recessive.' + k, B.recessive[k]);
    B.merge.breakthroughChance.forEach((v, i) => prob('merge.breakthroughChance[' + i + ']', v));
    prob('harvest.geneProductChance', B.harvest.geneProductChance);
    prob('harvest.naturalCloverChance', B.harvest.naturalCloverChance);
    prob('generators.carrierChance', B.generators.carrierChance);
    prob('orders.vip.chance', B.orders.vip.chance);
    prob('orders.earth.chance', B.orders.earth.chance);
    prob('hybrid.baseDiscovery', B.hybrid.baseDiscovery);
    prob('product.starUpChanceOnMerge', B.product.starUpChanceOnMerge);

    // labs
    if (B.labs.levels.length !== B.labs.maxLevel + 1) warn('labs.levels phải có ' + (B.labs.maxLevel + 1) + ' phần tử (kể cả null ở index 0)');
    for (let i = 2; i < B.labs.levels.length; i++) {
      const L = B.labs.levels[i];
      if (!L || !L.cost) warn('labs.levels[' + i + '] thiếu cost');
    }

    // gacha
    for (const boxId in B.gacha.boxes) {
      const box = B.gacha.boxes[boxId];
      if (!C.boxes[boxId]) warn('content.boxes thiếu "' + boxId + '"');
      sumPositive('gacha.boxes.' + boxId + '.rarityWeights', box.rarityWeights);
      for (const r in box.rarityWeights) {
        if (B.gacha.rarityOrder.indexOf(r) < 0) warn('Hộp ' + boxId + ': độ hiếm lạ ' + r);
        if (box.rarityWeights[r] > 0) {
          const pool = box.pool[r] || {};
          if (!Object.keys(pool).length) warn('Hộp ' + boxId + ': độ hiếm ' + r + ' có trọng số nhưng pool rỗng');
          for (const rid in pool) if (!B.gacha.rewards[rid]) warn('Hộp ' + boxId + ': phần thưởng không tồn tại ' + rid);
        }
      }
      for (const r in box.pity || {}) if (B.gacha.rarityOrder.indexOf(r) < 0) warn('Hộp ' + boxId + ': pity độ hiếm lạ ' + r);
    }
    for (const pool in B.gacha.mascotPools) {
      for (const id in B.gacha.mascotPools[pool]) if (!C.mascots[id]) warn('gacha.mascotPools.' + pool + ': linh vật không tồn tại ' + id);
    }
    for (const rid in B.gacha.rewards) {
      const r = B.gacha.rewards[rid];
      if (r.type === 'booster' && !C.boosters[r.id]) warn('gacha.rewards.' + rid + ': booster không tồn tại ' + r.id);
      if (r.type === 'mascot' && !B.gacha.mascotPools[r.pool]) warn('gacha.rewards.' + rid + ': nhóm linh vật không tồn tại ' + r.pool);
    }

    // mascots
    for (const id in C.mascots) {
      if (!B.mascots.effects[id]) warn('mascots.effects thiếu "' + id + '"');
      if (C.mascots[id].type === 'temp' && !(B.mascots.durationMin[id] > 0)) warn('mascots.durationMin thiếu "' + id + '"');
    }

    // rewards tables
    if ((B.login.days || []).length < 1) warn('login.days rỗng');
    const checkReward = (path, r) => {
      for (const b in (r && r.boosters) || {}) if (!C.boosters[b]) warn(path + ': booster không tồn tại ' + b);
      for (const tk in (r && r.tickets) || {}) if (!B.gacha.boxes[tk]) warn(path + ': vé không tồn tại ' + tk);
      if (r && r.mascot && !C.mascots[r.mascot]) warn(path + ': linh vật không tồn tại ' + r.mascot);
    };
    B.login.days.forEach((d, i) => checkReward('login.days[' + i + ']', d));
    for (const lv in B.levelRewards) checkReward('levelRewards.' + lv, B.levelRewards[lv]);
    B.shop.items.forEach((it) => checkReward('shop.' + it.id, it.grant));
    for (const s in B.secrets.rewards) checkReward('secrets.rewards.' + s, B.secrets.rewards[s]);

    // payment
    const skus = {};
    (P.products || []).forEach((p) => {
      if (skus[p.sku]) warn('payment: trùng sku ' + p.sku);
      skus[p.sku] = true;
      checkReward('payment.' + p.sku, p.grant);
    });
    if (P.enabled && P.provider === 'disabled') warn('payment.enabled = true nhưng provider vẫn là "disabled"');

    // i18n coverage for content names
    if (NOA.I18N && NOA.I18N.vi && NOA.I18N.en) {
      const need = [];
      for (const id in C.species) need.push('species.' + id);
      for (const id in C.products) need.push('product.' + id);
      for (const id in C.genes) need.push('gene.' + id);
      for (const id in C.mascots) need.push('mascot.' + id);
      for (const id in C.boosters) need.push('booster.' + id);
      for (const k of need) {
        if (NOA.I18N.vi[k] == null) warn('i18n/vi.js thiếu "' + k + '"');
        if (NOA.I18N.en[k] == null) warn('i18n/en.js thiếu "' + k + '"');
      }
    }
    return out;
  };
})();

// ---- js/systems/state.js
/*
 * Game state shape, resources (coins / gems / energy / research points) and XP / levels.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const S = () => NOA.state;

  NOA.newState = function (lang) {
    const b = B();
    const now = NOA.time ? Date.now() : 0;
    const cells = b.board.cols * b.board.rows;
    const state = {
      v: b.meta.saveVersion,
      createdAt: now,
      lang: lang || 'vi',
      farmName: '',
      res: { coins: 500, gems: 30, energy: b.energy.start, rp: 0, energyAt: now },
      xp: 0,
      level: 1,
      tickets: { sprout: 0, star: 0 },
      boosters: { clover: 1, stabilizer: 0, stardust: 0, tonic: 1, loupe: 0 },
      board: new Array(cells).fill(null),
      storage: [],
      storageCap: b.board.storageStart,
      plots: [],
      pens: [],
      orders: [],
      orderRefillAt: 0,
      orderSwapAt: 0,
      labs: { greenhouse: { level: 1, slots: [] }, ranch: { level: 1, slots: [] } },
      mascots: { owned: {}, temp: {}, shrine: new Array(b.mascots.shrineSlots).fill(null) },
      discovered: { species: {}, genes: {}, hybrids: {}, products: {}, mascots: {}, maxLevel: {} },
      essence: {},
      secrets: {},
      flags: {},
      login: { lastDay: null, claimed: 0 },
      gacha: {},
      market: { day: null, sold: {} },
      earth: 0,
      tutorial: { step: 0, counts: {}, done: false },
      settings: { sfx: true, music: true, haptics: true },
      dev: { offsetMs: 0, timeScale: null, force: {}, payProvider: null, features: {} },
      ledger: [],
      purchases: { owned: {}, monthlyUntil: 0, monthlyLastDay: null },
      stats: { merges: 0, harvests: 0, orders: 0, genesAwakened: 0, opens: 0, maxCombo: 0 },
      seen: { intro: false }
    };
    for (let i = 0; i < b.farm.plotsStart; i++) state.plots.push({ seed: null, start: 0, end: 0, out: [] });
    for (let i = 0; i < b.farm.pensStart; i++) state.pens.push({ animal: null, feed: 0, start: 0, end: 0, out: [] });
    for (const id in b.gacha.boxes) state.gacha[id] = { opened: 0, since: {} };
    return state;
  };

  /** Place the two generators and starter items (called once for a new game). */
  NOA.seedNewGame = function () {
    const b = B();
    const cols = b.board.cols, rows = b.board.rows;
    const s = S();
    s.board[(rows - 1) * cols] = NOA.items.newGenerator('seedSack');
    s.board[(rows - 1) * cols + cols - 1] = NOA.items.newGenerator('incubator');
    for (const id in NOA.CONTENT.species) {
      const sp = NOA.CONTENT.species[id];
      if (!sp.hybrid && b.species[id].unlockLevel <= 1) s.discovered.species[id] = true;
    }
  };

  /* ------------------------------------------------------------ resources */
  NOA.res = {
    get(k) { return S().res[k] || 0; },
    energyMax() { return Math.round(NOA.mods.value('energy.max', B().energy.max, {})); },
    add(k, n) {
      if (!n) return;
      const r = S().res;
      if (k === 'energy') {
        const max = NOA.res.energyMax();
        if (r.energy >= max && n > 0) r.energyAt = NOA.time.now();
      }
      r[k] = Math.max(0, (r[k] || 0) + n);
      NOA.events.emit('res.changed', { k, n });
      NOA.save.schedule();
    },
    canAfford(cost) {
      if (!cost) return true;
      for (const k in cost) {
        if (k === 'tickets') {
          for (const t in cost.tickets) if ((S().tickets[t] || 0) < cost.tickets[t]) return false;
        } else if ((S().res[k] || 0) < cost[k]) return false;
      }
      return true;
    },
    spend(cost) {
      if (!NOA.res.canAfford(cost)) return false;
      for (const k in cost) {
        if (k === 'tickets') {
          for (const t in cost.tickets) S().tickets[t] -= cost.tickets[t];
          NOA.events.emit('res.changed', { k: 'tickets' });
        } else {
          if (k === 'energy' && S().res.energy >= NOA.res.energyMax()) S().res.energyAt = NOA.time.now();
          S().res[k] -= cost[k];
          NOA.events.emit('res.changed', { k, n: -cost[k] });
        }
      }
      NOA.save.schedule();
      return true;
    },
    /** Regenerate energy from elapsed time (works offline too). */
    tickEnergy() {
      const r = S().res;
      const max = NOA.res.energyMax();
      const now = NOA.time.now();
      if (r.energy >= max) { r.energyAt = now; return; }
      const regenMs = NOA.time.dur(B().energy.regenSeconds) / NOA.mods.value('energy.regenMult', 1, {});
      const elapsed = now - (r.energyAt || now);
      if (elapsed >= regenMs) {
        const gained = Math.floor(elapsed / regenMs);
        r.energy = Math.min(max, r.energy + gained);
        r.energyAt = r.energy >= max ? now : r.energyAt + gained * regenMs;
        NOA.events.emit('res.changed', { k: 'energy', n: gained });
      }
    },
    energyNextMs() {
      const r = S().res;
      if (r.energy >= NOA.res.energyMax()) return 0;
      const regenMs = NOA.time.dur(B().energy.regenSeconds) / NOA.mods.value('energy.regenMult', 1, {});
      return Math.max(0, regenMs - (NOA.time.now() - r.energyAt));
    }
  };

  /* ------------------------------------------------------------ XP & level */
  NOA.progress = {
    xpToNext(level) {
      const t = B().level.xpToNext;
      if (level < t.length) return t[level];
      return t[t.length - 1] + (level - t.length + 1) * B().level.xpGrowthAfterTable;
    },
    addXP(n) {
      if (!n || n <= 0) return;
      const s = S();
      s.xp += Math.round(n);
      while (s.level < B().level.maxLevel && s.xp >= NOA.progress.xpToNext(s.level)) {
        s.xp -= NOA.progress.xpToNext(s.level);
        s.level += 1;
        const reward = NOA.rewards.levelReward(s.level);
        const granted = NOA.rewards.grant(reward, 'level');
        const unlocks = NOA.progress.unlocksAt(s.level);
        unlocks.species.forEach((id) => { s.discovered.species[id] = true; });
        NOA.events.emit('level.up', { level: s.level, granted, unlocks });
      }
      NOA.events.emit('xp.changed', { n });
      NOA.save.schedule();
    },
    unlocksAt(level) {
      const out = { species: [], features: [], plots: 0, pens: 0 };
      const b = B();
      for (const id in NOA.CONTENT.species) {
        const eco = b.species[id];
        if (!NOA.CONTENT.species[id].hybrid && eco.unlockLevel === level) out.species.push(id);
      }
      for (const f in b.unlocks) if (b.unlocks[f] === level) out.features.push(f);
      out.plots = b.farm.plotLevelReq.filter((l, i) => l === level && i >= b.farm.plotsStart).length;
      out.pens = b.farm.penLevelReq.filter((l, i) => l === level && i >= b.farm.pensStart).length;
      return out;
    },
    isUnlocked(feature) {
      const lv = B().unlocks[feature];
      return lv == null || S().level >= lv;
    }
  };
})();

// ---- js/systems/items.js
/*
 * Items: factories, naming, effective stats and value.
 *
 * Item shapes
 *   seed / animal : { id, kind, species, level, stats:{yield,growth,quality}, gene:{id,purity}|null,
 *                     carrier: geneId|null (hidden recessive gene), revealed, charm, locked }
 *   product       : { id, kind:'product', product, stars, gene|null, locked }
 *   generator     : { id, kind:'generator', generator }
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const U = NOA.util;
  const STATS = ['yield', 'growth', 'quality'];

  const I = NOA.items = {
    STATS,
    kindOf(family) { return family === 'plant' ? 'seed' : 'animal'; },
    isBreed(item) { return !!item && (item.kind === 'seed' || item.kind === 'animal'); },
    family(item) {
      if (!item) return null;
      if (I.isBreed(item)) return C().species[item.species].family;
      if (item.kind === 'product') return C().species[C().products[item.product].species].family;
      if (item.kind === 'generator') return C().generators[item.generator].family;
      return null;
    },
    speciesOf(item) {
      if (I.isBreed(item)) return item.species;
      if (item && item.kind === 'product') return C().products[item.product].species;
      return null;
    },

    /* ------------------------------------------------------------ factories */
    rollStats(level) {
      const ranges = B().generators.spawnStats;
      let r = ranges[level];
      if (!r) {
        const cap = B().merge.statCapByLevel[level] || 100;
        r = [Math.round(cap * 0.4), Math.round(cap * 0.65)];
      }
      return { yield: U.randInt(r[0], r[1]), growth: U.randInt(r[0], r[1]), quality: U.randInt(r[0], r[1]) };
    },
    randomCarrier(family) {
      if (!NOA.FEATURES.recessiveGenes) return null;
      if (!U.chance(B().generators.carrierChance)) return null;
      return U.pickWeighted(B().gene.spawnWeights[family]);
    },
    newBreed(species, level, opts) {
      opts = opts || {};
      const fam = C().species[species].family;
      const item = {
        id: U.uid('b'),
        kind: I.kindOf(fam),
        species,
        level: level || 1,
        stats: opts.stats || I.rollStats(level || 1),
        gene: opts.gene || null,
        carrier: opts.carrier !== undefined ? opts.carrier : (opts.gene ? null : I.randomCarrier(fam)),
        revealed: false,
        charm: null,
        locked: false
      };
      return item;
    },
    newProduct(productId, stars, gene) {
      return { id: U.uid('p'), kind: 'product', product: productId, stars: stars || 1, gene: gene || null, locked: false };
    },
    newGenerator(id) { return { id: U.uid('g'), kind: 'generator', generator: id }; },

    /* ------------------------------------------------------------ genes & stats */
    geneDef(item) { return item && item.gene ? C().genes[item.gene.id] : null; },
    geneTier(item) { const g = I.geneDef(item); return g ? g.tier : 0; },
    isSuper(item) { return !!(item && item.gene && item.gene.purity >= B().gene.maxPurity); },
    geneBonus(item, stat) {
      const g = I.geneDef(item);
      if (!g) return 0;
      const pts = B().gene.statBonusByPurity[item.gene.purity] || 0;
      if (g.favor === 'all') return Math.round(pts * B().gene.allFavorShare);
      return g.favor === stat ? pts : 0;
    },
    stat(item, stat) {
      if (!I.isBreed(item)) return 0;
      return item.stats[stat] + I.geneBonus(item, stat);
    },
    statTotal(item) { return STATS.reduce((a, s) => a + I.stat(item, s), 0); },
    geneMult(gene) {
      if (!gene) return 1;
      const def = C().genes[gene.id];
      const row = B().gene.priceMult[def.tier] || [1];
      return row[gene.purity] || row[row.length - 1];
    },

    /* ------------------------------------------------------------ value */
    unitPrice(species) {
      const eco = B().species[species];
      if (eco.price) return eco.price;
      const sp = C().species[species];
      if (sp.hybrid) {
        const avg = (I.unitPrice(sp.hybrid[0]) + I.unitPrice(sp.hybrid[1])) / 2;
        return avg * (eco.hybridPriceMult || 1);
      }
      return 1;
    },
    productValue(productId, stars, gene) {
      const p = C().products[productId];
      const b = B().product;
      return I.unitPrice(p.species) * b.tierUnits[p.tier] * b.tierValueBonus[p.tier] *
        (b.starPriceMult[stars || 1] || 1) * I.geneMult(gene);
    },
    /** Base coin value before market saturation and coin multipliers */
    value(item) {
      if (!item) return 0;
      if (item.kind === 'product') return Math.round(I.productValue(item.product, item.stars, item.gene));
      if (I.isBreed(item)) {
        const m = B().market;
        const hybrid = C().species[item.species].hybrid ? 1.5 : 1;
        return Math.round(m.seedSellBase * (m.seedLevelMult[item.level] || 1) * I.geneMult(item.gene) * hybrid);
      }
      return 0;
    },
    marketKey(item) {
      if (item.kind === 'product') return item.product;
      if (I.isBreed(item)) return item.species + ':' + item.level;
      return item.kind;
    },

    /* ------------------------------------------------------------ merge rules */
    canMerge(a, b) {
      if (!a || !b || a === b || a.locked || b.locked) return false;
      if (I.isBreed(a) && I.isBreed(b)) {
        return a.kind === b.kind && a.species === b.species && a.level === b.level && a.level < B().merge.maxLevel;
      }
      if (a.kind === 'product' && b.kind === 'product') {
        return a.product === b.product && C().products[a.product].tier < B().harvest.maxProductTier;
      }
      return false;
    },
    isMaxed(item) {
      if (I.isBreed(item)) return item.level >= B().merge.maxLevel;
      if (item && item.kind === 'product') return C().products[item.product].tier >= B().harvest.maxProductTier;
      return false;
    },

    /* ------------------------------------------------------------ display */
    speciesName(id) { return NOA.t('species.' + id); },
    geneName(id) { return NOA.t('gene.' + id); },
    baseName(item) {
      if (!item) return '';
      if (item.kind === 'seed') return NOA.t('item.seedName', { species: I.speciesName(item.species) });
      if (item.kind === 'animal') return I.speciesName(item.species);
      if (item.kind === 'product') return NOA.t('product.' + item.product);
      if (item.kind === 'generator') return NOA.t('gen.' + item.generator);
      return '';
    },
    name(item) {
      const base = I.baseName(item);
      if (item && item.gene) return NOA.t('item.withGene', { base, gene: I.geneName(item.gene.id) });
      return base;
    },
    emoji(item) {
      if (!item) return '';
      if (I.isBreed(item)) return C().species[item.species].emoji;
      if (item.kind === 'product') return C().products[item.product].emoji;
      if (item.kind === 'generator') return C().generators[item.generator].emoji;
      return '❔';
    },
    emoji2(item) {
      return I.isBreed(item) ? C().species[item.species].emoji2 || null : null;
    },
    purityText(p) {
      const max = B().gene.maxPurity;
      return '◆'.repeat(p) + '◇'.repeat(Math.max(0, max - p));
    },
    /** Stars for a quality score (+ jitter) */
    starsFor(quality) {
      const th = B().harvest.starThresholds;
      let s = 1;
      for (let i = 0; i < th.length; i++) if (quality >= th[i]) s = i + 1;
      return U.clamp(s, 1, 5);
    }
  };
})();

// ---- js/systems/genetics.js
/*
 * Genetics: merge resolution for seeds / animals / products, gene inheritance,
 * fusion, purity, recessive genes, breakthrough, and the pre-merge preview.
 *
 * Rules (from the design):
 *   - max 1 gene per item, plant genes only on plants, animal genes only on animals
 *   - normal + normal   -> small chance a new gene appears (lab level raises it)
 *   - gene   + normal   -> LOW chance to keep the gene (purity -1)
 *   - gene   + gene     -> HIGH chance to keep; same gene can gain purity;
 *                          a valid pair can fuse into a higher-tier gene
 *   - luck boosters attached to either parent add to every chance of that merge
 *   - a lost gene sinks into a hidden recessive gene that can re-awaken later
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const U = NOA.util;
  const I = () => NOA.items;

  const G = NOA.genetics = {
    labId(family) { return C().families[family].lab; },
    labLevel(family) {
      const s = NOA.state;
      return s ? s.labs[G.labId(family)].level : 1;
    },
    labData(family) { return B().labs.levels[G.labLevel(family)] || B().labs.levels[1]; },
    purityCap(family) { return Math.min(B().gene.maxPurity, G.labData(family).purityCap); },
    fusionTierAllowed(family) { return G.labData(family).fusionTier; },

    ctxFor(a, b, op) {
      return {
        family: I().family(a),
        items: [a, b],
        charms: [a && a.charm, b && b.charm].filter(Boolean),
        op: op || 'merge'
      };
    },

    /** Weighted pick of a tier-1 gene for a family, with world / mascot weight modifiers */
    spawnGeneId(family, ctx) {
      const w = Object.assign({}, B().gene.spawnWeights[family]);
      for (const id in w) w[id] = NOA.mods.value('geneWeight.' + id, w[id], ctx || { family });
      return U.pickWeighted(w);
    },

    /** Fusion recipe for two different genes -> gene id or null */
    fusionTarget(g1, g2) {
      for (const id in C().genes) {
        const p = C().genes[id].parents;
        if (p && ((p[0] === g1 && p[1] === g2) || (p[0] === g2 && p[1] === g1))) return id;
      }
      return null;
    },

    better(a, b) {
      const ta = C().genes[a.id].tier, tb = C().genes[b.id].tier;
      if (ta !== tb) return ta > tb ? a : b;
      if (a.purity !== b.purity) return a.purity > b.purity ? a : b;
      return U.chance(0.5) ? a : b;
    },

    chances(a, b, ctx) {
      const g = B().gene;
      const stab = ctx.charms.indexOf('stabilizer') >= 0;
      return {
        spawn: NOA.mods.chance('gene.spawn', g.spawnChance, ctx),
        keepNormal: stab ? 1 : NOA.mods.chance('gene.keep.withNormal', g.keep.withNormal, ctx),
        keepSame: stab ? 1 : NOA.mods.chance('gene.keep.sameGene', g.keep.sameGene, ctx),
        keepDiff: stab ? 1 : NOA.mods.chance('gene.keep.diffGene', g.keep.diffGene, ctx),
        recessive: NOA.mods.chance('recessive.express', B().recessive.expressChance, ctx),
        stab
      };
    },

    purityUpChance(gA, gB, ctx) {
      const g = B().gene;
      const purity = Math.max(gA.purity, gB.purity);
      let base = g.purityUpChance[purity] || 0;
      if (gA.purity !== gB.purity) base *= g.purityUpUnequalFactor;
      return NOA.mods.chance('gene.purityUp', base, ctx);
    },

    fusionChance(target, ctx) {
      const tier = C().genes[target].tier;
      const base = B().gene.fusion.chanceByTier[tier] || 0;
      return NOA.mods.chance('gene.fusion', base, Object.assign({}, ctx, { fusionTo: target }));
    },

    /** Gene outcome for two breeds -> { gene, carrier } and pushes fx events */
    resolveGene(a, b, ctx, fx) {
      const g = B().gene;
      const fam = ctx.family;
      const ch = G.chances(a, b, ctx);
      const gA = a.gene, gB = b.gene;

      // --- normal + normal
      if (!gA && !gB) {
        let carrier = null;
        if (NOA.FEATURES.recessiveGenes && a.carrier && a.carrier === b.carrier) {
          if (U.chance(ch.recessive)) {
            fx.push({ type: 'recessive', gene: a.carrier });
            fx.push({ type: 'awaken', gene: a.carrier });
            return { gene: { id: a.carrier, purity: 1 }, carrier: null };
          }
          carrier = U.chance(B().recessive.inheritBothCarriers) ? a.carrier : null;
        } else if (NOA.FEATURES.recessiveGenes && (a.carrier || b.carrier)) {
          const c = a.carrier && b.carrier ? U.pick([a.carrier, b.carrier]) : (a.carrier || b.carrier);
          carrier = U.chance(B().recessive.inheritOneCarrier) ? c : null;
        }
        if (ctx.forceGene || U.chance(ch.spawn)) {
          const id = G.spawnGeneId(fam, ctx);
          fx.push({ type: 'awaken', gene: id });
          return { gene: { id, purity: 1 }, carrier: null };
        }
        return { gene: null, carrier };
      }

      // --- gene + gene
      if (gA && gB) {
        if (gA.id === gB.id) {
          if (!U.chance(ch.keepSame)) {
            fx.push({ type: 'geneLost', gene: gA.id });
            return { gene: null, carrier: g.lostGeneBecomesRecessive ? gA.id : null };
          }
          let purity = Math.max(gA.purity, gB.purity);
          const cap = G.purityCap(fam);
          if (purity < g.maxPurity) {
            if (purity >= cap) {
              fx.push({ type: 'purityCapped', gene: gA.id, cap });
            } else if (U.chance(G.purityUpChance(gA, gB, ctx))) {
              purity += 1;
              fx.push({ type: 'purityUp', gene: gA.id, purity });
              if (purity >= g.maxPurity) fx.push({ type: 'super', gene: gA.id });
            }
          }
          return { gene: { id: gA.id, purity }, carrier: null };
        }

        // different genes: try a fusion recipe, then secret recipes, else keep one
        let fused = null;
        const target = G.fusionTarget(gA.id, gB.id);
        if (target) {
          const tier = C().genes[target].tier;
          const allowed = tier <= G.fusionTierAllowed(fam);
          const pure = gA.purity >= g.fusion.minPurity && gB.purity >= g.fusion.minPurity;
          if (!allowed) fx.push({ type: 'fusionLocked', gene: target });
          else if (!pure) fx.push({ type: 'fusionNeedsPurity', gene: target });
          else if (U.chance(G.fusionChance(target, ctx))) fused = target;
        } else {
          fused = NOA.hooks.run('gene.secretFusion', null, { a: gA, b: gB, ctx, fx });
        }
        if (fused) {
          fx.push({ type: 'fusion', gene: fused });
          fx.push({ type: 'awaken', gene: fused });
          return { gene: { id: fused, purity: 1 }, carrier: null };
        }
        const win = G.better(gA, gB);
        if (U.chance(ch.keepDiff)) return { gene: { id: win.id, purity: win.purity }, carrier: null };
        fx.push({ type: 'geneLost', gene: win.id });
        return { gene: null, carrier: g.lostGeneBecomesRecessive ? win.id : null };
      }

      // --- gene + normal
      const one = gA || gB;
      if (U.chance(ch.keepNormal)) {
        const loss = ch.stab ? 0 : g.purityLossWithNormal;
        const purity = Math.max(1, one.purity - loss);
        if (purity < one.purity) fx.push({ type: 'purityDown', gene: one.id, purity });
        return { gene: { id: one.id, purity }, carrier: null };
      }
      fx.push({ type: 'geneLost', gene: one.id });
      return { gene: null, carrier: g.lostGeneBecomesRecessive ? one.id : null };
    },

    /** Merge two seeds or two animals (same species, same level) */
    mergeBreed(a, b, opts) {
      const ctx = G.ctxFor(a, b, 'merge');
      if (opts && opts.forceGene) ctx.forceGene = true;
      const fx = [];
      const m = B().merge;
      const L = a.level;
      let level = L + 1;
      let bt = false;
      if (L + 2 <= m.maxLevel) {
        const p = NOA.mods.chance('merge.breakthrough', m.breakthroughChance[L] || 0, ctx);
        if (p > 0 && U.chance(p)) { level = L + 2; bt = true; fx.push({ type: 'breakthrough', level }); }
      }
      const cap = m.statCapByLevel[level] || 100;
      const stats = {};
      for (const s of I().STATS) {
        const v = (a.stats[s] + b.stats[s]) / 2 + U.randInt(m.statGain[0], m.statGain[1]) + (bt ? m.breakthroughStatBonus : 0);
        stats[s] = U.clamp(Math.round(v), 1, cap);
      }
      const res = G.resolveGene(a, b, ctx, fx);
      const item = I().newBreed(a.species, level, { stats, gene: res.gene, carrier: res.carrier });
      item.revealed = !!(a.revealed || b.revealed);
      const out = NOA.hooks.run('merge.result', { item, fx, a, b, ctx });
      return out;
    },

    /** Merge two products (same product) -> next processed tier, always succeeds */
    mergeProduct(a, b) {
      const ctx = G.ctxFor(a, b, 'product');
      const fx = [];
      const p = C().products[a.product];
      const next = C().species[p.species].products[p.tier];
      let stars = Math.round(((a.stars || 1) + (b.stars || 1)) / 2);
      if (stars < 5 && U.chance(B().product.starUpChanceOnMerge)) { stars += 1; fx.push({ type: 'starUp', stars }); }
      let gene = null;
      const ch = G.chances(a, b, ctx);
      if (a.gene && b.gene) {
        if (a.gene.id === b.gene.id) {
          if (U.chance(ch.keepSame)) gene = { id: a.gene.id, purity: Math.max(a.gene.purity, b.gene.purity) };
          else fx.push({ type: 'geneLost', gene: a.gene.id });
        } else {
          const win = G.better(a.gene, b.gene);
          if (U.chance(ch.keepDiff)) gene = { id: win.id, purity: win.purity };
          else fx.push({ type: 'geneLost', gene: win.id });
        }
      } else if (a.gene || b.gene) {
        const one = a.gene || b.gene;
        if (U.chance(ch.keepNormal)) gene = { id: one.id, purity: Math.max(1, one.purity - B().gene.purityLossWithNormal) };
        else fx.push({ type: 'geneLost', gene: one.id });
      }
      const item = I().newProduct(next, stars, gene);
      return NOA.hooks.run('merge.result', { item, fx, a, b, ctx });
    },

    merge(a, b, opts) {
      return I().isBreed(a) ? G.mergeBreed(a, b, opts) : G.mergeProduct(a, b);
    },

    /** Luck boosters attached to the merging items */
    charmMods(ctx) {
      const out = [];
      for (const c of ctx.charms || []) {
        const b = B().boosters[c];
        if (!b) continue;
        if (b.geneKeepAdd) out.push({ key: 'gene.keep', add: b.geneKeepAdd, src: 'booster', id: c });
        if (b.purityUpAdd) out.push({ key: 'gene.purityUp', add: b.purityUpAdd, src: 'booster', id: c });
        if (b.fusionAdd) out.push({ key: 'gene.fusion', add: b.fusionAdd, src: 'booster', id: c });
        if (b.spawnMult) out.push({ key: 'gene.spawn', mult: b.spawnMult, src: 'booster', id: c });
        if (b.breakthroughAdd) out.push({ key: 'merge.breakthrough', add: b.breakthroughAdd, src: 'booster', id: c });
      }
      return out;
    },

    /** Research labs: bonuses for the family being merged */
    labMods(ctx) {
      if (!ctx.family || !NOA.state) return [];
      const L = G.labData(ctx.family);
      const lv = G.labLevel(ctx.family);
      const src = 'lab', id = G.labId(ctx.family);
      const out = [];
      if (L.success) {
        out.push({ key: 'gene.keep', add: L.success, src, id, lv });
        out.push({ key: 'gene.purityUp', add: L.success, src, id, lv });
        out.push({ key: 'gene.fusion', add: L.success, src, id, lv });
      }
      if (L.spawnAdd) out.push({ key: 'gene.spawn', add: L.spawnAdd, src, id, lv });
      if (L.breakAdd) out.push({ key: 'merge.breakthrough', add: L.breakAdd, src, id, lv });
      if (L.discoveryAdd) out.push({ key: 'hybrid.discovery', add: L.discoveryAdd, src, id, lv });
      if (L.lv2Spawn) out.push({ key: 'gen.lv2', add: L.lv2Spawn, src, id, lv });
      return out;
    }
  };

  Object.assign(G, {

    /**
     * What the player sees while hovering one item over another.
     * Returns rows: { k: i18n key, p: probability|null, params }
     */
    preview(a, b) {
      const rows = [];
      if (!I().canMerge(a, b)) return rows;
      const ctx = G.ctxFor(a, b, I().isBreed(a) ? 'merge' : 'product');
      const ch = G.chances(a, b, ctx);
      if (a.kind === 'product') {
        const p = C().products[a.product];
        rows.push({ k: 'preview.process', p: 1, params: { name: NOA.t('product.' + C().species[p.species].products[p.tier]) } });
        rows.push({ k: 'preview.starUp', p: B().product.starUpChanceOnMerge });
        if (a.gene && b.gene) rows.push({ k: 'preview.keepGene', p: a.gene.id === b.gene.id ? ch.keepSame : ch.keepDiff });
        else if (a.gene || b.gene) rows.push({ k: 'preview.keepGene', p: ch.keepNormal });
        return rows;
      }
      const m = B().merge;
      rows.push({ k: 'preview.levelUp', p: 1, params: { level: a.level + 1 } });
      if (a.level + 2 <= m.maxLevel) {
        const p = NOA.mods.chance('merge.breakthrough', m.breakthroughChance[a.level] || 0, ctx);
        if (p > 0) rows.push({ k: 'preview.breakthrough', p, params: { level: a.level + 2 } });
      }
      const gA = a.gene, gB = b.gene;
      if (!gA && !gB) {
        rows.push({ k: 'preview.newGene', p: ch.spawn });
        if (a.revealed && b.revealed && a.carrier && a.carrier === b.carrier) {
          rows.push({ k: 'preview.recessive', p: ch.recessive, params: { gene: NOA.t('gene.' + a.carrier) } });
        }
      } else if (gA && gB && gA.id === gB.id) {
        rows.push({ k: 'preview.keepGene', p: ch.keepSame });
        const purity = Math.max(gA.purity, gB.purity);
        if (purity < B().gene.maxPurity) {
          if (purity >= G.purityCap(ctx.family)) rows.push({ k: 'preview.purityCapped', p: null, params: { level: G.labLevel(ctx.family) + 1 } });
          else rows.push({ k: 'preview.purityUp', p: G.purityUpChance(gA, gB, ctx), params: { purity: purity + 1 } });
        }
      } else if (gA && gB) {
        const target = G.fusionTarget(gA.id, gB.id);
        if (target) {
          const tier = C().genes[target].tier;
          if (tier > G.fusionTierAllowed(ctx.family)) rows.push({ k: 'preview.fusionLocked', p: null, params: { gene: NOA.t('gene.' + target) } });
          else if (gA.purity < B().gene.fusion.minPurity || gB.purity < B().gene.fusion.minPurity) {
            rows.push({ k: 'preview.fusionNeedsPurity', p: null, params: { purity: B().gene.fusion.minPurity } });
          } else {
            const known = NOA.state && NOA.state.discovered.genes[target];
            rows.push({ k: 'preview.fusion', p: G.fusionChance(target, ctx), params: { gene: known ? NOA.t('gene.' + target) : '???' } });
          }
        }
        rows.push({ k: 'preview.keepOne', p: ch.keepDiff });
      } else {
        rows.push({ k: 'preview.keepGeneNormal', p: ch.keepNormal });
      }
      if (ctx.charms.length) rows.push({ k: 'preview.charms', p: null, params: { list: ctx.charms.map((c) => C().boosters[c].emoji).join(' ') } });
      return rows;
    }
  });

  NOA.mods.register('charms', (ctx) => G.charmMods(ctx));
  NOA.mods.register('labs', (ctx) => G.labMods(ctx));
})();

// ---- js/systems/board.js
/*
 * Board logic: placement, storage overflow, generators, moving / swapping,
 * attaching luck boosters, selling.  No DOM here (the view lives in js/ui/farm-view.js).
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const S = () => NOA.state;
  const U = NOA.util;
  const I = () => NOA.items;

  const BD = NOA.board = {
    combo: { count: 0, last: 0 },
    cols() { return B().board.cols; },
    rows() { return B().board.rows; },
    get(i) { return S().board[i] || null; },
    indexOf(id) { return S().board.findIndex((it) => it && it.id === id); },
    freeCount() { return S().board.filter((x) => !x).length; },
    changed(detail) { NOA.events.emit('board.changed', detail || {}); NOA.save.schedule(); },

    /** Nearest empty cell to `from` (index) by grid distance; null `from` = top-centre */
    nearestEmpty(from) {
      const cols = BD.cols(), rows = BD.rows();
      const origin = from == null ? Math.floor(cols / 2) : from;
      const ox = origin % cols, oy = Math.floor(origin / cols);
      let best = -1, bestD = Infinity;
      for (let i = 0; i < cols * rows; i++) {
        if (S().board[i]) continue;
        const dx = (i % cols) - ox, dy = Math.floor(i / cols) - oy;
        const d = dx * dx + dy * dy + (dy < 0 ? 0.01 : 0);
        if (d < bestD) { bestD = d; best = i; }
      }
      return best;
    },
    place(item, near) {
      const i = BD.nearestEmpty(near);
      if (i < 0) return -1;
      S().board[i] = item;
      BD.changed({ placed: [i] });
      return i;
    },
    /** Board first, storage second. -> { where:'board', index } | { where:'storage' } | null */
    placeOrStore(item, near) {
      const i = BD.place(item, near);
      if (i >= 0) return { where: 'board', index: i };
      if (S().storage.length < S().storageCap) {
        S().storage.push(item);
        NOA.events.emit('storage.changed', {});
        NOA.save.schedule();
        return { where: 'storage' };
      }
      return null;
    },
    hasRoom(n) { return BD.freeCount() + (S().storageCap - S().storage.length) >= (n || 1); },
    remove(i) {
      const it = S().board[i];
      S().board[i] = null;
      BD.changed({ removed: [i] });
      return it;
    },
    move(from, to) {
      if (from === to) return false;
      const a = S().board[from], b = S().board[to];
      S().board[to] = a;
      S().board[from] = b || null;
      BD.changed({ moved: [from, to] });
      return true;
    },
    takeFromStorage(idx) {
      const it = S().storage[idx];
      if (!it) return -1;
      const i = BD.nearestEmpty(null);
      if (i < 0) return -1;
      S().storage.splice(idx, 1);
      S().board[i] = it;
      BD.changed({ placed: [i] });
      NOA.events.emit('storage.changed', {});
      return i;
    },
    toStorage(i) {
      const it = S().board[i];
      if (!it || it.kind === 'generator') return false;
      if (S().storage.length >= S().storageCap) return false;
      S().board[i] = null;
      S().storage.push(it);
      BD.changed({ removed: [i] });
      NOA.events.emit('storage.changed', {});
      return true;
    },

    /* ------------------------------------------------------------ generators */
    spawnPool(family) {
      const w = {};
      const lv = S().level;
      for (const id in C().species) {
        const sp = C().species[id];
        if (sp.family !== family) continue;
        if (sp.hybrid) {
          if (S().discovered.hybrids[id]) w[id] = B().hybrid.hybridSpawnWeight;
        } else if (B().species[id].unlockLevel <= lv) {
          w[id] = B().species[id].spawnWeight;
        }
      }
      return w;
    },
    /** Tap on a generator -> { item, index } or { error } */
    spawn(genIndex) {
      const gen = S().board[genIndex];
      if (!gen || gen.kind !== 'generator') return { error: 'none' };
      const cfg = B().generators[gen.generator];
      const fam = C().generators[gen.generator].family;
      if (BD.freeCount() < 1) return { error: 'full' };
      if (S().res.energy < cfg.energy) return { error: 'energy' };
      NOA.res.spend({ energy: cfg.energy });
      let species = NOA.hooks.run('spawn.species', null, { family: fam, gen: gen.generator });
      if (!species) species = U.pickWeighted(BD.spawnPool(fam));
      const lv2 = NOA.mods.chance('gen.lv2', 0, { family: fam });
      const level = U.chance(lv2) ? 2 : 1;
      const item = I().newBreed(species, level);
      const index = BD.place(item, genIndex);
      S().discovered.species[species] = true;
      NOA.events.emit('item.spawned', { item, index, genIndex, family: fam });
      return { item, index };
    },

    /* ------------------------------------------------------------ boosters */
    /** Attach a luck booster (clover / stabilizer / stardust) or use the loupe on a breed item */
    applyBooster(boosterId, boardIndex) {
      const it = S().board[boardIndex];
      const def = C().boosters[boosterId];
      if (!it || !I().isBreed(it) || !def || def.target !== 'breed') return { error: 'target' };
      if ((S().boosters[boosterId] || 0) < 1) return { error: 'none' };
      if (boosterId === 'loupe') {
        if (it.revealed) return { error: 'already' };
        S().boosters.loupe -= 1;
        it.revealed = true;
        BD.changed({ updated: [boardIndex] });
        NOA.events.emit('booster.used', { id: boosterId, item: it });
        return { ok: true, carrier: it.carrier };
      }
      if (it.charm) return { error: 'charmed' };
      S().boosters[boosterId] -= 1;
      it.charm = boosterId;
      BD.changed({ updated: [boardIndex] });
      NOA.events.emit('booster.used', { id: boosterId, item: it });
      return { ok: true };
    },

    /* ------------------------------------------------------------ merge on the board */
    /** Drag `from` onto `to` -> merge result or null */
    merge(from, to) {
      const a = S().board[to], b = S().board[from];
      if (!I().canMerge(a, b)) return null;
      const first = B().gene.firstGeneAtMerge;
      const breedMerge = I().isBreed(a);
      if (breedMerge) S().stats.breedMerges = (S().stats.breedMerges || 0) + 1;
      const forceGene = breedMerge && first > 0 && !S().flags.firstGene && !a.gene && !b.gene && S().stats.breedMerges >= first;
      const res = NOA.genetics.merge(a, b, { forceGene });
      S().board[from] = null;
      S().board[to] = res.item;
      S().stats.merges += 1;
      const fam = I().family(res.item);
      if (I().isBreed(res.item)) {
        NOA.progress.addXP(B().xp.mergePerLevel * a.level);
        const key = res.item.species;
        S().discovered.maxLevel[key] = Math.max(S().discovered.maxLevel[key] || 0, res.item.level);
      } else {
        S().discovered.products[res.item.product] = true;
      }
      if (res.item.gene) BD.recordGene(res.item.gene.id, res.fx, fam);
      // combo: merges inside the window climb the musical scale (and can unlock a secret)
      const now = Date.now();
      const win = NOA.mods.value('combo.windowMs', B().merge.comboWindowMs, {});
      BD.combo.count = now - BD.combo.last <= win ? BD.combo.count + 1 : 1;
      BD.combo.last = now;
      S().stats.maxCombo = Math.max(S().stats.maxCombo || 0, BD.combo.count);
      res.combo = BD.combo.count;
      BD.changed({ merged: to, from });
      NOA.events.emit('merge.done', { item: res.item, index: to, from, fx: res.fx, family: fam, combo: res.combo });
      return res;
    },
    recordGene(geneId, fx, family) {
      const s = S();
      const awakened = fx && fx.some((f) => f.type === 'awaken');
      if (awakened) s.stats.genesAwakened += 1;
      if (!s.discovered.genes[geneId]) {
        s.discovered.genes[geneId] = true;
        if (!s.flags.firstGene) s.flags.firstGene = true;
        if (family === 'animal' && !s.flags.firstAnimalGene) s.flags.firstAnimalGene = true;
        NOA.res.add('rp', B().gene.firstDiscoveryRP);
        NOA.progress.addXP(B().xp.discovery);
        NOA.events.emit('gene.discovered', { gene: geneId });
      }
    },

    /* ------------------------------------------------------------ selling */
    salePrice(item) {
      const base = I().value(item);
      const m = B().market;
      BD.rollMarketDay();
      const sold = S().market.sold[I().marketKey(item)] || 0;
      const sat = Math.max(m.saturationFloor, 1 - sold * m.saturationStep);
      return Math.max(1, Math.round(base * sat * NOA.mods.value('coins.mult', 1, {})));
    },
    rollMarketDay() {
      const day = NOA.time.dayKey();
      if (S().market.day !== day) { S().market.day = day; S().market.sold = {}; }
    },
    needsConfirm(item) {
      return !!(item.gene || (I().isBreed(item) && item.level >= B().market.confirmSellMinLevel));
    },
    sell(i) {
      const it = S().board[i];
      if (!it || it.kind === 'generator' || it.locked) return null;
      const price = BD.salePrice(it);
      const key = I().marketKey(it);
      S().market.sold[key] = (S().market.sold[key] || 0) + 1;
      BD.remove(i);
      NOA.res.add('coins', price);
      NOA.events.emit('item.sold', { item: it, price, index: i });
      return price;
    },
    toggleLock(i) {
      const it = S().board[i];
      if (!it || it.kind === 'generator') return;
      it.locked = !it.locked;
      BD.changed({ updated: [i] });
    }
  };
})();
