      if (I().family(a) !== L.family(lab) || I().family(b) !== L.family(lab)) return { error: 'family' };
      if (!NOA.res.spend({ coins: B().hybrid.costCoins })) return { error: 'coins' };
      cells[idxA] = null;
      cells[idxB] = null;
      const now = NOA.time.now();
      slots[slotIdx] = { a, b, start: now, end: now + NOA.time.dur(B().hybrid.durationSec) };
      NOA.grids.changed(L.grid(lab), { removed: [idxA, idxB] });
      NOA.events.emit('lab.changed', { lab });
      return { ok: true };
    },
    collectHybrid(lab, slotIdx) {
      const slots = S().labs[lab].slots;
      const job = slots[slotIdx];
      if (!job || NOA.time.now() < job.end) return null;
      if (!NOA.grids.hasRoom(L.grid(lab)) && L.grid(lab) === 'nursery') return { error: 'full' };
      const rec = L.recipe(job.a.species, job.b.species);
      const h = B().hybrid;
      let result;
      if (rec && U.chance(L.discoveryChance(lab))) {
        const fx = [];
        const ctx = NOA.genetics.ctxFor(job.a, job.b, 'hybrid');
        const level = Math.min(job.a.level, job.b.level);
        const cap = B().merge.statCapByLevel[level] + h.vigorBonus;
        const stats = {};
        for (const s of I().STATS) stats[s] = U.clamp(Math.round((job.a.stats[s] + job.b.stats[s]) / 2 + h.vigorBonus), 1, cap);
        const g = NOA.genetics.resolveGene(job.a, job.b, ctx, fx);
        const item = I().newBreed(rec.result, level, { stats, gene: g.gene, carrier: g.carrier });
        const isNew = !S().discovered.hybrids[rec.result];
        S().discovered.hybrids[rec.result] = true;
        S().discovered.species[rec.result] = true;
        if (isNew) {
          S().flags.firstHybrid = true;
          NOA.progress.addXP(B().xp.hybrid);
        }
        if (item.gene) NOA.grids.recordGene(item.gene.id, fx, I().family(item));
        const where = NOA.grids.place(item);
        result = { success: true, item, isNew, species: rec.result, where, fx };
      } else {
        const keep = job.a.level >= job.b.level ? job.a : job.b;
        const where = NOA.grids.place(keep);
        NOA.res.add('rp', h.failRefundRP);
        result = { success: false, item: keep, compatible: !!rec, where, rp: h.failRefundRP };
      }
      slots[slotIdx] = null;
      NOA.events.emit('hybrid.done', Object.assign({ lab }, result));
      NOA.events.emit('lab.changed', { lab });
      NOA.save.schedule();
      return result;
    },
    tick() {
      for (const lab of L.ids) {
        L.syncSlots(lab);
        for (const job of S().labs[lab].slots) {
          if (job && !job._ready && NOA.time.now() >= job.end) {
            job._ready = true;
            NOA.events.emit('lab.changed', { lab, ready: true });
          }
        }
      }
    }
  };
})();

// ---- js/systems/rewards.js
/*
 * Rewards: one grant() used by login days, level-ups, shop, secrets, gacha and payments.
 * Reward shape: { coins, gems, rp, tickets:{sprout,star}, boosters:{id:n}, materials:{id:n}, products:{id:n},
 *                 seeds:[{species,level,gene?,purity?}], animals:[...], vault:n, nursery:n, mascot }
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const S = () => NOA.state;

  const R = NOA.rewards = {
    /** Apply a reward; returns display entries [{ icon, key, n, label? }] */
    grant(r, source) {
      const out = [];
      if (!r) return out;
      const s = S();
      if (r.coins) { NOA.res.add('coins', r.coins); out.push({ icon: '🪙', key: 'res.coins', n: r.coins }); }
      if (r.gems) { NOA.res.add('gems', r.gems); out.push({ icon: '💎', key: 'res.gems', n: r.gems }); }
      if (r.rp) { NOA.res.add('rp', r.rp); out.push({ icon: '🔬', key: 'res.rp', n: r.rp }); }
      for (const t in r.tickets || {}) {
        s.tickets[t] = (s.tickets[t] || 0) + r.tickets[t];
        out.push({ icon: '🎟️', key: 'ticket.' + t, n: r.tickets[t] });
      }
      for (const b in r.boosters || {}) {
        s.boosters[b] = (s.boosters[b] || 0) + r.boosters[b];
        out.push({ icon: C().boosters[b].emoji, key: 'booster.' + b, n: r.boosters[b] });
      }
      for (const m in r.materials || {}) {
        NOA.barn.add(m, r.materials[m], { force: true });
        out.push({ icon: C().materials[m].emoji, key: 'material.' + m, n: r.materials[m] });
      }
      for (const pid in r.products || {}) {
        NOA.barn.add(pid, r.products[pid], { force: true });
        out.push({ icon: C().products[pid].emoji, key: 'product.' + pid, n: r.products[pid] });
      }
      for (const spec of (r.seeds || []).concat(r.animals || [])) {
        const item = R.makeItem(spec);
        const where = NOA.grids.place(item);
        out.push({ icon: NOA.items.emoji(item), key: null, label: NOA.items.name(item) + ' Lv' + item.level, n: 1, item, where });
      }
      if (r.vault) { NOA.grids.expand('vault', r.vault); out.push({ icon: '🌰', key: 'res.vault', n: r.vault }); }
      if (r.nursery) { NOA.grids.expand('nursery', r.nursery); out.push({ icon: '🐣', key: 'res.nursery', n: r.nursery }); }
      if (r.mascot) {
        const m = NOA.mascots.add(r.mascot);
        out.push({ icon: C().mascots[r.mascot].emoji, key: 'mascot.' + r.mascot, n: 1, mascot: m });
      }
      NOA.events.emit('rewards.granted', { source, entries: out });
      NOA.events.emit('res.changed', { k: 'all' });
      NOA.save.schedule();
      return out;
    },
    makeItem(spec) {
      const gene = spec.gene ? { id: spec.gene, purity: spec.purity || 1 } : null;
      return NOA.items.newBreed(spec.species, spec.level || 1, { gene });
    },

    levelReward(level) {
      const t = B().levelRewards[level];
      if (t) return t;
      const f = B().levelRewardFormula;
      const r = { coins: f.coinsBase + f.coinsPerLevel * level, gems: f.gems, materials: { manure: f.manure } };
      if (f.starTicketEvery && level % f.starTicketEvery === 0) r.tickets = { star: 1 };
      return r;
    },

    /* ------------------------------------------------------------ daily login */
    login: {
      days() { return B().login.days; },
      canClaim() { return S().login.lastDay !== NOA.time.dayKey(); },
      /** index of the day that the next claim pays */
      dayIndex() {
        const s = S().login;
        const days = B().login.days.length;
        if (B().login.resetOnMiss && s.lastDay) {
          const y = NOA.time.dayKey(NOA.time.now() - NOA.time.DAY);
          if (s.lastDay !== y && s.lastDay !== NOA.time.dayKey()) return 0;
        }
        return s.claimed % days;
      },
      claim() {
        if (!R.login.canClaim()) return null;
        const idx = R.login.dayIndex();
        const reward = B().login.days[idx];
        const s = S().login;
        if (B().login.resetOnMiss && idx === 0) s.claimed = 0;
        s.claimed += 1;
        s.lastDay = NOA.time.dayKey();
        const granted = R.grant(reward, 'login');
        NOA.events.emit('login.claimed', { day: idx, granted });
        return { day: idx, granted };
      }
    }
  };
})();

// ---- js/systems/shop.js
/*
 * Shop: soft currency (🪙 Xu, earned in game) and hard currency (💎 Ngọc, from top-ups / rewards).
 * Sells Lv1 seeds / young animals of unlocked species, farm supplies and luck items.
 * Real-money packs go through NOA.payment (js/systems/payment.js).
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const S = () => NOA.state;

  const SP = NOA.shop = {
    items() { return B().shop.items; },
    find(id) { return B().shop.items.find((x) => x.id === id) || null; },
    canBuy(id) {
      const it = SP.find(id);
      return !!it && NOA.res.canAfford(it.price) && !SP.maxed(it);
    },
    maxed(it) {
      if (it.grant.vault) return S().vault.cells.length >= B().storage.vaultMax;
      if (it.grant.nursery) return S().nursery.cells.length >= B().storage.nurseryMax;
      return false;
    },
    buy(id) {
      const it = SP.find(id);
      if (!it) return { error: 'unknown' };
      if (SP.maxed(it)) return { error: 'max' };
      if (!NOA.res.spend(it.price)) return { error: 'cost', currency: Object.keys(it.price)[0] };
      const granted = NOA.rewards.grant(it.grant, 'shop');
      NOA.events.emit('shop.bought', { id, granted });
      return { ok: true, granted };
    },

    /* ------------------------------------------------------------ seeds & young animals */
    breedsForSale() {
      return Object.keys(C().species).filter((id) => {
        const sp = C().species[id];
        if (sp.hybrid || !NOA.progress.speciesUnlocked(id)) return false;
        if (sp.bed === 'flower' && !NOA.progress.isUnlocked('flowers')) return false;
        return true;
      });
    },
    breedPrice(species) {
      const eco = B().species[species];
      return eco.seedPrice || eco.buyPrice || 0;
    },
    buyBreed(species) {
      const grid = C().species[species].family === 'plant' ? 'vault' : 'nursery';
      if (!NOA.grids.hasRoom(grid)) return { error: 'room', grid };
      if (!NOA.res.spend({ coins: SP.breedPrice(species) })) return { error: 'cost', currency: 'coins' };
      const item = NOA.items.newBreed(species, 1);
      NOA.grids.place(item);
      NOA.events.emit('shop.bought', { species });
      return { ok: true, item };
    },

    exchange() {
      const ex = B().shop.exchange;
      if (!NOA.res.spend({ gems: ex.gems })) return { error: 'cost', currency: 'gems' };
      const granted = NOA.rewards.grant({ coins: ex.coins }, 'exchange');
      return { ok: true, granted };
    }
  };
})();

// ---- js/systems/payment.js
/*
 * PaymentService — real-money top-ups. NOT LIVE YET: config/payment.js has enabled:false.
 *
 * Flow (identical for every provider):
 *   purchase(sku)
 *     -> adapter.createOrder(product)       server creates an order id
 *     -> adapter.pay(order, product)        store SDK / web checkout
 *     -> adapter.verify(receipt)            server validates the receipt (never trust the client)
 *     -> grant(product, transactionId)      idempotent: a transaction is granted once (ledger)
 *
 * Adding a provider = implementing createOrder / pay / verify / restore in an adapter below.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const P = () => NOA.PAYMENT;
  const S = () => NOA.state;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  async function postJSON(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  const adapters = {
    /* Default: nothing leaves the device. */
    disabled: {
      async createOrder() { const e = new Error('disabled'); e.code = 'disabled'; throw e; }
    },

    /* Dev only: simulates the whole round-trip so the grant / ledger logic can be tested. */
    mock: {
      async createOrder(product) {
        await wait(P().mockDelayMs / 3);
        return { orderId: 'mock_' + Date.now().toString(36), sku: product.sku };
      },
      async pay(order) {
        await wait(P().mockDelayMs / 3);
        if (Math.random() > P().mockSuccessRate) { const e = new Error('cancelled'); e.code = 'cancelled'; throw e; }
        return { orderId: order.orderId, receipt: 'mock-receipt-' + order.orderId };
      },
      async verify(receipt) {
        await wait(P().mockDelayMs / 3);
        return { ok: true, transactionId: 'tx_' + receipt.orderId };
      },
      async restore() { return []; }
    },

    /* Google Play Billing — wire through a Capacitor / Cordova billing plugin when the game ships as an app. */
    googlePlay: {
      async createOrder(product) {
        return postJSON(P().endpoints.createOrder, { sku: product.sku, store: 'googlePlay', productId: product.storeIds.googlePlay });
      },
      async pay(order, product) {
        // TODO: call the billing plugin, e.g. await Billing.purchase({ productId: product.storeIds.googlePlay })
        const e = new Error('not implemented'); e.code = 'not_implemented'; throw e;
      },
      async verify(receipt) { return postJSON(P().endpoints.verifyReceipt, { store: 'googlePlay', receipt }); },
      async restore() { return postJSON(P().endpoints.restore, { store: 'googlePlay' }); }
    },

    /* Apple StoreKit */
    appStore: {
      async createOrder(product) {
        return postJSON(P().endpoints.createOrder, { sku: product.sku, store: 'appStore', productId: product.storeIds.appStore });
      },
      async pay(order, product) {
        // TODO: StoreKit purchase via plugin, e.g. await InAppPurchase.purchase(product.storeIds.appStore)
        const e = new Error('not implemented'); e.code = 'not_implemented'; throw e;
      },
      async verify(receipt) { return postJSON(P().endpoints.verifyReceipt, { store: 'appStore', receipt }); },
      async restore() { return postJSON(P().endpoints.restore, { store: 'appStore' }); }
    },

    /* Web checkout (MoMo / ZaloPay / VNPay / Stripe...) handled by your server */
    web: {
      async createOrder(product) {
        return postJSON(P().endpoints.createOrder, { sku: product.sku, store: 'web', currency: 'VND', amount: product.priceVND });
      },
      async pay(order) {
        // TODO: open order.checkoutUrl (P().links.webCheckout + '?order=' + order.orderId) in a new tab,
        // then poll your server or listen for the return URL before calling verify().
        const e = new Error('not implemented'); e.code = 'not_implemented'; throw e;
      },
      async verify(receipt) { return postJSON(P().endpoints.verifyReceipt, { store: 'web', receipt }); },
      async restore() { return []; }
    }
  };

  const PAY = NOA.payment = {
    adapters,
    provider() {
      const dev = S() && S().dev && S().dev.payProvider;
      return dev || P().provider;
    },
    isLive() {
      const p = PAY.provider();
      return p === 'mock' || (P().enabled && p !== 'disabled');
    },
    products() { return P().products; },
    find(sku) { return P().products.find((p) => p.sku === sku) || null; },
    priceText(product) {
      const lang = NOA.i18n.lang;
      const cur = P().displayCurrency[lang] || 'VND';
      if (cur === 'USD') return '$' + product.priceUSD.toFixed(2);
      return product.priceVND.toLocaleString('vi-VN') + ' ₫';
    },
    owned(sku) { return !!S().purchases.owned[sku]; },
    available(product) {
      if (product.type === 'one_time' && PAY.owned(product.sku)) return false;
      if (product.type === 'subscription' && S().purchases.monthlyUntil > NOA.time.now()) return false;
      return true;
    },
    async purchase(sku) {
      const product = PAY.find(sku);
      if (!product) return { ok: false, code: 'unknown_sku' };
      if (!PAY.available(product)) return { ok: false, code: 'owned' };
      const adapter = adapters[PAY.isLive() ? PAY.provider() : 'disabled'];
      NOA.events.emit('payment.started', { sku });
      try {
        const order = await adapter.createOrder(product);
        const receipt = await adapter.pay(order, product);
        const verified = await adapter.verify(receipt);
        if (!verified || !verified.ok) return PAY.fail(sku, 'verify_failed');
        return PAY.grant(product, verified.transactionId);
      } catch (e) {
        return PAY.fail(sku, e.code || 'error', e);
      }
    },
    fail(sku, code, err) {
      if (err && code !== 'disabled') console.warn('[NOA payment]', err);
      NOA.events.emit('payment.failed', { sku, code });
      return { ok: false, code };
    },
    /** Idempotent grant keyed by transaction id */
    grant(product, transactionId) {
      const s = S();
      if (s.ledger.some((t) => t.tx === transactionId)) return { ok: true, duplicate: true };
      s.ledger.push({ tx: transactionId, sku: product.sku, at: NOA.time.now(), provider: PAY.provider() });
      const reward = Object.assign({}, product.grant);
      if (product.bonus) reward.gems = (reward.gems || 0) + product.bonus;
      if (product.type === 'one_time') s.purchases.owned[product.sku] = true;
      if (product.type === 'subscription') s.purchases.monthlyUntil = NOA.time.now() + product.durationDays * NOA.time.DAY;
      const granted = NOA.rewards.grant(reward, 'payment');
      NOA.events.emit('payment.completed', { sku: product.sku, granted });
      NOA.save.schedule();
      return { ok: true, granted };
    },
    /** Monthly card daily claim */
    monthly: {
      active() { return S().purchases.monthlyUntil > NOA.time.now(); },
      canClaim() { return PAY.monthly.active() && S().purchases.monthlyLastDay !== NOA.time.dayKey(); },
      claim() {
        if (!PAY.monthly.canClaim()) return null;
        const p = P().products.find((x) => x.type === 'subscription');
        S().purchases.monthlyLastDay = NOA.time.dayKey();
        return NOA.rewards.grant(p.daily, 'monthly');
      }
    },
    async restore() {
      const adapter = adapters[PAY.isLive() ? PAY.provider() : 'disabled'];
      if (!adapter.restore) return { ok: false, code: 'disabled' };
      try { return { ok: true, items: await adapter.restore() }; } catch (e) { return { ok: false, code: e.code || 'error' }; }
    }
  };
})();

// ---- js/systems/gacha.js
/*
 * Blindbox (gacha): rarity roll with pity counters, x10 guarantee, reward pools,
 * and a rate-disclosure table computed straight from config/balance.js.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const S = () => NOA.state;
  const U = NOA.util;
  const I = () => NOA.items;

  const order = () => B().gacha.rarityOrder;
  const rIdx = (r) => order().indexOf(r);

  const GA = NOA.gacha = {
    box(id) { return B().gacha.boxes[id]; },
    state(id) {
      const s = S().gacha;
      if (!s[id]) s[id] = { opened: 0, since: {} };
      return s[id];
    },
    isUnlocked(id) { return NOA.progress.isUnlocked(C().boxes[id].unlock); },

    /** Cost for opening `count`: tickets first, otherwise currency (x10 discounted) */
    cost(id, count) {
      const box = GA.box(id);
      const tickets = S().tickets[box.ticket] || 0;
      if (tickets >= count) return { tickets: { [box.ticket]: count } };
      const mult = count > 1 ? box.multi.costMult : 1;
      const out = {};
      for (const k in box.cost) out[k] = box.cost[k] * mult;
      return out;
    },
    canOpen(id, count) {
      if (!GA.isUnlocked(id)) return { ok: false, reason: 'locked' };
      const cost = GA.cost(id, count);
      if (!NOA.res.canAfford(cost)) return { ok: false, reason: 'cost', cost };
      return { ok: true, cost };
    },

    /* ------------------------------------------------------------ rolling */
    forcedMin(id) {
      const box = GA.box(id), st = GA.state(id);
      let min = -1;
      for (const r in box.pity || {}) {
        if ((st.since[r] || 0) + 1 >= box.pity[r]) min = Math.max(min, rIdx(r));
      }
      return min;
    },
    rollRarity(id, minIdx) {
      const box = GA.box(id);
      const w = {};
      for (const r of order()) {
        const wt = box.rarityWeights[r] || 0;
        const pool = box.pool[r] || {};
        if (wt > 0 && Object.keys(pool).length && rIdx(r) >= (minIdx || 0)) w[r] = wt;
      }
      let r = U.pickWeighted(w);
      if (!r) {
        // nothing at or above the forced floor has weight: take the lowest non-empty rarity above it
        r = order().find((x, i) => i >= minIdx && Object.keys(box.pool[x] || {}).length) || order()[0];
      }
      return r;
    },
    updatePity(id, rarity) {
      const box = GA.box(id), st = GA.state(id);
      for (const r in box.pity || {}) {
        if (rIdx(rarity) >= rIdx(r)) st.since[r] = 0;
        else st.since[r] = (st.since[r] || 0) + 1;
      }
    },
    /** Pure roll (no granting) — used by open() and by the simulator */
    roll(id, count) {
      const box = GA.box(id);
      const rarities = [];
      for (let i = 0; i < count; i++) {
        let min = GA.forcedMin(id);
        const isLast = i === count - 1;
        if (count > 1 && isLast && box.multi && box.multi.guaranteeMinRarity) {
          const g = rIdx(box.multi.guaranteeMinRarity);
          if (!rarities.some((r) => rIdx(r) >= g)) min = Math.max(min, g);
        }
        const r = GA.rollRarity(id, min);
        GA.updatePity(id, r);
        rarities.push(r);
      }
      return rarities.map((r) => ({ rarity: r, reward: U.pickWeighted(box.pool[r]) }));
    },
    open(id, count) {
      const can = GA.canOpen(id, count);
      if (!can.ok) return can;
      NOA.res.spend(can.cost);
      const rolls = GA.roll(id, count);
      const st = GA.state(id);
      st.opened += count;
      S().stats.opens += count;
      const results = rolls.map((r) => Object.assign({ rarity: r.rarity, rewardId: r.reward }, GA.apply(r.reward)));
      NOA.events.emit('gacha.opened', { box: id, count, results });
      NOA.save.schedule();
      return { ok: true, results };
    },

    /* ------------------------------------------------------------ rewards */
    randomSpecies(family) {
      const w = {};
      for (const id in C().species) {
        const sp = C().species[id];
        if (sp.family === family && !sp.hybrid && NOA.progress.speciesUnlocked(id)) w[id] = B().gacha.speciesWeights[id] || 0;
      }
      return U.pickWeighted(w);
    },
    randomGene(family, tier) {
      const ids = Object.keys(C().genes).filter((g) => C().genes[g].family === family && C().genes[g].tier === tier && !C().genes[g].secret);
      if (tier === 1) {
        const w = {};
        ids.forEach((g) => { w[g] = B().gene.spawnWeights[family][g] || 1; });
        return U.pickWeighted(w);
      }
      return U.pick(ids);
    },
    apply(rewardId) {
      const def = B().gacha.rewards[rewardId];
      if (def.type === 'seed' || def.type === 'animal') {
        const fam = def.type === 'seed' ? 'plant' : 'animal';
        const species = GA.randomSpecies(fam);
        const level = U.randInt(def.level[0], def.level[1]);
        let gene = null;
        if (def.geneTier) {
          const p = def.purity || [1, 1];
          gene = { id: GA.randomGene(fam, def.geneTier), purity: U.randInt(p[0], p[1]) };
        }
        const item = I().newBreed(species, level, { gene });
        S().discovered.species[species] = true;
        const isNewGene = gene && !S().discovered.genes[gene.id];
        if (gene) NOA.grids.recordGene(gene.id, [], fam);
        const where = NOA.grids.place(item);
        let refund = 0;
        if (where === -1) {   // grid full: pay the item's value instead of losing it
          refund = I().breedValue(item) * 2;
          NOA.res.add('coins', refund);
        }
        return { type: 'item', item, where, refund, isNew: !!isNewGene };
      }
      if (def.type === 'material') {
        NOA.barn.add(def.id, def.qty, { force: true });
        return { type: 'material', id: def.id, qty: def.qty };
      }
      if (def.type === 'booster') {
        S().boosters[def.id] = (S().boosters[def.id] || 0) + def.qty;
        return { type: 'booster', id: def.id, qty: def.qty };
      }
      if (def.type === 'currency') {
        const entries = NOA.rewards.grant({ coins: def.coins, gems: def.gems }, 'gacha');
        return { type: 'currency', entries };
      }
      if (def.type === 'mascot') {
        const id = U.pickWeighted(B().gacha.mascotPools[def.pool]);
        const res = NOA.mascots.add(id);
        return { type: 'mascot', id, res, isNew: res.isNew };
      }
      return { type: 'none' };
    },

    /* ------------------------------------------------------------ rate disclosure */
    rates(id) {
      const box = GA.box(id);
      const tot = U.sum(order().map((r) => (Object.keys(box.pool[r] || {}).length ? box.rarityWeights[r] || 0 : 0)));
      return order().filter((r) => (box.rarityWeights[r] || 0) > 0 && Object.keys(box.pool[r] || {}).length).map((r) => {
        const p = (box.rarityWeights[r] || 0) / tot;
        const pool = box.pool[r];
        const pt = U.sum(Object.values(pool));
        return {
          rarity: r,
          p,
          entries: Object.keys(pool).map((rid) => ({ rewardId: rid, p: p * pool[rid] / pt }))
        };
      });
    },
    pityLeft(id) {
      const box = GA.box(id), st = GA.state(id);
      const out = [];
      for (const r in box.pity || {}) out.push({ rarity: r, left: box.pity[r] - (st.since[r] || 0) });
      return out;
    }
  };
})();

/*
 * Mascots (linh vật): temporary ones buff for a duration (duplicates stack time);
 * permanent ones work while placed in the shrine (duplicates add stars).
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const S = () => NOA.state;

  const M = NOA.mascots = {
    def(id) { return C().mascots[id]; },
    stars(id) { const o = S().mascots.owned[id]; return o ? o.stars : 0; },
    tempRemaining(id) { return Math.max(0, (S().mascots.temp[id] || 0) - NOA.time.now()); },
    isActive(id) {
      const d = M.def(id);
      if (!d) return false;
      if (d.type === 'temp') return M.tempRemaining(id) > 0;
      return S().mascots.shrine.indexOf(id) >= 0;
    },
    add(id) {
      const d = M.def(id);
      const s = S().mascots;
      const isNew = !S().discovered.mascots[id];
      S().discovered.mascots[id] = true;
      if (d.type === 'temp') {
        const now = NOA.time.now();
        const minutes = B().mascots.durationMin[id] || 10;
        s.temp[id] = Math.max(now, s.temp[id] || 0) + NOA.time.dur(minutes * 60);
        NOA.events.emit('mascots.changed', { id });
        return { isNew, type: 'temp', minutes };
      }
      const owned = s.owned[id];
      if (!owned) {
        s.owned[id] = { stars: 1 };
        const free = s.shrine.indexOf(null);
        if (free >= 0) s.shrine[free] = id;
        NOA.events.emit('mascots.changed', { id });
        return { isNew: true, type: 'perm', stars: 1, placed: free >= 0 };
      }
      const max = B().gacha.duplicatePerm.maxStars;
      if (owned.stars < max) {
        owned.stars += 1;
        NOA.events.emit('mascots.changed', { id });
        return { isNew, type: 'perm', stars: owned.stars, starUp: true };
      }
      const gems = B().gacha.duplicatePerm.overflowGems;
      NOA.res.add('gems', gems);
      return { isNew, type: 'perm', stars: owned.stars, overflowGems: gems };
    },
    place(id, slot) {
      const s = S().mascots;
      if (!s.owned[id] || slot < 0 || slot >= s.shrine.length) return false;
      const cur = s.shrine.indexOf(id);
      if (cur >= 0) s.shrine[cur] = null;
      s.shrine[slot] = id;
      NOA.events.emit('mascots.changed', {});
      NOA.save.schedule();
      return true;
    },
    unplace(slot) {
      S().mascots.shrine[slot] = null;
      NOA.events.emit('mascots.changed', {});
      NOA.save.schedule();
    },
    /** Effects of every active mascot with star scaling */
    activeMods() {
      const out = [];
      const eff = B().mascots.effects;
      const push = (id, stars) => {
        for (const e of eff[id] || []) {
          const extra = (e.perStar || 0) * Math.max(0, stars - 1);
          const m = { key: e.key, src: 'mascot', id };
          if (e.mult != null) m.mult = e.mult + extra;
          if (e.add != null) m.add = e.add + extra;
          out.push(m);
        }
      };
      for (const id in S().mascots.temp) if (M.tempRemaining(id) > 0) push(id, 1);
      for (const id of S().mascots.shrine) if (id) push(id, M.stars(id));
      return out;
    },
    tick() {
      const t = S().mascots.temp;
      for (const id in t) {
        if (t[id] <= NOA.time.now()) {
          delete t[id];
          NOA.events.emit('mascot.expired', { id });
          NOA.events.emit('mascots.changed', {});
        }
      }
    }
  };

  NOA.mods.register('mascots', () => (NOA.state ? M.activeMods() : []));
})();

/*
 * World: real-time day / night, deterministic weather slots, rainbow after rain,
 * real lunar phase (full-moon nights) and real meteor-shower dates.
 * Everything here feeds NOA.mods so genes respond to the sky.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const S = () => NOA.state;
  const WEATHERS = ['sunny', 'cloudy', 'rain', 'storm'];

  const mdToNum = (md) => { const [m, d] = md.split('-').map(Number); return m * 100 + d; };
  const inWindow = (md, start, end) => {
    const x = mdToNum(md), a = mdToNum(start), b = mdToNum(end);
    return a <= b ? x >= a && x <= b : x >= a || x <= b;
  };

  const W = NOA.world = {
    slotMs() { return B().world.weather.slotMinutes * 60000; },
    weatherAt(ts) {
      const w = Object.assign({}, B().world.weather.weights);
      // read mascot weather mods directly: going through NOA.mods would recurse into this provider
      if (S() && NOA.mascots) {
        for (const m of NOA.mascots.activeMods()) if (m.key === 'weather.rain' && m.mult) w.rain *= m.mult;
      }
      const slot = Math.floor(ts / W.slotMs());
      let total = 0;
      for (const k of WEATHERS) total += Math.max(0, w[k] || 0);
      let r = NOA.rng.hash(slot * 7919 + 17) * total;
      for (const k of WEATHERS) {
        const v = Math.max(0, w[k] || 0);
        if (r < v) return k;
        r -= v;
      }
      return 'sunny';
    },
    weather() {
      if (!NOA.FEATURES.weather) return 'sunny';
      const f = S() && S().dev.force && S().dev.force.weather;
      return f || W.weatherAt(NOA.time.now());
    },
    rainbow() {
      if (!NOA.FEATURES.weather) return false;
      const f = S() && S().dev.force;
      if (f && f.rainbow != null) return !!f.rainbow;
      const now = NOA.time.now();
      const slotStart = Math.floor(now / W.slotMs()) * W.slotMs();
      if (now - slotStart > B().world.weather.rainbowMinutes * 60000) return false;
      const prev = W.weatherAt(slotStart - 1);
      return W.weather() === 'sunny' && (prev === 'rain' || prev === 'storm') && !NOA.time.isNight();
    },
    fullMoonNight() {
      return NOA.FEATURES.realSkyEvents && NOA.time.isNight() && NOA.time.isFullMoon();
    },
    /** Active meteor shower tonight -> { id, peak } | null */
    meteor() {
      if (!NOA.FEATURES.realSkyEvents) return null;
      const f = S() && S().dev.force;
      if (f && f.meteor) return { id: 'orionids', peak: true, forced: true };
      if (!NOA.time.isNight()) return null;
      const md = NOA.time.md();
      for (const sh of C().meteorShowers) {
        if (inWindow(md, sh.start, sh.end)) {
          const peakDiff = Math.abs(mdToNum(md) - mdToNum(sh.peak));
          return { id: sh.id, peak: peakDiff <= B().world.meteor.peakWindowDays };
        }
      }
      return null;
    },
    specialDay() {
      const md = NOA.time.md();
      const d = C().specialDays.find((x) => x.date === md);
      return d ? d.id : null;
    },
    sky() {
      return {
        phase: NOA.time.phase(),
        night: NOA.time.isNight(),
        weather: W.weather(),
        rainbow: W.rainbow(),
        moon: NOA.time.moonEmoji(),
        fullMoon: W.fullMoonNight(),
        meteor: W.meteor(),
        earth: S() ? S().earth : 0
      };
    },
    mods(ctx) {
      const out = [];
      if (!S()) return out;
      const wx = W.weather();
      const eff = B().world.weather.effects[wx] || {};
      if (eff.plantTimeMult && eff.plantTimeMult !== 1) out.push({ key: 'plant.timeMult', mult: eff.plantTimeMult, src: 'weather', id: wx });
      for (const g in eff.geneWeights || {}) out.push({ key: 'geneWeight.' + g, mult: eff.geneWeights[g], src: 'weather', id: wx });
      if (W.fullMoonNight()) {
        const m = B().world.moon;
        out.push({ key: 'geneWeight.lunar', mult: m.lunarWeightMult, src: 'event', id: 'fullmoon' });
        out.push({ key: 'gene.spawn', mult: m.spawnMult, src: 'event', id: 'fullmoon' });
      }
      if (ctx && ctx.fusionTo === 'rainbow' && W.rainbow()) {
        out.push({ key: 'gene.fusion', mult: B().world.weather.rainbowFusionMult, src: 'event', id: 'rainbow' });
      }
      if (ctx && ctx.fusionTo === 'stellar' && W.meteor()) {
        out.push({ key: 'gene.fusion', mult: B().world.meteor.stellarFusionMult, src: 'event', id: 'meteor' });
      }
      return out;
    }
  };

  NOA.mods.register('world', (ctx) => W.mods(ctx));
})();

// ---- js/systems/secrets.js
/*
 * Secrets: hidden triggers players discover by themselves.
 * Each secret unlocks once, grants balance.secrets.rewards[id] and shows up in the Codex.
 * Hints for undiscovered secrets are deliberately vague (i18n: secret.<id>.hint).
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const S = () => NOA.state;
  const U = NOA.util;

  let beanTaps = [];
  let lastCheck = 0;

  const SE = NOA.secrets = {
    ids() { return Object.keys(NOA.CONTENT.secrets); },
    isFound(id) { return !!(S() && S().secrets[id]); },
    count() { return SE.ids().filter(SE.isFound).length; },
    unlock(id) {
      if (!NOA.FEATURES.secrets || SE.isFound(id)) return null;
      S().secrets[id] = NOA.time.now();
      const reward = B().secrets.rewards[id];
      const granted = reward ? NOA.rewards.grant(reward, 'secret') : [];
      if (id === 'bean') S().flags.bean = true;
      NOA.events.emit('secret.unlocked', { id, granted });
      NOA.save.schedule();
      return granted;
    },

    /* ------------------------------------------------------------ player actions */
    catchMeteor() {
      const m = B().world.meteor;
      const reward = U.chance(m.stardustChance) ? { boosters: { stardust: 1 } } : { gems: m.gemReward };
      const granted = NOA.rewards.grant(reward, 'meteor');
      SE.unlock('meteor');
      return granted;
    },
    catchFirefly() {
      if (!SE.isFound('firefly')) return SE.unlock('firefly');
      return NOA.rewards.grant(B().secrets.rewards.fireflyRepeat, 'firefly');
    },
    tapBean() {
      const now = Date.now();
      const cfg = B().secrets;
      beanTaps = beanTaps.filter((t) => now - t < cfg.beanTapWindowMs);
      beanTaps.push(now);
      if (beanTaps.length >= cfg.beanTaps) {
        beanTaps = [];
        return SE.unlock('bean') || 'again';
      }
      return null;
    },
    rename(name) {
      const s = S();
      s.farmName = String(name || '').slice(0, 24);
      NOA.events.emit('farm.renamed', { name: s.farmName });
      const norm = s.farmName.trim().toLowerCase();
      if (B().secrets.renameWords.some((w) => norm === w)) SE.unlock('rename');
      NOA.save.schedule();
    },

    /* ------------------------------------------------------------ periodic checks */
    tick() {
      if (!NOA.FEATURES.secrets) return;
      const now = Date.now();
      if (now - lastCheck < 2000) return;
      lastCheck = now;
      if (NOA.world.fullMoonNight()) SE.unlock('fullmoon');
      if (NOA.world.rainbow()) SE.unlock('rainbow');
      if (NOA.world.specialDay()) SE.unlock('earthday');
    },

    init() {
      // ⚡ Lôi Vũ / 🐅 Bạch Hổ: secret fusions for pairs that have no normal recipe
      NOA.hooks.add('gene.secretFusion', (found, info) => {
        if (found || !NOA.FEATURES.secrets) return found;
        const ids = [info.a.id, info.b.id].sort().join('+');
        const cfg = B().secrets;
        if (ids === 'blaze+crystal' && NOA.world.weather() === 'storm' && U.chance(cfg.thunderChance)) {
          setTimeout(() => SE.unlock('thunder'), 0);
          return 'thunder';
        }
        if (ids === 'phoenix+tortoise' && NOA.time.isNight() && (NOA.time.isFullMoon() || NOA.world.meteor()) && U.chance(cfg.whiteTigerChance)) {
          setTimeout(() => SE.unlock('whitetiger'), 0);
          return 'whitetiger';
        }
        return found;
      });
      NOA.events.on('merge.done', (e) => {
        if (e.fx && e.fx.some((f) => f.type === 'recessive')) SE.unlock('mendel');
        if (e.combo >= B().secrets.octaveCombo) SE.unlock('octave');
      });
      NOA.events.on('hybrid.done', (e) => {
        if (e.fx && e.fx.some((f) => f.type === 'recessive')) SE.unlock('mendel');
      });
      NOA.events.on('harvest.clover', () => SE.unlock('clover4'));
    }
  };
})();

// ---- js/systems/essence.js
/*
 * Gene Essence (Tinh chất gen) — EXTENSION MODULE, disabled by default (config/features.js).
 * Shows how a new feature plugs in without touching the core:
 *   - hooks 'item.actions'   : adds "Decompose gene" to the item card
 *   - hooks 'labs.sections'  : adds an "Inject gene" panel to each lab
 *   - numbers live in balance.essence
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const S = () => NOA.state;
  const I = () => NOA.items;

  const E = NOA.essence = {
    enabled() {
      const dev = S() && S().dev.features;
      return !!(dev && dev.geneEssence != null ? dev.geneEssence : NOA.FEATURES.geneEssence);
    },
    amount(geneId) { return (S().essence || {})[geneId] || 0; },
    yieldOf(item) {
      if (!item || !item.gene) return 0;
      const tier = C().genes[item.gene.id].tier;
      return (B().essence.decomposeYield[tier] || [])[item.gene.purity] || 0;
    },
    decompose(ref) {
      const it = S()[ref.grid].cells[ref.index];
      if (!E.enabled() || !it || !it.gene || it.locked) return null;
      const n = E.yieldOf(it);
      S().essence[it.gene.id] = E.amount(it.gene.id) + n;
      NOA.grids.remove(ref.grid, ref.index);
      NOA.events.emit('essence.changed', { gene: it.gene.id, n });
      return { gene: it.gene.id, n };
    },
    injectCost(geneId) { return B().essence.injectCost[C().genes[geneId].tier]; },
    canInject(item, geneId) {
      return E.enabled() && I().isBreed(item) && !item.gene && !item.locked &&
        C().genes[geneId].family === I().family(item) && E.amount(geneId) >= E.injectCost(geneId);
    },
    inject(ref, geneId) {
      const it = S()[ref.grid].cells[ref.index];
      if (!E.canInject(it, geneId)) return null;
      S().essence[geneId] -= E.injectCost(geneId);
      const tier = C().genes[geneId].tier;
      const ok = NOA.util.chance(B().essence.injectChance[tier]);
      if (ok) {
        it.gene = { id: geneId, purity: 1 };
        it.carrier = null;
        NOA.grids.recordGene(geneId, [{ type: 'awaken', gene: geneId }], I().family(it));
      }
      NOA.grids.changed(ref.grid, { updated: [ref.index] });
      NOA.events.emit('essence.changed', { gene: geneId });
      return { ok };
    },

    init() {
      NOA.hooks.add('item.actions', (actions, item, ref) => {
        if (!E.enabled() || !item || !item.gene || !ref) return actions;
        actions.push({
          id: 'decompose',
          label: NOA.t('essence.decompose', { n: E.yieldOf(item) }),
          kind: 'ghost',
          run() {
            const r = E.decompose(ref);
            if (r) NOA.ui.toast(NOA.t('essence.decomposed', { n: r.n, gene: I().geneName(r.gene) }));
          }
        });
        return actions;
      });
      NOA.hooks.add('labs.sections', (sections, lab) => {
        if (!E.enabled()) return sections;
        sections.push({ id: 'essence', render: (el) => E.renderLab(el, lab) });
        return sections;
      });
    },

    /** Lab panel: owned essences + inject onto a picked board item */
    renderLab(el, lab) {
      const h = NOA.ui.h;
      const fam = NOA.labs.family(lab);
      const genes = Object.keys(C().genes).filter((g) => C().genes[g].family === fam && E.amount(g) > 0);
      el.append(h('h3', { class: 'lab-sub' }, NOA.t('essence.title')));
      if (!genes.length) {
        el.append(h('p', { class: 'muted' }, NOA.t('essence.empty')));
        return;
      }
      const row = h('div', { class: 'essence-row' });
      genes.forEach((g) => {
        const btn = h('button', { class: 'chip-btn', type: 'button' },
          C().genes[g].emoji + ' ' + I().geneName(g) + ' × ' + E.amount(g));
        btn.addEventListener('click', () => {
          const grid = NOA.labs.grid(lab);
          const cands = [];
          S()[grid].cells.forEach((it, i) => { if (E.canInject(it, g)) cands.push(i); });
          if (!cands.length) { NOA.ui.toast(NOA.t('essence.noTarget', { n: E.injectCost(g) })); return; }
          const r = E.inject({ grid, index: cands[0] }, g);
          NOA.ui.toast(NOA.t(r && r.ok ? 'essence.injected' : 'essence.injectFail', { gene: I().geneName(g) }));
          NOA.events.emit('lab.changed', { lab });
        });
        row.append(btn);
      });
      el.append(row);
    }
  };
})();

      for (const k in attrs) {
        const v = attrs[k];

        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'on') { for (const ev in v) el.addEventListener(ev, v[ev]); }
        else if (k === 'data') { for (const d in v) if (v[d] != null) el.dataset[d] = v[d]; }
        else if (k === 'style') {
          if (typeof v === 'string') el.style.cssText = v;
          else for (const s in v) el.style.setProperty(s, v[s]);
        } else if (k === 'hidden') el.hidden = true;
        else if (typeof v === 'boolean') { if (k in el) el[k] = v; else el.setAttribute(k, ''); }
        else el.setAttribute(k, v);
      }
    }
    for (let i = 2; i < arguments.length; i++) UI.append(el, arguments[i]);
    return el;
  };
  UI.append = function (el, kid) {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach((k) => UI.append(el, k)); return; }

  /* ------------------------------------------------------------ formatting */

    for (const k in r.products || {}) out.push({ icon: C().products[k].emoji, n: r.products[k], label: t('product.' + k) });

  /** entries from NOA.rewards.grant or UI.rewardPreview -> chips */
  UI.rewardChips = function (entries) {

    (entries || []).forEach((e, i) => {

  UI.itemArt = function (item, opts) {

    if (gene) { cls.push('has-gene', 'gt-' + gene.tier); style['--gc'] = gene.color; }
    if (I().isSuper(item)) cls.push('is-super');
    if (item.locked) cls.push('locked-item');
    if (item.kind === 'animal') style['--as'] = String(0.72 + 0.07 * item.level);
    if (opts.size) style['--sz'] = opts.size + 'px';
    const el = UI.h('div', { class: cls.join(' '), style });
    if (item.kind === 'seed') el.append(UI.h('span', { class: 'sack' }));
    if (item.kind === 'animal') el.append(UI.h('span', { class: 'tuft' }));
    el.append(UI.h('span', { class: 'emo' }, I().emoji(item)));
    const e2 = I().emoji2(item);
    if (e2) el.append(UI.h('span', { class: 'emo2' }, e2));
    if (opts.badges === false) return el;
    if (I().isBreed(item)) el.append(UI.h('span', { class: 'b-lv' }, item.level));
    if (gene) el.append(UI.h('span', { class: 'b-gene' }, gene.emoji));
    else if (item.revealed && item.carrier) el.append(UI.h('span', { class: 'b-carrier', title: t('item.carrier', { gene: t('gene.' + item.carrier) }) }, C().genes[item.carrier].emoji));
    if (item.charm) el.append(UI.h('span', { class: 'b-charm' }, C().boosters[item.charm].emoji));
    if (item.locked) el.append(UI.h('span', { class: 'b-lock' }, '🔒'));
    return el;
  };

  /** Barn goods (product / material stack): emoji + stars + gene badge */
  UI.goodArt = function (pid, stars, gene, opts) {
    opts = opts || {};
    const g = gene ? C().genes[gene.id] : null;
    const style = {};
    if (g) style['--gc'] = g.color;
    if (opts.size) style['--sz'] = opts.size + 'px';
    const el = UI.h('div', { class: 'art art--good' + (g ? ' has-gene gt-' + g.tier : ''), style },
      UI.h('span', { class: 'emo' }, I().goodEmoji(pid)));
    if (opts.badges === false) return el;
    if ((stars || 1) > 1) el.append(UI.h('span', { class: 'b-st' }, stars + '★'));
    if (g) el.append(UI.h('span', { class: 'b-gene' }, g.emoji));
    return el;
  };

  /* ------------------------------------------------------------ toasts */
  UI.toast = function (msg, kind) {
    const root = document.getElementById('toasts');
    if (!root) return;
    const el = UI.h('div', { class: 'toast' + (kind ? ' toast--' + kind : ''), role: 'status' }, msg);
    root.append(el);
    while (root.children.length > 3) root.firstChild.remove();
    setTimeout(() => el.classList.add('out'), 2400);
    setTimeout(() => el.remove(), 2800);
  };

  /* ------------------------------------------------------------ modals */
  const stack = [];
  UI.modal = function (opts) {
    const root = document.getElementById('modals');
    let closed = false;
    const close = () => {
      if (closed) return;
      closed = true;
      const i = stack.indexOf(api);
      if (i >= 0) stack.splice(i, 1);
      wrap.classList.add('closing');
      setTimeout(() => wrap.remove(), 180);
      NOA.audio.play('close');
      if (opts.onClose) opts.onClose();
    };
    const body = UI.h('div', { class: 'modal-body' });
    const dismissable = opts.dismissable !== false;
    const card = UI.h('div', { class: 'modal ' + (opts.cls || ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.title || '' },
      opts.title ? UI.h('div', { class: 'modal-title' }, UI.h('h2', null, opts.title)) : null,
      dismissable ? UI.h('button', { type: 'button', class: 'btn-icon modal-x', 'aria-label': t('ui.close'), on: { click: close } }, '✕') : null,
      body);
    if (opts.actions && opts.actions.length) {
      const acts = UI.h('div', { class: 'modal-actions' });
      opts.actions.forEach((a) => {
        acts.append(UI.btn(a.label, a.kind || 'ghost', () => {
          if (a.onClick) a.onClick(close);
          if (!a.keepOpen) close();
        }, { disabled: !!a.disabled }));
      });
      card.append(acts);
    }
    const wrap = UI.h('div', { class: 'modal-wrap' },
      UI.h('div', { class: 'modal-bg', on: { click: () => { if (dismissable) close(); } } }), card);
    const api = { el: card, body, close };
    if (typeof opts.body === 'function') opts.body(body, api);
    else if (opts.body) body.append(opts.body);
    root.append(wrap);
    stack.push(api);
    NOA.audio.play('open');
    const focusable = card.querySelector('.modal-actions .btn, .btn');
    if (focusable) setTimeout(() => { try { focusable.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 50);
    return api;
  };
  UI.closeTopModal = () => { const top = stack[stack.length - 1]; if (top) top.close(); };
  UI.hasModal = () => stack.length > 0;

  /* ------------------------------------------------------------ app skeleton & screens */
  UI.screens = {};
  UI.current = 'farm';
  const TABS = [
    { id: 'farm', icon: '🌾' },
    { id: 'orders', icon: '📋' },
    { id: 'breed', icon: '🧬' },
    { id: 'barn', icon: '📦' },
    { id: 'shop', icon: '🛒' }
  ];
  // screens without a tab button (opened from buildings / the HUD)
  const EXTRA = ['codex'];

  UI.mount = function () {
    const app = document.getElementById('app');
    UI.clear(app);
    app.className = 'app';
    app.append(
      UI.h('header', { class: 'hud-bar', id: 'hud' }),
      UI.h('main', { class: 'screens', id: 'screens' },
        TABS.map((tb) => tb.id).concat(EXTRA).map((id) => UI.h('section', { class: 'screen scr-' + id, id: 'scr-' + id, hidden: id !== UI.current, 'aria-label': t('tab.' + id) }))),
      UI.h('nav', { class: 'tabbar', id: 'tabbar', 'aria-label': 'Menu' })
    );
    const ensure = (id, tag) => {
      if (!document.getElementById(id)) document.body.append(UI.h(tag || 'div', { id }));
    };
    ensure('modals');
    ensure('toasts');
    ensure('fx-canvas', 'canvas');
    ensure('fx-layer');
    ensure('overlays');
    UI.renderTabs();
  };
  UI.tabEl = (id) => document.querySelector('#tabbar [data-tab="' + id + '"]');
  UI.renderTabs = function () {
    const nav = document.getElementById('tabbar');
    if (!nav) return;
    // update in place when the buttons exist (a rebuild under the finger would eat the tap)
    if (nav.children.length === TABS.length && nav.dataset.lang === NOA.i18n.lang) {
      TABS.forEach((tb, i) => {
        const b = nav.children[i];
        b.setAttribute('aria-current', tb.id === UI.current ? 'page' : 'false');
        const badge = UI.tabBadge(tb.id);
        let dot = b.querySelector('.badge-dot');
        if (!badge) { if (dot) dot.remove(); return; }
        if (!dot) { dot = UI.h('span', { class: 'badge-dot' }); b.append(dot); }
        dot.classList.toggle('n', typeof badge === 'number');
        dot.textContent = typeof badge === 'number' ? String(badge) : '';
      });
      return;
    }
    nav.dataset.lang = NOA.i18n.lang;
    UI.clear(nav);
    TABS.forEach((tb) => {
      const b = UI.h('button', {
        type: 'button', class: 'tab', data: { tab: tb.id }, 'aria-current': tb.id === UI.current ? 'page' : 'false',
        on: { click: () => { NOA.audio.unlock(); NOA.audio.play('tap'); UI.show(tb.id); } }
      }, UI.h('span', { class: 'ti' }, tb.icon), UI.h('span', null, t('tab.' + tb.id)));
      const badge = UI.tabBadge(tb.id);
      if (badge) b.append(UI.h('span', { class: 'badge-dot' + (typeof badge === 'number' ? ' n' : '') }, typeof badge === 'number' ? String(badge) : null));
      nav.append(b);
    });
  };
  /** true / a count when a tab has something waiting */
  UI.tabBadge = function (id) {
    const s = NOA.state;
    if (!s) return false;
    if (id === 'orders') {
      const n = s.orders.filter((o) => NOA.orders.canDeliver(o)).length;
      return n || false;
    }
    if (id === 'breed') {
      return NOA.labs.ids.some((lab) => NOA.labs.isOpen(lab) && s.labs[lab].slots.some((j) => j && NOA.time.now() >= j.end));
    }
    if (id === 'barn') return NOA.barn.free() <= 0;
    if (id === 'shop') {
      const tickets = Object.keys(NOA.BALANCE.gacha.boxes).some((b) => NOA.gacha.isUnlocked(b) && (s.tickets[NOA.BALANCE.gacha.boxes[b].ticket] || 0) > 0);
      return tickets || NOA.payment.monthly.canClaim();
    }
    return false;
  };
  UI.show = function (id, opts) {
    UI.current = id;
    document.querySelectorAll('.screen').forEach((s) => { s.hidden = s.id !== 'scr-' + id; });
    UI.renderTabs();
    if (NOA.ui.panels) NOA.ui.panels.closeSheet();
    const view = UI.screens[id];
    if (view && view.render) view.render(opts);
    const scr = document.getElementById('screens');
    if (scr && id !== 'farm') scr.scrollTop = 0;
    if (NOA.ui.story) NOA.ui.story.applyFocus();
  };
  UI.renderAll = function () {
    UI.renderTabs();
    if (NOA.ui.hud) NOA.ui.hud.render();
    for (const id in UI.screens) {
      const s = document.getElementById('scr-' + id);
      if (s && UI.screens[id].render && (!s.hidden || id === 'farm')) UI.screens[id].render();
    }
  };
})();

// ---- js/ui/fx.js
/*
 * Juice: canvas particles, floating text, flying coins, rings, flashes, screen shake
 * and the full-screen "gene awakened" cinematic.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const UI = NOA.ui;
  const P = [];
  let cv, ctx, raf = 0, last = 0, dpr = 1;

  const FX = NOA.ui.fx = {
    init() {
      cv = document.getElementById('fx-canvas');
      ctx = cv.getContext('2d');
      const resize = () => {
        dpr = Math.min(2, globalThis.devicePixelRatio || 1);
        cv.width = Math.round(innerWidth * dpr);
        cv.height = Math.round(innerHeight * dpr);
      };
      resize();
      addEventListener('resize', resize);
    },

    /* ------------------------------------------------------------ particles */
    burst(x, y, o) {
      o = o || {};
      const n = UI.reduced ? Math.min(6, o.count || 18) : (o.count || 18);
      const colors = o.colors || ['#ffc83a', '#5cbb49', '#ffffff', '#ff6b8e'];
      const shapes = o.shapes || ['circle', 'star'];
      for (let i = 0; i < n; i++) {
        const a = (o.angle != null ? o.angle : Math.random() * Math.PI * 2) + (o.spread != null ? (Math.random() - 0.5) * o.spread : 0);
        const sp = (o.speed || 260) * (0.35 + Math.random() * 0.65);
        P.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - (o.lift || 60),
          g: o.gravity != null ? o.gravity : 520,
          life: 0,
          max: (o.life || 0.9) * (0.6 + Math.random() * 0.6),
          size: (o.size || 6) * (0.6 + Math.random() * 0.8),
          color: colors[Math.floor(Math.random() * colors.length)],
          shape: shapes[Math.floor(Math.random() * shapes.length)],
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 10,
          drag: o.drag || 0.985
        });
      }
      if (!raf) { last = performance.now(); raf = requestAnimationFrame(FX.loop); }
    },
    confetti(x, y, n) {
      FX.burst(x, y, { count: n || 60, shapes: ['square', 'square', 'circle', 'star'], colors: ['#ff6b8e', '#ffc83a', '#5cbb49', '#56c1ff', '#a560f0', '#fff'], speed: 520, lift: 220, gravity: 640, life: 1.6, size: 7 });
    },
    loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cv.width, cv.height);
      for (let i = P.length - 1; i >= 0; i--) {
        const p = P[i];
        p.life += dt;
        if (p.life >= p.max) { P.splice(i, 1); continue; }
        p.vx *= p.drag; p.vy = p.vy * p.drag + p.g * dt;
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        const k = 1 - p.life / p.max;
        ctx.globalAlpha = Math.min(1, k * 1.6);
        ctx.fillStyle = p.color;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        const s = p.size * (0.6 + 0.4 * k);
        if (p.shape === 'circle') { ctx.beginPath(); ctx.arc(0, 0, s / 2, 0, Math.PI * 2); ctx.fill(); }
        else if (p.shape === 'square') ctx.fillRect(-s / 2, -s / 3, s, s * 0.66);
        else if (p.shape === 'leaf') { ctx.beginPath(); ctx.ellipse(0, 0, s * 0.7, s * 0.35, 0, 0, Math.PI * 2); ctx.fill(); }
        else { FX.star(s); }
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      raf = P.length ? requestAnimationFrame(FX.loop) : 0;
      if (!raf) ctx.clearRect(0, 0, cv.width, cv.height);
    },
    star(s) {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 ? s * 0.28 : s * 0.7;
        const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
    },

    /* ------------------------------------------------------------ DOM fx */
    layer() { return document.getElementById('fx-layer'); },
    float(x, y, text, cls, delay) {
      const el = UI.h('div', { class: 'ftxt ' + (cls || ''), style: { left: x + 'px', top: y + 'px', 'animation-delay': (delay || 0) + 's' } }, text);
      FX.layer().append(el);
      setTimeout(() => el.remove(), 1400 + (delay || 0) * 1000);
    },
    ring(x, y, color) {
      if (UI.reduced) return;
      const el = UI.h('div', { class: 'ring-fx', style: { left: x + 'px', top: y + 'px', '--rc': color || '#fff' } });
      FX.layer().append(el);
      setTimeout(() => el.remove(), 600);
    },
    flash(color) {
      if (UI.reduced) return;
      const el = UI.h('div', { class: 'flash-fx', style: { '--fc': color || '#fff' } });
      document.body.append(el);
      setTimeout(() => el.remove(), 400);
    },
    shake(el) {
      if (UI.reduced || !el) return;
      el.classList.remove('screen-shake');
      void el.offsetWidth;
      el.classList.add('screen-shake');
      setTimeout(() => el.classList.remove('screen-shake'), 400);
    },
    bump(el) {
      if (!el) return;
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
      setTimeout(() => el.classList.remove('bump'), 380);
    },
    /** Emojis fly along an arc from a point to a HUD element */
    flyTo(from, target, emoji, n, onEach) {
      if (!target) return;
      const to = UI.center(target);
      const count = Math.min(n || 6, 10);
      let coinSound = 0;
      for (let i = 0; i < count; i++) {
        const el = UI.h('div', { class: 'fly' }, emoji);
        FX.layer().append(el);
        const sx = from.x + (Math.random() - 0.5) * 40, sy = from.y + (Math.random() - 0.5) * 30;
        const cx = (sx + to.x) / 2 + (Math.random() - 0.5) * 120, cy = Math.min(sy, to.y) - 80 - Math.random() * 60;
        const dur = 620 + Math.random() * 220, delay = i * 55;
        const t0 = performance.now() + delay;
        const step = (now) => {
          const k = Math.min(1, Math.max(0, (now - t0) / dur));
          const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
          const x = (1 - e) * (1 - e) * sx + 2 * (1 - e) * e * cx + e * e * to.x;
          const y = (1 - e) * (1 - e) * sy + 2 * (1 - e) * e * cy + e * e * to.y;
          el.style.left = x + 'px';
          el.style.top = y + 'px';
          el.style.transform = 'translate(-50%,-50%) scale(' + (1.2 - 0.5 * e) + ')';
          if (k < 1) requestAnimationFrame(step);
          else {
            el.remove();
            FX.bump(target);
            if (now - coinSound > 70) { NOA.audio.play(emoji === '💎' ? 'gem' : 'coin'); coinSound = now; }
            if (onEach) onEach(i);
          }
        };
        el.style.left = sx + 'px';
        el.style.top = sy + 'px';
        requestAnimationFrame(step);
      }
    },

    /* ------------------------------------------------------------ gene awakening cinematic (queued) */
    _queue: Promise.resolve(),
    awaken(item, mode) {
      FX._queue = FX._queue.then(() => FX._awaken(item, mode));
      return FX._queue;
    },
    _awaken(item, mode) {
      return new Promise((resolve) => {
        const g = NOA.CONTENT.genes[item.gene.id];
        const titles = { awaken: 'awaken.title', fusion: 'awaken.fusion', super: 'awaken.super', recessive: 'awaken.recessive' };
        const I = NOA.items;
        const sub = [g.emoji + ' ' + NOA.t('gene.tier' + g.tier), I.purityText(item.gene.purity),
          NOA.t('gene.favor', { stat: NOA.t(g.favor === 'all' ? 'stat.all' : 'stat.' + g.favor) })].join(' · ');
        const ov = UI.h('div', { class: 'awaken mode-' + mode, style: { '--gc': g.color }, role: 'dialog', 'aria-label': NOA.t(titles[mode]) },
          UI.h('div', { class: 'aw-bg' }),
          UI.h('div', { class: 'aw-rays' }),
          UI.h('div', { class: 'aw-item' }, UI.itemArt(item, { badges: false })),
          UI.h('div', { class: 'aw-title' }, NOA.t(titles[mode] || 'awaken.title')),
          UI.h('div', { class: 'aw-name' }, I.name(item)),
          UI.h('div', { class: 'aw-sub' }, sub),
          UI.h('div', { class: 'aw-sub' }, NOA.t('gene.' + item.gene.id + '.desc')),
          UI.h('div', { class: 'aw-tap' }, NOA.t('ui.tapToContinue')));
        document.getElementById('overlays').append(ov);
        NOA.audio.play(mode === 'super' ? 'levelUp' : 'gene');
        NOA.audio.vibrate([30, 40, 70]);
        const c = { x: innerWidth / 2, y: innerHeight * 0.42 };
        setTimeout(() => FX.burst(c.x, c.y, { count: 40, colors: [g.color, '#fff', '#fff6b0'], speed: 420, life: 1.3, shapes: ['star', 'circle'] }), 250);
        if (mode === 'super' || mode === 'fusion') setTimeout(() => FX.confetti(c.x, c.y, 70), 500);
        let done = false;
        const close = () => {
          if (done) return;
          done = true;
          ov.classList.add('closing');
          setTimeout(() => { ov.remove(); resolve(); }, 280);
        };
        setTimeout(() => ov.addEventListener('click', close), 500);
        setTimeout(close, 5200);
      });
    }
  };
})();

/*
 * HUD: the top bar (level, coins, gems, codex, settings) on every screen, plus the widgets that
 * float over the farm map: robot Bean with its speech bubble, the sky widget (weather, moon, Earth,
 * daily gift), live event chips, shooting stars and the idle firefly.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const UI = NOA.ui;
  const h = (...a) => UI.h(...a);
  const t = (k, p) => NOA.t(k, p);
  const S = () => NOA.state;
  const B = () => NOA.BALANCE;

  let meteorTimer = 0;
  let lastInput = Date.now();
  let fireflyOut = false;
  let sayTimer = 0;
  let idleTipAt = Date.now() + 20000;

  const earthColor = (p) => {
    const k = Math.max(0, Math.min(1, p / 100));
    const mix = (a, b) => Math.round(a + (b - a) * k);
    const from = [164, 122, 88], to = [74, 176, 214];
    return 'rgb(' + mix(from[0], to[0]) + ',' + mix(from[1], to[1]) + ',' + mix(from[2], to[2]) + ')';
  };
  const IDLE_TIPS = 8;   // i18n bean.idle1..8
  const WX_ICON = { sunny: '☀️', cloudy: '⛅', rain: '🌧️', storm: '⛈️' };

  const HUD = NOA.ui.hud = {
    els: {},

    /* ------------------------------------------------------------ top bar */
    render() {
      const bar = document.getElementById('hud');
      if (!bar) return;
      UI.clear(bar);
      const e = HUD.els;
      e.level = h('button', { type: 'button', class: 'lvl', 'aria-label': t('ui.level'), on: { click: HUD.showXP } }, h('b', null, ''));
      e.coins = h('button', { type: 'button', class: 'pill pill--coins', on: { click: () => { UI.show('shop', { tab: 'items' }); } } }, h('span', { class: 'pi' }, '🪙'), h('b', null, ''));
      e.gems = h('button', { type: 'button', class: 'pill pill--gems', on: { click: () => { UI.show('shop', { tab: 'gems' }); } } }, h('span', { class: 'pi' }, '💎'), h('b', null, ''));
      e.codex = h('button', { type: 'button', class: 'btn-icon hud-btn', 'aria-label': t('tab.codex'), title: t('tab.codex'), on: { click: () => UI.show('codex') } }, '📖');

    },
    update() {

    },

    /* ------------------------------------------------------------ map overlay (built by the farm map) */
    mountOverlay(root) {
      const e = HUD.els;
      e.bean = h('button', { type: 'button', class: 'bean', 'aria-label': t('bean.name'), on: { click: HUD.onBean } },
        h('span', { class: 'sprout' }),
        h('span', { class: 'bean-body' }, h('span', { class: 'eye l' }), h('span', { class: 'eye r' }), h('span', { class: 'blush' }), h('span', { class: 'mouth' })));
      e.say = h('div', { class: 'bubble', 'aria-live': 'polite', on: { click: () => e.say.classList.toggle('mini') } }, '');
      e.wx = h('button', { type: 'button', class: 'sw-wx', on: { click: HUD.skyInfo } }, '');
      e.moon = h('button', { type: 'button', class: 'sw-moon', on: { click: HUD.skyInfo } }, '');
      e.earth = h('button', { type: 'button', class: 'earth', 'aria-label': 'Earth', on: { click: HUD.skyInfo } }, h('small', null, ''));
      e.gift = h('button', { type: 'button', class: 'btn-icon gift-btn', 'aria-label': t('login.title'), title: t('login.title'), on: { click: () => NOA.ui.panels.loginModal() } }, '🎁');
      e.events = h('div', { class: 'sky-events' });
      e.layer = h('div', { class: 'sky-layer' });
      root.append(
        h('div', { class: 'bean-dock' }, e.bean, e.say),
        h('div', { class: 'sky-widget' }, h('div', { class: 'sw-row' }, e.wx, e.moon, e.earth), e.gift, e.events),
        e.layer);

    tick() {
      if (!HUD.els.level) return;
