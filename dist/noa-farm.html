// ---- js/ui/gacha-view.js
/*
 * Blindboxes (shop tab + the wish tree on the map) and the opening show:
 *   tap → box shakes (glow escalates white → blue → purple → gold → pink, honest to the roll)
 *   → lid flies off with a burst → cards rise and flip (single) or a 2×5 grid flips in sequence (×10).
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const UI = NOA.ui;
  const h = (...a) => UI.h(...a);
  const t = (k, p) => NOA.t(k, p);
  const S = () => NOA.state;
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const I = () => NOA.items;

  const RC = { common: '#e9f0e6', rare: '#3ea8f4', epic: '#a560f0', legendary: '#ffb21f', mythic: '#ff58a6' };
  const order = () => B().gacha.rarityOrder;
  const sleep = (ms) => new Promise((r) => setTimeout(r, UI.reduced ? Math.min(ms, 60) : ms));

  const giftBox = (id, extraCls) => h('div', { class: 'gbox gbox--' + id + (extraCls ? ' ' + extraCls : '') },
    h('div', { class: 'gb-body' }, h('span', { class: 'gb-emblem' }, C().boxes[id].emoji)),
    h('div', { class: 'gb-lid' }, h('div', { class: 'gb-bow' })));

  const GV = NOA.ui.gacha = {
    renderInto(root) {
      root.append(h('div', { class: 'tickets-bar' },
        Object.keys(B().gacha.boxes).map((id) => h('span', { class: 'ev' }, '🎟️ ' + t('ticket.' + B().gacha.boxes[id].ticket) + ' ×' + (S().tickets[B().gacha.boxes[id].ticket] || 0)))));
      Object.keys(B().gacha.boxes).forEach((id) => root.append(GV.boxCard(id)));
      root.append(h('p', { class: 'notice' }, '🔎 ' + t('box.ratesNote', { rarity: t('rarity.' + B().gacha.boxes.sprout.multi.guaranteeMinRarity) })));
    },

    boxCard(id) {
      const unlocked = NOA.gacha.isUnlocked(id);
      const box = B().gacha.boxes[id];
      const lockLv = B().unlocks[C().boxes[id].unlock];
      const costLabel = (n) => {
        const c = NOA.gacha.cost(id, n);
        return UI.cost(c);
      };
      const pity = NOA.gacha.pityLeft(id).map((p) => h('div', { class: 'pity-line' },
        h('span', { class: 'rh-dot', style: { background: RC[p.rarity] } }), t('box.pity', { rarity: t('rarity.' + p.rarity), n: p.left })));
      const card = h('section', { class: 'panel box-card' + (unlocked ? '' : ' locked-panel'), 'data-lock': unlocked ? null : '🔒 ' + t('box.locked', { level: lockLv }) },
        giftBox(id),
        h('div', { class: 'box-info' },
          h('h3', null, t('box.' + id)),
          h('p', null, t('box.' + id + '.desc')),
          pity,
          h('div', { class: 'box-btns' },
            UI.btn(t('box.open1') + ' · ' + costLabel(1), 'sm berry', () => GV.open(id, 1), { disabled: !unlocked }),
            UI.btn(t('box.open10') + ' · ' + costLabel(box.multi.count), 'sm sun', () => GV.open(id, box.multi.count), { disabled: !unlocked }),
            UI.btn(t('ui.rates'), 'sm ghost', () => GV.ratesModal(id)))));
      return card;
    },

    open(id, count) {
      NOA.audio.unlock();
      const can = NOA.gacha.canOpen(id, count);
      if (!can.ok) {
        NOA.audio.play('invalid');
        if (can.reason === 'room') UI.toast(t('box.needRoom'), 'warn');
        else if (can.reason === 'locked') UI.toast(t('box.locked', { level: B().unlocks[C().boxes[id].unlock] }));
        else UI.toast(t('toast.notEnough', { name: can.cost && can.cost.gems ? t('res.gems') : t('res.coins') }), 'warn');
        return;
      }
      const res = NOA.gacha.open(id, count);
      if (!res.ok) return;
      NOA.ui.hud.update();
      GV.stage(id, count, res.results);
    },

    /* ------------------------------------------------------------ the show */
    async stage(id, count, results) {
      const best = Math.max(...results.map((r) => order().indexOf(r.rarity)));
      const ov = h('div', { class: 'gstage', role: 'dialog', 'aria-label': t('box.' + id) });
      const setRC = (r) => ov.style.setProperty('--rc', RC[r]);
      setRC('common');
      let skipped = false;
      const skipBtn = UI.btn(t('ui.skip'), 'sm ghost', () => { skipped = true; });
      skipBtn.classList.add('gs-skip');
      const box = giftBox(id, 'gs-box');
      const hint = h('div', { class: 'gs-hint' }, t('box.tap'));
      const center = h('div', { class: 'gs-center' }, box, hint);
      const cards = h('div', { class: 'gs-cards' + (count > 1 ? ' many' : '') });
      const actions = h('div', { class: 'gs-actions' });
      ov.append(h('div', { class: 'gs-bg' }), h('div', { class: 'gs-rays' }), h('div', { class: 'gs-glow' }), skipBtn, center, cards, actions);
      document.getElementById('overlays').append(ov);
      NOA.audio.play('open');

      // 1) anticipation: wait for the tap
      await new Promise((resolve) => {
        let done = false;
        const go = () => { if (done) return; done = true; ov.removeEventListener('click', go); resolve(); };
        ov.addEventListener('click', go);
        skipBtn.addEventListener('click', go);
      });
      hint.remove();
      ov.classList.add('charging');

      // 2) shakes with an honest rarity escalation
      const steps = 3 + Math.max(0, best - 2);
      let shown = 0;
      for (let s = 0; s < steps && !skipped; s++) {
        const r = Math.min(best, s);
        box.classList.remove('s1', 's2', 's3');
        void box.offsetWidth;
        box.classList.add('s' + Math.min(3, s + 1));
        setRC(order()[r]);
        NOA.audio.play('boxShake', s);
        if (r > shown || s === 0) { NOA.audio.play('boxTease', r); shown = r; }
        NOA.audio.vibrate(15 + s * 10);
        const c = UI.center(box);
        NOA.ui.fx.burst(c.x, c.y, { count: 8 + s * 4, colors: [RC[order()[r]], '#ffffff'], shapes: ['star'], speed: 160 + s * 40, size: 5 });
        await sleep(560 + s * 70);
      }
      setRC(order()[best]);

      // 3) burst
      ov.classList.add('burst');
      box.classList.remove('s1', 's2', 's3');
      box.classList.add('open');
      NOA.audio.play('boxBurst', best);
      NOA.audio.vibrate(best >= 3 ? [40, 30, 80] : 30);
      NOA.ui.fx.flash(RC[order()[best]]);
      const c = UI.center(box);
      NOA.ui.fx.burst(c.x, c.y, { count: 40 + best * 18, colors: [RC[order()[best]], '#ffffff', '#ffe27a'], shapes: ['star', 'circle'], speed: 420 + best * 60, life: 1.2 });
      if (best >= 3) NOA.ui.fx.confetti(c.x, c.y, 90);
      if (best >= 2) NOA.ui.fx.shake(ov);
      await sleep(skipped ? 120 : 520);
      center.remove();
      skipBtn.remove();

      // 4) reveal
      if (count === 1) {
        const r = results[0];
        ov.insertBefore(h('div', { class: 'gs-title' }, t('rarity.' + r.rarity) + '!'), cards);
        const card = GV.card(r);
        card.classList.add('rise');
        cards.append(card);
        await sleep(skipped ? 50 : 380);
        card.classList.add('flipped');
        NOA.audio.play('reveal', order().indexOf(r.rarity));
      } else {
        const els = results.map((r) => GV.card(r));
        els.forEach((el, i) => { el.classList.add('rise'); el.style.animationDelay = (i * 0.04) + 's'; cards.append(el); });
        await sleep(skipped ? 50 : 520);
        for (let i = 0; i < els.length; i++) {
          const ri = order().indexOf(results[i].rarity);
          els[i].classList.add('flipped');
          NOA.audio.play(ri >= 3 ? 'reveal' : 'flip', ri);
          if (ri >= 3) {
            const cc = UI.center(els[i]);
            NOA.ui.fx.burst(cc.x, cc.y, { count: 30, colors: [RC[results[i].rarity], '#ffffff'], shapes: ['star'], speed: 260 });
          }
          await sleep(skipped ? 20 : ri >= 3 ? 420 : 170);
        }
      }

      // 5) actions
      const close = () => {
        ov.classList.add('closing');
        ov.style.animation = 'fadeOut .25s ease forwards';
        setTimeout(() => ov.remove(), 260);
        const pending = results.filter((r) => r.where === 'pending').length;
        const refund = results.reduce((a, r) => a + (r.refund || 0), 0);
        if (pending) UI.toast(t('harvest.pending', { n: S().vault.pending.length }), 'warn');
        if (refund) UI.toast(t('box.refund', { n: UI.num(refund) }), 'warn');
        if (UI.current === 'shop') UI.screens.shop.render();
        NOA.ui.hud.update();
        NOA.ui.renderTabs();
      };
      actions.append(
        UI.btn(t('box.again') + ' · ' + UI.cost(NOA.gacha.cost(id, count)), 'berry', () => { close(); setTimeout(() => GV.open(id, count), 280); }),
        UI.btn(t('box.done'), 'leaf', close));
    },

    card(r) {
      let art, name, sub, desc = '';
      if (r.type === 'item') {
        art = UI.itemArt(r.item);
        name = I().name(r.item);
        sub = t(r.item.kind === 'seed' ? 'kind.seed' : 'kind.animal') + ' · ' + t('ui.lv', { n: r.item.level });
        if (r.refund) sub += ' · ' + t('box.refund', { n: UI.num(r.refund) });
        if (r.item.gene) {
          const g = C().genes[r.item.gene.id];
          sub += ' · ' + g.emoji + ' ' + I().purityText(r.item.gene.purity);
          desc = t('gene.' + r.item.gene.id + '.desc');
        } else {
          desc = '🌾 ' + I().stat(r.item, 'yield') + '  ⏱️ ' + I().stat(r.item, 'growth') + '  ⭐ ' + I().stat(r.item, 'quality');
        }
      } else if (r.type === 'material') {
        art = h('div', { class: 'art' }, h('span', { class: 'emo' }, C().materials[r.id].emoji));
        name = t('material.' + r.id) + ' ×' + r.qty;
        sub = t('bld.barn');
        desc = t('material.' + r.id + '.desc');
      } else if (r.type === 'booster') {
        art = h('div', { class: 'art' }, h('span', { class: 'emo' }, C().boosters[r.id].emoji));
        name = t('booster.' + r.id) + ' ×' + r.qty;
        sub = t('farm.bag');
        desc = t('booster.' + r.id + '.desc');
      } else if (r.type === 'currency') {
        const e = r.entries[0] || { icon: '🪙', n: 0 };
        art = h('div', { class: 'art' }, h('span', { class: 'emo' }, e.icon));
        name = '+' + UI.num(e.n) + ' ' + (e.key ? t(e.key) : '');
        sub = '';
      } else if (r.type === 'mascot') {
        const m = C().mascots[r.id];
        art = h('div', { class: 'art' }, h('span', { class: 'emo' }, m.emoji));
        name = t('mascot.' + r.id);
        sub = t('mascot.' + m.type) + (m.type === 'temp' ? ' · ' + r.res.minutes + "'" : ' · ' + '★'.repeat(r.res.stars));
        if (r.res.overflowGems) sub += ' · +' + r.res.overflowGems + '💎';
        desc = t('mascot.' + r.id + '.desc');
      } else {
        art = h('div', { class: 'art' });
        name = '…';
        sub = '';
      }
      return h('div', { class: 'gcard r-' + r.rarity },
        h('div', { class: 'gc-inner' },
          h('div', { class: 'gc-back' }, '?'),
          h('div', { class: 'gc-front' },
            h('div', { class: 'gc-banner' }, t('rarity.' + r.rarity)),
            h('div', { class: 'gc-art' }, art),
            h('div', { class: 'gc-name' }, name),
            sub ? h('div', { class: 'gc-sub' }, sub) : null,
            desc ? h('div', { class: 'gc-desc' }, desc) : null,
            r.isNew ? h('span', { class: 'gc-new' }, t('ui.new')) : null)));
    },

    ratesModal(id) {
      const rates = NOA.gacha.rates(id);
      const box = B().gacha.boxes[id];
      UI.modal({
        title: t('box.ratesTitle', { box: t('box.' + id) }),
        body: (b) => {
          const tb = h('table', { class: 'rate-table' });
          rates.forEach((r) => {
            tb.append(h('tr', { class: 'rh' },
              h('td', null, h('span', { class: 'rh-dot', style: { background: RC[r.rarity] } }), t('rarity.' + r.rarity)),
              h('td', { class: 'p' }, UI.pct(r.p))));
            r.entries.forEach((e) => tb.append(h('tr', null, h('td', null, '· ' + t('reward.' + e.rewardId)), h('td', { class: 'p' }, UI.pct(e.p)))));
          });
          b.append(h('div', { style: { overflowX: 'auto' } }, tb));
          const pity = Object.keys(box.pity || {}).map((r) => t('box.pity', { rarity: t('rarity.' + r), n: box.pity[r] })).join(' · ');
          if (pity) b.append(h('p', { class: 'notice' }, pity));
          b.append(h('p', { class: 'muted tiny' }, t('box.ratesNote', { rarity: t('rarity.' + box.multi.guaranteeMinRarity) })));
        }
      });
    }
  };
})();

// ---- js/ui/shop-view.js
/*
 * Shop screen (also the market stall and the wish tree on the map):
 *   🎁 blindboxes · 🌱 seeds & young animals (Lv1) · 🧰 supplies & luck items (🪙 coins or 💎 gems)
 *   💎 gem packs (real money via NOA.payment, not live yet) · 🎀 offers (starter pack, monthly card).
 * Payment links/config: config/payment.js.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const UI = NOA.ui;
  const h = (...a) => UI.h(...a);
  const t = (k, p) => NOA.t(k, p);
  const S = () => NOA.state;
  const B = () => NOA.BALANCE;

  const ICON = {
    manure_5: '💩', straw_10: '🧹', pollen_10: '🌼', clover_1: '🍀', clover_5: '🍀', stabilizer_1: '🧪', stardust_1: '✨',
    tonic_3: '🧃', loupe_1: '🔍', vault_6: '🌰', nursery_3: '🐣', ticket_star: '🎟️'
  };
  const TABS = [['gacha', '🎁'], ['breeds', '🌱'], ['items', '🧰'], ['gems', '💎'], ['offers', '🎀']];
  const PACK_ICON = { gems_60: '💎', gems_330: '💰', gems_700: '🧰', gems_1500: '👑', starter_pack: '🎒', monthly_card: '📆' };

  let tab = 'gacha';

  const SV = NOA.ui.screens.shop = {
    tab(name) { tab = name; SV.render(); },
    render(opts) {
      if (opts && opts.tab) tab = opts.tab;
      const root = document.getElementById('scr-shop');
      UI.clear(root);
      const seg = h('div', { class: 'seg', role: 'tablist' });
      TABS.forEach(([id, ic]) => {
        seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': tab === id ? 'true' : 'false', on: { click: () => { NOA.audio.play('tap'); SV.tab(id); } } }, ic + ' ' + t('shop.tab.' + id)));
      });
      root.append(seg);
      const on = seg.querySelector('[aria-pressed="true"]');
      if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      if (tab === 'gacha') NOA.ui.gacha.renderInto(root);
      else if (tab === 'breeds') SV.renderBreeds(root);
      else if (tab === 'items') SV.renderItems(root);
      else if (tab === 'gems') SV.renderGems(root);
      else SV.renderOffers(root);
    },
    current() { return tab; },

    itemCard(it) {
      const cur = Object.keys(it.price)[0];
      const can = NOA.shop.canBuy(it.id);
      return h('div', { class: 'sitem' },
        h('span', { class: 'si' }, ICON[it.id] || '🎁'),
        h('span', { class: 'sn' }, t('shopitem.' + it.id)),
        it.grant.boosters ? h('span', { class: 'sd' }, t('booster.' + Object.keys(it.grant.boosters)[0] + '.desc'))
          : it.grant.materials ? h('span', { class: 'sd' }, t('material.' + Object.keys(it.grant.materials)[0] + '.desc')) : null,
        UI.btn(UI.cost(it.price), cur === 'gems' ? 'sm sky' : 'sm sun', (ev) => {
          const r = NOA.shop.buy(it.id);
          if (r.ok) {
            NOA.audio.play('coin');
            const c = UI.center(ev.currentTarget);
            NOA.ui.fx.burst(c.x, c.y, { count: 16, colors: ['#ffd84d', '#ffffff', '#56c1ff'], shapes: ['star'], speed: 200 });
            UI.toast(t('shop.bought') + ' ' + r.granted.map((g) => g.icon + '+' + g.n).join(' '), 'good');
            NOA.ui.hud.update();
            SV.render();
          } else {
            NOA.audio.play('invalid');
            UI.toast(r.error === 'max' ? t('ui.max') : t('toast.notEnough', { name: t('res.' + (r.currency || cur)) }), 'warn');
          }
        }, { disabled: !can }));
    },

    renderBreeds(root) {
      root.append(h('p', { class: 'muted tiny' }, t('shop.breedsNote')));
      const grid = h('div', { class: 'shop-grid' });
      NOA.shop.breedsForSale().forEach((sp) => {
        const def = NOA.CONTENT.species[sp];
        const price = NOA.shop.breedPrice(sp);
        const grid2 = def.family === 'plant' ? 'vault' : 'nursery';
        const where = def.family === 'plant' ? t('zone.' + def.bed) : t('bld.' + def.pen);
        grid.append(h('div', { class: 'sitem' },
          h('span', { class: 'si' }, def.emoji),
          h('span', { class: 'sn' }, def.family === 'plant' ? t('item.seedName', { species: t('species.' + sp) }) : t('species.' + sp)),
          h('span', { class: 'sd' }, 'Lv1 · ' + where),
          UI.btn(UI.num(price) + '🪙', 'sm sun', (ev) => {
            const r = NOA.shop.buyBreed(sp);
            if (r.ok) {
              NOA.audio.play('coin');
              const c = UI.center(ev.currentTarget);
              NOA.ui.fx.burst(c.x, c.y, { count: 12, colors: ['#9be37a', '#ffffff', '#ffd84d'], shapes: ['leaf', 'star'], speed: 180 });
              NOA.ui.fx.flyTo(c, UI.tabEl('breed'), def.emoji, 1);
              NOA.ui.hud.update();
              SV.render();
            } else {
              NOA.audio.play('invalid');
              UI.toast(r.error === 'room' ? t('shop.noRoom', { grid: t('grid.' + grid2) }) : t('toast.notEnough', { name: t('res.coins') }), 'warn');
            }
          }, { disabled: !NOA.res.canAfford({ coins: price }) || !NOA.grids.hasRoom(grid2) })));
      });
      root.append(grid);
    },

    renderItems(root) {
      const grid = h('div', { class: 'shop-grid' });
      NOA.shop.items().forEach((it) => grid.append(SV.itemCard(it)));
      const ex = B().shop.exchange;
      grid.append(h('div', { class: 'sitem' },
        h('span', { class: 'si' }, '🔁'),
        h('span', { class: 'sn' }, t('shop.exchange')),
        h('span', { class: 'sd' }, t('shop.exchangeDesc', { gems: ex.gems, coins: UI.num(ex.coins) })),
        UI.btn(UI.cost({ gems: ex.gems }), 'sm sky', () => {
          const r = NOA.shop.exchange();
          if (r.ok) { NOA.audio.play('coin'); NOA.ui.hud.update(); SV.render(); }
          else { NOA.audio.play('invalid'); UI.toast(t('toast.notEnough', { name: t('res.gems') }), 'warn'); }
        }, { disabled: S().res.gems < ex.gems })));
      root.append(grid);
    },

    payNotice() {
      if (NOA.payment.provider() === 'mock') return h('p', { class: 'notice' }, '🧪 ' + t('shop.payMock'));
      if (!NOA.payment.isLive()) return h('p', { class: 'notice' }, '🔒 ' + t('shop.payOff') + '. ' + t('shop.payOffNote'));
      return null;
    },
    packCard(p) {
      const live = NOA.payment.isLive();
      const available = NOA.payment.available(p);
      const btn = UI.btn(available ? NOA.payment.priceText(p) : t('shop.owned'), live ? 'sm leaf' : 'sm ghost', async (ev) => {
        const b = ev.currentTarget;
        b.disabled = true;
        const r = await NOA.payment.purchase(p.sku);
        b.disabled = false;
        if (r.ok) {
          NOA.audio.play('levelUp');
          NOA.ui.fx.confetti(innerWidth / 2, innerHeight * 0.4, 70);
          UI.toast(t('toast.purchaseOk'), 'good');
          NOA.ui.panels.rewardsToast(r.granted);
          SV.render();
        } else if (r.code === 'disabled') {
          NOA.audio.play('tap');
          UI.toast(t('toast.purchaseOff', { sku: p.sku }));
        } else {
          NOA.audio.play('invalid');
          UI.toast(t('toast.purchaseFail', { code: r.code }), 'warn');
        }
      }, { disabled: !available });
      return h('div', { class: 'sitem gems' },
        p.bonus ? h('span', { class: 'ribbon' }, t('shop.bonus', { n: p.bonus })) : !live ? h('span', { class: 'ribbon' }, t('ui.comingSoon')) : null,
        h('span', { class: 'si' }, PACK_ICON[p.sku] || '💎'),
        h('span', { class: 'sn' }, t('pay.' + p.sku)),
        h('span', { class: 'sd' }, p.grant.gems && !p.daily && p.type === 'consumable' ? UI.num(p.grant.gems + (p.bonus || 0)) + ' 💎' : t('pay.' + p.sku + '.desc')),
        btn);
    },
    renderGems(root) {
      const n = SV.payNotice();
      if (n) root.append(n);
      const grid = h('div', { class: 'shop-grid' });
      NOA.payment.products().filter((p) => p.type === 'consumable').forEach((p) => grid.append(SV.packCard(p)));
      root.append(grid, SV.footer());
    },
    renderOffers(root) {
      const n = SV.payNotice();
      if (n) root.append(n);
      if (NOA.payment.monthly.active()) {
        const days = Math.ceil((S().purchases.monthlyUntil - NOA.time.now()) / NOA.time.DAY);
        root.append(h('div', { class: 'panel' },
          h('div', { class: 'panel-title' }, h('span', null, '📆 ' + t('shop.monthlyActive', { d: days }))),
          UI.btn(t('shop.monthlyClaim'), 'leaf block', () => {
            const g = NOA.payment.monthly.claim();
            if (g) { NOA.audio.play('coin'); NOA.ui.panels.rewardsToast(g); SV.render(); NOA.ui.renderTabs(); }
          }, { disabled: !NOA.payment.monthly.canClaim() })));
      }
      const grid = h('div', { class: 'shop-grid' });
      NOA.payment.products().filter((p) => p.type !== 'consumable').forEach((p) => grid.append(SV.packCard(p)));
      root.append(grid, SV.footer());
    },
    footer() {
      const L = NOA.PAYMENT.links;
      return h('div', { class: 'panel' },
        h('div', { class: 'links' },
          h('a', { href: L.terms, target: '_blank', rel: 'noopener' }, t('shop.terms')),
          h('a', { href: L.privacy, target: '_blank', rel: 'noopener' }, t('shop.privacy')),
          h('span', { class: 'muted' }, t('shop.support', { mail: L.support }))),
        h('div', { style: { marginTop: '10px' } }, UI.btn(t('shop.restore'), 'sm ghost', async () => {
          const r = await NOA.payment.restore();
          UI.toast(r.ok ? t('toast.purchaseOk') : t('toast.purchaseOff', { sku: 'restore' }));
        })));
    }
  };
})();

// ---- js/ui/codex-view.js
/*
 * Codex (Sổ tay): species & hybrids, genes, mascots + shrine, secrets, story & letters.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const UI = NOA.ui;
  const h = (...a) => UI.h(...a);
  const t = (k, p) => NOA.t(k, p);
  const S = () => NOA.state;
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;

  let tab = 'species';

  const unlocked = (u) => {
    if (!u) return true;
    if (u.level != null) return S().level >= u.level;
    if (u.earth != null) return S().earth >= u.earth;
    if (u.flag) return !!S().flags[u.flag];
    return false;
  };

  const CV = NOA.ui.screens.codex = {
    tab(name) { tab = name; CV.render(); },
    render(opts) {
      if (opts && opts.tab) tab = opts.tab;
      const root = document.getElementById('scr-codex');
      UI.clear(root);
      const seg = h('div', { class: 'seg', role: 'tablist' });
      [['species', '🌱'], ['genes', '🧬'], ['mascots', '🐾'], ['secrets', '🔮'], ['story', '📜']].forEach(([id, ic]) => {
        seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': tab === id ? 'true' : 'false', on: { click: () => { NOA.audio.play('tap'); CV.tab(id); } } }, ic + ' ' + t('codex.' + id)));
      });
      root.append(seg);
      const on = seg.querySelector('[aria-pressed="true"]');
      if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      ({ species: CV.species, genes: CV.genes, mascots: CV.mascots, secrets: CV.secrets, story: CV.story })[tab](root);
    },

    species(root) {
      const all = Object.keys(C().species);
      const found = all.filter((id) => S().discovered.species[id]);
      root.append(h('div', { class: 'row-title' }, h('span', null, t('codex.progress', { a: found.length, b: all.length }))));
      const grid = h('div', { class: 'cx-grid' });
      all.forEach((id) => {
        const sp = C().species[id];
        const known = !!S().discovered.species[id];
        const best = S().discovered.maxLevel[id];
        grid.append(h('button', {
          type: 'button', class: 'cx' + (known ? '' : ' unknown'),
          on: { click: () => CV.speciesInfo(id) }
        },
          h('span', { class: 'ce' }, sp.emoji + (sp.emoji2 ? sp.emoji2 : '')),
          h('span', { class: 'cn' }, known ? t('species.' + id) : t('codex.unknown')),
          h('span', { class: 'cs' }, known ? (sp.hybrid ? t('item.hybrid') : t('fam.' + sp.family)) + (best ? ' · ' + t('ui.lv', { n: best }) : '') : sp.hybrid ? t('item.hybrid') : t('ui.unlockAt', { level: B().species[id].unlockLevel }))));
      });
      root.append(grid);
    },
    speciesInfo(id) {
      const sp = C().species[id];
      const known = !!S().discovered.species[id];
      UI.modal({
        title: known ? sp.emoji + ' ' + t('species.' + id) : t('codex.unknown'),
        body: (b) => {
          if (sp.hybrid) {
            b.append(h('p', { style: { textAlign: 'center', fontWeight: '800' } }, t('codex.hybridOf', { a: C().species[sp.hybrid[0]].emoji + ' ' + (known ? t('species.' + sp.hybrid[0]) : '???'), b: C().species[sp.hybrid[1]].emoji + ' ' + (known ? t('species.' + sp.hybrid[1]) : '???') })));
            b.append(h('p', { class: 'notice' }, known ? '🔎 ' + t('hybrid.' + id + '.fact') : '💡 ' + t('hybrid.' + id + '.hint')));
          } else {
            const prods = sp.products.map((p) => h('span', { class: 'ev', style: { opacity: S().discovered.products[p] ? '1' : '0.4' } }, C().products[p].emoji + ' ' + (S().discovered.products[p] ? t('product.' + p) : '???')));
            b.append(h('div', { class: 'essence-row', style: { justifyContent: 'center' } }, prods));
            const goods = (ids) => ids.map((f) => NOA.items.goodEmoji(f) + ' ' + NOA.items.goodName(f)).join(', ');
            const lines = [];
            lines.push(sp.family === 'plant' ? '📍 ' + t('zone.' + sp.bed) : '📍 ' + t('bld.' + sp.pen));
            if (sp.feed) lines.push('🍽️ ' + t('item.eats', { list: goods(sp.feed) }));
            if (sp.byproduct) lines.push(C().materials[sp.byproduct].emoji + ' ' + t('codex.byproduct', { list: t('material.' + sp.byproduct) }));
            if (sp.manure) lines.push('💩 ' + t('codex.byproduct', { list: t('material.manure') }));
            const used = Object.keys(B().recipes).filter((r) => Object.keys(B().recipes[r].inputs).some((x) => sp.products.indexOf(x) >= 0) && sp.products.indexOf(r) < 0);
            if (used.length) lines.push('🏭 ' + t('codex.usedIn', { list: goods(used) }));
            b.append(h('div', { class: 'sh-meta', style: { textAlign: 'center' } }, lines.map((l) => h('div', null, l))));
          }
          if (S().discovered.maxLevel[id]) b.append(h('p', { style: { textAlign: 'center' } }, t('codex.bestLevel', { n: S().discovered.maxLevel[id] })));
        }
      });
    },

    genes(root) {
      const all = Object.keys(C().genes);
      const found = all.filter((g) => S().discovered.genes[g]).length;
      root.append(h('div', { class: 'row-title' }, h('span', null, t('codex.progress', { a: found, b: all.length }))));
      ['plant', 'animal'].forEach((fam) => {
        root.append(h('h3', { class: 'lab-sub' }, (fam === 'plant' ? '🌱 ' : '🐾 ') + t('fam.' + fam)));
        const grid = h('div', { class: 'cx-grid' });
        all.filter((g) => C().genes[g].family === fam).forEach((g) => {
          const def = C().genes[g];
          const known = !!S().discovered.genes[g];
          grid.append(h('button', {
            type: 'button', class: 'cx' + (known ? ' has-gene' : ' unknown'), style: { '--gc': def.color },
            on: { click: () => CV.geneInfo(g) }
          },
            h('span', { class: 'ce' }, def.emoji),
            h('span', { class: 'cn' }, known ? t('gene.' + g) : t('codex.unknown')),
            h('span', { class: 'cs' }, (def.secret ? '🔮 ' : '') + t('gene.tier' + def.tier))));
        });
        root.append(grid);
      });
    },
    geneInfo(g) {
      const def = C().genes[g];
      const known = !!S().discovered.genes[g];
      UI.modal({
        title: known ? def.emoji + ' ' + t('gene.' + g) : t('codex.unknown'),
        body: (b) => {
          b.append(h('p', { style: { textAlign: 'center', fontWeight: '800' } }, t('gene.tier' + def.tier) + ' · ' + t('fam.' + def.family) + ' · ' + t('gene.favor', { stat: t(def.favor === 'all' ? 'stat.all' : 'stat.' + def.favor) })));
          if (known) b.append(h('p', { style: { textAlign: 'center' } }, t('gene.' + g + '.desc')));
          if (def.parents) {
            const p = def.parents.map((x) => C().genes[x].emoji + ' ' + (S().discovered.genes[x] ? t('gene.' + x) : '???'));
            b.append(h('p', { class: 'notice' }, known ? t('gene.recipe', { a: p[0], b: p[1] }) : '💡 ' + t('gene.' + g + '.hint')));
          } else if (def.secret) {
            b.append(h('p', { class: 'notice' }, '🔮 ' + t('gene.secret') + ' · ' + t('gene.' + g + '.hint')));
          }
          const row = B().gene.priceMult[def.tier];
          b.append(h('p', { class: 'muted tiny', style: { textAlign: 'center' } }, '🪙 ×' + row[1] + ' (◆1) → ×' + row[5] + ' (◆5)'));
        }
      });
    },

    mascots(root) {
      const shrineLv = B().unlocks.shrine;
      root.append(h('h3', { class: 'lab-sub' }, '⛩️ ' + t('mascot.shrine')));
      if (S().level < shrineLv) root.append(h('p', { class: 'notice' }, '🔒 ' + t('ui.unlockAt', { level: shrineLv })));
      const shrine = h('div', { class: 'shrine' });
      S().mascots.shrine.forEach((id, i) => {
        shrine.append(h('button', {
          type: 'button', class: 'shrine-slot' + (id ? ' filled' : ''),
          on: { click: () => { if (id) { NOA.mascots.unplace(i); NOA.audio.play('close'); CV.render(); } } }

          let armed = false;
          const reset = UI.btn('🗑️ ' + t('settings.reset'), 'sm ghost', () => {
            if (!armed) { armed = true; reset.textContent = '⚠️ ' + t('settings.resetConfirm'); reset.classList.add('btn--berry'); return; }

          });
          b.append(reset, h('p', { class: 'muted tiny', style: { textAlign: 'center' } }, t('settings.version', { v: B().meta.version })));

              for (const pid in C().products) if (NOA.production.inputUnlocked(pid) || C().products[pid].tier === 1) NOA.barn.add(pid, 10, { force: true });

          box.append(h('h3', null, '⏰ ' + t('dev.speed')), h('div', { class: 'row' },

          box.append(h('h3', null, '💳 ' + t('dev.payProvider')),

          box.append(h('h3', null, '🧪 ' + t('dev.spawnGene')), h('div', { class: 'form-row' }, sel, UI.btn('＋', 'sm leaf', () => {

            const species = fam === 'plant' ? 'tomato' : 'chicken';

            if (NOA.grids.place(item) === -1) { UI.toast(t('grid.full', { grid: t('grid.' + NOA.grids.gridFor(item)) }), 'warn'); return; }

          })));

          const out = h('pre', null, '');

            Object.keys(B().gacha.boxes).map((id) => UI.btn(t('box.' + id), 'sm ghost', () => { out.textContent = SET.simulate(id, 1000); }))),
            UI.btn('✅ ' + t('dev.config'), 'sm ghost', () => {
              const w = NOA.validateConfig();
              out.textContent = w.length ? '⚠️ ' + w.join('\n⚠️ ') : t('dev.configOk');
            }), out);
          b.append(box);
          void m;
        }
      });
    },

    /** Dev: every field, pen, workshop job and hybrid finishes now */
    finishAll() {
      const now = NOA.time.now();
      const s = S();
      for (const bed in s.fields) s.fields[bed].forEach((p) => { if (p.seed) p.end = Math.min(p.end, now); });
      for (const id in s.pens) s.pens[id].slots.forEach((x) => { if (x && x.end) x.end = Math.min(x.end, now); });
      for (const id in s.factories) s.factories[id].queue.forEach((j) => { j.end = Math.min(j.end, now); j.start = Math.min(j.start, now); });
      for (const lab in s.labs) s.labs[lab].slots.forEach((j) => { if (j) j.end = Math.min(j.end, now); });
      NOA.farm.tick();
      NOA.production.tick();
      NOA.labs.tick();
      for (const bed in s.fields) NOA.events.emit('field.changed', { bed });
      for (const id in s.pens) NOA.events.emit('pens.changed', { penId: id });
      for (const id in s.factories) NOA.events.emit('factory.changed', { building: id });
    },

    /** Roll a box n times on a scratch pity state (the real save is untouched) */
    simulate(id, n) {
      const s = S();
      const saved = JSON.parse(JSON.stringify(s.gacha[id] || { opened: 0, since: {} }));
      s.gacha[id] = { opened: 0, since: {} };
      const counts = {};
      const rewards = {};
      for (let i = 0; i < n; i++) {
        const [r] = NOA.gacha.roll(id, 1);
        counts[r.rarity] = (counts[r.rarity] || 0) + 1;
        rewards[r.reward] = (rewards[r.reward] || 0) + 1;
      }
      s.gacha[id] = saved;
      const lines = [t('dev.simResult', { box: t('box.' + id) }) + ' · n=' + n];
      NOA.gacha.rates(id).forEach((r) => {
        lines.push(t('rarity.' + r.rarity).padEnd(12) + ' ' + t('dev.cfg') + ' ' + UI.pct(r.p).padStart(7) + ' | ' + t('dev.real') + ' ' + UI.pct((counts[r.rarity] || 0) / n).padStart(7));
      });
      lines.push('');
      Object.keys(rewards).sort((a, b) => rewards[b] - rewards[a]).forEach((k) => lines.push('· ' + t('reward.' + k) + ': ' + rewards[k]));
      return lines.join('\n');
    }
  };
})();

/*
 * Story: the intro cutscene and the step-by-step tutorial led by robot Bean.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const UI = NOA.ui;
  const h = (...a) => UI.h(...a);
  const t = (k, p) => NOA.t(k, p);
  const S = () => NOA.state;
  const C = () => NOA.CONTENT;

  const SCENES = [
    { cls: 's1', art: '🌍🥀' },
    { cls: 's2', art: '🧬🌱🚀' },
    { cls: 's3', art: '🪐✨' },
    { cls: 's4', art: '💥🧬✨' },
    { cls: 's5', art: '❄️🛌💤' },
    { cls: 's6', art: null }
  ];

  const beanEl = () => h('span', { class: 'bean', 'aria-hidden': 'true' },
    h('span', { class: 'sprout' }),
    h('span', { class: 'bean-body' }, h('span', { class: 'eye l' }), h('span', { class: 'eye r' }), h('span', { class: 'blush' }), h('span', { class: 'mouth' })));

  const ST = NOA.ui.story = {
    /* ------------------------------------------------------------ intro */
    intro(onDone) {
      let i = 0;
      const ov = h('div', { class: 'intro', role: 'dialog', 'aria-label': t('game.title') });
      const card = h('div', { class: 'intro-card' });
      ov.append(card);
      const finish = () => {
        S().seen.intro = true;
        NOA.save.schedule();
        ov.classList.add('closing');
        setTimeout(() => ov.remove(), 380);
        if (onDone) onDone();
      };
      const show = () => {
        UI.clear(card);
        const sc = SCENES[i];
        const art = h('div', { class: 'intro-art ' + sc.cls }, sc.art ? sc.art : beanEl());
        const dots = h('div', { class: 'intro-dots' }, SCENES.map((s, k) => h('i', { class: k === i ? 'on' : '' })));
        const last = i === SCENES.length - 1;
        card.append(
          h('div', { class: 'intro-logo' }, t('game.title'), h('small', null, t('game.subtitle'))),
          art,
          h('p', { class: 'intro-text' }, t('intro.' + (i + 1))),
          dots,
          h('div', { class: 'intro-actions' },
            UI.btn(t('ui.skip'), 'ghost', () => { NOA.audio.unlock(); finish(); }),
            UI.btn(last ? t('intro.start') : t('ui.next') + ' →', last ? 'leaf' : 'sun', () => {
              NOA.audio.unlock();
              NOA.audio.play(last ? 'levelUp' : 'tap');
              if (last) finish();
              else { i += 1; show(); }
            })));
      };
      show();
      document.getElementById('overlays').append(ov);
    },

    /* ------------------------------------------------------------ tutorial */
    steps() { return C().tutorial; },
    current() {
      const tu = S().tutorial;
      if (!NOA.FEATURES.tutorial || tu.done) return null;
      return ST.steps()[tu.step] || null;
    },
    tutorialDone() { return !NOA.FEATURES.tutorial || S().tutorial.done; },
    currentTip() {
      const st = ST.current();
      return st ? t('tut.' + st.id) : null;
    },
    advance() {
      const tu = S().tutorial;
      tu.step += 1;
      tu.counts = {};
      if (tu.step >= ST.steps().length) {
        tu.done = true;
        NOA.ui.hud.say(t('tut.done'), 8000);
        NOA.progress.addXP(10);
      } else {
        NOA.ui.hud.say(ST.currentTip());
      }
      ST.applyFocus();
      NOA.save.schedule();
    },
    /**
     * Highlight what the current step needs. On the farm map the camera flies to it once per step;
     * on other screens the matching button / item pulses.
     */
    applyFocus() {
      document.querySelectorAll('.tut-focus').forEach((el) => el.classList.remove('tut-focus'));
      const st = ST.current();
      ST.banner(st);
      if (!st) return;
      const el = ST.focusTarget(st);
      if (!el) return;
      el.classList.add('tut-focus');
      if (UI.current === 'farm' && ST._flown !== st.id + ':farm') {
        ST._flown = st.id + ':farm';
        // let the reward effects of the step that just finished play out before the camera moves,
        // and never pull the map from under a finger that is dragging it
        const MV = NOA.ui.screens.farm;
        const go = () => { if (MV.busy()) setTimeout(go, 400); else MV.reveal(el, true); };
        setTimeout(go, 900);
      }
    },
    /** Off the farm map Bean is not visible, so the current tip sits at the top of the screen */
    banner(st) {
      document.querySelectorAll('.tut-banner').forEach((el) => el.remove());
      if (!st || UI.current === 'farm') return;
      const root = document.getElementById('scr-' + UI.current);
      if (!root) return;
      root.prepend(h('div', { class: 'tut-banner', role: 'status' }, h('span', { class: 'tb-bean', 'aria-hidden': 'true' }, '🌱'), h('span', null, t('tut.' + st.id))));
    },
    focusTarget(st) {
      const scr = UI.current;
      const byId = (id) => document.getElementById(id);
      if (scr === 'farm') return byId(st.focus);
      if (scr === 'breed') {
        const grid = NOA.ui.screens.breed.grid;
        const cells = S()[grid].cells;
        if (st.id === 'merge') {
          for (let i = 0; i < cells.length; i++) {
            for (let j = i + 1; j < cells.length; j++) if (NOA.items.canMerge(cells[i], cells[j])) return byId('gi-' + grid + '-' + i);
          }
        }
        if (st.id === 'animal' && grid === 'nursery') {
          const i = cells.findIndex((x) => x && x.species === 'chicken');
          if (i >= 0) return byId('gi-' + grid + '-' + i);
        }
        if (st.id === 'animal' && grid === 'vault') return document.querySelector('#scr-breed .seg button:last-child');
        return null;
      }
      if (scr === 'orders' && st.id === 'order') {
        const o = S().orders.find((x) => NOA.orders.canDeliver(x));
        return o ? document.querySelector('#order-' + o.id + ' .btn--leaf') : null;
      }
      return null;
    },
    init() {
      NOA.events.on('*', (name) => {
        const st = ST.current();
        if (!st || st.done !== name) return;
        const tu = S().tutorial;
        tu.counts[st.id] = (tu.counts[st.id] || 0) + 1;
        if (tu.counts[st.id] >= (st.count || 1)) setTimeout(ST.advance, 350);
      });
      // While the tutorial runs, keep one easy order (2 Rice Sheaves — the starter barn has 3) on the board
      NOA.hooks.add('order.generated', (o) => {
        const tu = S().tutorial;
        const orderStep = ST.steps().findIndex((x) => x.id === 'order');
        if (!NOA.FEATURES.tutorial || tu.done || tu.step > orderStep) return o;
        const hasEasy = S().orders.some((x) => x.lines.length === 1 && x.lines[0].product === 'rice_1' && x.lines[0].count <= 2);
        if (!hasEasy && !o.vip) o.lines = [{ product: 'rice_1', count: 2, filled: 0, minStars: 0, needGene: false }];
        return o;
      });
    }
  };
})();

// ---- js/main.js
/*
 * Boot: load / create the save, wire events to views, run the clock, show intro / daily gift.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const UI = NOA.ui;
  const S = () => NOA.state;

  /** Add keys that newer versions introduced, without touching existing values */
  function fillDefaults(target, defaults) {
    for (const k in defaults) {
      if (target[k] === undefined) target[k] = NOA.util.clone(defaults[k]);
      else if (NOA.util.isObj(target[k]) && NOA.util.isObj(defaults[k])) fillDefaults(target[k], defaults[k]);
    }
    return target;
  }
  function detectLang() {
    try { return (navigator.language || 'vi').toLowerCase().startsWith('vi') ? 'vi' : 'en'; } catch (e) { return 'vi'; }
  }

  let loopTimer = 0;
  let lastSave = Date.now();
  let loginShownFor = null;
  let throttled = 0;
  let badgeTimer = 0;

  const APP = NOA.app = {
    boot(hot) {
      let state = hot && hot.state ? hot.state : NOA.save.load();
      const fresh = !state;
      if (fresh) state = NOA.newState(detectLang());
      else fillDefaults(state, NOA.newState(state.lang));
      NOA.state = state;
      if (fresh) NOA.seedNewGame();
      NOA.i18n.setLang(state.lang);

      NOA.secrets.init();
      NOA.essence.init();
      NOA.ui.story.init();

      // catch up on time spent away
      NOA.farm.grantFreePlots();
      NOA.orders.fill();
      NOA.labs.ids.forEach((l) => NOA.labs.syncSlots(l));
      NOA.ship.tick();

      UI.mount();
      UI.fx.init();
      UI.hud.render();
      UI.show('farm');
      APP.wire();
      APP.startLoop();

      const warnings = NOA.validateConfig();
      if (warnings.length) console.warn('[Noa Farm] config warnings:\n - ' + warnings.join('\n - '));

      const unlockAudio = () => { NOA.audio.unlock(); document.removeEventListener('pointerdown', unlockAudio, true); };
      document.addEventListener('pointerdown', unlockAudio, true);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') UI.closeTopModal(); });
      document.addEventListener('visibilitychange', () => { if (document.hidden) NOA.save.write(); });
      addEventListener('pagehide', () => NOA.save.write());

      if (!state.seen.intro) UI.story.intro(() => APP.afterIntro());
      else setTimeout(APP.maybeLogin, 600);

      try {
        const h = globalThis.claude && globalThis.claude.hot;
        if (h && typeof h.snapshot === 'function') h.snapshot(() => ({ state: NOA.state }));
      } catch (e) { /* not inside the artifact viewer */ }
      NOA.save.write();
    },

    afterIntro() {
      UI.hud.sayDefault();
      UI.story.applyFocus();
      setTimeout(APP.maybeLogin, 900);
    },

    maybeLogin() {
      const day = NOA.time.dayKey();
      if (loginShownFor === day || !S().seen.intro) return;
      if (NOA.rewards.login.canClaim() && !UI.hasModal()) {
        loginShownFor = day;
        UI.panels.loginModal(true);
      }
    },

    wire() {
      const on = NOA.events.on;
      const farm = UI.screens.farm;
      const PN = UI.panels;
      const cur = (id) => UI.current === id;
      const labBuildings = () => { farm.updateBuilding('greenhouse'); farm.updateBuilding('ranch'); };
      on('grid.changed', (e) => {
        if (cur('breed')) {
          if (e.expanded || e.pending || e.flushed || e.grid !== UI.screens.breed.grid) UI.screens.breed.build();
          else UI.screens.breed.renderCells();
          UI.story.applyFocus();
        }
        labBuildings();
        PN.refreshSheet('item:');
        PN.refreshSheet('picker:');
      });
      on('barn.changed', () => {
        farm.updateBuilding('barn');
        farm.updateBuilding('orders');
        ['factory:', 'pen:', 'good:', 'ship', 'picker:', 'plot:'].forEach((k) => PN.refreshSheet(k));
        if (cur('barn')) UI.screens.barn.render();
        if (cur('orders')) { UI.screens.orders.render(); UI.story.applyFocus(); }
        APP.badgesSoon();
      });
      on('orders.changed', () => {
        farm.updateBuilding('orders');
        if (cur('orders')) { UI.screens.orders.render(); UI.story.applyFocus(); }
        APP.badgesSoon();
      });
      on('field.changed', (e) => {
        if (e && e.bed) farm.updatePlots(e.bed);
        else { farm.updatePlots('crop'); farm.updatePlots('flower'); }
        PN.refreshSheet('plot:');
        PN.refreshSheet('picker:');
        UI.story.applyFocus();
      });
      on('pens.changed', (e) => {
        if (e && e.penId) farm.updateBuilding(e.penId);
        else for (const id in S().pens) farm.updateBuilding(id);
        PN.refreshSheet('pen:');
      });
      on('factory.changed', (e) => { farm.updateBuilding(e.building); PN.refreshSheet('factory:'); });
      on('ship.changed', () => { farm.updateBuilding('dock'); PN.refreshSheet('ship'); if (cur('orders')) UI.screens.orders.render(); });
      const labChanged = () => {
        UI.labs.refresh();
        labBuildings();
        if (cur('breed')) UI.screens.breed.build();
        APP.badgesSoon();
      };
      on('lab.changed', labChanged);
      on('lab.upgraded', labChanged);
      on('booster.used', () => { if (cur('breed')) UI.screens.breed.renderBag(); PN.refreshSheet('item:'); });
      on('rewards.granted', () => { UI.hud.update(); if (cur('breed')) UI.screens.breed.renderBag(); });
      on('res.changed', (e) => {
        UI.hud.update();
        if (e && (e.k === 'coins' || e.k === 'gems' || e.k === 'rp' || e.k === 'all' || e.k === 'tickets')) {
          clearTimeout(throttled);
          throttled = setTimeout(() => {
            if (cur('shop') || cur('barn')) UI.screens[UI.current].render();
            UI.labs.refresh();
            farm.updateBuilding('wishtree');
          }, 120);
        }
      });
      on('xp.changed', () => UI.hud.update());
      on('level.up', (e) => { PN.levelUp(e); UI.hud.update(); farm.updateAll(); });
      on('secret.unlocked', (e) => setTimeout(() => PN.secret(e), 500));
      on('gene.discovered', (e) => UI.hud.say(NOA.t('bean.gene', { gene: NOA.CONTENT.genes[e.gene].emoji + ' ' + NOA.t('gene.' + e.gene) }), 9000, true));
      on('mascots.changed', () => { UI.hud.updateSky(); if (cur('codex')) UI.screens.codex.render(); });
      on('mascot.expired', (e) => UI.toast(NOA.t('mascot.expired', { name: NOA.CONTENT.mascots[e.id].emoji + ' ' + NOA.t('mascot.' + e.id) })));
      on('earth.changed', () => UI.hud.updateSky());
      on('lang.changed', () => { if (S()) { S().lang = NOA.i18n.lang; PN.closeSheet(); UI.renderAll(); UI.hud.render(); UI.story.applyFocus(); } });
      on('payment.completed', () => UI.hud.update());
      on('essence.changed', () => { UI.labs.refresh(); if (cur('breed')) UI.screens.breed.build(); });
    },

    /** Tab badges follow the barn, orders and labs; batch their refresh */
    badgesSoon() {
      if (badgeTimer) return;
      badgeTimer = setTimeout(() => { badgeTimer = 0; UI.renderTabs(); }, 150);
    },

    startLoop() {
      clearInterval(loopTimer);
      let n = 0;
      loopTimer = setInterval(() => {
        n += 1;
        try {
          NOA.farm.tick();
          NOA.production.tick();
          NOA.ship.tick();
          NOA.orders.tick();
          NOA.labs.tick();
          NOA.mascots.tick();
          NOA.secrets.tick();
          UI.hud.tick();
          UI.screens.farm.tick();
          UI.screens.orders.tick();
          UI.panels.tick();
          UI.labs.tick();
          if (n % 8 === 0) { UI.renderTabs(); APP.maybeLogin(); }
          if (Date.now() - lastSave > 10000) { lastSave = Date.now(); NOA.save.write(); }
        } catch (e) {
          console.error('[Noa Farm loop]', e);
        }
      }, 250);
    },

    reset() {
      const lang = S().lang;
      NOA.save.clear();
      NOA.state = NOA.newState(lang);
      NOA.seedNewGame();
      NOA.orders.fill();
      NOA.ship.tick();
      UI.panels.closeSheet();
      UI.current = 'farm';
      UI.mount();
      UI.hud.render();
      UI.show('farm');
      NOA.save.write();
      UI.story.intro(() => APP.afterIntro());
    }
  };

  function start(data) { APP.boot(data || {}); }
  function ready() {
    const hot = globalThis.claude && globalThis.claude.hot;
    if (hot && typeof hot.ready === 'function') hot.ready(start);
    else start(hot && hot.data ? hot.data : {});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready);
  else ready();
})();

</script>
