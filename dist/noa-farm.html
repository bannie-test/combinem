<title>Noa Farm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Noa Farm — nông trại merge trên hành tinh hạt giống: bản đồ chia khu, kho hạt giống merge, chuồng trại, xưởng chế biến. Merge farming game prototype.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Coiny&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* css/base.css */
/* Layout: one phone-width column. HUD bar → active screen (the farm map fills it) → tab bar.
   Panels are "seed-paper" cards with chunky ink outlines and a pressed-down shadow, like a hand-drawn seed packet. */
:root {
  --ink: #3a2a4d;
  --ink-2: #6b5b80;
  --ink-3: #9a8cad;
  --paper: #fffaf0;
  --paper-2: #fbefd9;
  --paper-3: #f1dfc2;
  --leaf: #5cbb49;
  --leaf-d: #3f8e31;
  --sun: #ffc83a;
  --sun-d: #e3a118;
  --berry: #ff6b8e;
  --berry-d: #d6476c;
  --sky: #56c1ff;
  --sky-d: #2a93d4;
  --grass: #b6e58b;
  --grass-d: #8fcb63;
  --soil: #c08a5f;
  --soil-d: #8a5a37;
  --cell: #f7fce9;
  --page: #dff2cf;
  --white: #ffffff;
  --shade: rgba(58, 42, 77, 0.18);
  --scrim: rgba(36, 24, 52, 0.55);

  --r-common: #9aa69a;
  --r-rare: #3ea8f4;
  --r-epic: #a560f0;
  --r-legendary: #ffb21f;
  --r-mythic: #ff58a6;

  --font-display: "Coiny", "Baloo 2", "Nunito", system-ui, sans-serif;
  --font-ui: "Baloo 2", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: "Nunito", "Baloo 2", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --line: 3px;
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --pop: 0 4px 0 var(--ink);
  --pop-sm: 0 3px 0 var(--ink);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--page);
  background-image: radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.55) 0 2px, transparent 3px),
    radial-gradient(circle at 80% 40%, rgba(255, 255, 255, 0.45) 0 2px, transparent 3px);
  background-size: 46px 46px, 64px 64px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--font-ui); line-height: 1.25; margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--sky-d); outline-offset: 2px; border-radius: 8px; }
.muted { color: var(--ink-2); }
.tiny { font-size: 11.5px; }
.num { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ app frame */
.app {
  max-width: 480px;
  margin: 0 auto;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-block: 8px 0;
}
/* one-screen app: the screen area scrolls, the HUD and tab bar stay put; the farm map fills its screen */
.screens { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; position: relative; }
.screen { display: flex; flex-direction: column; gap: 8px; padding-block: 8px 12px; min-height: 100%; }
.screen.scr-farm { height: 100%; min-height: 0; padding-block: 6px 8px; }

/* ------------------------------------------------------------ buttons */
.btn {
  appearance: none;
  border: var(--line) solid var(--ink);
  border-radius: 14px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 15px;
  line-height: 1.2;
  padding: 8px 14px 7px;
  box-shadow: var(--pop);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s;
  white-space: nowrap;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { filter: grayscale(0.7) opacity(0.6); cursor: not-allowed; }
.btn--leaf { background: var(--leaf); color: var(--white); text-shadow: 0 2px 0 var(--leaf-d); }
.btn--sun { background: var(--sun); }
.btn--berry { background: var(--berry); color: var(--white); text-shadow: 0 2px 0 var(--berry-d); }
.btn--sky { background: var(--sky); color: var(--white); text-shadow: 0 2px 0 var(--sky-d); }
.btn--ghost { background: var(--paper-2); }
.btn--sm { font-size: 13px; padding: 4px 10px 3px; border-radius: 11px; box-shadow: var(--pop-sm); border-width: 2.5px; }
.btn--block { width: 100%; }
.btn-icon {
  appearance: none;
  border: 2.5px solid var(--ink);
  background: var(--paper);
  border-radius: 10px;
  width: 30px;
  height: 30px;
  display: inline-grid;
  place-items: center;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 2px 0 var(--ink);
  padding: 0;
}
.chip-btn {
  appearance: none;
  border: 2.5px solid var(--ink);
  background: var(--paper-2);
  border-radius: 999px;
  padding: 3px 10px;
  font-family: var(--font-ui);
  font-weight: 700;
  cursor: pointer;
}

/* ------------------------------------------------------------ cards / panels */
.panel {
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: var(--r-lg);
  box-shadow: var(--pop);
  padding: 14px;
}
.panel-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 17px;
}
.seg {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 4px;
}
.seg::-webkit-scrollbar { display: none; }
.seg button {
  flex: 0 0 auto;
  appearance: none;
  border: 2.5px solid var(--ink);
  background: var(--paper);
  border-radius: 999px;
  padding: 4px 12px 3px;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 2px 0 var(--ink);
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* ------------------------------------------------------------ tab bar */
.tabbar {
  position: relative;
  flex: 0 0 auto;
  z-index: 40;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 4px;
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-bottom: 0;
  border-radius: 22px 22px 0 0;
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -4px 0 rgba(58, 42, 77, 0.08);
}
.tab {
  appearance: none;
  border: 0;
  background: transparent;
  border-radius: 14px;
  padding: 4px 2px 3px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  cursor: pointer;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 11.5px;
  color: var(--ink-2);
  position: relative;
  min-width: 0;
}
.tab > span:not(.ti):not(.badge-dot) { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .ti { font-size: 22px; line-height: 1.1; transition: transform 0.2s cubic-bezier(.3, 1.6, .5, 1); }
.tab[aria-current="page"] { background: var(--sun); color: var(--ink); box-shadow: inset 0 0 0 2.5px var(--ink); }
.tab[aria-current="page"] .ti { transform: translateY(-2px) scale(1.12); }
.tab .badge-dot {
  position: absolute;
  top: 3px;
  right: 18%;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--berry);
  border: 2px solid var(--ink);
}
.tab .badge-dot.n {
  width: auto;
  height: auto;
  min-width: 18px;
  top: 0;
  right: 12%;
  border-radius: 9px;
  padding: 1px 4px 0;
  font-size: 10.5px;
  line-height: 13px;
  color: #fff;
}

/* ------------------------------------------------------------ modals */
#modals { position: relative; z-index: 800; }
.modal-wrap {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: fadeIn 0.18s ease;
}
.modal-wrap.closing { animation: fadeOut 0.18s ease forwards; }
.modal-bg { position: absolute; inset: 0; background: var(--scrim); }
.modal {
  position: relative;
  width: min(420px, 100%);
  max-height: min(86vh, 760px);
  overflow: auto;
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: 24px;
  box-shadow: 0 6px 0 var(--ink);
  padding: 18px 16px 16px;
  animation: popIn 0.32s cubic-bezier(.2, 1.5, .4, 1);
}
.modal-title { text-align: center; padding: 0 30px 10px; }
.modal-title h2 { font-size: 21px; font-weight: 800; }
.modal-x { position: absolute; top: 10px; right: 10px; }
.modal-body { display: flex; flex-direction: column; gap: 12px; }
.modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

/* ------------------------------------------------------------ toasts */
#toasts {
  position: fixed;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 150px);
  transform: translateX(-50%);
  z-index: 990;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
  width: min(440px, calc(100vw - 32px));
}
.toast {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: 14px;
  padding: 7px 14px 6px;
  border-radius: 14px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
  animation: toastIn 0.25s cubic-bezier(.2, 1.5, .4, 1);
  text-align: center;
  max-width: 100%;
}
.toast.out { animation: fadeOut 0.3s ease forwards; }
.toast--good { background: var(--leaf-d); }
.toast--warn { background: var(--berry-d); }

/* ------------------------------------------------------------ reward chips */
.rewards { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.rchip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--paper-2);
  border: 2.5px solid var(--ink);
  border-radius: 14px;
  padding: 5px 10px 4px;
  font-family: var(--font-ui);
  font-weight: 800;
  animation: popIn 0.4s cubic-bezier(.2, 1.6, .4, 1) both;
}
.rchip .ri { font-size: 20px; line-height: 1; }
.rchip small { font-weight: 700; color: var(--ink-2); font-size: 12px; }

/* ------------------------------------------------------------ keyframes */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes popIn { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes toastIn { from { transform: translateY(-10px) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes wiggle { 0%, 86%, 100% { transform: rotate(0); } 89% { transform: rotate(-8deg); } 93% { transform: rotate(7deg); } 97% { transform: rotate(-4deg); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes spinC { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes shakeX { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

.bump { animation: bump 0.35s cubic-bezier(.3, 1.6, .5, 1); }
.shake { animation: shakeX 0.4s ease; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* css/game.css */
/* ============================================================ HUD BAR */
.hud-bar { position: relative; z-index: 30; flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 2px 0 6px; }
.hud-bar .grow { flex: 1; min-width: 0; display: flex; gap: 5px; }
.lvl {
  appearance: none;
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: var(--line) solid var(--ink);
  padding: 0;
  cursor: pointer;
  position: relative;
  display: grid;
  place-items: center;
  background: conic-gradient(var(--leaf) calc(var(--p, 0) * 360deg), var(--paper-3) 0);
  box-shadow: var(--pop-sm);
}
.lvl::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--sun); border: 2px solid var(--ink); }
.lvl b { position: relative; font-family: var(--font-display); font-size: 17px; line-height: 1; padding-top: 2px; }
.pill {
  appearance: none;
  flex: 1 1 0;
  min-width: 0;
  height: 34px;
  border: 2.5px solid var(--ink);
  border-radius: 999px;
  background: var(--paper);
  box-shadow: 0 2px 0 var(--ink);
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 0 10px 0 5px;
  cursor: pointer;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 15px;
  white-space: nowrap;
  position: relative;
}
.pill .pi { font-size: 16px; width: 22px; flex: 0 0 auto; text-align: center; }
.pill b { font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
.hud-btn { position: relative; flex: 0 0 auto; width: 36px; height: 36px; font-size: 17px; border-radius: 12px; }
.hud-btn .dot, .gift-btn .dot {
  position: absolute;
  top: -4px;
  right: -4px;
  width: 11px;
  height: 11px;
  background: var(--berry);
  border: 2px solid var(--ink);
  border-radius: 50%;
}

/* ============================================================ FARM MAP */
.map-vp {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  border: var(--line) solid var(--ink);
  border-radius: 24px;
  box-shadow: var(--pop);
  background: #96d26c;
  isolation: isolate;
  cursor: grab;
}
.map-vp:active { cursor: grabbing; }
.map-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; --z: 1; }
.map-ground {
  position: absolute;
  inset: 0;
  border-radius: 28px;
  background-color: #a8dc7e;
  background-image: radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.2) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(60, 120, 40, 0.2) 0 2px, transparent 3px);
  background-size: 38px 38px, 52px 52px;
}

/* zones: each area is its own patch of ground with a hanging sign */
.zone {
  position: absolute;
  border: 3px solid rgba(58, 42, 77, 0.6);
  border-radius: 26px;
  box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.28), 0 4px 0 rgba(58, 42, 77, 0.22);
}
.zone--cobble {
  background: radial-gradient(ellipse at center, #e9d5b1 0 52%, transparent 56%) 0 0 / 28px 20px,
    radial-gradient(ellipse at center, #e9d5b1 0 52%, transparent 56%) 14px 10px / 28px 20px, #f5e8cf;
}
.zone--soil { background: #b4de88; }
.zone--soil::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 4px dashed #b07a45;
  border-radius: 20px;
  pointer-events: none;
}
.zone--garden { background: radial-gradient(circle, #ffc6dc 0 2.5px, transparent 3.5px) 0 0 / 24px 24px, radial-gradient(circle, #fff3a8 0 2px, transparent 3px) 12px 12px / 24px 24px, #c8eaa0; }
.zone--stone {
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.45) 2px, transparent 2px) 0 0 / 34px 34px,
    linear-gradient(0deg, rgba(255, 255, 255, 0.45) 2px, transparent 2px) 0 0 / 34px 34px, #cfe2e8;
}
.zone--meadow { background: radial-gradient(circle at 30% 40%, #8dcd5c 0 3px, transparent 4px) 0 0 / 30px 26px, #bbe991; }
.zone--wood { background: repeating-linear-gradient(0deg, #e4bc89 0 22px, #d3a672 22px 24px); }
.zone--pad { background: repeating-linear-gradient(45deg, rgba(58, 42, 77, 0.05) 0 10px, transparent 10px 20px), #dfe4ec; }
.zone-sign {
  position: absolute;
  left: 14px;
  top: -15px;
  z-index: 3;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: clamp(14px, calc(12.5px / var(--z)), 21px);
  line-height: 1.25;
  white-space: nowrap;
  color: var(--ink);
  background: linear-gradient(180deg, #ffe4b5, #f0c07c);
  border: 3px solid var(--ink);
  border-radius: 12px;
  padding: 2px 10px 0 7px;
  box-shadow: 0 3px 0 var(--ink);
  pointer-events: none;
}
.zone-sign .zi { font-size: 1.1em; }
.pond {
  position: absolute;
  border-radius: 48% 52% 46% 54%;
  background: radial-gradient(circle at 40% 35%, #c8f2ff, #69c5ec 72%);
  border: 3px solid var(--ink);
  box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.08);
}
.pond .lily { position: absolute; left: 22%; top: 30%; font-size: 22px; }
.pond .duck { position: absolute; left: 50%; top: 46%; font-size: 26px; animation: swim 9s ease-in-out infinite; }
@keyframes swim { 0%, 100% { transform: translateX(-14px); } 50% { transform: translateX(16px) scaleX(-1); } }
.deco { position: absolute; line-height: 1; pointer-events: none; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.14)); }

/* ------------------------------------------------------------ fields */
.plot {
  position: absolute;
  appearance: none;
  padding: 0;
  margin: 0;
  cursor: pointer;
  font: inherit;
  color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: 16px;
  background: repeating-linear-gradient(0deg, #b9824f 0 10px, #a8703f 10px 13px);
  box-shadow: 0 4px 0 rgba(58, 42, 77, 0.5), inset 0 3px 0 rgba(255, 255, 255, 0.16);
  display: grid;
  place-items: center;
  overflow: visible;
}
.plot--flower { background: repeating-linear-gradient(90deg, #946042 0 12px, #82523a 12px 15px); border-radius: 22px; }
.plot .p-hint { font-size: 26px; font-weight: 800; color: rgba(255, 255, 255, 0.55); line-height: 1; }
.p-plants { position: absolute; inset: 7px 8px 13px; display: grid; grid-template-columns: repeat(3, 1fr); place-items: center; pointer-events: none; }
.plot--flower .p-plants { grid-template-columns: repeat(5, 1fr); inset: 5px 8px 9px; }
.p-plants .pl {
  font-size: 22px;
  line-height: 1;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.22));
  transform-origin: 50% 100%;
  animation: sway 3.2s ease-in-out infinite;
  animation-delay: calc(var(--k) * -0.45s);
}
.st-s1 .pl { font-size: 15px; }
.st-s2 .pl { font-size: 18px; }
.st-s3 .pl { font-size: 20px; filter: saturate(0.7) drop-shadow(0 2px 0 rgba(0, 0, 0, 0.22)); }
.plot.ready .pl { font-size: 24px; animation: readyBounce 0.9s ease-in-out infinite; animation-delay: calc(var(--k) * 0.07s); }
.plot.ready { box-shadow: 0 4px 0 rgba(58, 42, 77, 0.5), 0 0 0 3px #ffe27a, 0 0 18px 4px rgba(255, 214, 90, 0.75); }
.plot.has-gene { box-shadow: 0 4px 0 rgba(58, 42, 77, 0.5), 0 0 0 3px var(--gc), 0 0 16px 3px var(--gc); }
@keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
.p-bar { position: absolute; left: 12px; right: 12px; bottom: 4px; height: 7px; border-radius: 5px; background: rgba(255, 255, 255, 0.5); border: 1.5px solid var(--ink); overflow: hidden; }
.p-bar i { display: block; height: 100%; background: var(--leaf); transition: width 0.25s linear; }
.p-tag, .p-sign {
  position: absolute;
  left: 50%;
  bottom: -11px;
  transform: translateX(-50%);
  z-index: 2;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: clamp(12px, calc(10.5px / var(--z)), 16px);
  line-height: 1.2;
  white-space: nowrap;
  background: var(--sun);
  border: 2.5px solid var(--ink);
  border-radius: 9px;
  padding: 1px 7px 0;
  box-shadow: 0 2px 0 var(--ink);
}
.p-sign { position: static; transform: none; background: linear-gradient(180deg, #ffe7bd, #f0c486); }
.p-gene {
  position: absolute;
  left: -9px;
  top: -9px;
  z-index: 2;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  font-size: 13px;
  border-radius: 50%;
  background: var(--paper);

}
.p-fert { position: absolute; right: 3px; top: 1px; font-size: 14px; line-height: 1; filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.8)); }

/* ------------------------------------------------------------ buildings */

}
.bld .b-art { position: absolute; left: 0; right: 0; top: 10px; bottom: 26px; }
.b-wall {

  right: 9%;
  top: 40%;
  bottom: 0;
  background: linear-gradient(180deg, #fff8e8, #f1dcb6);
  border: 3px solid var(--ink);
  border-radius: 6px 6px 10px 10px;
  box-shadow: 0 4px 0 rgba(58, 42, 77, 0.42);
}
.b-door {
  position: absolute;
  left: 50%;
  bottom: -3px;

}
.bld--barn .b-wall { background: linear-gradient(180deg, #e65b4b, #c8443a); }
.bld--barn .b-door { background: repeating-linear-gradient(45deg, #fff 0 4px, #c8443a 4px 10px); }
.bld .b-emo {
  position: absolute;
  left: 50%;
  top: 34%;

}
.bld .b-lv {

  right: 0;
  top: 22%;
  z-index: 3;
  background: var(--ink);

  font-size: 12px;

}
.bld .b-name {

  bottom: 0;

}

.bld .b-bubble {
  position: absolute;
  right: -6px;
  top: -12px;
  z-index: 6;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: clamp(12px, calc(11px / var(--z)), 18px);

.bld .b-lock {

  top: 42%;

/* order board */
.bld--orders .board {

.bld--orders .board::before, .bld--orders .board::after {

}
.bld--orders .board::before { left: 14%; }
.bld--orders .board::after { right: 14%; }
.bld--orders .board i { background: #fffaf0; border: 2px solid var(--ink); border-radius: 3px; transform: rotate(-3deg); }

}

/* wish tree & shrine */
.bld--gacha .tree, .bld--shrine .torii { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); line-height: 1; filter: drop-shadow(0 4px 0 rgba(58, 42, 77, 0.3)); }

.bld--shrine .torii { font-size: 76px; }

/* workshop smoke */
.bld--factory .smoke { position: absolute; right: 20%; top: 0; width: 20px; height: 20px; pointer-events: none; }
.bld--factory .smoke i { position: absolute; left: 4px; bottom: 0; width: 12px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, 0.85); border: 1.5px solid rgba(58, 42, 77, 0.35); opacity: 0; }
.bld--factory.working .smoke i { animation: puff 2.4s ease-out infinite; }

.bld--factory.working .smoke i:nth-child(3) { animation-delay: 1.6s; }
@keyframes puff { 0% { transform: translate(0, 0) scale(0.5); opacity: 0.9; } 100% { transform: translate(10px, -34px) scale(1.6); opacity: 0; } }

/* ------------------------------------------------------------ pens */
.bld--pen .pen-yard {
  position: absolute;

  border-radius: 18px;
  background: linear-gradient(180deg, #c2eb98, #a9dc7a);
  box-shadow: inset 0 0 0 5px #d9a466, inset 0 0 0 7px rgba(58, 42, 77, 0.35), 0 4px 0 rgba(58, 42, 77, 0.4);
}
.pen-apiary .pen-yard { background: radial-gradient(circle, #ffe37a 0 2px, transparent 3px) 0 0 / 18px 18px, linear-gradient(180deg, #fff1b8, #f6dc84); }
.pen-cowshed .pen-yard { background: linear-gradient(180deg, #d6eea9, #bcdc8a); }
.pen-goatpen .pen-yard { background: radial-gradient(circle, #c9b48f 0 3px, transparent 4px) 0 0 / 26px 22px, linear-gradient(180deg, #d9e8a4, #c4d98a); }
.pen-shed {
  position: absolute;
  left: 9px;
  top: 9px;
  width: 54px;
  height: 38px;
  background-color: var(--roof);
  background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.16) 0 7px, transparent 7px 14px);
  border: 3px solid var(--ink);
  border-radius: 12px 12px 5px 5px;
}
.pen-shed .b-emo { top: 50%; width: 32px; height: 32px; font-size: 18px; border-width: 2.5px; }
.trough { position: absolute; right: 12px; top: 18px; width: 44px; height: 13px; background: #a0683f; border: 2.5px solid var(--ink); border-radius: 4px 4px 9px 9px; }
.an { position: absolute; width: 34px; height: 34px; display: grid; place-items: center; }
.an-e { display: block; font-size: calc(30px * var(--as, 0.9)); line-height: 1; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.2)); animation: wander 7s ease-in-out infinite; animation-delay: calc(var(--d, 0s) * -1); }
.an.empty { font-size: 14px; color: rgba(58, 42, 77, 0.4); border: 2px dashed rgba(58, 42, 77, 0.3); border-radius: 50%; }
.an.has-gene .an-e { filter: drop-shadow(0 0 5px var(--gc)) drop-shadow(0 2px 0 rgba(0, 0, 0, 0.2)); }
.an.done .an-e { animation: readyBounce 0.9s ease-in-out infinite; }
.an-think, .an-prod {
  position: absolute;
  right: -11px;
  top: -13px;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  font-size: 13px;
  line-height: 1;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 50%;
}
.an-prod { background: #fff4b8; font-size: 15px; animation: readyBounce 0.9s ease-in-out infinite; }
.an-ring { position: absolute; right: -3px; bottom: -2px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: conic-gradient(var(--leaf) calc(var(--p, 0) * 360deg), var(--paper) 0); }
@keyframes wander {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(5px); }
  45% { transform: translateX(5px) scaleX(-1); }
  70% { transform: translateX(-5px) scaleX(-1); }
  85% { transform: translateX(-5px); }
}

/* ------------------------------------------------------------ bee-ship dock */
.bld--ship .pad {
  position: absolute;
  inset: 0 0 22px 0;
  background: radial-gradient(ellipse at 30% 50%, #f8f8fb 0 26%, #d9dee8 27% 52%, #c8cfdb 53%);
  border: 3px solid var(--ink);
  border-radius: 24px;
  box-shadow: 0 4px 0 rgba(58, 42, 77, 0.4), inset 0 0 0 5px rgba(255, 200, 58, 0.55);
}
.pad-h { position: absolute; left: 30%; top: 50%; transform: translate(-50%, -50%); font-family: var(--font-display); font-size: 40px; color: rgba(58, 42, 77, 0.12); }
.ship { position: absolute; left: 15%; top: 50%; transform: translateY(-50%); font-size: 50px; line-height: 1; animation: hover 2.6s ease-in-out infinite; }
.ship-body { display: inline-block; transform: rotate(-45deg); filter: drop-shadow(0 4px 0 rgba(58, 42, 77, 0.3)); }
.ship-bee { position: absolute; right: -16px; top: -8px; font-size: 22px; }
@keyframes hover { 0%, 100% { margin-top: 0; } 50% { margin-top: -6px; } }
.crates { position: absolute; right: 7%; top: 50%; transform: translateY(-50%); display: flex; gap: 6px; }
.crate {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  font-size: 21px;
  line-height: 1;
  background: linear-gradient(180deg, #f0c18c, #d99e62);

}

/* ------------------------------------------------------------ sky over the farm */
.map-shade { position: absolute; inset: 0; z-index: 2; pointer-events: none; transition: background-color 1s ease; }
.map-vp.ph-night .map-shade {
  background-color: rgba(26, 28, 92, 0.42);
  background-image: radial-gradient(2px 2px at 14% 30%, #f6ff9e 99%, transparent), radial-gradient(2px 2px at 64% 22%, #f6ff9e 99%, transparent),
    radial-gradient(1.5px 1.5px at 42% 70%, #f6ff9e 99%, transparent), radial-gradient(2px 2px at 84% 58%, #f6ff9e 99%, transparent);
  animation: twinkle 3s ease-in-out infinite alternate;
}
.map-vp.ph-dusk .map-shade { background-color: rgba(255, 110, 70, 0.13); }
.map-vp.ph-dawn .map-shade { background-color: rgba(255, 190, 140, 0.12); }
.map-shade::before, .map-shade::after { content: ""; position: absolute; inset: 0; opacity: 0; }
.map-vp.wx-cloudy .map-shade::before { opacity: 1; background: linear-gradient(180deg, rgba(150, 160, 180, 0.22), rgba(150, 160, 180, 0.08)); }
.map-vp.wx-rain .map-shade::before, .map-vp.wx-storm .map-shade::before {
  opacity: 0.6;
  background-color: rgba(90, 110, 150, 0.12);
  background-image: repeating-linear-gradient(105deg, transparent 0 9px, rgba(255, 255, 255, 0.6) 9px 10px, transparent 10px 22px);
  background-size: 120px 120px;
  animation: rain 0.5s linear infinite;
}
.map-vp.wx-storm .map-shade::after { background: #fff; animation: lightning 7s infinite; }
.map-vp.rainbow .map-shade::after {
  opacity: 0.55;
  background: radial-gradient(circle at 50% 110%, transparent 0 44%, #ff5f7e 45%, #ffb21f 48%, #f9f871 51%, #5cbb49 54%, #56c1ff 57%, #a560f0 60%, transparent 63%);
}
@keyframes twinkle { from { opacity: 0.8; } to { opacity: 1; } }
@keyframes rain { to { background-position: -40px 120px; } }
@keyframes lightning { 0%, 92%, 100% { opacity: 0; } 93% { opacity: 0.6; } 94% { opacity: 0.08; } 95% { opacity: 0.5; } }

/* ------------------------------------------------------------ widgets over the map */
.map-ui { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.bean-dock { position: absolute; left: 8px; top: 8px; right: 56px; display: flex; align-items: flex-start; gap: 4px; pointer-events: none; }

.bean {
  appearance: none;

  border: 0;
  padding: 0;
  width: 44px;
  height: 52px;
  flex: 0 0 auto;
  cursor: pointer;
  position: relative;
  animation: bob 2.6s ease-in-out infinite;
}
.bean-body {
  position: absolute;
  left: 4px;
  bottom: 2px;
  width: 36px;
  height: 38px;
  background: radial-gradient(circle at 34% 30%, #c4f19b 0 22%, #8fd365 60%);
  border: var(--line) solid var(--ink);
  border-radius: 52% 48% 46% 50% / 56% 56% 44% 44%;
}
.bean-body .eye { position: absolute; top: 13px; width: 6px; height: 8px; background: var(--ink); border-radius: 50%; animation: blink 4s infinite; }
.bean-body .eye.l { left: 8px; }
.bean-body .eye.r { right: 8px; }
.bean-body .blush { position: absolute; top: 22px; left: 5px; right: 5px; height: 5px; background: radial-gradient(circle at 15% 50%, #ff9db5 0 3px, transparent 4px), radial-gradient(circle at 85% 50%, #ff9db5 0 3px, transparent 4px); }
.bean-body .mouth { position: absolute; top: 22px; left: 50%; width: 8px; height: 4px; margin-left: -4px; border-bottom: 2.5px solid var(--ink); border-radius: 0 0 8px 8px; }
.bean .sprout { position: absolute; left: 20px; top: 0; width: 3px; height: 14px; background: var(--leaf-d); border-radius: 2px; }
.bean .sprout::before, .bean .sprout::after {
  content: "";
  position: absolute;
  top: 0;
  width: 12px;
  height: 8px;
  background: var(--leaf);
  border: 2px solid var(--ink);
  border-radius: 100% 0;
}
.bean .sprout::before { right: 2px; transform: rotate(-10deg); }
.bean .sprout::after { left: 2px; transform: scaleX(-1) rotate(-10deg); }
.bean.talk { animation: bump 0.4s ease; }
.bean.glitch .bean-body { animation: glitch 0.3s steps(2) 3; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
@keyframes glitch { 0% { filter: hue-rotate(0); transform: translateX(0); } 50% { filter: hue-rotate(160deg); transform: translateX(2px); } 100% { filter: hue-rotate(0); transform: translateX(-2px); } }
.bubble {
  position: relative;

  border: 2.5px solid var(--ink);

  padding: 5px 10px 4px;

  position: absolute;

.bubble.mini { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.bubble.pop { animation: popIn 0.3s cubic-bezier(.2, 1.6, .4, 1); }
.sky-widget { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; pointer-events: none; }
.sky-widget > button, .sky-widget > .sw-row { pointer-events: auto; }
.sw-row {
  display: flex;

  gap: 2px;
  background: rgba(255, 250, 240, 0.94);

.sw-row button { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; font-size: 18px; line-height: 1.15; }

.ev {

  padding: 1px 8px 0;

  font-weight: 800;

}
.sky-layer { position: absolute; left: 0; right: 0; top: 0; height: 150px; pointer-events: none; overflow: hidden; }
.zone-bar { position: absolute; left: 6px; right: 6px; bottom: 6px; display: flex; gap: 6px; align-items: center; pointer-events: none; }

.zoom-ctl .btn-icon { width: 32px; height: 32px; font-size: 16px; font-weight: 800; }
.sickle { position: fixed; z-index: 890; pointer-events: none; font-size: 34px; line-height: 1; transform: translate(-30%, -75%) rotate(-25deg); filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.3)); }

.meteor {
  position: absolute;
  pointer-events: auto;
  appearance: none;

  padding: 10px;

}
.meteor::before {
  content: "";
  position: absolute;
  right: 12px;
  top: 20px;
  width: 70px;
  height: 3px;
  border-radius: 3px;
  background: linear-gradient(90deg, transparent, #fff8c9);
  transform-origin: right center;
  transform: rotate(-24deg);
}
.meteor::after {
  content: "";
  position: absolute;
  right: 10px;
  top: 16px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #fffbe0;
  box-shadow: 0 0 10px 4px rgba(255, 245, 190, 0.9);
}
@keyframes meteorFly { from { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } to { transform: translate(-260px, 116px); opacity: 0; } }
.firefly {
  position: fixed;
  z-index: 700;
  appearance: none;
  border: 0;
  background: none;
  width: 48px;
  height: 48px;
  padding: 0;
  cursor: pointer;
  animation: fireflyDrift 9s ease-in-out forwards;
}
.firefly::before {
  content: "";
  position: absolute;
  inset: 16px;
  border-radius: 50%;
  background: #f6ff9e;
  box-shadow: 0 0 14px 7px rgba(240, 255, 120, 0.85);
  animation: pulse 0.9s ease-in-out infinite;
}
@keyframes fireflyDrift {
  0% { transform: translate(0, 0); opacity: 0; }
  10% { opacity: 1; }
  30% { transform: translate(-60px, -40px); }
  55% { transform: translate(-130px, 10px); }
  80% { transform: translate(-200px, -50px); opacity: 1; }
  100% { transform: translate(-260px, -20px); opacity: 0; }
}

/* ============================================================ ITEM ART (breeds & barn goods, shared everywhere) */
.art {
  --sz: var(--board-sz, 30px);
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  user-select: none;
  -webkit-user-select: none;
  border-radius: 12px;
}
.art .emo { position: relative; z-index: 1; font-size: var(--sz); line-height: 1; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.16)); }
.art .emo2 { position: absolute; z-index: 2; right: 8%; bottom: 14%; font-size: calc(var(--sz) * 0.55); line-height: 1; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.2)); }
.art--seed .emo { font-size: calc(var(--sz) * 0.62); margin-top: 18%; }
.art--seed .sack {
  position: absolute;
  inset: 16% 15% 7%;
  background: radial-gradient(circle at 30% 30%, #f9e1b5, #e5be86 70%);
  border: 2.5px solid #9a6a3b;
  border-radius: 38% 38% 34% 34% / 28% 28% 46% 46%;
}
.art--seed .sack::before {
  content: "";
  position: absolute;
  left: 22%;
  right: 22%;
  top: 14%;
  height: 4px;
  border-radius: 3px;
  background: #b17a40;
}
.art--animal .tuft {
  position: absolute;
  left: 16%;
  right: 16%;
  bottom: 9%;
  height: 18%;
  border-radius: 50%;
  background: radial-gradient(ellipse at 50% 40%, #9bd36f, #79b84f);
  opacity: 0.85;
}
.art--animal .emo { font-size: calc(var(--sz) * var(--as, 0.9)); }
.art .b-lv, .art .b-st {
  position: absolute;
  right: 1px;
  bottom: 1px;
  z-index: 3;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 10px;
  line-height: 1;
  padding: 2px 3px 1px;
  border-radius: 6px;
  background: var(--ink);
  color: var(--paper);
}
.art .b-st { background: var(--sun); color: var(--ink); border: 1.5px solid var(--ink); }
.art .b-gene {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 3;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 10px;
  background: var(--paper);
  border: 2px solid var(--gc, var(--ink));
}
.art .b-charm { position: absolute; right: 0; top: 0; z-index: 3; font-size: 12px; line-height: 1; filter: drop-shadow(0 1px 0 #fff); }
.art .b-lock { position: absolute; left: 1px; bottom: 1px; z-index: 3; font-size: 10px; line-height: 1; }
.art .b-carrier {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 3;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 9px;
  background: rgba(255, 255, 255, 0.7);
  border: 2px dashed var(--ink-3);
  opacity: 0.85;
}
/* gene aura */
.art.has-gene { box-shadow: 0 0 0 2px var(--gc), 0 0 12px 2px var(--gc); background: radial-gradient(circle, rgba(255, 255, 255, 0.7), transparent 70%); animation: aura 2.4s ease-in-out infinite; }
.art.gt-2 { box-shadow: 0 0 0 2px var(--gc), 0 0 0 4px #fff, 0 0 14px 4px var(--gc); }
.art.gt-3::before, .art.is-super::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 14px;
  padding: 3px;
  background: conic-gradient(from var(--ang, 0deg), #ff5fa2, #ffb21f, #f9f871, #5cbb49, #56c1ff, #a560f0, #ff5fa2);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: spinAng 3s linear infinite;
}
@property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes spinAng { to { --ang: 360deg; } }
.art.is-super { box-shadow: 0 0 16px 5px rgba(255, 210, 90, 0.85); }
@keyframes aura { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.12); } }

/* merge-grid item behaviours */
.cell > .art { position: absolute; inset: 1px; width: auto; height: auto; touch-action: none; cursor: grab; }
.cell > .art.dragging { opacity: 0.25; }
.cell > .art.hint { animation: hintPulse 0.8s ease-in-out infinite; }
.cell > .art.locked-item { filter: saturate(0.7); }
@keyframes hintPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.ghost { position: fixed; z-index: 880; pointer-events: none; transform: translate(-50%, -58%) scale(1.15); filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.25)); transition: none; }
.ghost.snap { transition: left 0.12s ease, top 0.12s ease, transform 0.12s ease; }
.pop-in { animation: mergePop 0.42s cubic-bezier(.2, 1.7, .4, 1) both; animation-delay: 0.05s; }
.fly-in { animation: flyIn 0.55s cubic-bezier(.25, 1.3, .5, 1) both; }
@keyframes mergePop { 0% { transform: scale(0.5); } 55% { transform: scale(1.28, 1.16); } 75% { transform: scale(0.94, 1.04); } 100% { transform: none; } }
@keyframes flyIn { 0% { transform: translate(var(--fx, 0), var(--fy, 0)) scale(0.35); } 70% { transform: translate(0, 0) scale(1.15); } 100% { transform: none; } }
.art--good .emo { font-size: var(--sz); }
@keyframes readyBounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.06); } }

.preview {
  position: fixed;
  z-index: 870;
  pointer-events: none;
  background: var(--paper);
  border: 2.5px solid var(--ink);
  border-radius: 12px;
  box-shadow: 0 3px 0 var(--ink);
  padding: 5px 8px 4px;
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: 12px;
  line-height: 1.3;
  min-width: 150px;
  max-width: 230px;
  transform: translate(-50%, calc(-100% - 10px));
}
.preview .pr { display: flex; justify-content: space-between; gap: 10px; }
.preview .pr b { font-variant-numeric: tabular-nums; }
.preview .pr.lock { color: var(--berry-d); }

/* ============================================================ BREEDING SCREEN (vault / nursery) */
.lab-strip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: 18px;
  padding: 6px 8px;
  box-shadow: var(--pop-sm);
}
.ls-art {
  position: relative;
  width: 44px;
  height: 44px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  font-size: 25px;
  background: linear-gradient(180deg, #d9f4ff, #b4e48c);
  border: 2.5px solid var(--ink);
  border-radius: 14px;
}
.ls-art b { position: absolute; right: -6px; bottom: -6px; background: var(--ink); color: var(--paper); font-family: var(--font-display); font-size: 11px; line-height: 1.2; border-radius: 8px; padding: 2px 5px 0; }
.ls-name { flex: 1; min-width: 0; font-family: var(--font-ui); font-weight: 800; font-size: 14.5px; line-height: 1.15; }
.ls-name small { display: block; font-weight: 600; font-size: 11px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grid-tip { font-size: 12px; color: var(--ink-2); font-weight: 700; line-height: 1.4; padding: 0 2px; }
.seg button small { font-size: 11px; opacity: 0.8; }
.seg button:disabled { opacity: 0.45; cursor: not-allowed; }
.mgrid {
  --board-sz: 33px;
  display: grid;
  grid-template-columns: repeat(var(--cols, 6), minmax(0, 1fr));
  gap: 4px;
  padding: 7px;
  background: linear-gradient(180deg, #e6c193, #c99a64);
  border: var(--line) solid var(--ink);
  border-radius: 22px;
  box-shadow: var(--pop);
  touch-action: manipulation;
}
.scr-breed .mgrid { background: linear-gradient(180deg, #e6c193, #c99a64); }
.mgrid .cell {
  position: relative;
  min-width: 0;
  aspect-ratio: 1;
  background: #fbf3e1;
  border-radius: 12px;
  box-shadow: inset 0 -3px 0 rgba(58, 42, 77, 0.1);
}
.mgrid .cell:nth-child(odd) { background: #f6ead0; }
.mgrid .cell.hover { box-shadow: inset 0 0 0 3px var(--sky-d); }
.mgrid .cell.hover-merge { box-shadow: inset 0 0 0 3px var(--leaf); background: #e2f7cf; }
.mgrid .cell.selected { box-shadow: inset 0 0 0 3px var(--ink); }

/* dock under the grid: sell bin · booster bag · quick sell */
.dock { display: flex; align-items: stretch; gap: 8px; }
.sell-bin {
  flex: 0 0 auto;
  appearance: none;
  border: var(--line) solid var(--ink);
  border-radius: 16px;
  background: var(--paper);
  box-shadow: var(--pop-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 58px;
  padding: 3px 0 2px;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 11px;
  cursor: pointer;
}
.sell-bin .di { font-size: 22px; line-height: 1.1; }
.sell-bin.hover { background: var(--sun); transform: scale(1.08); }
.bag {
  flex: 1;
  min-width: 0;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  background: var(--paper-2);
  border: var(--line) solid var(--ink);
  border-radius: 16px;
  padding: 5px;
  align-items: center;
  scrollbar-width: none;
}
.bag::-webkit-scrollbar { display: none; }
.boost {
  flex: 0 0 auto;
  position: relative;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  background: var(--paper);
  border: 2.5px solid var(--ink);
  border-radius: 12px;
  font-size: 22px;
  cursor: grab;
  touch-action: none;
  user-select: none;
}
.boost b {
  position: absolute;
  right: -3px;
  bottom: -4px;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 10.5px;
  line-height: 1;
  background: var(--ink);
  color: var(--paper);
  border-radius: 7px;
  padding: 2px 4px 1px;
}
.boost.empty { opacity: 0.38; cursor: default; }

/* ============================================================ BOTTOM SHEET (map panels, item info) */
.sheet {
  position: fixed;
  left: 50%;
  bottom: calc(74px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 60;
  width: min(448px, calc(100vw - 32px));
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: 22px;
  box-shadow: 0 6px 0 var(--ink), 0 12px 30px rgba(0, 0, 0, 0.18);
  padding: 12px;
  animation: sheetIn 0.25s cubic-bezier(.2, 1.4, .4, 1);
  max-height: 56vh;
  overflow: auto;
  overscroll-behavior: contain;
}
@keyframes sheetIn { from { transform: translate(-50%, 30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.sh-x { position: absolute; top: 10px; right: 10px; }
.sh-title { font-family: var(--font-ui); font-weight: 800; font-size: 16px; line-height: 1.25; padding-right: 36px; margin-bottom: 6px; }
.sh-head { display: flex; gap: 10px; align-items: center; padding-right: 30px; }
.sh-art { width: 58px; height: 58px; flex: 0 0 auto; background: var(--cell); border-radius: 14px; border: 2.5px solid var(--ink); }
.sh-art .art { --sz: 34px; }
.sh-name { font-family: var(--font-ui); font-weight: 800; font-size: 17px; line-height: 1.2; }
.sh-sub { font-size: 12.5px; color: var(--ink-2); font-weight: 700; }
.stats { display: grid; gap: 5px; margin-top: 10px; }
.stat { display: grid; grid-template-columns: 22px 88px 1fr 46px; align-items: center; gap: 6px; font-weight: 700; font-size: 12.5px; }
.stat .si { font-size: 15px; text-align: center; }
.stat .bar { height: 10px; border-radius: 6px; background: var(--paper-3); border: 2px solid var(--ink); overflow: hidden; position: relative; }
.stat .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--leaf); border-radius: 0 4px 4px 0; }
.stat .bar i.bonus { background: var(--gc, var(--sun)); }
.stat .sv { font-family: var(--font-ui); font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.stat .sv small { color: var(--leaf-d); }
.gene-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 800; font-size: 13px; padding: 6px 8px; border-radius: 12px; background: var(--paper-2); border: 2px dashed var(--paper-3); }
.gene-line.on { background: linear-gradient(90deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.6)), var(--gc); border: 2px solid var(--gc); }
.gene-line .pur { letter-spacing: 1px; color: var(--ink); }
.sh-meta { display: grid; gap: 3px; margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.sh-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.grow-row { display: flex; align-items: center; gap: 6px; font-family: var(--font-ui); font-weight: 800; font-size: 13.5px; margin-top: 8px; }
.pbar { flex: 1; min-width: 50px; height: 10px; border-radius: 6px; border: 2px solid var(--ink); background: var(--paper-3); overflow: hidden; display: block; }
.pbar i { display: block; height: 100%; background: var(--leaf); transition: width 0.25s linear; }
.slot-list { display: grid; gap: 6px; margin-top: 8px; }
.slot-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--paper-2); border: 2px solid var(--paper-3); border-radius: 14px; text-align: left; }
.slot-row.empty { appearance: none; width: 100%; border: 2.5px dashed var(--ink-3); background: transparent; cursor: pointer; font: inherit; font-family: var(--font-ui); font-weight: 800; color: var(--ink-2); }
.slot-row.done { opacity: 0.6; }
.sr-art { width: 44px; height: 44px; flex: 0 0 auto; display: grid; place-items: center; background: var(--cell); border: 2px solid var(--ink); border-radius: 12px; font-size: 20px; }
.sr-art .art { --sz: 26px; }
.sr-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-family: var(--font-ui); font-weight: 800; font-size: 13px; line-height: 1.2; }
.sr-state { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.sr-state.hungry { color: var(--berry-d); }
.sr-state.ready { color: var(--leaf-d); }
.queue { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.qslot {
  position: relative;
  width: 56px;
  height: 62px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  border: 2.5px solid var(--ink);
  border-radius: 12px;
  background: var(--paper-2);
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 10.5px;
}
.qslot .art { --sz: 24px; width: 34px; height: 34px; }
.qslot.empty { border-style: dashed; border-color: var(--ink-3); background: transparent; }
.qslot.ready { background: #d4f5bd; }
.qslot.run { background: #fff3c4; }
.qslot.wait { opacity: 0.75; }
.qslot.add { appearance: none; cursor: pointer; border-style: dashed; font-size: 18px; color: var(--ink-2); }
.qslot.add small { font-size: 10px; }
.recipes { display: grid; gap: 6px; margin-top: 10px; }
.recipe { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px; }
.recipe.locked { opacity: 0.55; border-style: dashed; }
.rc-art { width: 44px; height: 44px; flex: 0 0 auto; background: var(--cell); border: 2px solid var(--ink); border-radius: 12px; }
.rc-art .art { --sz: 26px; }
.rc-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.rc-name { font-family: var(--font-ui); font-weight: 800; font-size: 13.5px; line-height: 1.15; }
.rc-in { display: flex; flex-wrap: wrap; gap: 4px; }
.inp { display: inline-flex; align-items: center; gap: 2px; font-size: 15px; line-height: 1.3; background: #ffe3ea; border: 1.5px solid #f3a7ba; border-radius: 9px; padding: 0 5px; }
.inp b { font-family: var(--font-ui); font-size: 11px; }
.inp.ok { background: #e3f7d6; border-color: #9bd67f; }
.rc-meta { font-size: 11px; color: var(--ink-2); font-weight: 700; }

/* ============================================================ ORDERS SCREEN */
.row-title { display: flex; align-items: center; justify-content: space-between; font-family: var(--font-ui); font-weight: 800; font-size: 15px; color: var(--ink); padding: 0 4px; }
.orders-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; padding-top: 6px; }
.order {
  min-width: 0;
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: 18px;
  box-shadow: var(--pop-sm);
  padding: 7px 8px 8px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  position: relative;
}
.order.vip { background: linear-gradient(180deg, #fff3c4, var(--paper) 60%); border-color: #a86b00; box-shadow: 0 3px 0 #a86b00; }
.order.ready { background: linear-gradient(180deg, #e3f7d6, var(--paper) 70%); }
.o-head { display: flex; align-items: center; gap: 5px; min-width: 0; }
.o-npc { font-size: 22px; line-height: 1; }
.o-name { font-family: var(--font-ui); font-weight: 800; font-size: 12.5px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.o-tag { position: absolute; top: -10px; right: 8px; font-family: var(--font-ui); font-weight: 800; font-size: 10.5px; border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; background: var(--sun); }
.o-lines { display: flex; flex-direction: column; gap: 3px; }
.o-line { display: flex; align-items: center; gap: 5px; min-width: 0; font-size: 12px; background: var(--paper-2); border: 2px solid var(--paper-3); border-radius: 10px; padding: 1px 6px 1px 2px; }
.o-line .oe { width: 28px; height: 28px; flex: 0 0 auto; }
.o-line .oe .art { --sz: 21px; }
.o-line .on { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.o-line .on small { color: var(--ink-2); }
.o-line b { font-family: var(--font-ui); font-weight: 800; }
.o-line.ok { border-color: var(--leaf); background: #e3f7d6; }
.o-line.ok b { color: var(--leaf-d); }
.o-rew { margin-top: auto; font-family: var(--font-ui); font-weight: 800; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.o-foot { display: flex; align-items: center; gap: 6px; }
.o-foot .btn { flex: 1; }
.o-wait { display: grid; place-items: center; min-height: 120px; text-align: center; color: var(--ink-2); font-weight: 700; font-size: 12px; border: 3px dashed var(--ink-3); border-radius: 18px; padding: 10px; }
.ship-card { display: flex; flex-direction: column; gap: 8px; }
.crates-row { display: flex; gap: 8px; flex-wrap: wrap; }
.crates-row .crate { width: 46px; height: 46px; flex-direction: column; font-size: 20px; }
.crates-row .crate small { font-family: var(--font-ui); font-weight: 800; font-size: 10.5px; line-height: 1; }
.crate.can { box-shadow: 0 0 0 3px var(--leaf), inset 0 -4px 0 rgba(0, 0, 0, 0.14); }

/* ============================================================ BARN SCREEN */
.barn-head { display: flex; flex-direction: column; gap: 8px; }
.cap-meter { height: 14px; border-radius: 8px; border: 2.5px solid var(--ink); background: var(--paper-3); overflow: hidden; }
.cap-meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--leaf), #9be37a); }
.cap-meter.full i { background: var(--berry); }
.warn-t { color: var(--berry-d); }
.stack-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.stack {
  appearance: none;
  position: relative;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: 6px 4px 5px;
  background: var(--paper);
  border: 2.5px solid var(--ink);
  border-radius: 14px;
  box-shadow: 0 2px 0 var(--ink);
  cursor: pointer;
  font: inherit;
}
.stack .art { --sz: 30px; width: 46px; height: 46px; }

.links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; font-weight: 700; }
.links a { color: var(--sky-d); }

/* ============================================================ CODEX */
.cx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.cx {

.earth-meter i { display: block; height: 100%; background: linear-gradient(90deg, #6fd06a, #4fb6e8); }
.secret-card { display: flex; gap: 10px; align-items: flex-start; }
.secret-card .ce { font-size: 30px; line-height: 1; flex: 0 0 auto; }

.secret-card h4 { font-size: 15px; font-weight: 800; }
.secret-card p { font-size: 13px; color: var(--ink-2); font-weight: 600; }

/* ============================================================ LOGIN / LEVEL MODALS */
.login-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.lday {
  border: 2.5px solid var(--ink);

  text-align: center;
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: 11px;

}

.lday small { font-size: 10px; color: var(--ink-2); line-height: 1.15; }

.levelup-num { font-family: var(--font-display); font-size: 64px; line-height: 1; text-align: center; color: var(--sun); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); animation: popIn 0.6s cubic-bezier(.2, 1.6, .4, 1); }

.form-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

.input {
  border: 2.5px solid var(--ink);

  font: inherit;
  font-weight: 700;

  flex: 1;
}
.toggle { appearance: none; border: 2.5px solid var(--ink); background: var(--paper-3); border-radius: 999px; width: 54px; height: 30px; position: relative; cursor: pointer; padding: 0; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); transition: left 0.2s; }
.toggle[aria-pressed="true"] { background: var(--leaf); }
.toggle[aria-pressed="true"]::after { left: 26px; }
.dev { display: grid; gap: 10px; }
.dev h3 { font-size: 14px; }
.dev .row { display: flex; flex-wrap: wrap; gap: 6px; }

/* ============================================================ FX LAYERS */
#fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 940; }
#fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 941; overflow: hidden; }
.ftxt {
  position: absolute;
  transform: translate(-50%, -50%);
  font-family: var(--font-display);
  font-size: 18px;

.ftxt.big { font-size: 24px; color: var(--sun); }
.ftxt.gene { color: #fff6a8; font-size: 20px; }
.ftxt.sad { color: #d6d0e0; font-size: 15px; }
.ftxt.good { color: #b7ff8f; }
@keyframes floatUp { 0% { transform: translate(-50%, -30%) scale(0.6); opacity: 0; } 15% { transform: translate(-50%, -60%) scale(1.15); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(-50%, -190%) scale(1); opacity: 0; } }
.fly { position: absolute; font-size: 22px; line-height: 1; transform: translate(-50%, -50%); filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.2)); }
.ring-fx { position: absolute; width: 20px; height: 20px; border-radius: 50%; border: 4px solid var(--rc, #fff); transform: translate(-50%, -50%); animation: ringOut 0.5s ease-out forwards; }
@keyframes ringOut { to { width: 120px; height: 120px; opacity: 0; border-width: 1px; } }

@keyframes flash { from { opacity: 0.75; } to { opacity: 0; } }

/* tutorial focus: pulse on screens, glow + pointing finger on the farm map */
.tut-focus { animation: tutPulse 1.2s ease-in-out infinite; }
@keyframes tutPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 200, 58, 0); } 50% { box-shadow: 0 0 0 6px rgba(255, 200, 58, 0.9); } }

/* css/gacha.css */
/* ============================================================ GIFT BOX ART */
.gbox { --w: 110px; --body: #7ed36b; --lid: #5cbb49; --rib: #ffcf3d; position: relative; width: var(--w); height: calc(var(--w) * 0.96); }

/* ============================================================ OPENING STAGE */
.gstage {

.gs-box.s1 { animation: boxShake 0.45s ease; }

@keyframes boxShake { 0%, 100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-7deg) scale(1.03); } 50% { transform: rotate(6deg) scale(1.05); } 75% { transform: rotate(-4deg); } }

/* reveal cards */
.gcard { --rc: var(--r-common); width: 210px; aspect-ratio: 3 / 4.1; perspective: 900px; position: relative; }
.gcard.r-common { --rc: var(--r-common); }

 * Thêm 1 loài mới = thêm 1 dòng ở `species`, 3 dòng ở `products`,

 *   2. Viết phần "TODO" trong adapter tương ứng (googlePlay / appStore / web)
 *   3. Đặt enabled: true và provider: '<tên adapter>'

 * provider:
 *   'disabled'   – mặc định: nút nạp hiện "Sắp ra mắt", không gọi gì ra ngoài
 *   'mock'       – giả lập thanh toán thành công để test luồng cộng Ngọc (chỉ dùng khi dev)
 *   'googlePlay' – Google Play Billing (qua plugin Capacitor/Cordova khi đóng gói app)
 *   'appStore'   – Apple StoreKit
 *   'web'        – cổng thanh toán web (MoMo / ZaloPay / VNPay / Stripe...) qua server của bạn
 *
 * AN TOÀN: Ngọc chỉ được cộng SAU KHI server xác thực hóa đơn (verifyReceipt).
 * Không bao giờ để client tự quyết định cộng tiền ở bản phát hành.
 */

  /* ---------------- story */
  'intro.1': 'The year is 2190. Earth has dried up. Rivers ran empty, forests turned to ash, and the last green plant withered.',
  'intro.2': 'Before it was too late, the Seed Keepers stored the genes of every plant, flower and animal inside a tiny man-made planet: NOA.',
  'intro.3': 'Noa is so small you can walk around it in one afternoon. It circles a young star, carrying the Eternal Gene Vault.',
  'intro.4': 'On the long journey, cosmic radiation shattered the vault into fragments. Every seed it prints is only an incomplete piece of a genome.',
  'intro.5': 'You are the grandchild of Grandma Mai, head of the Seed Keepers. Today, after 300 years of cryosleep, you wake up.',
  'intro.6': '"Hello, Sower! I\'m Bean. Piece the genes back together (MERGE), plant, crossbreed… and one day we\'ll carry green back to Earth!"',
  'intro.start': 'Start sowing',

  'story.ch1.title': 'Chapter 1 · Awakening',
  'story.ch1.text': 'The cryopod opens. The air on Noa smells of damp soil. Bean, a little bean-shaped robot with a sprout on its head, leads you to the first field. "The vault broke into pieces," Bean says, "but two identical pieces joined together make a more complete one. Grandma Mai called it MERGING." You sow the first rice seed on Noa.',
  'story.ch2.title': 'Chapter 2 · Sleeping Genes',
  'story.ch2.text': 'A freshly merged seed suddenly glows. Bean cheers: "A gene awakened!" Grandma Mai wrote extra code into the vault, inspired by nature and humanity\'s legends: sunlight, moonlight, fire, water. She believed life in space would need to be stronger than life on Earth. Those genes were never lost. They were only sleeping.',
  'story.ch3.title': 'Chapter 3 · A Signal from Earth',
  'story.ch3.text': 'That night Bean\'s radio catches a faint signal: "…this is Hanoi Dome… can anyone hear us…" People still live on Earth, inside sealed domes. A girl named Na asks: "What does a rose smell like?" From that day on, golden bee-ships start carrying Noa\'s harvest back to Earth.',
  'story.ch4.title': 'Chapter 4 · The Four Sacred Beasts',
  'story.ch4.text': 'In the Research Ranch you find Grandma Mai\'s notebook. She was Vietnamese, and she named the animal genes after the Four Sacred Beasts: Dragon, Qilin, Tortoise and Phoenix. "Our ancestors believed these four bring peace," she wrote. "I hope the animals of Noa carry that belief with them."',
  'story.ch5.title': 'Chapter 5 · The Fifth Letter',
  'story.ch5.text': 'The Earth in Noa\'s sky looks a little less brown. Na sends a photo: a small potted rose blooming inside Hanoi Dome. The first flower in three hundred years! The whole dome cried. Bean stays quiet for a long time, then says: "Grandma Mai would be so happy."',
  'story.ch6.title': 'Chapter 6 · Stellar Seeds',
  'story.ch6.text': 'Earth\'s soil is too dry for ordinary seeds. Bean shows you Grandma Mai\'s final blueprint: the Stellar Seed, carrying a mythic gene that survives drought and dust. "When we have enough Stellar Seeds," Bean says, "Noa will release a SEED RAIN over Earth."',
  'story.ch7.title': 'Chapter 7 · The Seed Rain',
  'story.ch7.text': 'Millions of glowing seeds fall like a meteor shower. From Noa\'s sky you watch the first green patches spread across Earth. Bean projects an old message: "To my grandchild, the last Sower. I always knew you could do it." Noa\'s story isn\'t over. It has only just sprouted.',
  'story.l1.title': 'Letter 1 · To my grandchild',
  'story.l1.text': 'My dear, when you read this I will no longer be with you. Don\'t be sad. I\'m leaving you a whole planet. Remember: a seed doesn\'t have to be perfect. It only needs to be joined with another seed that is trying just as hard.',
  'story.l2.title': 'Letter 2 · On sleeping genes',
  'story.l2.text': 'A gene is never truly lost, my dear. Sometimes it just hides, sleeping in a bloodline, waiting for the right pair of parents to wake it. Mr. Mendel counted peas one by one to understand that. You will too, if you are patient.',
  'story.l3.title': 'Letter 3 · Hybrid vigor',
  'story.l3.text': 'When two different species meet, they sometimes create something stronger than both. It is called hybrid vigor. I think people are the same: we are strongest when we reach for each other.',
  'story.l4.title': 'Letter 4 · The recording',
  'story.l4.text': 'I hid this recording in Bean\'s memory. Bean is shy, so you have to knock many times before it opens up. If you hear it, tell Bean I am very proud of it.',
  'story.l5.title': 'Letter 5 · The promise',
  'story.l5.text': 'The day I left Earth, I promised a little girl in Hanoi that roses would bloom again one day. Three hundred years have passed. I couldn\'t keep that promise, but you can. Perhaps her great-great-grandchildren are still waiting.',

// ---- js/core/noa.js
/*
 * Core: namespace, utilities, seeded RNG, event bus, hooks (extension points)
 * and the modifier registry every rate lookup goes through.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';

  /* ------------------------------------------------------------ utilities */
  const U = NOA.util = {
    clamp(v, a, b) { return Math.max(a, Math.min(b, v)); },
    lerp(a, b, t) { return a + (b - a) * t; },
    sum(arr) { let s = 0; for (const v of arr) s += v; return s; },
    randInt(min, max) { return min + Math.floor(NOA.rng.random() * (max - min + 1)); },
    randFloat(min, max) { return min + NOA.rng.random() * (max - min); },
    chance(p) { return NOA.rng.random() < p; },
    pick(arr) { return arr[Math.floor(NOA.rng.random() * arr.length)]; },
    /** weights: { key: weight } -> key (null if every weight is 0) */
    pickWeighted(weights) {
      let total = 0;
      for (const k in weights) total += Math.max(0, weights[k] || 0);
      if (total <= 0) return null;
      let r = NOA.rng.random() * total;
      for (const k in weights) {
        const w = Math.max(0, weights[k] || 0);
        if (r < w) return k;
        r -= w;
      }
      return Object.keys(weights).pop();
    },
    shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(NOA.rng.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    },
    uid(prefix) {
      U._uid = (U._uid || 0) + 1;
      return (prefix || 'i') + Date.now().toString(36) + U._uid.toString(36) + Math.floor(Math.random() * 1296).toString(36);
    },
    clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); },
    isObj(o) { return o && typeof o === 'object' && !Array.isArray(o); },
    deepMerge(target, src) {
      for (const k in src) {
        if (U.isObj(src[k]) && U.isObj(target[k])) U.deepMerge(target[k], src[k]);
        else target[k] = U.clone(src[k]);
      }
      return target;
    },
    pad2(n) { return String(n).padStart(2, '0'); },
    /** ms -> "0:42", "12:05", "1:02:03" */
    fmtDuration(ms) {
      const s = Math.max(0, Math.ceil(ms / 1000));
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      return h > 0 ? h + ':' + U.pad2(m) + ':' + U.pad2(sec) : m + ':' + U.pad2(sec);
    },
    pct(p, digits) {
      const v = p * 100;
      const d = digits != null ? digits : (v < 1 && v > 0 ? 2 : v < 10 ? 1 : 0);
      return (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toLocaleString(NOA.i18n ? NOA.i18n.locale() : 'vi-VN') + '%';
    }
  };

  /* ------------------------------------------------------------ seeded RNG (mulberry32) */
  NOA.rng = {
    _s: (Date.now() ^ 0x9e3779b9) >>> 0,
    seed(s) { this._s = (s >>> 0) || 1; },
    random() {
      let t = (this._s += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    /** Deterministic value in [0,1) for a key (weather slots etc.) */
    hash(n) {
      let t = (n >>> 0) + 0x6d2b79f5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
  };

  /* ------------------------------------------------------------ event bus */
  const listeners = {};
  NOA.events = {
    on(name, fn) {
      (listeners[name] = listeners[name] || []).push(fn);
      return () => { listeners[name] = (listeners[name] || []).filter((f) => f !== fn); };
    },
    emit(name, payload) {
      for (const fn of (listeners[name] || []).slice()) {
        try { fn(payload); } catch (e) { console.error('[NOA event ' + name + ']', e); }
      }
      for (const fn of (listeners['*'] || []).slice()) {
        try { fn(name, payload); } catch (e) { console.error(e); }
      }
    }
  };

  /* ------------------------------------------------------------ hooks (filters for extensions) */
  const hooks = {};
  NOA.hooks = {
    /** Register a filter: fn(value, ...args) -> new value */
    add(name, fn, priority) {
      (hooks[name] = hooks[name] || []).push({ fn, p: priority || 10 });
      hooks[name].sort((a, b) => a.p - b.p);
    },
    run(name, value, ...args) {
      for (const h of hooks[name] || []) {
        try {
          const out = h.fn(value, ...args);
          if (out !== undefined) value = out;
        } catch (e) { console.error('[NOA hook ' + name + ']', e); }
      }
      return value;
    }
  };

  /* ------------------------------------------------------------ modifiers
   * Every tunable rate is read through NOA.mods so labs, mascots, boosters,
   * world events and future features can stack bonuses without touching the
   * systems.  A provider returns [{ key, add?, mult?, src, params? }].
   * A modifier with key "gene.keep" also applies to "gene.keep.sameGene".
   */
  const providers = [];
  NOA.mods = {
    register(id, fn) {
      const i = providers.findIndex((p) => p.id === id);
      if (i >= 0) providers.splice(i, 1);
      providers.push({ id, fn });
    },
    collect(key, ctx) {
      const out = [];
      for (const p of providers) {
        let list;
        try { list = p.fn(ctx || {}) || []; } catch (e) { console.error('[NOA mods ' + p.id + ']', e); list = []; }
        for (const m of list) {
          if (m.key === key || key.startsWith(m.key + '.')) out.push(m);
        }
      }
      return out;
    },
    value(key, base, ctx) {
      let add = 0, mult = 1;
      for (const m of NOA.mods.collect(key, ctx)) {
        if (m.add) add += m.add;
        if (m.mult != null) mult *= m.mult;
      }
      return (base + add) * mult;
    },
    chance(key, base, ctx) {
      return U.clamp(NOA.mods.value(key, base, ctx), 0, NOA.BALANCE.merge.maxChance);
    },
    breakdown(key, base, ctx) {
      return { base, entries: NOA.mods.collect(key, ctx), total: NOA.mods.value(key, base, ctx) };
    }
  };
})();

    },
    locale() { return LOCALES[this.lang] || 'vi-VN'; },

    },

      return s;
    },
    num(n) {
      return Math.round(n).toLocaleString(this.locale());
    },
    /** 1.2K / 3,4M */

      } catch (e) { return this.num(n); }

})();

/*
 * Clock: real time + dev offset, duration scaling, day keys and the lunar phase.
 * Every timer in the game reads NOA.time.now() so the dev panel can time-travel.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const DAY = 86400000;

  NOA.time = {
    now() {
      const dev = NOA.state && NOA.state.dev;
      return Date.now() + (dev && dev.offsetMs ? dev.offsetMs : 0);
    },
    scale() {
      const dev = NOA.state && NOA.state.dev;
      return dev && dev.timeScale ? dev.timeScale : NOA.BALANCE.time.timeScale;
    },
    /** seconds of game design time -> real milliseconds */
    dur(sec) { return sec * 1000 * NOA.time.scale(); },
    date() { return new Date(NOA.time.now()); },
    hour() { return NOA.time.date().getHours() + NOA.time.date().getMinutes() / 60; },
    isNight() {
      const force = NOA.state && NOA.state.dev && NOA.state.dev.force;
      if (force && force.night != null) return !!force.night;
      const h = NOA.time.date().getHours();
      const b = NOA.BALANCE.time;
      return h >= b.nightStartHour || h < b.nightEndHour;
    },
    /** 'dawn' | 'day' | 'dusk' | 'night' */
    phase() {
      if (NOA.time.isNight()) return 'night';
      const h = NOA.time.hour();
      const b = NOA.BALANCE.time;
      if (h < b.nightEndHour + 1.5) return 'dawn';
      if (h >= b.nightStartHour - 1.5) return 'dusk';
      return 'day';
    },
    /** Calendar day key that rolls over at balance.time.dayResetHour */
    dayKey(ts) {
      const d = new Date((ts != null ? ts : NOA.time.now()) - NOA.BALANCE.time.dayResetHour * 3600000);
      return d.getFullYear() + '-' + NOA.util.pad2(d.getMonth() + 1) + '-' + NOA.util.pad2(d.getDate());
    },
    /** 'MM-DD' in local time */
    md(ts) {
      const d = new Date(ts != null ? ts : NOA.time.now());
      return NOA.util.pad2(d.getMonth() + 1) + '-' + NOA.util.pad2(d.getDate());
    },
    /** Moon age as a fraction of the synodic month: 0 = new moon, 0.5 = full moon */
    moonPhase(ts) {
      const m = NOA.BALANCE.world.moon;
      const epoch = Date.parse(m.epochNewMoonUTC);
      const days = ((ts != null ? ts : NOA.time.now()) - epoch) / DAY;
      const f = (days / m.synodicDays) % 1;
      return f < 0 ? f + 1 : f;
    },
    isFullMoon(ts) {
      const force = NOA.state && NOA.state.dev && NOA.state.dev.force;
      if (force && force.fullMoon != null) return !!force.fullMoon;
      const m = NOA.BALANCE.world.moon;
      const ageFromFull = Math.abs(NOA.time.moonPhase(ts) - 0.5) * m.synodicDays;
      return ageFromFull <= m.fullWindowDays;
    },
    moonEmoji(ts) {
      if (NOA.time.isFullMoon(ts)) return '🌕';
      const f = NOA.time.moonPhase(ts);
      const icons = ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘'];
      return icons[Math.round(f * 8) % 8];
    },
    DAY
  };
})();

/*
 * Save system with a swappable storage adapter.
 * Default adapter: localStorage (wrapped in try/catch) with an in-memory fallback.
 * A cloud save only needs a new adapter with get/set/remove (see docs/GDD.md, "Mở rộng").
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const KEY = 'noa-farm-save-v2';

  const memory = {};
  const memoryAdapter = {
    id: 'memory',
    get(k) { return memory[k] != null ? memory[k] : null; },
    set(k, v) { memory[k] = v; },
    remove(k) { delete memory[k]; }
  };
  const localAdapter = {
    id: 'local',
    get(k) { try { return globalThis.localStorage.getItem(k); } catch (e) { return memoryAdapter.get(k); } },
    set(k, v) { try { globalThis.localStorage.setItem(k, v); } catch (e) { memoryAdapter.set(k, v); } },
    remove(k) { try { globalThis.localStorage.removeItem(k); } catch (e) { memoryAdapter.remove(k); } }
  };

  let timer = null;

  NOA.save = {
    adapter: (function () {
      try { return globalThis.localStorage ? localAdapter : memoryAdapter; } catch (e) { return memoryAdapter; }
    })(),
    /** Version -> function(state) upgrading a save from version-1 to version */
    migrations: {
      // 2: (s) => { s.newField = 0; return s; }
    },
    setAdapter(adapter) { this.adapter = adapter; },
    load() {
      const raw = this.adapter.get(KEY);
      if (!raw) return null;
      try {
        let s = JSON.parse(raw);
        const target = NOA.BALANCE.meta.saveVersion;
        while ((s.v || 1) < target) {
          const next = (s.v || 1) + 1;
          if (this.migrations[next]) s = this.migrations[next](s);
          s.v = next;
        }
        return s;
      } catch (e) {
        console.warn('[NOA save] could not parse save, starting fresh', e);
        return null;
      }
    },
    write() {
      if (!NOA.state) return;
      try { this.adapter.set(KEY, JSON.stringify(NOA.state)); } catch (e) { console.warn('[NOA save]', e); }
    },
    schedule() {
      clearTimeout(timer);
      timer = setTimeout(() => NOA.save.write(), 400);
    },
    clear() { this.adapter.remove(KEY); },
    exportString() { return JSON.stringify(NOA.state); }
  };
})();

/*
 * Audio: every sound is synthesized with WebAudio (no asset files).
 * Merge notes climb a major scale while a combo lasts, so a fast chain plays a melody.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const MAJOR = [0, 2, 4, 5, 7, 9, 11];

    const oct = Math.floor(degree / 7);

  };

  const A = NOA.audio = {
    ctx: null,
    master: null,
    sfxBus: null,
    musicBus: null,
    noiseBuf: null,
    musicTimer: null,

    settings() { return (NOA.state && NOA.state.settings) || { sfx: true, music: true, haptics: true }; },

        const len = A.ctx.sampleRate * 1;
        A.noiseBuf = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
        const data = A.noiseBuf.getChannelData(0);

        ];
        const seq = seqs[Math.min(r, 4)];
        seq.forEach((n, i) => A.tone({ f: semis(base, n), type: 'triangle', dur: 0.32, gain: 0.1, when: i * 0.075 }));
        if (r >= 2) A.chord([semis(base, 0), semis(base, 4), semis(base, 7)], seq.length * 0.075, 1.2, 0.04);
        if (r >= 3) { A.tone({ f: 130.81, type: 'sine', dur: 1.4, gain: 0.12, attack: 0.02 }); A.shimmer(0.3, 12); }
        if (r >= 4) {
          [0, 4, 7, 11].forEach((n) => {
            A.tone({ f: semis(261.63, n), type: 'sawtooth', dur: 2.2, gain: 0.018, attack: 0.4, detune: -8 });
            A.tone({ f: semis(261.63, n), type: 'sawtooth', dur: 2.2, gain: 0.018, attack: 0.4, detune: 8 });
          });
        }
      },
      flip() { A.noise({ freq: 1800, dur: 0.06, gain: 0.06 }); A.tone({ f: 990, type: 'sine', dur: 0.06, gain: 0.05 }); }
    },

    /* ------------------------------------------------------------ generative background music */
    startMusic() {
      if (!A.ctx || A.musicTimer) return;
      const PENTA = [0, 2, 4, 7, 9];
      const bassLine = [0, -5, -3, -7]; // C, G, A, F (relative to C3)
      A.musicStep = 0;
      A.musicTimer = setInterval(() => {
        if (!A.ctx || A.ctx.state !== 'running') return;
        const night = NOA.time && NOA.time.isNight();
        const step = A.musicStep++;
        const t = A.ctx.currentTime + 0.05;
        const chance = night ? 0.38 : 0.55;
        if (Math.random() < chance) {
          const deg = PENTA[Math.floor(Math.random() * PENTA.length)];
          const oct = Math.random() < 0.3 ? 12 : 0;
          const f = semis(night ? 392 : 523.25, deg + oct - 12);
          const osc = A.ctx.createOscillator();
          const g = A.ctx.createGain();
          osc.type = 'sine'; osc.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.05, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
          osc.connect(g); g.connect(A.musicBus); g.connect(A.delay);
          osc.start(t); osc.stop(t + 1);
        }
        if (step % 8 === 0) {
          const f = semis(130.81, bassLine[(step / 8) % bassLine.length]);
          const osc = A.ctx.createOscillator();
          const g = A.ctx.createGain();
          osc.type = 'triangle'; osc.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.035, t + 0.2);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
          osc.connect(g); g.connect(A.musicBus);
          osc.start(t); osc.stop(t + 3.3);
        }
      }, 420);
    },
    stopMusic() { clearInterval(A.musicTimer); A.musicTimer = null; },

    noteFreq
  };
})();

/*
 * Config validator: catches typos and impossible numbers after someone edits
 * config/balance.js or config/content.js. Results show in Dev panel + console.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';

  NOA.validateConfig = function () {
    const B = NOA.BALANCE, C = NOA.CONTENT, P = NOA.PAYMENT;
    const out = [];
    const warn = (msg) => out.push(msg);
    const prob = (path, v) => {
      if (typeof v !== 'number' || isNaN(v) || v < 0 || v > 1) warn(path + ' phải là xác suất 0..1 (đang là ' + v + ')');
    };
    const sumPositive = (path, obj) => {
      const s = Object.values(obj || {}).reduce((a, b) => a + (b > 0 ? b : 0), 0);
      if (s <= 0) warn(path + ': tổng trọng số phải > 0');
      return s;
    };

    // species
    for (const id in C.species) {
      const sp = C.species[id];
      const eco = B.species[id];
      if (!eco) { warn('balance.species thiếu "' + id + '"'); continue; }
      const timeKey = sp.family === 'plant' ? 'growSec' : 'cycleSec';
      if (!(eco[timeKey] > 0)) warn('balance.species.' + id + '.' + timeKey + ' phải > 0');
      if (sp.hybrid) {
        sp.hybrid.forEach((p) => { if (!C.species[p]) warn('Giống lai ' + id + ' tham chiếu loài không tồn tại: ' + p); });
        if (!(eco.hybridPriceMult > 0)) warn('balance.species.' + id + '.hybridPriceMult phải > 0');
      } else {
        if (!(eco.price > 0)) warn('balance.species.' + id + '.price phải > 0');
        if (!(eco.unlockLevel >= 1)) warn('balance.species.' + id + '.unlockLevel phải >= 1');
        (sp.products || []).forEach((pid, i) => {
          const p = C.products[pid];
          if (!p) warn('content.products thiếu "' + pid + '"');
          else if (p.species !== id || p.tier !== i + 1) warn('Sản phẩm ' + pid + ' sai loài/cấp');
        });
      }
      (sp.feed || []).forEach((f) => { if (!C.products[f] && !C.materials[f]) warn('Thức ăn của ' + id + ' không tồn tại: ' + f); });
      if (sp.family === 'plant' && ['crop', 'flower'].indexOf(sp.bed) < 0) warn('Loài cây ' + id + ' thiếu bed (crop/flower)');
      if (sp.family === 'animal') {
        if (!sp.pen || !C.buildings[sp.pen]) warn('Vật nuôi ' + id + ': chuồng không tồn tại ' + sp.pen);
        else if (!B.livestock.pens[sp.pen]) warn('balance.livestock.pens thiếu "' + sp.pen + '"');
        if (!(sp.feed || []).length) warn('Vật nuôi ' + id + ' thiếu feed');
      }
      if (sp.byproduct && (!C.materials[sp.byproduct] || !B.byproducts[sp.byproduct])) warn('Phụ phẩm của ' + id + ' không tồn tại: ' + sp.byproduct);
    }
    for (const id in B.species) if (!C.species[id]) warn('balance.species có "' + id + '" nhưng content.species không có');

    // genes
    for (const id in C.genes) {
      const g = C.genes[id];
      if (g.parents) {
        g.parents.forEach((p) => {
          const pg = C.genes[p];
          if (!pg) warn('Gen ' + id + ': gen cha/mẹ không tồn tại ' + p);
          else if (pg.family !== g.family) warn('Gen ' + id + ': gen cha/mẹ khác họ ' + p);
