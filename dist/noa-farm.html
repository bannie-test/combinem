      m.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const c = UI.center(m);
        m.remove();
        NOA.audio.play('star');
        NOA.ui.fx.burst(c.x, c.y, { count: 24, colors: ['#fff8c9', '#ffd84d', '#ffffff'], shapes: ['star'], speed: 260 });
        const got = NOA.secrets.catchMeteor();
        NOA.ui.fx.float(c.x, c.y + 20, t('meteor.caught'), 'gene');
        if (got && got.length) UI.toast(got.map((g) => g.icon + ' +' + g.n).join('  '), 'good');
      });
      layer.append(m);
      setTimeout(() => m.remove(), 2000);
    },
    spawnFirefly() {
      fireflyOut = true;
      const vis = B().world.idleFirefly.visibleSec * 1000;
      const f = h('button', { type: 'button', class: 'firefly', 'aria-label': t('mascot.firefly'), style: { left: (innerWidth - 60) + 'px', top: (innerHeight * 0.45) + 'px', 'animation-duration': (vis / 1000) + 's' } });
      f.addEventListener('click', () => {
        const c = UI.center(f);
        f.remove();
        NOA.audio.play('secret');
        NOA.ui.fx.burst(c.x, c.y, { count: 30, colors: ['#f6ff9e', '#ffffff', '#c8ff7a'], shapes: ['circle'], speed: 200, gravity: -40 });
        NOA.ui.fx.float(c.x, c.y, t('firefly.caught'), 'good');
        NOA.secrets.catchFirefly();
        lastInput = Date.now();
        fireflyOut = false;
      });
      document.body.append(f);
      setTimeout(() => { if (f.isConnected) { f.remove(); lastInput = Date.now(); fireflyOut = false; } }, vis);
    },
    skyInfo() {
      const st = NOA.world.sky();
      const lines = [
        (st.night ? st.moon + ' ' + t('sky.night') : '☀️') + ' · ' + t('wx.' + st.weather),
        t('sky.earth', { n: st.earth })
      ];
      if (st.fullMoon) lines.push('🌕 ' + t('sky.fullMoon'));
      if (st.meteor) lines.push('🌠 ' + t('meteor.' + st.meteor.id));
      if (st.rainbow) lines.push('🌈 ' + t('sky.rainbow'));
      UI.toast(lines.join(' · '));
    },
    showXP() {
      const s = S();
      UI.toast(t('hud.level', { n: s.level }) + ' · ' + t('hud.xp', { xp: UI.num(s.xp), need: UI.num(NOA.progress.xpToNext(s.level)) }));
    },

    /* ------------------------------------------------------------ Bean */
    say(text, ms) {
      const e = HUD.els;
      if (!e.say) return;
      e.say.textContent = text;
      e.say.classList.remove('pop');
      void e.say.offsetWidth;
      e.say.classList.add('pop');
      e.bean.classList.remove('talk');
      void e.bean.offsetWidth;
      e.bean.classList.add('talk');
      clearTimeout(sayTimer);
      if (ms) sayTimer = setTimeout(HUD.sayDefault, ms);
    },
    sayDefault() {
      const tip = NOA.ui.story && NOA.ui.story.currentTip();
      HUD.els.say.textContent = tip || t('bean.idle' + (1 + (S().level % 6)));
    },
    onBean() {
      NOA.audio.unlock();
      NOA.audio.play('tap');
      const r = NOA.secrets.tapBean();
      if (r && r !== 'again') {
        HUD.els.bean.classList.add('glitch');
        setTimeout(() => HUD.els.bean.classList.remove('glitch'), 1000);
        HUD.say(t('secret.bean.voice'), 12000);
      } else if (r === 'again') {
        HUD.say(t('secret.bean.voice'), 12000);
      } else {
        HUD.sayDefault();
      }
    }
  };
})();

// ---- js/ui/farm-view.js
/*
 * Farm screen: orders row, fields & pens, the merge board, the dock (sell / bag / storage)
 * and all drag & drop interactions with their merge feedback.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const UI = NOA.ui;
  const h = (...a) => UI.h(...a);
  const t = (k, p) => NOA.t(k, p);
  const S = () => NOA.state;
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const I = () => NOA.items;
  const FX = () => NOA.ui.fx;

  let drag = null;
  let ghost = null;
  let preview = null;

  const FV = NOA.ui.screens.farm = {
    els: {},
    selected: -1,

    render() {
      if (!FV.els.board || !FV.els.board.isConnected || FV._lang !== NOA.i18n.lang) { FV.build(); FV._lang = NOA.i18n.lang; }
      FV.renderOrders();
      FV.renderField();
      FV.renderBoard(true);
      FV.renderDock();
      if (NOA.ui.story) NOA.ui.story.applyFocus();
    },

    build() {
      const root = document.getElementById('scr-farm');
      UI.clear(root);
      const e = FV.els;
      e.orders = h('div', { class: 'hscroll', id: 'orders', 'aria-label': t('farm.orders') });
      e.field = h('div', { class: 'hscroll', id: 'field', 'aria-label': t('farm.field') });
      e.board = h('div', { class: 'board', id: 'board', style: { '--cols': String(B().board.cols), '--rows': String(B().board.rows) } });
      e.cells = [];
      for (let i = 0; i < B().board.cols * B().board.rows; i++) {
        const c = h('div', { class: 'cell', data: { drop: 'cell', index: String(i) } });
        e.cells.push(c);
        e.board.append(c);
      }
      e.sell = h('button', { type: 'button', class: 'sell-bin', data: { drop: 'sell' }, on: { click: () => UI.toast('🧺 ' + t('farm.sell') + ': ' + t('toast.boardFull').split('.')[0]) } },
        h('span', { class: 'di' }, '🧺'), h('span', null, t('farm.sell')));
      e.bag = h('div', { class: 'bag', 'aria-label': t('farm.bag') });
      e.store = h('button', { type: 'button', class: 'store-btn', data: { drop: 'storage' }, on: { click: () => NOA.ui.panels.storageModal() } },
        h('span', { class: 'di' }, '📦'), h('span', { class: 'num' }, ''));
      e.dock = h('div', { class: 'dock' }, e.sell, e.bag, e.store);
      e.wrap = h('div', { class: 'board-wrap' }, e.board);
      root.append(e.orders, e.field, e.wrap, e.dock);
      root.addEventListener('pointerdown', onDown);
      // keep the whole board on screen: fit it to the space left between the field row and the dock
      if (globalThis.ResizeObserver) {
        if (FV._ro) FV._ro.disconnect();
        FV._ro = new ResizeObserver(() => FV.fitBoard());
        FV._ro.observe(e.wrap);
      }
      requestAnimationFrame(() => FV.fitBoard());
    },

    fitBoard() {
      const e = FV.els;
      if (!e.wrap || !e.wrap.isConnected) return;
      const r = e.wrap.getBoundingClientRect();
      if (!r.width || !r.height) return;
      const cols = B().board.cols;
      const w = Math.floor(Math.min(r.width, r.height * cols / B().board.rows));
      e.board.style.setProperty('--bw', w + 'px');
      // emoji size follows the cell size (board padding 7px + 3px border each side, 4px gaps)
      const cell = (w - 20 - 4 * (cols - 1)) / cols;
      e.board.style.setProperty('--board-sz', Math.max(18, Math.round(cell * 0.64)) + 'px');
    },

    /* ------------------------------------------------------------ orders */
    renderOrders() {
      const box = FV.els.orders;
      if (!box) return;
      UI.clear(box);
      for (const o of S().orders) box.append(orderCard(o));
      if (S().orders.length < B().orders.slots) box.append(h('div', { class: 'o-wait' }, '⏳ ' + t('order.waiting')));
    },

    /* ------------------------------------------------------------ field */
    renderField() {
      const box = FV.els.field;
      if (!box) return;
      UI.clear(box);
      S().plots.forEach((p, i) => box.append(plotTile(p, i)));
      if (S().plots.length < B().farm.plotsMax) box.append(buyTile('plot'));
      S().pens.forEach((p, i) => box.append(penTile(p, i)));
      if (S().pens.length < B().farm.pensMax) box.append(buyTile('pen'));
    },

    /* ------------------------------------------------------------ board */
    renderBoard(force) {
      const cells = FV.els.cells;
      if (!cells) return;
      const board = S().board;
      for (let i = 0; i < cells.length; i++) {
        const it = board[i];
        const sig = it ? [it.id, it.charm, it.locked, it.revealed, it.gene ? it.gene.id + it.gene.purity : ''].join('|') : '';
        if (force || cells[i]._sig !== sig) {
          UI.clear(cells[i]);
          if (it) {
            const art = UI.itemArt(it);
            art.dataset.drag = 'board';
            art.dataset.index = String(i);
            if (it.kind === 'generator') { art.classList.add('idle'); art.id = 'gen-' + it.generator; }
            cells[i].append(art);
          }
          cells[i]._sig = sig;
        }
        cells[i].classList.toggle('selected', i === FV.selected);
      }
      FV.renderDock();
    },

    renderDock() {
      const e = FV.els;
      if (!e.bag) return;
      UI.clear(e.bag);
      for (const id in C().boosters) {
        const n = S().boosters[id] || 0;
        e.bag.append(h('div', {
          class: 'boost' + (n ? '' : ' empty'),
          data: { drag: 'bag', booster: id },
          title: t('booster.' + id),
          role: 'button',
          'aria-label': t('booster.' + id) + ' ×' + n
        }, C().boosters[id].emoji, h('b', null, String(n))));
      }
      e.store.querySelector('.num').textContent = S().storage.length + '/' + S().storageCap;
    },

    cellEl(i) { return FV.els.cells ? FV.els.cells[i] : null; },
    itemEl(i) { const c = FV.cellEl(i); return c ? c.firstChild : null; },

    /** Animate an item flying into a cell from a screen point */
    flyIn(index, from) {
      const el = FV.itemEl(index);
      if (!el || UI.reduced) return;
      const c = UI.center(FV.cellEl(index));
      el.style.setProperty('--fx', (from.x - c.x) + 'px');
      el.style.setProperty('--fy', (from.y - c.y) + 'px');
      el.classList.add('fly-in');
      setTimeout(() => el.classList.remove('fly-in'), 650);
    },

    /** Animate a batch of placements ({ index, where }) out of a source element */
    deliverPlaced(placed, fromEl) {
      const from = UI.center(fromEl);
      let stored = 0;
      placed.forEach((p, k) => {
        if (p.where === 'board') setTimeout(() => FV.flyIn(p.index, from), k * 60);
        else stored += 1;
      });
      if (stored) UI.toast(t('toast.toStorage', { n: stored }));
    },

    tick() {
      if (!FV.els.field || NOA.ui.current !== 'farm') return;
      FV.els.field.querySelectorAll('.slot[data-drop]').forEach((el) => {
        const i = Number(el.dataset.index);
        const slot = el.dataset.drop === 'plot' ? S().plots[i] : S().pens[i];
        if (!slot || !slot.end || NOA.farm.isReady(slot)) return;
        const ring = el.querySelector('.ring');
        if (ring) ring.style.setProperty('--p', String(NOA.farm.progress(slot)));
        const lab = el.querySelector('.sl');
        if (lab) lab.textContent = UI.dur(slot.end - NOA.time.now());
        const se = el.querySelector('.se.stage');
        if (se) se.textContent = stageEmoji(slot);
      });
    },

    select(i) {
      FV.selected = i;
      FV.renderBoard();
    }
  };

  /* ================================================================ builders */
  function stageEmoji(plot) {
    const p = NOA.farm.progress(plot);
    if (p < 0.34) return '🌱';
    if (p < 0.75) return '🌿';
    return C().species[plot.seed.species].emoji;
  }

  function orderCard(o) {
    const avail = NOA.orders.availability(o);
    const ready = NOA.orders.canDeliver(o);
    const est = NOA.orders.estimate(o);
    const npc = C().npcs[o.npc];
    const lines = o.lines.map((l, i) => {
      const have = Math.min(l.count, l.filled + avail[i]);
      const p = C().products[l.product];
      return h('span', { class: 'o-line' + (have >= l.count ? ' ok' : '') + (l.filled >= l.count ? ' done' : ''), title: t('product.' + l.product) },
        h('span', { class: 'oe' }, p.emoji),
        have + '/' + l.count,
        l.needGene ? h('span', { class: 'req' }, '🧬') : l.minStars ? h('span', { class: 'req' }, l.minStars + '★') : null);
    });
    const deliverBtn = UI.btn(t('order.deliver'), 'sm leaf', (ev) => { ev.stopPropagation(); deliver(o, card); });
    const swapBtn = NOA.orders.canSwap(o)
      ? h('button', { type: 'button', class: 'btn-icon', 'aria-label': t('order.swap'), title: t('order.swap'), on: { click: (ev) => { ev.stopPropagation(); NOA.audio.play('swoosh'); NOA.orders.swap(o.id); } } }, '⟳')
      : null;
    const card = h('div', {
      class: 'order' + (o.vip ? ' vip' : '') + (o.earth ? ' earth' : '') + (ready ? ' ready' : ''),
      data: { drop: 'order', id: o.id },
      role: 'group',
      'aria-label': t('npc.' + o.npc),
      on: { click: () => NOA.ui.panels.orderModal(o) }
    },
      o.vip ? h('span', { class: 'o-tag' }, '✨ ' + t('order.vip')) : o.earth ? h('span', { class: 'o-tag' }, '🌍') : null,
      h('div', { class: 'o-head' }, h('span', { class: 'o-npc' }, npc.emoji), h('span', { class: 'o-name' }, t('npc.' + o.npc))),
      h('div', { class: 'o-lines' }, lines),
      h('div', { class: 'o-foot' }, h('span', { class: 'o-rew num' }, '🪙' + UI.compact(est.coins)), ready ? deliverBtn : swapBtn));
    return card;
  }

  function deliver(o, card) {
    const c = UI.center(card);
    const r = NOA.orders.deliver(o.id);
    if (!r) { NOA.audio.play('invalid'); return; }
    celebrateOrder(c, r.reward);
  }
  function celebrateOrder(c, reward) {
    NOA.audio.play('order');
    NOA.audio.vibrate([10, 30, 10]);
    FX().confetti(c.x, c.y, 40);
    const hud = NOA.ui.hud.els;
    FX().flyTo(c, hud.coins, '🪙', 3 + Math.min(7, Math.floor(reward.coins / 60)));
    if (reward.gems) FX().flyTo(c, hud.gems, '💎', 3);
    FX().float(c.x, c.y - 10, '+' + UI.num(reward.coins) + '🪙', 'big');
    FX().float(c.x, c.y + 18, '+' + reward.xp + ' XP', 'good', 0.15);
    if (reward.rp) FX().float(c.x, c.y + 44, '+' + reward.rp + '🔬', '', 0.3);
  }
  FV.celebrateOrder = celebrateOrder;

  function plotTile(p, i) {
    const ready = NOA.farm.isReady(p);
    const g = p.seed && p.seed.gene ? C().genes[p.seed.gene.id] : null;
    const el = h('button', {
      type: 'button',
      class: 'slot slot--plot' + (ready ? ' ready' : '') + (g ? ' has-gene' : ''),
      data: { drop: 'plot', index: String(i) },
      style: g ? { '--gc': g.color } : null,
      'aria-label': t('farm.plot') + ' ' + (i + 1)
    });
    if (!p.seed) {
      el.append(h('span', { class: 'se small', style: { opacity: '0.4' } }, '🌱'), h('span', { class: 'sl' }, t('farm.emptyPlot')));
    } else if (ready) {
      el.append(h('span', { class: 'se' }, C().species[p.seed.species].emoji),
        h('span', { class: 'sl' }, p.out && p.out.length ? t('farm.harvest') + ' ×' + p.out.length : t('farm.harvest')));
    } else {
      el.append(h('span', { class: 'se stage' }, stageEmoji(p)),
        h('span', { class: 'ring', style: { '--p': String(NOA.farm.progress(p)) } }),
        h('span', { class: 'sl num' }, UI.dur(p.end - NOA.time.now())));
    }
    el.addEventListener('click', () => {
      NOA.audio.unlock();
      if (drag) return;
      if (NOA.farm.isReady(p)) {
        const res = NOA.farm.harvest(i);
        if (!res) return;
        NOA.audio.play('harvest');
        NOA.audio.vibrate(15);
        const c = UI.center(el);
        FX().burst(c.x, c.y, { count: 22, colors: ['#5cbb49', '#9be37a', '#ffd36b', '#c08a5f'], shapes: ['leaf', 'circle'], speed: 240 });
        FV.deliverPlaced(res.placed, el);
        if (res.remaining) UI.toast(t('toast.harvestLeft', { n: res.remaining }), 'warn');
      } else if (p.seed) {
        NOA.ui.panels.slotSheet('plot', i);
      } else {
        NOA.audio.play('tap');
        NOA.ui.hud.say(t('tut.plant'), 5000);
      }
    });
    return el;
  }

  function penTile(p, i) {
    const ready = NOA.farm.isReady(p);
    const a = p.animal;
    const g = a && a.gene ? C().genes[a.gene.id] : null;
    const hungry = a && !p.end && p.feed < 1;
    const el = h('button', {
      type: 'button',
      class: 'slot slot--pen' + (ready ? ' ready' : '') + (g ? ' has-gene' : '') + (hungry ? ' hungry' : ''),
      data: { drop: 'pen', index: String(i) },
      style: g ? { '--gc': g.color } : null,
      'aria-label': t('farm.penInfo', { n: i + 1 })
    });
    if (!a) {
      el.append(h('span', { class: 'se small', style: { opacity: '0.4' } }, '🐾'), h('span', { class: 'sl' }, t('farm.emptyPen')));
    } else {
      const feedIcons = (C().species[a.species].feed || []).map((f) => C().species[f].emoji).join('');
      el.append(h('span', { class: 'se' }, C().species[a.species].emoji), h('span', { class: 'feed num' }, feedIcons + '×' + p.feed));
      if (ready) {
        const prod = C().products[C().species[C().species[a.species].hybrid ? C().species[a.species].hybrid[0] : a.species].products[0]];
        el.append(h('span', { class: 'bubble-prod' }, prod.emoji), h('span', { class: 'sl' }, t('farm.collect')));
      } else if (p.end) {
        el.append(h('span', { class: 'ring', style: { '--p': String(NOA.farm.progress(p)) } }), h('span', { class: 'sl num' }, UI.dur(p.end - NOA.time.now())));
      } else {
        el.append(h('span', { class: 'sl' }, t('farm.hungry', { list: feedIcons })));
      }
    }
    el.addEventListener('click', () => {
      NOA.audio.unlock();
      if (drag) return;
      if (NOA.farm.isReady(p)) {
        const res = NOA.farm.collect(i);
        if (!res) return;
        NOA.audio.play('harvest');
        const c = UI.center(el);
        FX().burst(c.x, c.y, { count: 18, colors: ['#fff6d6', '#ffd36b', '#ffffff'], speed: 220 });
        FV.deliverPlaced(res.placed, el);
        if (res.remaining) UI.toast(t('toast.harvestLeft', { n: res.remaining }), 'warn');
      } else if (a) {
        NOA.ui.panels.slotSheet('pen', i);
      } else {
        NOA.audio.play('tap');
        NOA.ui.hud.say(t('tut.animal'), 5000);
      }
    });
    return el;
  }

  function buyTile(type) {
    const f = B().farm;
    const i = type === 'plot' ? S().plots.length : S().pens.length;
    const req = type === 'plot' ? f.plotLevelReq[i] : f.penLevelReq[i];
    const cost = type === 'plot' ? f.plotCost[i] : f.penCost[i];
    const locked = S().level < req;
    const el = h('button', { type: 'button', class: 'slot slot--buy' },
      locked ? '🔒 ' + t('ui.lv', { n: req }) : '＋ ' + (type === 'plot' ? t('farm.buyPlot') : t('farm.buyPen')) + '\n' + UI.num(cost) + '🪙');
    el.style.whiteSpace = 'pre-line';
    el.addEventListener('click', () => {
      if (locked) { UI.toast(t('toast.levelReq', { level: req })); return; }
      UI.modal({
        title: type === 'plot' ? t('farm.buyPlot') : t('farm.buyPen'),
        body: h('p', { style: { textAlign: 'center', fontWeight: '700' } }, (type === 'plot' ? '🟫' : '🏡') + ' ' + UI.num(cost) + '🪙'),
        actions: [
          { label: t('ui.cancel'), kind: 'ghost' },
          {
            label: t('ui.confirm'), kind: 'leaf', onClick: () => {
              const r = type === 'plot' ? NOA.farm.unlockPlot() : NOA.farm.unlockPen();
              if (r.ok) { NOA.audio.play('unlock'); FX().confetti(innerWidth / 2, innerHeight / 2, 40); }
              else UI.toast(r.error === 'coins' ? t('toast.notEnough', { name: t('res.coins') }) : t('toast.levelReq', { level: r.level }), 'warn');
            }
          }
        ]
      });
    });
    return el;
  }

  /* ================================================================ drag & drop */
  function onDown(e) {
    NOA.ui.hud.noteInput();
    const src = e.target.closest('[data-drag]');
    if (!src || drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    NOA.audio.unlock();
    drag = {
      kind: src.dataset.drag,
      index: src.dataset.index != null ? Number(src.dataset.index) : -1,
      booster: src.dataset.booster || null,
      el: src,
      x0: e.clientX,
      y0: e.clientY,
      id: e.pointerId,
      moved: false,
      hover: null
    };
    document.addEventListener('pointermove', onMove, { passive: false });
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onCancel);
  }

  function onMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.moved) {
      if (dx * dx + dy * dy < 64) return;
      if (!startDrag()) { cleanup(); return; }
    }
    e.preventDefault();
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';
    hoverAt(e.clientX, e.clientY);
  }

  function startDrag() {
    if (drag.kind === 'bag' && !(S().boosters[drag.booster] > 0)) return false;
    if (drag.kind === 'board') {
      const it = S().board[drag.index];
      if (!it) return false;
    }
    drag.moved = true;
    const r = drag.el.getBoundingClientRect();
    ghost = drag.el.cloneNode(true);
    ghost.classList.add('ghost');
    ghost.classList.remove('hint', 'idle', 'fly-in', 'pop-in');
    ghost.removeAttribute('id');
    ghost.style.width = r.width + 'px';
    ghost.style.height = r.height + 'px';
    ghost.style.left = drag.x0 + 'px';
    ghost.style.top = drag.y0 + 'px';
    document.body.append(ghost);
    drag.el.classList.add('dragging');
    NOA.ui.panels.closeSheet();
    highlight(true);
    NOA.audio.play('pick');
    NOA.audio.vibrate(8);
    return true;
  }

  function targetsFor() {
    const out = [];
    const board = S().board;
    if (drag.kind === 'board') {
      const it = board[drag.index];
      board.forEach((o, i) => { if (i !== drag.index && I().canMerge(o, it)) out.push(FV.itemEl(i)); });
      if (it.kind === 'seed') FV.els.field.querySelectorAll('[data-drop="plot"]').forEach((el) => { if (!S().plots[+el.dataset.index].seed) out.push(el); });
      if (it.kind === 'animal') FV.els.field.querySelectorAll('[data-drop="pen"]').forEach((el) => { if (!S().pens[+el.dataset.index].animal) out.push(el); });
      if (it.kind === 'product') {
        FV.els.field.querySelectorAll('[data-drop="pen"]').forEach((el) => { if (NOA.farm.canFeed(S().pens[+el.dataset.index], it)) out.push(el); });
        FV.els.orders.querySelectorAll('[data-drop="order"]').forEach((el) => {
          const o = S().orders.find((x) => x.id === el.dataset.id);
          if (o && o.lines.some((l) => l.filled < l.count && NOA.orders.matches(it, l))) out.push(el);
        });
      }
    } else if (drag.kind === 'bag') {
      const def = C().boosters[drag.booster];
      if (def.target === 'breed') board.forEach((o, i) => { if (I().isBreed(o) && (drag.booster === 'loupe' ? !o.revealed : !o.charm)) out.push(FV.itemEl(i)); });
      else FV.els.field.querySelectorAll('.slot[data-drop]').forEach((el) => {
        const s = el.dataset.drop === 'plot' ? S().plots[+el.dataset.index] : S().pens[+el.dataset.index];
        if (s && s.end && !NOA.farm.isReady(s)) out.push(el);
      });
    }
    return out.filter(Boolean);
  }
  function highlight(on) {
    if (on) drag.targets = targetsFor();
    (drag.targets || []).forEach((el) => el.classList.toggle(el.classList.contains('art') ? 'hint' : 'target', on));
  }

  function hoverAt(x, y) {
    const under = document.elementFromPoint(x, y);
    const tgt = under ? under.closest('[data-drop]') : null;
    if (tgt === drag.hover) return;
    if (drag.hover) drag.hover.classList.remove('hover', 'hover-merge');
    drag.hover = tgt;
    hidePreview();
    if (!tgt) return;
    let merge = false;
    if (drag.kind === 'board' && tgt.dataset.drop === 'cell') {
      const a = S().board[+tgt.dataset.index], b = S().board[drag.index];
      merge = I().canMerge(a, b);
      if (merge) showPreview(tgt, NOA.genetics.preview(a, b));
    }
    tgt.classList.add(merge ? 'hover-merge' : 'hover');
  }

  function showPreview(cell, rows) {
    if (!rows.length) return;
    const c = UI.center(cell);
    preview = h('div', { class: 'preview', role: 'tooltip' }, rows.map((r) =>
      h('div', { class: 'pr' + (r.p == null ? ' lock' : '') }, h('span', null, t(r.k, r.params)), r.p != null ? h('b', null, UI.pct(r.p)) : null)));
    const x = Math.max(110, Math.min(innerWidth - 110, c.x));
    preview.style.left = x + 'px';
    preview.style.top = (c.y - c.h / 2) + 'px';
    document.body.append(preview);
    const pr = preview.getBoundingClientRect();
    if (pr.top < 8) preview.style.top = (c.y + c.h / 2 + pr.height + 16) + 'px';
  }
  function hidePreview() { if (preview) { preview.remove(); preview = null; } }

  function onUp(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    removeListeners();
    if (!d.moved) { drag = null; tap(d); return; }
    const target = d.hover;
    if (target) target.classList.remove('hover', 'hover-merge');
    hidePreview();
    highlight(false);
    drag = null;
    let ok = false;
    try { ok = target ? drop(d, target) : false; } catch (err) { console.error(err); ok = false; }
    if (d.el) d.el.classList.remove('dragging');
    if (ok) { if (ghost) ghost.remove(); ghost = null; }
    else snapBack(d);
  }
  function onCancel() {
    if (!drag) return;
    const d = drag;
    removeListeners();
    if (d.hover) d.hover.classList.remove('hover', 'hover-merge');
    hidePreview();
    if (d.moved) highlight(false);
    drag = null;
    if (d.el) d.el.classList.remove('dragging');
    if (ghost) { ghost.remove(); ghost = null; }
  }
  function cleanup() { removeListeners(); drag = null; }
  function removeListeners() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onCancel);
  }
  function snapBack(d) {
    const g = ghost;
    ghost = null;
    if (!g) return;
    NOA.audio.play('drop');
    const src = d.kind === 'board' ? FV.itemEl(d.index) : d.el;
    if (!src || UI.reduced) { g.remove(); return; }
    const c = UI.center(src);
    g.classList.add('snap');
    g.style.left = c.x + 'px';
    g.style.top = c.y + 'px';
    g.style.transform = 'translate(-50%,-50%) scale(1)';
    setTimeout(() => g.remove(), 140);
  }

  /* ------------------------------------------------------------ taps */
  function tap(d) {
    if (d.kind === 'bag') {
      NOA.audio.play('tap');
      UI.toast(C().boosters[d.booster].emoji + ' ' + t('booster.' + d.booster) + ': ' + t('booster.' + d.booster + '.desc'));
      return;
    }
    const it = S().board[d.index];
    if (!it) return;
    if (it.kind === 'generator') { spawnFrom(d.index); return; }
    NOA.audio.play('tap');
    if (FV.selected === d.index && NOA.ui.panels.sheetOpen()) { NOA.ui.panels.closeSheet(); return; }
    NOA.ui.panels.itemSheet(d.index);
  }

  function spawnFrom(i) {
    const res = NOA.board.spawn(i);
    if (res.error === 'energy') {
      NOA.audio.play('invalid');
      FX().shake(NOA.ui.hud.els.energy);
      UI.toast(t('toast.noEnergy'), 'warn');
      return;
    }
    if (res.error === 'full') { NOA.audio.play('invalid'); UI.toast(t('toast.boardFull'), 'warn'); FX().shake(FV.els.board); return; }
    if (res.error) return;
    const gc = UI.center(FV.cellEl(i));
    FX().bump(FV.itemEl(i));
    NOA.audio.play('spawn');
    NOA.audio.vibrate(6);
    FV.flyIn(res.index, gc);
    FX().burst(gc.x, gc.y - 10, { count: 8, colors: ['#ffffff', '#ffe680'], speed: 140, size: 5 });
    NOA.ui.hud.update();
  }

  /* ------------------------------------------------------------ drops */
  function drop(d, target) {
    const type = target.dataset.drop;
    const idx = target.dataset.index != null ? Number(target.dataset.index) : -1;
    if (d.kind === 'bag') return dropBooster(d.booster, type, idx, target);
    const from = d.index;
    const it = S().board[from];
    if (!it) return false;
    switch (type) {
      case 'cell': {
        if (idx === from) return false;
        const other = S().board[idx];
        if (!other) { NOA.board.move(from, idx); NOA.audio.play('drop'); return true; }
        if (I().canMerge(other, it)) return doMerge(from, idx);
        const sameSpecies = I().isBreed(it) && I().isBreed(other) && it.species === other.species;
        const sameProduct = it.kind === 'product' && other.kind === 'product' && it.product === other.product;
        if ((sameSpecies && it.level === other.level) || sameProduct) {
          if (it.locked || other.locked) UI.toast(t('toast.locked'));
          else UI.toast(t('toast.maxLevel'));
          return false;
        }
        if (sameSpecies) UI.toast(t('toast.cantMerge'));
        NOA.board.move(from, idx);
        NOA.audio.play('drop');
        return true;
      }
      case 'plot': {
        const plot = S().plots[idx];
        if (it.kind !== 'seed') { NOA.audio.play('invalid'); UI.toast(t('toast.needSeed')); return false; }
        if (plot.seed) { NOA.audio.play('invalid'); UI.toast(t('toast.plotBusy')); return false; }
        if (it.locked) { UI.toast(t('toast.locked')); return false; }
        NOA.farm.plant(idx, from);
        NOA.audio.play('plant');
        const c = UI.center(FV.els.field.querySelector('[data-drop="plot"][data-index="' + idx + '"]') || target);
        FX().burst(c.x, c.y, { count: 14, colors: ['#8a5a37', '#c08a5f', '#5cbb49'], shapes: ['circle', 'leaf'], speed: 160 });
        return true;
      }
      case 'pen': {
        const pen = S().pens[idx];
        if (it.kind === 'animal') {
          if (pen.animal) { NOA.audio.play('invalid'); UI.toast(t('toast.penBusy')); return false; }
          if (it.locked) { UI.toast(t('toast.locked')); return false; }
          NOA.farm.placeAnimal(idx, from);
          NOA.audio.play('plant');
          return true;
        }
        if (it.kind === 'product' && pen.animal) {
          if (NOA.farm.canFeed(pen, it)) {
            const units = B().product.tierUnits[C().products[it.product].tier];
            NOA.farm.feed(idx, from);
            NOA.audio.play('plant');
            const c = UI.center(FV.els.field.querySelector('[data-drop="pen"][data-index="' + idx + '"]') || target);
            FX().float(c.x, c.y - 20, '+' + units + ' 🍽️', 'good');
            return true;
          }
          NOA.audio.play('invalid');
          UI.toast(pen.feed >= B().farm.feedCapacity ? t('toast.feedFull') : t('toast.wrongFeed', { animal: I().speciesName(pen.animal.species) }));
          return false;
        }
        NOA.audio.play('invalid');
        UI.toast(t('toast.needAnimal'));
        return false;
      }
      case 'order': {
        const c = UI.center(target);
        const r = NOA.orders.deliverItem(target.dataset.id, from);
        if (!r) { NOA.audio.play('invalid'); UI.toast(t('toast.orderNoMatch')); return false; }
        if (r.complete) celebrateOrder(c, r.reward);
        else { NOA.audio.play('coin'); FX().burst(c.x, c.y, { count: 10, colors: ['#ffd36b', '#ffffff'], speed: 150 }); }
        return true;
      }
      case 'sell':
        return sellFlow(from);
      case 'storage': {
        if (it.kind === 'generator') return false;
        if (!NOA.board.toStorage(from)) { UI.toast(t('toast.storageFull'), 'warn'); return false; }
        NOA.audio.play('drop');
        FX().bump(FV.els.store);
        return true;
      }
    }
    return false;
  }

  function dropBooster(id, type, idx, target) {
    const def = C().boosters[id];
    if (def.target === 'breed') {
      if (type !== 'cell') { NOA.audio.play('invalid'); UI.toast(t('booster.wrongTarget')); return false; }
      const r = NOA.board.applyBooster(id, idx);
      if (r.error) {
        NOA.audio.play('invalid');
        UI.toast(r.error === 'charmed' ? t('booster.charmed') : r.error === 'none' ? t('booster.none', { name: t('booster.' + id) }) : t('booster.wrongTarget'));
        return false;
      }
      const c = UI.center(target);
      NOA.audio.play('unlock');
      FX().burst(c.x, c.y, { count: 16, colors: ['#9be37a', '#ffffff', '#ffd84d'], shapes: ['star'], speed: 180 });
      if (id === 'loupe') {
        UI.toast(t('booster.revealed', { result: r.carrier ? t('item.carrier', { gene: C().genes[r.carrier].emoji + ' ' + t('gene.' + r.carrier) }) : t('item.noCarrier') }));
      } else {
        UI.toast(t('booster.used', { name: def.emoji + ' ' + t('booster.' + id) }), 'good');
      }
      return true;
    }
    if (type === 'plot' || type === 'pen') {
      if (NOA.farm.tonic(type, idx)) {
        const c = UI.center(target);
        NOA.audio.play('purity');
        FX().burst(c.x, c.y, { count: 18, colors: ['#ffb84d', '#ffffff', '#9be37a'], speed: 200 });
        return true;
      }
    }
    NOA.audio.play('invalid');
    UI.toast(t('booster.' + id + '.desc'));
    return false;
  }

  function sellFlow(index) {
    const it = S().board[index];
    if (!it || it.kind === 'generator') return false;
    if (it.locked) { UI.toast(t('toast.locked')); return false; }
    const price = NOA.board.salePrice(it);
    if (NOA.board.needsConfirm(it)) {
      UI.modal({
        title: t('item.sell'),
        body: (b) => {
          b.append(h('div', { style: { width: '84px', height: '84px', margin: '0 auto' } }, UI.itemArt(it)),
            h('p', { style: { textAlign: 'center', fontWeight: '800' } }, I().name(it) + ' → ' + UI.num(price) + '🪙'));
        },
        actions: [
          { label: t('ui.cancel'), kind: 'ghost' },
          { label: t('item.sell') + ' · ' + UI.num(price) + '🪙', kind: 'sun', onClick: () => doSell(index) }
        ]
      });
      return false;
    }
    doSell(index);
    return true;
  }
  function doSell(index) {
    const price = NOA.board.sell(index);
    if (price == null) return;
    const c = UI.center(FV.els.sell);
    NOA.audio.play('sell');
    FX().bump(FV.els.sell);
    FX().flyTo(c, NOA.ui.hud.els.coins, '🪙', Math.min(8, 2 + Math.floor(price / 40)));
    FX().float(c.x, c.y - 30, '+' + UI.num(price) + '🪙', 'big');
  }
  FV.sell = sellFlow;

  /* ------------------------------------------------------------ merge feedback */
  function doMerge(from, to) {
    const res = NOA.board.merge(from, to);
    if (!res) return false;
    const item = res.item;
    const cell = FV.cellEl(to);
    const c = UI.center(cell);
    const art = FV.itemEl(to);
    if (art) art.classList.add('pop-in');
    const lvl = I().isBreed(item) ? item.level : C().products[item.product].tier;
    const g = item.gene ? C().genes[item.gene.id] : null;
    const color = g ? g.color : I().isBreed(item) ? '#8fdb6a' : '#ffd36b';
    NOA.audio.play('merge', lvl, res.combo);
    NOA.audio.vibrate(12);
    FX().burst(c.x, c.y, { count: 12 + lvl * 4, colors: [color, '#ffffff', '#ffe680'], speed: 190 + lvl * 30, shapes: I().isBreed(item) ? ['leaf', 'circle', 'star'] : ['star', 'circle'] });
    FX().ring(c.x, c.y, color);
    if (res.combo >= 2) FX().float(c.x, c.y - 30, t('fx.combo', { n: res.combo }), 'good');

    let cinematic = null;
    let delay = 0.1;
    for (const f of res.fx) {
      switch (f.type) {
        case 'breakthrough':
          FX().float(c.x, c.y, t('fx.breakthrough', { level: f.level }), 'big', delay); delay += 0.2;
          NOA.audio.play('breakthrough');
          FX().flash('#fff6c2');
          FX().shake(FV.els.board);
          break;
        case 'purityUp':
          FX().float(c.x, c.y + 10, t('fx.purityUp', { n: f.purity }), 'gene', delay); delay += 0.2;
          NOA.audio.play('purity');
          break;
        case 'purityDown': FX().float(c.x, c.y + 10, t('fx.purityDown', { n: f.purity }), 'sad', delay); delay += 0.2; break;
        case 'geneLost': FX().float(c.x, c.y + 10, t('fx.geneLost'), 'sad', delay); delay += 0.2; NOA.audio.play('geneLost'); break;
        case 'starUp': FX().float(c.x, c.y + 10, t('fx.starUp'), 'good', delay); delay += 0.2; break;
        case 'purityCapped': UI.toast(t('fx.purityCapped')); break;
        case 'fusionLocked': UI.toast(t('fx.fusionLocked')); break;
        case 'fusionNeedsPurity': UI.toast(t('fx.fusionNeedsPurity')); break;
        case 'super': cinematic = 'super'; break;
        case 'fusion': if (cinematic !== 'super') cinematic = 'fusion'; break;
        case 'recessive': if (!cinematic) cinematic = 'recessive'; break;
        case 'awaken': if (!cinematic) cinematic = 'awaken'; break;
      }
    }
    if (cinematic && item.gene) {
      setTimeout(() => NOA.ui.fx.awaken(item, cinematic), 380);
    }
    return true;
  }
})();

// ---- js/ui/panels.js
/*
 * Panels: item info sheet, plot / pen sheets, storage, energy, daily login, level-up,
 * order details, secret discovered, generic reward popups.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const UI = NOA.ui;
  const h = (...a) => UI.h(...a);
  const t = (k, p) => NOA.t(k, p);
  const S = () => NOA.state;
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const I = () => NOA.items;

  let sheet = null;
  let sheetFor = null;

  const PN = NOA.ui.panels = {
    sheetOpen() { return !!sheet; },
    closeSheet() {
      if (sheet) { sheet.remove(); sheet = null; }
      sheetFor = null;
      const fv = NOA.ui.screens.farm;
      if (fv && fv.selected !== -1) { fv.selected = -1; fv.renderBoard(); }
    },
    openSheet(content, key) {
      if (sheet) sheet.remove();
      sheet = h('div', { class: 'sheet', role: 'dialog', 'aria-label': t('ui.close') },
        h('button', { type: 'button', class: 'btn-icon sh-x', 'aria-label': t('ui.close'), on: { click: PN.closeSheet } }, '✕'),
        content);
      sheetFor = key;
      document.body.append(sheet);
    },
    refreshSheet() {
      if (!sheetFor) return;
      if (sheetFor.type === 'item') {
        const it = S().board[sheetFor.index];
        if (!it || it.id !== sheetFor.id) PN.closeSheet();
        else PN.itemSheet(sheetFor.index, true);
      } else if (sheetFor.type === 'slot') PN.slotSheet(sheetFor.kind, sheetFor.index, true);
    },

    /* ------------------------------------------------------------ item sheet */
    statRows(it) {
      const rows = h('div', { class: 'stats' });
      const g = I().geneDef(it);
      const icons = { yield: '🌾', growth: '⏱️', quality: '⭐' };
      for (const s of I().STATS) {
        const base = it.stats[s];
        const bonus = I().geneBonus(it, s);
        const cap = 100;
        rows.append(h('div', { class: 'stat', style: g ? { '--gc': g.color } : null },
          h('span', { class: 'si' }, icons[s]),
          h('span', null, t('stat.' + s)),
          h('span', { class: 'bar' },
            h('i', { style: { width: Math.min(100, base / cap * 100) + '%' } }),
            bonus ? h('i', { class: 'bonus', style: { left: Math.min(100, base / cap * 100) + '%', width: Math.min(100 - base, bonus) / cap * 100 + '%' } }) : null),
          h('span', { class: 'sv num' }, String(base), bonus ? h('small', null, ' +' + bonus) : null)));
      }
      return rows;
    },
    geneLine(it) {
      const g = I().geneDef(it);
      if (g) {
        return h('div', { class: 'gene-line on', style: { '--gc': g.color } },
          h('span', null, '🧬 ' + g.emoji + ' ' + t('gene.' + it.gene.id)),
          h('span', { class: 'pur' }, I().purityText(it.gene.purity)),
          h('span', { class: 'muted tiny' }, t('gene.tier' + g.tier) + ' · ' + t('gene.favor', { stat: t(g.favor === 'all' ? 'stat.all' : 'stat.' + g.favor) })),
          I().isSuper(it) ? h('b', null, '👑 ' + t('item.super')) : null);
      }
      let carrierText = t('item.noGene');
      if (it.revealed) carrierText += ' · ' + (it.carrier ? t('item.carrier', { gene: C().genes[it.carrier].emoji + ' ' + t('gene.' + it.carrier) }) : t('item.noCarrier'));
      return h('div', { class: 'gene-line' }, '🧬 ' + carrierText);
    },
    itemSheet(index, keep) {
      const it = S().board[index];
      if (!it) return;
      const fv = NOA.ui.screens.farm;
      fv.selected = index;
      fv.renderBoard();
      const body = h('div');
      const kindKey = it.kind === 'seed' ? 'kind.seed' : it.kind === 'animal' ? 'kind.animal' : it.kind === 'product' ? 'kind.product' : 'kind.generator';
      let sub = t(kindKey);
      if (I().isBreed(it)) sub += ' · ' + t('fam.' + I().family(it)) + ' · ' + t('ui.lv', { n: it.level }) + (C().species[it.species].hybrid ? ' · ' + t('item.hybrid') : '');
      if (it.kind === 'product') sub += ' · ' + t('item.stars', { n: it.stars || 1 });
      body.append(h('div', { class: 'sh-head' },
        h('div', { class: 'sh-art' }, UI.itemArt(it)),
        h('div', null, h('div', { class: 'sh-name' }, I().name(it)), h('div', { class: 'sh-sub' }, sub))));

      if (it.kind === 'generator') {
        body.append(h('div', { class: 'sh-meta' },
          h('div', null, t('item.tapGen', { n: B().generators[it.generator].energy })),
          h('div', null, t(it.generator === 'seedSack' ? 'item.genSeed' : 'item.genAnimal'))));
        PN.openSheet(body, { type: 'item', index, id: it.id });
        return;
      }
      if (I().isBreed(it)) {
        body.append(PN.statRows(it), h('div', { style: { marginTop: '8px' } }, PN.geneLine(it)));
        const meta = h('div', { class: 'sh-meta' });
        const est = NOA.farm.estimateUnits(it);
        const tm = UI.dur(NOA.farm.growMs(it));
        meta.append(h('div', null, (it.kind === 'seed' ? '🌾 ' + t('item.harvestEst', { n: est, t: tm }) : '🥚 ' + t('item.cycleEst', { n: est, t: tm }))));
        if (it.kind === 'animal') meta.append(h('div', null, '🍽️ ' + t('item.eats', { list: (C().species[it.species].feed || []).map((f) => C().species[f].emoji + ' ' + t('species.' + f)).join(', ') })));
        if (it.charm) meta.append(h('div', null, t('item.charm', { name: C().boosters[it.charm].emoji + ' ' + t('booster.' + it.charm) })));
        if (!it.revealed && NOA.FEATURES.recessiveGenes && !it.gene) meta.append(h('div', null, t('item.hiddenCarrier')));
        if (I().isMaxed(it)) meta.append(h('div', null, '🏆 ' + t('item.maxed')));
        body.append(meta);
      }
      if (it.kind === 'product') {
        if (it.gene) body.append(h('div', { style: { marginTop: '8px' } }, PN.geneLine(it)));
        const sp = C().products[it.product].species;
        const eaters = Object.keys(C().species).filter((id) => (C().species[id].feed || []).indexOf(sp) >= 0 && !C().species[id].hybrid);
        if (eaters.length) body.append(h('div', { class: 'sh-meta' }, '🍽️ ' + t('item.feedHint', { animal: eaters.map((e) => C().species[e].emoji).join(' ') })));
      }
      body.append(h('div', { class: 'sh-meta' }, h('div', null, '🪙 ' + t('item.price') + ': ' + UI.num(NOA.board.salePrice(it)))));

      const acts = h('div', { class: 'sh-actions' });
      if (it.kind === 'seed') {
        const free = S().plots.findIndex((p) => !p.seed);
        acts.append(UI.btn('🌱 ' + t('item.plant'), 'sm leaf', () => {
          if (free < 0) { UI.toast(t('toast.plotBusy')); return; }
          NOA.farm.plant(free, index);
          NOA.audio.play('plant');
          PN.closeSheet();
        }, { disabled: free < 0 || it.locked }));
      }
      if (it.kind === 'animal') {
        const free = S().pens.findIndex((p) => !p.animal);
        acts.append(UI.btn('🏡 ' + t('item.toPen'), 'sm leaf', () => {
          NOA.farm.placeAnimal(free, index);
          NOA.audio.play('plant');
          PN.closeSheet();
        }, { disabled: free < 0 || it.locked }));
      }
      acts.append(UI.btn('🧺 ' + t('item.sell'), 'sm sun', () => { PN.closeSheet(); NOA.ui.screens.farm.sell(index); }, { disabled: it.locked }));
      acts.append(UI.btn((it.locked ? '🔓 ' + t('item.unlock') : '🔒 ' + t('item.lock')), 'sm ghost', () => { NOA.board.toggleLock(index); NOA.audio.play('tap'); PN.itemSheet(index); }));
      acts.append(UI.btn('📦 ' + t('item.toStorage'), 'sm ghost', () => {
        if (!NOA.board.toStorage(index)) UI.toast(t('toast.storageFull'), 'warn');
        PN.closeSheet();
      }, { disabled: S().storage.length >= S().storageCap }));
      if (I().isBreed(it) && !it.charm) {
        for (const id of ['clover', 'stabilizer', 'stardust']) {
          const n = S().boosters[id] || 0;
          if (n > 0) acts.append(UI.btn(t('item.attach', { emoji: C().boosters[id].emoji }) + ' (' + n + ')', 'sm ghost', () => {
            const r = NOA.board.applyBooster(id, index);
            if (r.ok) { NOA.audio.play('unlock'); UI.toast(t('booster.used', { name: C().boosters[id].emoji + ' ' + t('booster.' + id) }), 'good'); }
            PN.itemSheet(index);
          }));
        }
      }
      if (I().isBreed(it) && !it.revealed && (S().boosters.loupe || 0) > 0) {
        acts.append(UI.btn('🔍 (' + S().boosters.loupe + ')', 'sm ghost', () => {
          const r = NOA.board.applyBooster('loupe', index);
          if (r.ok) UI.toast(t('booster.revealed', { result: r.carrier ? t('item.carrier', { gene: C().genes[r.carrier].emoji + ' ' + t('gene.' + r.carrier) }) : t('item.noCarrier') }));
          PN.itemSheet(index);
        }));
      }
      // extension point: features add their own actions (see js/systems/essence.js)
      const extra = NOA.hooks.run('item.actions', [], it, index);
      extra.forEach((a) => acts.append(UI.btn(a.label, 'sm ' + (a.kind || 'ghost'), () => { a.run(); PN.closeSheet(); })));
      body.append(acts);
      PN.openSheet(body, { type: 'item', index, id: it.id });
    },

    /* ------------------------------------------------------------ plot / pen sheet */
    slotSheet(kind, index) {
      const slot = kind === 'plot' ? S().plots[index] : S().pens[index];
      const it = kind === 'plot' ? slot.seed : slot.animal;
      if (!it) return;
      const body = h('div');
      body.append(h('div', { class: 'sh-head' },
        h('div', { class: 'sh-art' }, UI.itemArt(it)),
        h('div', null, h('div', { class: 'sh-name' }, I().name(it)),
          h('div', { class: 'sh-sub' }, (kind === 'plot' ? t('farm.plot') + ' ' + (index + 1) : t('farm.penInfo', { n: index + 1 })) + ' · ' + t('ui.lv', { n: it.level })))));
      body.append(PN.statRows(it), h('div', { style: { marginTop: '8px' } }, PN.geneLine(it)));
      const meta = h('div', { class: 'sh-meta' });
      if (slot.end) meta.append(h('div', null, '⏳ ' + (NOA.farm.isReady(slot) ? t('ui.ready') : t('ui.left', { t: UI.dur(slot.end - NOA.time.now()) }))));
      if (kind === 'pen') {
        meta.append(h('div', null, '🍽️ ' + t('farm.feed', { n: slot.feed }) + ' · ' + t('item.eats', { list: (C().species[it.species].feed || []).map((f) => C().species[f].emoji).join(' ') })));
      }
      meta.append(h('div', null, '🌾 ' + t(kind === 'plot' ? 'item.harvestEst' : 'item.cycleEst', { n: NOA.farm.estimateUnits(it), t: UI.dur(NOA.farm.growMs(it)) })));
      body.append(meta);
      const acts = h('div', { class: 'sh-actions' });
      if (slot.end && !NOA.farm.isReady(slot)) {
        acts.append(UI.btn(t('farm.tonic', { n: S().boosters.tonic || 0 }), 'sm sun', () => {
          if (NOA.farm.tonic(kind, index)) { NOA.audio.play('purity'); PN.closeSheet(); }
          else UI.toast(t('booster.none', { name: t('booster.tonic') }));
        }, { disabled: !(S().boosters.tonic > 0) }));
      }
      if (kind === 'pen') {
        acts.append(UI.btn('↩️ ' + t('farm.removeAnimal'), 'sm ghost', () => {
          if (!NOA.farm.removeAnimal(index)) UI.toast(t('toast.boardFull'), 'warn');
          PN.closeSheet();
        }));
      }
      body.append(acts);
      PN.openSheet(body, { type: 'slot', kind, index });
    },

    /* ------------------------------------------------------------ storage */
    storageModal() {
      UI.modal({
        title: '📦 ' + t('farm.storage') + ' ' + S().storage.length + '/' + S().storageCap,
        body: (b, m) => {
          const render = () => {
            UI.clear(b);
            if (!S().storage.length) { b.append(h('p', { class: 'muted', style: { textAlign: 'center' } }, t('ui.empty'))); return; }
            const grid = h('div', { class: 'pick-grid' });
            S().storage.forEach((it, i) => {
              grid.append(h('button', {
                type: 'button', class: 'pick', title: I().name(it),
                on: {
                  click: () => {
                    if (NOA.board.takeFromStorage(i) < 0) { UI.toast(t('toast.boardFull'), 'warn'); return; }
                    NOA.audio.play('drop');
                    render();
                  }
                }
              }, UI.itemArt(it)));
            });
            b.append(grid);
          };
          render();
        }
      });
    },

    /* ------------------------------------------------------------ energy */
    energyModal() {
      const shopIds = ['energy_small', 'energy_50'];
      UI.modal({
        title: '⚡ ' + t('res.energy'),
        body: (b) => {
          const ms = NOA.res.energyNextMs();
          b.append(h('p', { style: { textAlign: 'center', fontWeight: '800', fontSize: '18px' } },
            UI.num(S().res.energy) + ' / ' + NOA.res.energyMax() + (ms ? '  ·  +1 ' + UI.dur(ms) : '  ·  ' + t('hud.energyFull'))));
          const grid = h('div', { class: 'shop-grid' });
          shopIds.forEach((id) => grid.append(NOA.ui.screens.shop.itemCard(NOA.shop.find(id))));
          b.append(grid);
        }
      });
    },

    /* ------------------------------------------------------------ daily login */
    loginModal(auto) {
      const days = B().login.days;
      const idx = NOA.rewards.login.dayIndex();
      const can = NOA.rewards.login.canClaim();
      UI.modal({
        title: '📅 ' + t('login.title'),
        body: (b) => {
          const grid = h('div', { class: 'login-grid' });
          // after claiming day 7 the index wraps to 0, so the whole week shows as claimed today
          const doneCount = can ? idx : (idx === 0 && S().login.claimed > 0 ? days.length : idx);
          days.forEach((d, i) => {
            const prev = UI.rewardPreview(d);
            const done = i < doneCount;
            const today = can && i === idx;
            grid.append(h('div', { class: 'lday' + (done ? ' done' : '') + (today ? ' today' : '') + (i === days.length - 1 ? ' big' : '') },
              h('span', null, t('login.day', { n: i + 1 })),
              h('span', { class: 'le' }, prev.map((p) => p.icon).join('')),
              h('small', null, prev.map((p) => '+' + UI.compact(p.n)).join(' ')),
              done ? h('small', null, '✓ ' + t('login.claimed')) : today ? h('small', null, t('login.today')) : null));
          });
          b.append(grid);
          if (!can) b.append(h('p', { class: 'muted', style: { textAlign: 'center' } }, t('login.tomorrow')));
        },
        actions: can ? [{
          label: t('ui.claim'), kind: 'leaf', onClick: () => {
            const r = NOA.rewards.login.claim();
            if (!r) return;
            NOA.audio.play('levelUp');
            NOA.ui.fx.confetti(innerWidth / 2, innerHeight * 0.4, 60);
            PN.rewardsToast(r.granted);
            NOA.ui.hud.update();
          }
        }] : [{ label: t('ui.ok'), kind: 'ghost' }]
      });
      void auto;
    },
    rewardsToast(entries) {
      if (!entries || !entries.length) return;
      UI.toast(entries.map((e) => e.icon + ' +' + UI.num(e.n)).join('   '), 'good');
      const hud = NOA.ui.hud.els;
      const c = { x: innerWidth / 2, y: innerHeight * 0.45 };
      entries.forEach((e) => {
        if (e.icon === '🪙') NOA.ui.fx.flyTo(c, hud.coins, '🪙', 6);
        if (e.icon === '💎') NOA.ui.fx.flyTo(c, hud.gems, '💎', 4);
        if (e.icon === '⚡') NOA.ui.fx.flyTo(c, hud.energy, '⚡', 4);
      });
    },

    /* ------------------------------------------------------------ level up (queued) */
    _levelQueue: [],
    levelUp(e) {
      PN._levelQueue.push(e);
      if (PN._levelQueue.length === 1) PN._showLevel();
    },
    _showLevel() {
      const e = PN._levelQueue[0];
      if (!e) return;
      NOA.audio.play('levelUp');
      NOA.audio.vibrate([20, 40, 20, 40, 60]);
      NOA.ui.fx.confetti(innerWidth / 2, innerHeight * 0.35, 90);
      UI.modal({
        title: t('level.title', { n: e.level }),
        body: (b) => {
          b.append(h('div', { class: 'levelup-num' }, String(e.level)));
          b.append(h('h3', { style: { textAlign: 'center' } }, t('level.rewards')), UI.rewardChips(e.granted));
          const list = [];
          e.unlocks.species.forEach((id) => list.push([C().species[id].emoji, t('species.' + id)]));
          e.unlocks.features.forEach((f) => list.push(['✨', t('unlock.' + f)]));
          if (e.unlocks.plots) list.push(['🟫', t('unlock.plot')]);
          if (e.unlocks.pens) list.push(['🏡', t('unlock.pen')]);
          if (list.length) {
            b.append(h('h3', { style: { textAlign: 'center' } }, t('level.unlocks')),
              h('div', { class: 'unlock-list' }, list.map(([ic, tx]) => h('div', null, h('span', { style: { fontSize: '20px' } }, ic), tx))));
          }
        },
        actions: [{ label: t('ui.claim'), kind: 'leaf' }],
        onClose: () => {
          PN._levelQueue.shift();
          NOA.ui.hud.update();
          NOA.ui.renderTabs();
          if (NOA.ui.current === 'farm') NOA.ui.screens.farm.renderField();
          if (PN._levelQueue.length) setTimeout(PN._showLevel, 250);
        }
      });
    },

    /* ------------------------------------------------------------ order details */
    orderModal(o) {
      const fresh = S().orders.find((x) => x.id === o.id);
      if (!fresh) return;
      const avail = NOA.orders.availability(fresh);
      const est = NOA.orders.estimate(fresh);
      UI.modal({
        title: C().npcs[fresh.npc].emoji + ' ' + t('npc.' + fresh.npc),
        body: (b) => {
          if (fresh.vip) b.append(h('p', { class: 'notice' }, '✨ ' + t('order.vip')));
          if (fresh.earth) b.append(h('p', { class: 'notice' }, '🌍 ' + t('order.earth') + ' · ' + t('sky.earth', { n: S().earth })));
          fresh.lines.forEach((l, i) => {
            const p = C().products[l.product];
            const have = Math.min(l.count, l.filled + avail[i]);
            b.append(h('div', { class: 'gene-line' + (have >= l.count ? ' on' : ''), style: { '--gc': '#9be37a' } },
              h('span', { style: { fontSize: '22px' } }, p.emoji),
              h('span', null, t('product.' + l.product) + ' · ' + have + '/' + l.count),
              l.needGene ? h('span', { class: 'muted' }, '🧬 ' + t('order.needGene')) : null,
              l.minStars ? h('span', { class: 'muted' }, t('order.minStars', { n: l.minStars })) : null));
          });
          b.append(h('p', { style: { textAlign: 'center', fontWeight: '800' } }, t('order.reward') + ': 🪙' + UI.num(est.coins) + ' · ⭐' + est.xp + ' XP'));
        },
        actions: [
          { label: '⟳ ' + t('order.swap'), kind: 'ghost', disabled: !NOA.orders.canSwap(fresh), onClick: () => NOA.orders.swap(fresh.id) },
          {
            label: t('order.deliver'), kind: 'leaf', disabled: !NOA.orders.canDeliver(fresh), onClick: () => {
              const r = NOA.orders.deliver(fresh.id);
              if (r && r.complete) NOA.ui.screens.farm.celebrateOrder({ x: innerWidth / 2, y: innerHeight / 2 }, r.reward);
            }
          }
        ]
      });
    },

    /* ------------------------------------------------------------ secret discovered */
    secret(e) {
      NOA.audio.play('secret');
      NOA.ui.fx.confetti(innerWidth / 2, innerHeight * 0.4, 50);
      UI.modal({
        title: '🔮 ' + t('secret.unlocked'),
        body: (b) => {
          b.append(h('div', { style: { fontSize: '56px', textAlign: 'center', lineHeight: '1.1' } }, C().secrets[e.id].icon),
            h('h3', { style: { textAlign: 'center', fontSize: '20px' } }, t('secret.' + e.id + '.title')),
            h('p', { style: { textAlign: 'center' } }, t('secret.' + e.id + '.desc')));
          if (e.granted && e.granted.length) b.append(UI.rewardChips(e.granted));
        },
        actions: [{ label: t('ui.ok'), kind: 'leaf' }]
      });
    }
  };
})();

// ---- js/ui/labs-view.js
/*
 * Labs screen: 🌱 Greenhouse and 🐾 Ranch — upgrades, current vs next-level bonuses,
 * cross-breeding slots and extension sections (gene essence...).
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const UI = NOA.ui;
  const h = (...a) => UI.h(...a);
  const t = (k, p) => NOA.t(k, p);
  const S = () => NOA.state;
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const I = () => NOA.items;
  const L = () => NOA.labs;

  const LV = NOA.ui.screens.labs = {
    render() {
      const root = document.getElementById('scr-labs');
      UI.clear(root);
      L().ids.forEach((lab) => root.append(LV.labCard(lab)));
      const fams = ['plant', 'animal'];
      const genes = Object.keys(C().genes);
      const found = genes.filter((g) => S().discovered.genes[g]).length;
      root.append(h('div', { class: 'panel' },
        h('div', { class: 'panel-title' }, h('span', null, '🧬 ' + t('lab.genes')), h('span', { class: 'num' }, found + '/' + genes.length)),
        h('div', { class: 'essence-row', style: { marginTop: '8px' } },
          fams.map((f) => genes.filter((g) => C().genes[g].family === f).map((g) =>
            h('span', { class: 'ev', title: S().discovered.genes[g] ? t('gene.' + g) : '???', style: { opacity: S().discovered.genes[g] ? '1' : '0.35' } },
              S().discovered.genes[g] ? C().genes[g].emoji : '❔'))))));
    },
    tick() {
      if (NOA.ui.current !== 'labs') return;
      document.querySelectorAll('#scr-labs [data-job]').forEach((el) => {
        const [lab, i] = el.dataset.job.split(':');
        const job = S().labs[lab].slots[Number(i)];
        if (!job) return;
        const left = job.end - NOA.time.now();
        const tm = el.querySelector('.jt');
        if (left > 0 && tm) tm.textContent = UI.dur(left);
        else if (left <= 0 && !el.dataset.ready) LV.render();
      });
    },

    labCard(lab) {
      const lvl = L().level(lab);
      const cur = L().data(lab);
      const next = lvl < B().labs.maxLevel ? B().labs.levels[lvl + 1] : null;
      const open = L().isOpen(lab);
      const tier = lvl >= 8 ? 3 : lvl >= 4 ? 2 : 1;
      const card = h('section', { class: 'panel lab' + (open ? '' : ' locked-panel'), 'data-lock': open ? null : '🔒 ' + t('lab.locked', { level: B().unlocks.ranch }) });
      card.append(h('div', { class: 'lab-head' },
        h('div', { class: 'lab-art tier-' + tier }, lab === 'greenhouse' ? (tier === 3 ? '🏰' : tier === 2 ? '🏡' : '🛖') : (tier === 3 ? '🏯' : tier === 2 ? '🏠' : '🛖'),
          h('span', { class: 'lv' }, String(lvl))),
        h('div', { style: { minWidth: '0' } },
          h('div', { class: 'lab-name' }, (lab === 'greenhouse' ? '🌱 ' : '🐾 ') + t('lab.' + lab)),
          h('p', { class: 'muted tiny' }, t('lab.' + lab + '.desc')))));

      const pct = (v) => UI.pct(v);
      const rows = [
        ['lab.success', '+' + pct(cur.success), next ? '+' + pct(next.success) : null],
        ['lab.spawn', pct(B().gene.spawnChance + cur.spawnAdd), next ? pct(B().gene.spawnChance + next.spawnAdd) : null],
        ['lab.break', '+' + pct(cur.breakAdd), next ? '+' + pct(next.breakAdd) : null],
        ['lab.lv2', pct(cur.lv2Spawn), next ? pct(next.lv2Spawn) : null],
        ['lab.purityCap', '◆' + cur.purityCap, next ? '◆' + next.purityCap : null],
        ['lab.fusionTier', t('tier.n', { n: cur.fusionTier }), next ? t('tier.n', { n: next.fusionTier }) : null],
        ['lab.slots', String(cur.slots), next ? String(next.slots) : null],
        ['lab.discovery', pct(B().hybrid.baseDiscovery + cur.discoveryAdd), next ? pct(B().hybrid.baseDiscovery + next.discoveryAdd) : null]
      ];
      const kv = h('dl', { class: 'kv' });
      rows.forEach(([k, v, n]) => {
        kv.append(h('dt', null, t(k)), h('dd', null, v), h('span', { class: 'up' }, n && n !== v ? '→ ' + n : ''));
      });
      card.append(kv);

      if (open) {
        if (next) {
          const can = NOA.res.canAfford(next.cost);
          card.append(UI.btn('⬆️ ' + t('lab.upgradeTo', { n: lvl + 1 }) + ' · ' + UI.cost(next.cost), can ? 'leaf block' : 'ghost block', () => {
            const r = L().upgrade(lab);
            if (r.ok) {
              NOA.audio.play('levelUp');
              NOA.ui.fx.confetti(innerWidth / 2, innerHeight * 0.4, 70);
              UI.toast(t('lab.upgraded', { lab: t('lab.' + lab), n: r.level }), 'good');
              LV.render();
              NOA.ui.hud.update();
            } else {
              NOA.audio.play('invalid');
              UI.toast(t('toast.notEnough', { name: t('res.coins') + ' / ' + t('res.rp') }), 'warn');
            }
          }));
        } else {
          card.append(h('p', { class: 'notice', style: { textAlign: 'center' } }, '🏆 ' + t('lab.maxed')));
        }
        card.append(LV.hybridSection(lab));
        const extra = NOA.hooks.run('labs.sections', [], lab);
        extra.forEach((s) => { const box = h('div'); s.render(box); card.append(box); });
      }
      return card;
    },

    hybridSection(lab) {
      const box = h('div', { class: 'lab' });
      box.append(h('h3', { class: 'lab-sub' }, '🧪 ' + t('lab.hybridTitle')));
      if (!L().hybridOpen(lab)) {
        box.append(h('p', { class: 'muted tiny' }, t('lab.hybridLocked', { level: B().unlocks.hybrid })));
        return box;
      }
      box.append(h('p', { class: 'muted tiny' }, t('lab.hybridHint', { vigor: B().hybrid.vigorBonus })));
      L().syncSlots(lab);
      const grid = h('div', { class: 'hslots' });
      S().labs[lab].slots.forEach((job, i) => {
        if (!job) {
          grid.append(h('button', { type: 'button', class: 'hslot', on: { click: () => LV.pickPair(lab, i) } },
            h('span', { style: { fontSize: '26px' } }, '🧬'), t('lab.hybridNew')));
          return;
        }
        const ready = NOA.time.now() >= job.end;
        const el = h('div', { class: 'hslot busy', data: { job: lab + ':' + i, ready: ready ? '1' : null } },
          h('span', { class: 'pair' }, C().species[job.a.species].emoji, h('span', { class: 'dna' }, '🧬'), C().species[job.b.species].emoji),
          ready ? UI.btn(t('lab.hybridReady'), 'sm berry', () => LV.collect(lab, i))
            : h('span', null, t('lab.hybridRunning') + ' ', h('b', { class: 'jt num' }, UI.dur(job.end - NOA.time.now()))));
        grid.append(el);
      });
      box.append(grid);
      return box;
    },

    pickPair(lab, slot) {
      const cands = L().candidates(lab);
      const species = new Set(cands.map((i) => S().board[i].species));
      if (species.size < 2) { UI.toast(t('lab.noCandidates'), 'warn'); return; }
      const chosen = [];
      UI.modal({
        title: t('lab.hybridPick'),
        body: (b, m) => {
          const grid = h('div', { class: 'pick-grid' });
          const startBtn = UI.btn(t('lab.hybridCost', { n: B().hybrid.costCoins }), 'leaf block', () => {
            const r = L().startHybrid(lab, slot, chosen[0], chosen[1]);
            if (r.ok) { NOA.audio.play('swoosh'); m.close(); LV.render(); }
            else { NOA.audio.play('invalid'); UI.toast(r.error === 'coins' ? t('toast.notEnough', { name: t('res.coins') }) : t('lab.noCandidates'), 'warn'); }
          }, { disabled: true });
          const status = h('p', { class: 'muted tiny', style: { textAlign: 'center' } }, '');
          const update = () => {
            grid.querySelectorAll('.pick').forEach((el) => el.setAttribute('aria-pressed', chosen.indexOf(Number(el.dataset.i)) >= 0 ? 'true' : 'false'));
            startBtn.disabled = chosen.length !== 2;
            status.textContent = chosen.map((i) => I().name(S().board[i])).join(' × ');
          };
          cands.forEach((i) => {
            const it = S().board[i];
            grid.append(h('button', {
              type: 'button', class: 'pick', data: { i: String(i) }, 'aria-pressed': 'false', title: I().name(it),
              on: {
                click: () => {
                  const k = chosen.indexOf(i);
                  if (k >= 0) chosen.splice(k, 1);
                  else {
                    if (chosen.length === 1 && S().board[chosen[0]].species === it.species) { UI.toast(t('lab.hybridHint', { vigor: B().hybrid.vigorBonus })); return; }
                    if (chosen.length >= 2) chosen.shift();
                    chosen.push(i);
                  }
                  NOA.audio.play('tap');
                  update();
                }
              }
            }, UI.itemArt(it)));
          });
          b.append(grid, status, startBtn);
        }
      });
    },

    collect(lab, slot) {
      const r = L().collectHybrid(lab, slot);
      if (!r) return;
      if (r.error === 'full') { UI.toast(t('toast.boardFull'), 'warn'); return; }
      LV.render();
      if (r.success) {
        NOA.audio.play('reveal', r.isNew ? 3 : 2);
        NOA.ui.fx.confetti(innerWidth / 2, innerHeight * 0.4, 80);
        UI.modal({
          title: '🧬 ' + t('lab.hybridSuccess'),
          body: (b) => {
            b.append(h('div', { style: { width: '110px', height: '110px', margin: '0 auto' } }, UI.itemArt(r.item, { size: 54 })),
              h('h3', { style: { textAlign: 'center' } }, I().name(r.item) + (r.isNew ? '  ' + t('ui.new') : '')),
              h('p', { class: 'notice' }, '🔎 ' + t('hybrid.' + r.species + '.fact')));
          },
          actions: [{ label: t('ui.ok'), kind: 'leaf' }],
          onClose: () => { if (r.item.gene && r.fx.some((f) => f.type === 'awaken')) NOA.ui.fx.awaken(r.item, 'awaken'); }
        });
      } else {
        NOA.audio.play('geneLost');
        UI.modal({
          title: t('lab.hybridFail'),
          body: h('p', { style: { textAlign: 'center' } }, t('lab.hybridFailText', {
            name: I().name(r.item), rp: r.rp, extra: t(r.compatible ? 'lab.hybridCompatible' : 'lab.hybridIncompatible')
          })),
          actions: [{ label: t('ui.ok'), kind: 'ghost' }]
        });
      }
    }
  };
})();

// ---- js/ui/gacha-view.js
/*
 * Blindbox screen + the opening show:
 *   tap → box shakes (glow escalates white → blue → purple → gold → pink, honest to the roll)
 *   → lid flies off with a burst → cards rise and flip (single) or a 2×5 grid flips in sequence (×10).
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const UI = NOA.ui;
  const h = (...a) => UI.h(...a);
  const t = (k, p) => NOA.t(k, p);
  const S = () => NOA.state;
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;
  const I = () => NOA.items;

  const RC = { common: '#e9f0e6', rare: '#3ea8f4', epic: '#a560f0', legendary: '#ffb21f', mythic: '#ff58a6' };
  const order = () => B().gacha.rarityOrder;
  const sleep = (ms) => new Promise((r) => setTimeout(r, UI.reduced ? Math.min(ms, 60) : ms));

  const giftBox = (id, extraCls) => h('div', { class: 'gbox gbox--' + id + (extraCls ? ' ' + extraCls : '') },
    h('div', { class: 'gb-body' }, h('span', { class: 'gb-emblem' }, C().boxes[id].emoji)),
    h('div', { class: 'gb-lid' }, h('div', { class: 'gb-bow' })));

  const GV = NOA.ui.screens.gacha = {
    render() {
      const root = document.getElementById('scr-gacha');
      UI.clear(root);
      root.append(h('div', { class: 'tickets-bar' },
        Object.keys(B().gacha.boxes).map((id) => h('span', { class: 'ev' }, '🎟️ ' + t('ticket.' + B().gacha.boxes[id].ticket) + ' ×' + (S().tickets[B().gacha.boxes[id].ticket] || 0)))));
      Object.keys(B().gacha.boxes).forEach((id) => root.append(GV.boxCard(id)));
      root.append(h('p', { class: 'notice' }, '🔎 ' + t('box.ratesNote', { rarity: t('rarity.' + B().gacha.boxes.sprout.multi.guaranteeMinRarity) })));
    },

    boxCard(id) {
      const unlocked = NOA.gacha.isUnlocked(id);
      const box = B().gacha.boxes[id];
      const lockLv = B().unlocks[C().boxes[id].unlock];
      const costLabel = (n) => {
        const c = NOA.gacha.cost(id, n);
        return UI.cost(c);
      };
      const pity = NOA.gacha.pityLeft(id).map((p) => h('div', { class: 'pity-line' },
        h('span', { class: 'rh-dot', style: { background: RC[p.rarity] } }), t('box.pity', { rarity: t('rarity.' + p.rarity), n: p.left })));
      const card = h('section', { class: 'panel box-card' + (unlocked ? '' : ' locked-panel'), 'data-lock': unlocked ? null : '🔒 ' + t('box.locked', { level: lockLv }) },
        giftBox(id),
        h('div', { class: 'box-info' },
          h('h3', null, t('box.' + id)),
          h('p', null, t('box.' + id + '.desc')),
          pity,
          h('div', { class: 'box-btns' },
            UI.btn(t('box.open1') + ' · ' + costLabel(1), 'sm berry', () => GV.open(id, 1), { disabled: !unlocked }),
            UI.btn(t('box.open10') + ' · ' + costLabel(box.multi.count), 'sm sun', () => GV.open(id, box.multi.count), { disabled: !unlocked }),
            UI.btn(t('ui.rates'), 'sm ghost', () => GV.ratesModal(id)))));
      return card;
    },

    open(id, count) {
      NOA.audio.unlock();
      const can = NOA.gacha.canOpen(id, count);
      if (!can.ok) {
        NOA.audio.play('invalid');
        if (can.reason === 'room') UI.toast(t('box.needRoom'), 'warn');
        else if (can.reason === 'locked') UI.toast(t('box.locked', { level: B().unlocks[C().boxes[id].unlock] }));
        else UI.toast(t('toast.notEnough', { name: can.cost && can.cost.gems ? t('res.gems') : t('res.coins') }), 'warn');
        return;
      }
      const res = NOA.gacha.open(id, count);
      if (!res.ok) return;
      NOA.ui.hud.update();
      GV.stage(id, count, res.results);
    },

    /* ------------------------------------------------------------ the show */
    async stage(id, count, results) {
      const best = Math.max(...results.map((r) => order().indexOf(r.rarity)));
      const ov = h('div', { class: 'gstage', role: 'dialog', 'aria-label': t('box.' + id) });
      const setRC = (r) => ov.style.setProperty('--rc', RC[r]);
      setRC('common');
      let skipped = false;
      const skipBtn = UI.btn(t('ui.skip'), 'sm ghost', () => { skipped = true; });
      skipBtn.classList.add('gs-skip');
      const box = giftBox(id, 'gs-box');
      const hint = h('div', { class: 'gs-hint' }, t('box.tap'));
      const center = h('div', { class: 'gs-center' }, box, hint);
      const cards = h('div', { class: 'gs-cards' + (count > 1 ? ' many' : '') });
      const actions = h('div', { class: 'gs-actions' });
      ov.append(h('div', { class: 'gs-bg' }), h('div', { class: 'gs-rays' }), h('div', { class: 'gs-glow' }), skipBtn, center, cards, actions);
      document.getElementById('overlays').append(ov);
      NOA.audio.play('open');

      // 1) anticipation: wait for the tap
      await new Promise((resolve) => {
        let done = false;
        const go = () => { if (done) return; done = true; ov.removeEventListener('click', go); resolve(); };
        ov.addEventListener('click', go);
        skipBtn.addEventListener('click', go);
      });
      hint.remove();
      ov.classList.add('charging');

      // 2) shakes with an honest rarity escalation
      const steps = 3 + Math.max(0, best - 2);
      let shown = 0;
      for (let s = 0; s < steps && !skipped; s++) {
        const r = Math.min(best, s);
        box.classList.remove('s1', 's2', 's3');
        void box.offsetWidth;
        box.classList.add('s' + Math.min(3, s + 1));
        setRC(order()[r]);
        NOA.audio.play('boxShake', s);
        if (r > shown || s === 0) { NOA.audio.play('boxTease', r); shown = r; }
        NOA.audio.vibrate(15 + s * 10);
        const c = UI.center(box);
        NOA.ui.fx.burst(c.x, c.y, { count: 8 + s * 4, colors: [RC[order()[r]], '#ffffff'], shapes: ['star'], speed: 160 + s * 40, size: 5 });
        await sleep(560 + s * 70);
      }
      setRC(order()[best]);

      // 3) burst
      ov.classList.add('burst');
      box.classList.remove('s1', 's2', 's3');
      box.classList.add('open');
      NOA.audio.play('boxBurst', best);
      NOA.audio.vibrate(best >= 3 ? [40, 30, 80] : 30);
      NOA.ui.fx.flash(RC[order()[best]]);
      const c = UI.center(box);
      NOA.ui.fx.burst(c.x, c.y, { count: 40 + best * 18, colors: [RC[order()[best]], '#ffffff', '#ffe27a'], shapes: ['star', 'circle'], speed: 420 + best * 60, life: 1.2 });
      if (best >= 3) NOA.ui.fx.confetti(c.x, c.y, 90);
      if (best >= 2) NOA.ui.fx.shake(ov);
      await sleep(skipped ? 120 : 520);
      center.remove();
      skipBtn.remove();

      // 4) reveal
      if (count === 1) {
        const r = results[0];
        ov.insertBefore(h('div', { class: 'gs-title' }, t('rarity.' + r.rarity) + '!'), cards);
        const card = GV.card(r);
        card.classList.add('rise');
        cards.append(card);
        await sleep(skipped ? 50 : 380);
        card.classList.add('flipped');
        NOA.audio.play('reveal', order().indexOf(r.rarity));
      } else {
        const els = results.map((r) => GV.card(r));
        els.forEach((el, i) => { el.classList.add('rise'); el.style.animationDelay = (i * 0.04) + 's'; cards.append(el); });
        await sleep(skipped ? 50 : 520);
        for (let i = 0; i < els.length; i++) {
          const ri = order().indexOf(results[i].rarity);
          els[i].classList.add('flipped');
          NOA.audio.play(ri >= 3 ? 'reveal' : 'flip', ri);
          if (ri >= 3) {
            const cc = UI.center(els[i]);
            NOA.ui.fx.burst(cc.x, cc.y, { count: 30, colors: [RC[results[i].rarity], '#ffffff'], shapes: ['star'], speed: 260 });
          }
          await sleep(skipped ? 20 : ri >= 3 ? 420 : 170);
        }
      }

      // 5) actions
      const close = () => {
        ov.classList.add('closing');
        ov.style.animation = 'fadeOut .25s ease forwards';
        setTimeout(() => ov.remove(), 260);
        const stored = results.filter((r) => r.where && r.where.where === 'storage').length;
        if (stored) UI.toast(t('toast.toStorage', { n: stored }));
        GV.render();
        NOA.ui.hud.update();
        NOA.ui.renderTabs();
      };
      actions.append(
        UI.btn(t('box.again') + ' · ' + UI.cost(NOA.gacha.cost(id, count)), 'berry', () => { close(); setTimeout(() => GV.open(id, count), 280); }),
        UI.btn(t('box.done'), 'leaf', close));
    },

    card(r) {
      let art, name, sub, desc = '';
      if (r.type === 'item') {
        art = UI.itemArt(r.item);
        name = I().name(r.item);
        sub = t(r.item.kind === 'seed' ? 'kind.seed' : 'kind.animal') + ' · ' + t('ui.lv', { n: r.item.level });
        if (r.item.gene) {
          const g = C().genes[r.item.gene.id];
          sub += ' · ' + g.emoji + ' ' + I().purityText(r.item.gene.purity);
          desc = t('gene.' + r.item.gene.id + '.desc');
        } else {
          desc = '🌾 ' + I().stat(r.item, 'yield') + '  ⏱️ ' + I().stat(r.item, 'growth') + '  ⭐ ' + I().stat(r.item, 'quality');
        }
      } else if (r.type === 'booster') {
        art = h('div', { class: 'art' }, h('span', { class: 'emo' }, C().boosters[r.id].emoji));
        name = t('booster.' + r.id) + ' ×' + r.qty;
        sub = t('farm.bag');
        desc = t('booster.' + r.id + '.desc');
      } else if (r.type === 'currency') {
        const e = r.entries[0] || { icon: '🪙', n: 0 };
        art = h('div', { class: 'art' }, h('span', { class: 'emo' }, e.icon));
        name = '+' + UI.num(e.n) + ' ' + (e.key ? t(e.key) : '');
        sub = '';
      } else if (r.type === 'mascot') {
        const m = C().mascots[r.id];
        art = h('div', { class: 'art' }, h('span', { class: 'emo' }, m.emoji));
        name = t('mascot.' + r.id);
        sub = t('mascot.' + m.type) + (m.type === 'temp' ? ' · ' + r.res.minutes + "'" : ' · ' + '★'.repeat(r.res.stars));
        if (r.res.overflowGems) sub += ' · +' + r.res.overflowGems + '💎';
        desc = t('mascot.' + r.id + '.desc');
      } else {
        art = h('div', { class: 'art' });
        name = '…';
        sub = '';
      }
      return h('div', { class: 'gcard r-' + r.rarity },
        h('div', { class: 'gc-inner' },
          h('div', { class: 'gc-back' }, '?'),
          h('div', { class: 'gc-front' },
            h('div', { class: 'gc-banner' }, t('rarity.' + r.rarity)),
            h('div', { class: 'gc-art' }, art),
            h('div', { class: 'gc-name' }, name),
            sub ? h('div', { class: 'gc-sub' }, sub) : null,
            desc ? h('div', { class: 'gc-desc' }, desc) : null,
            r.isNew ? h('span', { class: 'gc-new' }, t('ui.new')) : null)));
    },

    ratesModal(id) {
      const rates = NOA.gacha.rates(id);
      const box = B().gacha.boxes[id];
      UI.modal({
        title: t('box.ratesTitle', { box: t('box.' + id) }),
        body: (b) => {
          const tb = h('table', { class: 'rate-table' });
          rates.forEach((r) => {
            tb.append(h('tr', { class: 'rh' },
              h('td', null, h('span', { class: 'rh-dot', style: { background: RC[r.rarity] } }), t('rarity.' + r.rarity)),
              h('td', { class: 'p' }, UI.pct(r.p))));
            r.entries.forEach((e) => tb.append(h('tr', null, h('td', null, '· ' + t('reward.' + e.rewardId)), h('td', { class: 'p' }, UI.pct(e.p)))));
          });
          b.append(h('div', { style: { overflowX: 'auto' } }, tb));
          const pity = Object.keys(box.pity || {}).map((r) => t('box.pity', { rarity: t('rarity.' + r), n: box.pity[r] })).join(' · ');
          if (pity) b.append(h('p', { class: 'notice' }, pity));
          b.append(h('p', { class: 'muted tiny' }, t('box.ratesNote', { rarity: t('rarity.' + box.multi.guaranteeMinRarity) })));
        }
      });
    }
  };
})();

// ---- js/ui/shop-view.js
/*
 * Shop screen: items (🪙 coins or 💎 gems), gem packs (real money via NOA.payment, not live yet)
 * and offers (starter pack, monthly card). Payment links/config: config/payment.js.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const UI = NOA.ui;
  const h = (...a) => UI.h(...a);
  const t = (k, p) => NOA.t(k, p);
  const S = () => NOA.state;
  const B = () => NOA.BALANCE;

  const ICON = {
    energy_50: '⚡', energy_small: '⚡', clover_1: '🍀', clover_5: '🍀', stabilizer_1: '🧪', stardust_1: '✨',
    tonic_3: '🧃', loupe_1: '🔍', storage_8: '📦', ticket_star: '🎟️'
  };
  const PACK_ICON = { gems_60: '💎', gems_330: '💰', gems_700: '🧰', gems_1500: '👑', starter_pack: '🎒', monthly_card: '📆' };

  let tab = 'items';

  const SV = NOA.ui.screens.shop = {
    tab(name) { tab = name; SV.render(); },
    render() {
      const root = document.getElementById('scr-shop');
      UI.clear(root);
      const seg = h('div', { class: 'seg', role: 'tablist' });
      [['items', '🛍️ ' + t('shop.items')], ['gems', '💎 ' + t('shop.gems')], ['offers', '🎁 ' + t('shop.offers')]].forEach(([id, label]) => {
        seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': tab === id ? 'true' : 'false', on: { click: () => { NOA.audio.play('tap'); SV.tab(id); } } }, label));
      });
      root.append(seg);
      const on = seg.querySelector('[aria-pressed="true"]');
      if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      if (tab === 'items') SV.renderItems(root);
      else if (tab === 'gems') SV.renderGems(root);
      else SV.renderOffers(root);
    },

    itemCard(it) {
      const cur = Object.keys(it.price)[0];
      const can = NOA.shop.canBuy(it.id);
      return h('div', { class: 'sitem' },
        h('span', { class: 'si' }, ICON[it.id] || '🎁'),
        h('span', { class: 'sn' }, t('shopitem.' + it.id)),
        it.grant.boosters ? h('span', { class: 'sd' }, t('booster.' + Object.keys(it.grant.boosters)[0] + '.desc')) : null,
        UI.btn(UI.cost(it.price), cur === 'gems' ? 'sm sky' : 'sm sun', (ev) => {
          const r = NOA.shop.buy(it.id);
          if (r.ok) {
            NOA.audio.play('coin');
            const c = UI.center(ev.currentTarget);
            NOA.ui.fx.burst(c.x, c.y, { count: 16, colors: ['#ffd84d', '#ffffff', '#56c1ff'], shapes: ['star'], speed: 200 });
            UI.toast(t('shop.bought') + ' ' + r.granted.map((g) => g.icon + '+' + g.n).join(' '), 'good');
            NOA.ui.hud.update();
            SV.render();
            if (NOA.ui.screens.farm.els.bag) NOA.ui.screens.farm.renderDock();
          } else {
            NOA.audio.play('invalid');
            UI.toast(r.error === 'max' ? t('ui.max') : t('toast.notEnough', { name: t('res.' + (r.currency || cur)) }), 'warn');
          }
        }, { disabled: !can }));
    },

    renderItems(root) {
      const grid = h('div', { class: 'shop-grid' });
