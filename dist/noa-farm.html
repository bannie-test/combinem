      NOA.shop.items().forEach((it) => grid.append(SV.itemCard(it)));
      const ex = B().shop.exchange;
      grid.append(h('div', { class: 'sitem' },
        h('span', { class: 'si' }, '🔁'),
        h('span', { class: 'sn' }, t('shop.exchange')),
        h('span', { class: 'sd' }, t('shop.exchangeDesc', { gems: ex.gems, coins: UI.num(ex.coins) })),
        UI.btn(UI.cost({ gems: ex.gems }), 'sm sky', () => {
          const r = NOA.shop.exchange();
          if (r.ok) { NOA.audio.play('coin'); NOA.ui.hud.update(); SV.render(); }
          else { NOA.audio.play('invalid'); UI.toast(t('toast.notEnough', { name: t('res.gems') }), 'warn'); }
        }, { disabled: S().res.gems < ex.gems })));
      root.append(grid);
    },

    payNotice() {
      if (NOA.payment.provider() === 'mock') return h('p', { class: 'notice' }, '🧪 ' + t('shop.payMock'));
      if (!NOA.payment.isLive()) return h('p', { class: 'notice' }, '🔒 ' + t('shop.payOff') + '. ' + t('shop.payOffNote'));
      return null;
    },
    packCard(p) {
      const live = NOA.payment.isLive();
      const available = NOA.payment.available(p);
      const btn = UI.btn(available ? NOA.payment.priceText(p) : t('shop.owned'), live ? 'sm leaf' : 'sm ghost', async (ev) => {
        const b = ev.currentTarget;
        b.disabled = true;
        const r = await NOA.payment.purchase(p.sku);
        b.disabled = false;
        if (r.ok) {
          NOA.audio.play('levelUp');
          NOA.ui.fx.confetti(innerWidth / 2, innerHeight * 0.4, 70);
          UI.toast(t('toast.purchaseOk'), 'good');
          NOA.ui.panels.rewardsToast(r.granted);
          SV.render();
        } else if (r.code === 'disabled') {
          NOA.audio.play('tap');
          UI.toast(t('toast.purchaseOff', { sku: p.sku }));
        } else {
          NOA.audio.play('invalid');
          UI.toast(t('toast.purchaseFail', { code: r.code }), 'warn');
        }
      }, { disabled: !available });
      return h('div', { class: 'sitem gems' },
        p.bonus ? h('span', { class: 'ribbon' }, t('shop.bonus', { n: p.bonus })) : !live ? h('span', { class: 'ribbon' }, t('ui.comingSoon')) : null,
        h('span', { class: 'si' }, PACK_ICON[p.sku] || '💎'),
        h('span', { class: 'sn' }, t('pay.' + p.sku)),
        h('span', { class: 'sd' }, p.grant.gems && !p.daily && p.type === 'consumable' ? UI.num(p.grant.gems + (p.bonus || 0)) + ' 💎' : t('pay.' + p.sku + '.desc')),
        btn);
    },
    renderGems(root) {
      const n = SV.payNotice();
      if (n) root.append(n);
      const grid = h('div', { class: 'shop-grid' });
      NOA.payment.products().filter((p) => p.type === 'consumable').forEach((p) => grid.append(SV.packCard(p)));
      root.append(grid, SV.footer());
    },
    renderOffers(root) {
      const n = SV.payNotice();
      if (n) root.append(n);
      if (NOA.payment.monthly.active()) {
        const days = Math.ceil((S().purchases.monthlyUntil - NOA.time.now()) / NOA.time.DAY);
        root.append(h('div', { class: 'panel' },
          h('div', { class: 'panel-title' }, h('span', null, '📆 ' + t('shop.monthlyActive', { d: days }))),
          UI.btn(t('shop.monthlyClaim'), 'leaf block', () => {
            const g = NOA.payment.monthly.claim();
            if (g) { NOA.audio.play('coin'); NOA.ui.panels.rewardsToast(g); SV.render(); NOA.ui.renderTabs(); }
          }, { disabled: !NOA.payment.monthly.canClaim() })));
      }
      const grid = h('div', { class: 'shop-grid' });
      NOA.payment.products().filter((p) => p.type !== 'consumable').forEach((p) => grid.append(SV.packCard(p)));
      root.append(grid, SV.footer());
    },
    footer() {
      const L = NOA.PAYMENT.links;
      return h('div', { class: 'panel' },
        h('div', { class: 'links' },
          h('a', { href: L.terms, target: '_blank', rel: 'noopener' }, t('shop.terms')),
          h('a', { href: L.privacy, target: '_blank', rel: 'noopener' }, t('shop.privacy')),
          h('span', { class: 'muted' }, t('shop.support', { mail: L.support }))),
        h('div', { style: { marginTop: '10px' } }, UI.btn(t('shop.restore'), 'sm ghost', async () => {
          const r = await NOA.payment.restore();
          UI.toast(r.ok ? t('toast.purchaseOk') : t('toast.purchaseOff', { sku: 'restore' }));
        })));
    }
  };
})();

 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const UI = NOA.ui;

    if (u.level != null) return S().level >= u.level;

  };

  const CV = NOA.ui.screens.codex = {
    tab(name) { tab = name; CV.render(); },
    render() {
      const root = document.getElementById('scr-codex');
      UI.clear(root);

    },

    species(root) {

      const found = all.filter((id) => S().discovered.species[id]);
      root.append(h('div', { class: 'row-title' }, h('span', null, t('codex.progress', { a: found.length, b: all.length }))));
      const grid = h('div', { class: 'cx-grid' });
      all.forEach((id) => {

        const known = !!S().discovered.species[id];
        const best = S().discovered.maxLevel[id];
        grid.append(h('button', {
          type: 'button', class: 'cx' + (known ? '' : ' unknown'),
          on: { click: () => CV.speciesInfo(id) }
        },
          h('span', { class: 'ce' }, sp.emoji + (sp.emoji2 ? sp.emoji2 : '')),
          h('span', { class: 'cn' }, known ? t('species.' + id) : t('codex.unknown')),
          h('span', { class: 'cs' }, known ? (sp.hybrid ? t('item.hybrid') : t('fam.' + sp.family)) + (best ? ' · ' + t('ui.lv', { n: best }) : '') : sp.hybrid ? t('item.hybrid') : t('ui.unlockAt', { level: B().species[id].unlockLevel }))));
      });
      root.append(grid);
    },
    speciesInfo(id) {
      const sp = C().species[id];
      const known = !!S().discovered.species[id];
      UI.modal({
        title: known ? sp.emoji + ' ' + t('species.' + id) : t('codex.unknown'),
        body: (b) => {
          if (sp.hybrid) {
            b.append(h('p', { style: { textAlign: 'center', fontWeight: '800' } }, t('codex.hybridOf', { a: C().species[sp.hybrid[0]].emoji + ' ' + (known ? t('species.' + sp.hybrid[0]) : '???'), b: C().species[sp.hybrid[1]].emoji + ' ' + (known ? t('species.' + sp.hybrid[1]) : '???') })));
            b.append(h('p', { class: 'notice' }, known ? '🔎 ' + t('hybrid.' + id + '.fact') : '💡 ' + t('hybrid.' + id + '.hint')));
          } else {
            const prods = sp.products.map((p) => h('span', { class: 'ev', style: { opacity: S().discovered.products[p] ? '1' : '0.4' } }, C().products[p].emoji + ' ' + (S().discovered.products[p] ? t('product.' + p) : '???')));
            b.append(h('div', { class: 'essence-row', style: { justifyContent: 'center' } }, prods));
            if (sp.feed) b.append(h('p', { class: 'muted', style: { textAlign: 'center' } }, t('item.eats', { list: sp.feed.map((f) => C().species[f].emoji + ' ' + t('species.' + f)).join(', ') })));
          }
          if (S().discovered.maxLevel[id]) b.append(h('p', { style: { textAlign: 'center' } }, t('codex.bestLevel', { n: S().discovered.maxLevel[id] })));

    genes(root) {
      const all = Object.keys(C().genes);
      const found = all.filter((g) => S().discovered.genes[g]).length;
      root.append(h('div', { class: 'row-title' }, h('span', null, t('codex.progress', { a: found, b: all.length }))));

        all.filter((g) => C().genes[g].family === fam).forEach((g) => {
          const def = C().genes[g];
          const known = !!S().discovered.genes[g];
          grid.append(h('button', {
            type: 'button', class: 'cx' + (known ? ' has-gene' : ' unknown'), style: { '--gc': def.color },

          },
            h('span', { class: 'ce' }, def.emoji),
            h('span', { class: 'cn' }, known ? t('gene.' + g) : t('codex.unknown')),
            h('span', { class: 'cs' }, (def.secret ? '🔮 ' : '') + t('gene.tier' + def.tier))));
        });
        root.append(grid);
      });
    },
    geneInfo(g) {
      const def = C().genes[g];
      const known = !!S().discovered.genes[g];
      UI.modal({
        title: known ? def.emoji + ' ' + t('gene.' + g) : t('codex.unknown'),
        body: (b) => {
          b.append(h('p', { style: { textAlign: 'center', fontWeight: '800' } }, t('gene.tier' + def.tier) + ' · ' + t('fam.' + def.family) + ' · ' + t('gene.favor', { stat: t(def.favor === 'all' ? 'stat.all' : 'stat.' + def.favor) })));
          if (known) b.append(h('p', { style: { textAlign: 'center' } }, t('gene.' + g + '.desc')));
          if (def.parents) {
            const p = def.parents.map((x) => C().genes[x].emoji + ' ' + (S().discovered.genes[x] ? t('gene.' + x) : '???'));
            b.append(h('p', { class: 'notice' }, known ? t('gene.recipe', { a: p[0], b: p[1] }) : '💡 ' + t('gene.' + g + '.hint')));
          } else if (def.secret) {
            b.append(h('p', { class: 'notice' }, '🔮 ' + t('gene.secret') + ' · ' + t('gene.' + g + '.hint')));

          const row = B().gene.priceMult[def.tier];
          b.append(h('p', { class: 'muted tiny', style: { textAlign: 'center' } }, '🪙 ×' + row[1] + ' (◆1) → ×' + row[5] + ' (◆5)'));

    mascots(root) {

        shrine.append(h('button', {
          type: 'button', class: 'shrine-slot' + (id ? ' filled' : ''),

        }, id ? [h('span', { class: 'ce' }, C().mascots[id].emoji), t('mascot.' + id), h('br'), '★'.repeat(NOA.mascots.stars(id))] : t('ui.empty')));

      root.append(shrine, h('p', { class: 'muted tiny' }, t('mascot.shrineHint')));
      ['perm', 'temp'].forEach((type) => {
        root.append(h('h3', { class: 'lab-sub' }, t('mascot.' + type)));
        const grid = h('div', { class: 'cx-grid' });
        Object.keys(C().mascots).filter((id) => C().mascots[id].type === type).forEach((id) => {
          const m = C().mascots[id];
          const known = !!S().discovered.mascots[id];
          const active = NOA.mascots.isActive(id);
          let status = '';
          if (type === 'temp' && active) status = t('mascot.remaining', { t: UI.dur(NOA.mascots.tempRemaining(id)) });
          else if (type === 'perm' && S().mascots.owned[id]) status = '★'.repeat(NOA.mascots.stars(id)) + (active ? ' · ' + t('mascot.active') : '');
          grid.append(h('button', {
            type: 'button', class: 'cx' + (known ? '' : ' unknown') + (active ? ' active' : ''),
            on: { click: () => CV.mascotInfo(id) }

            h('span', { class: 'ce' }, m.emoji),
            h('span', { class: 'cn' }, known ? t('mascot.' + id) : (m.secret ? '🔮 ' : '') + t('codex.unknown')),
            h('span', { class: 'cs' }, status)));
        });
        root.append(grid);
      });
    },
    mascotInfo(id) {
      const m = C().mascots[id];
      const known = !!S().discovered.mascots[id];
      const owned = !!S().mascots.owned[id];
      const inShrine = S().mascots.shrine.indexOf(id);
      const actions = [];
      if (m.type === 'perm' && owned && S().level >= B().unlocks.shrine) {
        if (inShrine >= 0) actions.push({ label: t('mascot.remove'), kind: 'ghost', onClick: () => { NOA.mascots.unplace(inShrine); CV.render(); } });
        else actions.push({
          label: t('mascot.place'), kind: 'leaf', onClick: () => {
            const free = S().mascots.shrine.indexOf(null);
            if (free < 0) { UI.toast(t('mascot.shrineFull'), 'warn'); return; }
            NOA.mascots.place(id, free);
            NOA.audio.play('unlock');
            CV.render();
          }
        });
      }
      UI.modal({
        title: known ? m.emoji + ' ' + t('mascot.' + id) : t('codex.unknown'),
        body: (b) => {
          b.append(h('div', { style: { fontSize: '64px', textAlign: 'center', lineHeight: '1.1', filter: known ? 'none' : 'brightness(0) opacity(.25)' } }, m.emoji));
          b.append(h('p', { style: { textAlign: 'center', fontWeight: '800' } }, t('mascot.' + m.type) + (owned ? ' · ' + '★'.repeat(NOA.mascots.stars(id)) : '')));
          if (known) b.append(h('p', { style: { textAlign: 'center' } }, t('mascot.' + id + '.desc')));
          else if (m.secret) b.append(h('p', { class: 'notice' }, '🔮 ???'));
        },
        actions
      });
    },

    secrets(root) {
      const ids = NOA.secrets.ids();
      root.append(h('div', { class: 'row-title' }, h('span', null, t('codex.progress', { a: NOA.secrets.count(), b: ids.length }))));
      ids.forEach((id) => {
        const found = NOA.secrets.isFound(id);
        root.append(h('div', { class: 'panel secret-card' + (found ? '' : ' unknown') },
          h('span', { class: 'ce' }, found ? C().secrets[id].icon : '❔'),
          h('div', null,
            h('h4', null, found ? t('secret.' + id + '.title') : t('codex.unknown')),
            h('p', null, found ? t('secret.' + id + '.desc') : '💡 ' + t('secret.' + id + '.hint')))));
      });
    },

    story(root) {
      root.append(h('div', { class: 'panel story-card' },
        h('h3', null, '🌍 ' + t('codex.earth', { n: S().earth })),
        h('div', { class: 'earth-meter' }, h('i', { style: { width: S().earth + '%' } }))));
      C().chapters.forEach((ch) => {
        const open = unlocked(ch.unlock);
        root.append(h('article', { class: 'panel story-card' + (open ? '' : ' locked') },
          h('h3', null, (open ? '📖 ' : '🔒 ') + t('story.' + ch.id + '.title')),
          h('p', null, open ? t('story.' + ch.id + '.text') : t('codex.chapterLocked'))));
      });
      root.append(h('h3', { class: 'lab-sub' }, '✉️ ' + t('codex.letters')));
      C().letters.forEach((l) => {
        const open = unlocked(l.unlock);
        root.append(h('article', { class: 'panel story-card' + (open ? '' : ' locked') },
          h('h3', null, (open ? '💌 ' : '🔒 ') + t('story.' + l.id + '.title')),
          h('p', null, open ? t('story.' + l.id + '.text') : t('codex.chapterLocked'))));
      });
      root.append(UI.btn('🎬 ' + t('settings.story'), 'ghost', () => NOA.ui.story.intro()));
    }
  };
  CV.isUnlocked = unlocked;
})();

/*
 * Settings (language, sound, farm name, reset) and the Dev panel used to test config & rates.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const UI = NOA.ui;
  const h = (...a) => UI.h(...a);
  const t = (k, p) => NOA.t(k, p);
  const S = () => NOA.state;
  const B = () => NOA.BALANCE;
  const C = () => NOA.CONTENT;

  const toggle = (on, onChange, label) => {
    const b = h('button', { type: 'button', class: 'toggle', 'aria-pressed': on ? 'true' : 'false', 'aria-label': label });
    b.addEventListener('click', () => {
      const v = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', v ? 'true' : 'false');
      onChange(v);
    });
    return b;
  };
  const seg = (options, current, onPick) => {
    const box = h('div', { class: 'seg' });
    options.forEach(([val, label]) => {
      const b = h('button', { type: 'button', 'aria-pressed': val === current ? 'true' : 'false' }, label);
      b.addEventListener('click', () => {
        box.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', 'true');
        onPick(val);
      });
      box.append(b);
    });
    return box;
  };

  const SET = NOA.ui.settings = {
    open() {
      UI.modal({
        title: '⚙️ ' + t('settings.title'),
        body: (b, m) => {
          const s = S();
          b.append(h('div', { class: 'form-row' }, h('label', null, '🌐 ' + t('settings.language')),
            seg([['vi', 'Tiếng Việt'], ['en', 'English']], s.lang, (lang) => {
              s.lang = lang;
              NOA.i18n.setLang(lang);
              NOA.save.schedule();
              m.close();
              setTimeout(SET.open, 200);
            })));
          const audioRow = (key, label) => h('div', { class: 'form-row' }, h('label', null, label),
            toggle(s.settings[key], (v) => { s.settings[key] = v; NOA.audio.unlock(); NOA.audio.applySettings(); NOA.save.schedule(); }, label));
          b.append(audioRow('sfx', '🔊 ' + t('settings.sfx')), audioRow('music', '🎵 ' + t('settings.music')), audioRow('haptics', '📳 ' + t('settings.haptics')));
          const input = h('input', { class: 'input', id: 'set-farm-name', type: 'text', maxlength: '24', placeholder: t('settings.farmNamePh'), value: s.farmName || '' });
          b.append(h('div', null, h('label', { for: 'set-farm-name', style: { fontWeight: '800', fontFamily: 'var(--font-ui)' } }, '🏷️ ' + t('settings.farmName'))),
            h('div', { class: 'form-row' }, input, UI.btn(t('settings.save'), 'sm leaf', () => {
              NOA.secrets.rename(input.value);
              UI.toast(t('toast.saved'), 'good');
            })));
          b.append(h('div', { class: 'form-row' },
            UI.btn('🎬 ' + t('settings.story'), 'sm ghost', () => { m.close(); NOA.ui.story.intro(); }),
            NOA.FEATURES.devPanel ? UI.btn('🛠️ ' + t('dev.title'), 'sm ghost', () => { m.close(); SET.dev(); }) : null));
          let armed = false;
          const reset = UI.btn('🗑️ ' + t('settings.reset'), 'sm ghost', () => {
            if (!armed) { armed = true; reset.textContent = '⚠️ ' + t('settings.resetConfirm'); reset.classList.add('btn--berry'); return; }
            m.close();
            NOA.app.reset();
          });
          b.append(reset, h('p', { class: 'muted tiny', style: { textAlign: 'center' } }, t('settings.version', { v: B().meta.version })));
        }
      });
    },

    dev() {
      UI.modal({
        title: '🛠️ ' + t('dev.title'),
        cls: 'dev-modal',
        body: (b, m) => {
          const s = S();
          const refresh = () => { NOA.ui.renderAll(); NOA.ui.hud.update(); NOA.ui.hud.updateSky(); };
          const box = h('div', { class: 'dev' });
          box.append(h('p', { class: 'muted tiny' }, t('dev.note')));

          box.append(h('h3', null, t('dev.give')), h('div', { class: 'row' },
            UI.btn('+1000🪙', 'sm sun', () => { NOA.res.add('coins', 1000); refresh(); }),
            UI.btn('+100💎', 'sm sky', () => { NOA.res.add('gems', 100); refresh(); }),
            UI.btn('⚡ MAX', 'sm ghost', () => { NOA.rewards.grant({ energyFull: true }); refresh(); }),
            UI.btn('+50🔬', 'sm ghost', () => { NOA.res.add('rp', 50); refresh(); }),
            UI.btn('+5 🍀🧪✨🧃🔍', 'sm ghost', () => { NOA.rewards.grant({ boosters: { clover: 5, stabilizer: 5, stardust: 5, tonic: 5, loupe: 5 } }); refresh(); }),
            UI.btn('+2 🎟️🎟️', 'sm ghost', () => { NOA.rewards.grant({ tickets: { sprout: 2, star: 2 } }); refresh(); }),
            UI.btn(t('dev.level'), 'sm leaf', () => { NOA.progress.addXP(NOA.progress.xpToNext(s.level) - s.xp); refresh(); }),
            UI.btn(t('dev.labMax'), 'sm ghost', () => { NOA.labs.ids.forEach((l) => { s.labs[l].level = B().labs.maxLevel; NOA.labs.syncSlots(l); }); refresh(); })));

          box.append(h('h3', null, '⏰ ' + t('dev.speed')), h('div', { class: 'row' },
            UI.btn(t('dev.nextDay'), 'sm ghost', () => { s.dev.offsetMs += NOA.time.DAY; refresh(); UI.toast(NOA.time.dayKey()); }),
            UI.btn(t('dev.skip10'), 'sm ghost', () => { s.dev.offsetMs += 600000; refresh(); }),
            UI.btn(t('dev.resetTime'), 'sm ghost', () => { s.dev.offsetMs = 0; refresh(); })),
          seg([[null, '×1'], [0.2, '×5'], [0.05, '×20']], s.dev.timeScale, (v) => { s.dev.timeScale = v; NOA.save.schedule(); }));

          const force = s.dev.force || (s.dev.force = {});
          const ft = (key, val, label) => h('div', { class: 'form-row' }, h('label', null, label),
            toggle(force[key] === val, (on) => { force[key] = on ? val : null; NOA.save.schedule(); NOA.ui.hud.updateSky(); }, label));
          box.append(h('h3', null, '🌌 ' + t('dev.force')),
            ft('night', true, '🌙 ' + t('dev.night')),
            ft('fullMoon', true, '🌕 ' + t('dev.fullMoon')),
            ft('meteor', true, '🌠 ' + t('dev.meteor')),
            ft('weather', 'storm', '⛈️ ' + t('dev.storm')),
            ft('rainbow', true, '🌈 ' + t('dev.rainbow')));

          box.append(h('h3', null, '💳 ' + t('dev.payProvider')),
            seg([[null, 'config (' + NOA.PAYMENT.provider + ')'], ['mock', 'mock']], s.dev.payProvider, (v) => { s.dev.payProvider = v; NOA.save.schedule(); }));

          box.append(h('h3', null, '🧩 ' + t('dev.features')),
            h('div', { class: 'form-row' }, h('label', null, '🧬 ' + t('dev.geneEssence')),
              toggle(NOA.essence.enabled(), (on) => { s.dev.features.geneEssence = on; NOA.save.schedule(); refresh(); }, t('dev.geneEssence'))));

          const sel = h('select', { class: 'input', id: 'dev-gene' }, Object.keys(C().genes).map((g) => h('option', { value: g }, C().genes[g].emoji + ' ' + t('gene.' + g))));
          box.append(h('h3', null, '🧪 ' + t('dev.spawnGene')), h('div', { class: 'form-row' }, sel, UI.btn('＋', 'sm leaf', () => {
            const g = C().genes[sel.value];
            const fam = g.family;
            const species = fam === 'plant' ? 'tomato' : 'chicken';
            const item = NOA.items.newBreed(species, 2, { gene: { id: sel.value, purity: 3 } });
            NOA.board.placeOrStore(item, null);
            NOA.board.recordGene(sel.value, [], fam);
            UI.toast(NOA.items.name(item), 'good');
          })));

          const out = h('pre', null, '');
          box.append(h('h3', null, '🎲 ' + t('dev.simulate')), h('div', { class: 'row' },
            Object.keys(B().gacha.boxes).map((id) => UI.btn(t('box.' + id), 'sm ghost', () => { out.textContent = SET.simulate(id, 1000); }))),
            UI.btn('✅ ' + t('dev.config'), 'sm ghost', () => {
              const w = NOA.validateConfig();
              out.textContent = w.length ? '⚠️ ' + w.join('\n⚠️ ') : t('dev.configOk');
            }), out);
          b.append(box);
          void m;
        }
      });
    },

    /** Roll a box n times on a scratch pity state (the real save is untouched) */
    simulate(id, n) {
      const s = S();
      const saved = JSON.parse(JSON.stringify(s.gacha[id] || { opened: 0, since: {} }));
      s.gacha[id] = { opened: 0, since: {} };
      const counts = {};
      const rewards = {};
      for (let i = 0; i < n; i++) {
        const [r] = NOA.gacha.roll(id, 1);
        counts[r.rarity] = (counts[r.rarity] || 0) + 1;
        rewards[r.reward] = (rewards[r.reward] || 0) + 1;
      }
      s.gacha[id] = saved;
      const lines = [t('dev.simResult', { box: t('box.' + id) }) + ' · n=' + n];
      NOA.gacha.rates(id).forEach((r) => {
        lines.push(t('rarity.' + r.rarity).padEnd(12) + ' ' + t('dev.cfg') + ' ' + UI.pct(r.p).padStart(7) + ' | ' + t('dev.real') + ' ' + UI.pct((counts[r.rarity] || 0) / n).padStart(7));
      });
      lines.push('');
      Object.keys(rewards).sort((a, b) => rewards[b] - rewards[a]).forEach((k) => lines.push('· ' + t('reward.' + k) + ': ' + rewards[k]));
      return lines.join('\n');
    }
  };
})();

    { cls: 's6', art: null }
  ];

  const beanEl = () => h('span', { class: 'bean', 'aria-hidden': 'true' },
    h('span', { class: 'sprout' }),
    h('span', { class: 'bean-body' }, h('span', { class: 'eye l' }), h('span', { class: 'eye r' }), h('span', { class: 'blush' }), h('span', { class: 'mouth' })));

  const ST = NOA.ui.story = {
    /* ------------------------------------------------------------ intro */
    intro(onDone) {
      let i = 0;
      const ov = h('div', { class: 'intro', role: 'dialog', 'aria-label': t('game.title') });
      const card = h('div', { class: 'intro-card' });
      ov.append(card);
      const finish = () => {
        S().seen.intro = true;
        NOA.save.schedule();
        ov.classList.add('closing');
        setTimeout(() => ov.remove(), 380);
        if (onDone) onDone();
      };
      const show = () => {
        UI.clear(card);
        const sc = SCENES[i];
        const art = h('div', { class: 'intro-art ' + sc.cls }, sc.art ? sc.art : beanEl());
        const dots = h('div', { class: 'intro-dots' }, SCENES.map((s, k) => h('i', { class: k === i ? 'on' : '' })));
        const last = i === SCENES.length - 1;
        card.append(
          h('div', { class: 'intro-logo' }, t('game.title'), h('small', null, t('game.subtitle'))),
          art,
          h('p', { class: 'intro-text' }, t('intro.' + (i + 1))),
          dots,
          h('div', { class: 'intro-actions' },
            UI.btn(t('ui.skip'), 'ghost', () => { NOA.audio.unlock(); finish(); }),
            UI.btn(last ? t('intro.start') : t('ui.next') + ' →', last ? 'leaf' : 'sun', () => {
              NOA.audio.unlock();
              NOA.audio.play(last ? 'levelUp' : 'tap');
              if (last) finish();
              else { i += 1; show(); }
            })));
      };
      show();
      document.getElementById('overlays').append(ov);
    },

    /* ------------------------------------------------------------ tutorial */
    steps() { return C().tutorial; },
    current() {
      const tu = S().tutorial;
      if (!NOA.FEATURES.tutorial || tu.done) return null;
      return ST.steps()[tu.step] || null;
    },
    tutorialDone() { return !NOA.FEATURES.tutorial || S().tutorial.done; },
    currentTip() {
      const st = ST.current();
      return st ? t('tut.' + st.id) : null;
    },
    advance() {
      const tu = S().tutorial;
      tu.step += 1;
      tu.counts = {};
      if (tu.step >= ST.steps().length) {
        tu.done = true;
        NOA.ui.hud.say(t('tut.done'), 8000);
        NOA.progress.addXP(10);
      } else {
        NOA.ui.hud.say(ST.currentTip());
      }
      ST.applyFocus();
      NOA.save.schedule();
    },
    applyFocus() {
      document.querySelectorAll('.tut-focus').forEach((el) => el.classList.remove('tut-focus'));
      const st = ST.current();
      if (!st || !st.focus) return;
      let el = document.getElementById(st.focus);
      if (el && el.classList.contains('hscroll')) el = el.firstElementChild;
      if (el) el.classList.add('tut-focus');
    },
    init() {
      NOA.events.on('*', (name) => {
        const st = ST.current();
        if (!st || st.done !== name) return;
        const tu = S().tutorial;
        tu.counts[st.id] = (tu.counts[st.id] || 0) + 1;
        if (tu.counts[st.id] >= (st.count || 1)) setTimeout(ST.advance, 350);
      });
      // While the tutorial runs, keep one easy order (1 Rice Sheaf) on the board
      NOA.hooks.add('order.generated', (o) => {
        const tu = S().tutorial;
        const orderStep = ST.steps().findIndex((s) => s.id === 'order');
        if (!NOA.FEATURES.tutorial || tu.done || tu.step > orderStep) return o;
        const hasEasy = S().orders.some((x) => x.lines.length === 1 && x.lines[0].product === 'rice_1' && x.lines[0].count === 1);
        if (!hasEasy && !o.vip) {
          o.lines = [{ product: 'rice_1', count: 1, filled: 0, minStars: 0, needGene: false }];
          o.earth = false;
        }
        return o;
      });
      // During the first steps the seed sack always gives rice (so the first merge is guaranteed)
      // and the first animal is a chicken (fed with rice).
      NOA.hooks.add('spawn.species', (sp, info) => {
        if (sp) return sp;
        const st = ST.current();
        if (!st) return sp;
        const early = ['tap', 'merge', 'plant', 'harvest', 'order'];
        if (info.family === 'plant' && early.indexOf(st.id) >= 0) return 'rice';
        if (info.family === 'animal' && (st.id === 'animal' || st.id === 'feed')) return 'chicken';
        return sp;
      });
    }
  };
})();

// ---- js/main.js
/*
 * Boot: load / create the save, wire events to views, run the clock, show intro / daily gift.
 */
var NOA = globalThis.NOA = globalThis.NOA || {};

(function () {
  'use strict';
  const UI = NOA.ui;
  const S = () => NOA.state;

  /** Add keys that newer versions introduced, without touching existing values */
  function fillDefaults(target, defaults) {
    for (const k in defaults) {
      if (target[k] === undefined) target[k] = NOA.util.clone(defaults[k]);
      else if (NOA.util.isObj(target[k]) && NOA.util.isObj(defaults[k])) fillDefaults(target[k], defaults[k]);
    }
    return target;
  }
  function detectLang() {
    try { return (navigator.language || 'vi').toLowerCase().startsWith('vi') ? 'vi' : 'en'; } catch (e) { return 'vi'; }
  }

  let loopTimer = 0;
  let lastSave = Date.now();
  let loginShownFor = null;
  let throttled = 0;

  const APP = NOA.app = {
    boot(hot) {
      let state = hot && hot.state ? hot.state : NOA.save.load();
      const fresh = !state;
      if (fresh) state = NOA.newState(detectLang());
      else fillDefaults(state, NOA.newState(state.lang));
      NOA.state = state;
      if (fresh) NOA.seedNewGame();
      NOA.i18n.setLang(state.lang);

      NOA.secrets.init();
      NOA.essence.init();
      NOA.ui.story.init();

      // catch up on time spent away
      NOA.res.tickEnergy();
      NOA.orders.fill();
      NOA.labs.ids.forEach((l) => NOA.labs.syncSlots(l));

      UI.mount();
      UI.fx.init();
      UI.hud.render();
      UI.show('farm');
      APP.wire();
      APP.startLoop();

      const warnings = NOA.validateConfig();
      if (warnings.length) console.warn('[Noa Farm] config warnings:\n - ' + warnings.join('\n - '));

      const unlockAudio = () => { NOA.audio.unlock(); document.removeEventListener('pointerdown', unlockAudio, true); };
      document.addEventListener('pointerdown', unlockAudio, true);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') UI.closeTopModal(); });
      document.addEventListener('visibilitychange', () => { if (document.hidden) NOA.save.write(); });
      addEventListener('pagehide', () => NOA.save.write());

      if (!state.seen.intro) UI.story.intro(() => APP.afterIntro());
      else setTimeout(APP.maybeLogin, 600);

      try {
        const h = globalThis.claude && globalThis.claude.hot;
        if (h && typeof h.snapshot === 'function') h.snapshot(() => ({ state: NOA.state }));
      } catch (e) { /* not inside the artifact viewer */ }
      NOA.save.write();
    },

    afterIntro() {
      UI.hud.say(UI.story.currentTip() || NOA.t('bean.idle1'));
      UI.story.applyFocus();
      setTimeout(APP.maybeLogin, 900);
    },

    maybeLogin() {
      const day = NOA.time.dayKey();
      if (loginShownFor === day || !S().seen.intro) return;
      if (NOA.rewards.login.canClaim() && !UI.hasModal()) {
        loginShownFor = day;
        UI.panels.loginModal(true);
      }
    },

    wire() {
      const on = NOA.events.on;
      const farm = UI.screens.farm;
      on('board.changed', () => { farm.renderBoard(); farm.renderOrders(); UI.panels.refreshSheet(); });
      on('orders.changed', () => farm.renderOrders());
      on('field.changed', () => { farm.renderField(); UI.panels.refreshSheet(); UI.story.applyFocus(); });
      on('storage.changed', () => farm.renderDock());
      on('booster.used', () => farm.renderDock());
      on('rewards.granted', () => { farm.renderDock(); UI.hud.update(); });
      on('res.changed', (e) => {
        UI.hud.update();
        if (e && (e.k === 'coins' || e.k === 'gems' || e.k === 'rp' || e.k === 'all')) {
          clearTimeout(throttled);
          throttled = setTimeout(() => {
            if (UI.current === 'labs' || UI.current === 'shop') UI.screens[UI.current].render();
          }, 120);
        }
      });
      on('xp.changed', () => UI.hud.update());
      on('level.up', (e) => { UI.panels.levelUp(e); UI.hud.update(); });
      on('secret.unlocked', (e) => setTimeout(() => UI.panels.secret(e), 500));
      on('gene.discovered', (e) => UI.hud.say(NOA.t('bean.gene', { gene: NOA.CONTENT.genes[e.gene].emoji + ' ' + NOA.t('gene.' + e.gene) }), 9000));
      on('mascots.changed', () => { UI.hud.updateSky(); if (UI.current === 'codex') UI.screens.codex.render(); });
      on('mascot.expired', (e) => UI.toast(NOA.t('mascot.expired', { name: NOA.CONTENT.mascots[e.id].emoji + ' ' + NOA.t('mascot.' + e.id) })));
      on('lab.changed', () => { if (UI.current === 'labs') UI.screens.labs.render(); UI.renderTabs(); });
      on('lab.upgraded', () => UI.renderTabs());
      on('earth.changed', () => UI.hud.updateSky());
      on('lang.changed', () => { if (S()) { S().lang = NOA.i18n.lang; UI.renderAll(); UI.hud.render(); } });
      on('payment.completed', () => UI.hud.update());
      on('essence.changed', () => { if (UI.current === 'labs') UI.screens.labs.render(); });
    },

    startLoop() {
      clearInterval(loopTimer);
      let n = 0;
      loopTimer = setInterval(() => {
        n += 1;
        try {
          NOA.res.tickEnergy();
          NOA.farm.tick();
          NOA.orders.tick();
          NOA.labs.tick();
          NOA.mascots.tick();
          NOA.secrets.tick();
          UI.hud.tick();
          UI.screens.farm.tick();
          UI.screens.labs.tick();
          if (n % 8 === 0) { UI.renderTabs(); APP.maybeLogin(); }
          if (Date.now() - lastSave > 10000) { lastSave = Date.now(); NOA.save.write(); }
        } catch (e) {
          console.error('[Noa Farm loop]', e);
        }
      }, 250);
    },

    reset() {
      const lang = S().lang;
      NOA.save.clear();
      NOA.state = NOA.newState(lang);
      NOA.seedNewGame();
      NOA.orders.fill();
      UI.panels.closeSheet();
      UI.current = 'farm';
      UI.mount();
      UI.hud.render();
      UI.show('farm');
      NOA.save.write();
      UI.story.intro(() => APP.afterIntro());
    }
  };

  function start(data) { APP.boot(data || {}); }
  function ready() {
    const hot = globalThis.claude && globalThis.claude.hot;
    if (hot && typeof hot.ready === 'function') hot.ready(start);
    else start(hot && hot.data ? hot.data : {});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready);
  else ready();
})();

</script>
